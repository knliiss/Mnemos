name: Temporary Realtime Protocol Diagnostics

on:
  push:
    branches:
      - diagnostics/realtime-protocol-error

permissions:
  contents: read

jobs:
  inspect:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 5

    steps:
      - name: Inspect collector credential replacement history
        shell: bash
        run: |
          set -euo pipefail

          postgres_container="$(
            sudo -n docker ps --format '{{.Names}}' \
              | grep -E 'app-postgres|postgres' \
              | head -n 1
          )"

          if [ -z "$postgres_container" ]; then
            echo 'Production PostgreSQL container was not found' >&2
            exit 1
          fi

          sudo -n docker exec "$postgres_container" sh -lc '
            psql \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB" \
              -P pager=off \
              -c "WITH affected AS (SELECT owner_user_id FROM realtime.collector_credentials WHERE id = '\''01a04aaf-73b2-7ff4-a422-90a13e3503d7'\'') SELECT id, name, enabled, created_at, revoked_at FROM realtime.collector_credentials WHERE owner_user_id IS NOT DISTINCT FROM (SELECT owner_user_id FROM affected) ORDER BY created_at DESC LIMIT 20;"
          '
