name: Temporary Realtime Protocol Diagnostics

on:
  push:
    branches:
      - diagnostics/realtime-protocol-error

permissions:
  contents: read

jobs:
  inspect:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 5

    steps:
      - name: Inspect recent realtime transport failures
        shell: bash
        run: |
          set -euo pipefail

          for service in \
            mnemos_gateway-service \
            mnemos_realtime-service \
            mnemos_cloudflared; do
            echo "=== ${service} TASKS ==="
            sudo -n docker service ps \
              --no-trunc \
              --format 'table {{.Name}}\t{{.Image}}\t{{.CurrentState}}\t{{.Error}}' \
              "$service"
          done

          echo '=== GATEWAY LOGS ==='
          sudo -n docker service logs \
            --since 20m \
            --timestamps \
            mnemos_gateway-service 2>&1 \
            | grep -Ei 'websocket|protocol|premature|connection|close|error|exception|collector' \
            | tail -n 800 \
            || true

          echo '=== REALTIME LOGS ==='
          sudo -n docker service logs \
            --since 20m \
            --timestamps \
            mnemos_realtime-service 2>&1 \
            | grep -Ei 'websocket|protocol|collector|transport|error|exception' \
            | tail -n 800 \
            || true

          echo '=== CLOUDFLARED LOGS ==='
          sudo -n docker service logs \
            --since 20m \
            --timestamps \
            mnemos_cloudflared 2>&1 \
            | grep -Ei 'websocket|protocol|connection|stream|error|warn' \
            | tail -n 800 \
            || true
