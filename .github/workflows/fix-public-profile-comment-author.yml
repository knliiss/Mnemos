name: Fix public profile comment author

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - .github/workflows/fix-public-profile-comment-author.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration

      - name: Apply account author semantics
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/mini-app-mockup/src/features/PublicProfileRethink.tsx")
          content = path.read_text()

          content = content.replace(
              'import { currentUser, feed, initialComments, profiles } from "../mockData"',
              'import { feed, initialComments, profiles } from "../mockData"',
          )
          content = content.replace("currentUser.username", "activeAccount.nickname")

          if "currentUser" in content:
              raise SystemExit("currentUser still leaks into public profile comments")

          path.write_text(content)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mini-app-mockup/package-lock.json

      - name: Install dependencies
        working-directory: apps/mini-app-mockup
        run: npm ci

      - name: Build mockup
        working-directory: apps/mini-app-mockup
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/mini-app-mockup/src/features/PublicProfileRethink.tsx

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "fix account-authored profile comments"
          git push origin HEAD:feat/frontend-integration
