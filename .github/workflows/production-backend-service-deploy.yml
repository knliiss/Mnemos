name: Production Backend Service Deploy

on:
  workflow_run:
    workflows:
      - Production Backend Deploy Request
    types:
      - completed

concurrency:
  group: mnemos-production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  plan:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on:
      - self-hosted
      - mnemos-production

    permissions:
      actions: read
      contents: read

    timeout-minutes: 10

    outputs:
      service: ${{ steps.authorization.outputs.service }}
      target_sha: ${{ steps.authorization.outputs.target_sha }}
      authorization_ref: ${{ steps.authorization.outputs.authorization_ref }}
      request_actor: ${{ steps.authorization.outputs.request_actor }}
      request_run_id: ${{ steps.authorization.outputs.request_run_id }}
      current_source_sha: ${{ steps.state.outputs.current_source_sha }}
      tooling_revision: ${{ steps.state.outputs.tooling_revision }}
      has_action: ${{ steps.state.outputs.has_action }}
      transition_id: ${{ steps.plan.outputs.transition_id }}
      approval_runner: ${{ steps.plan.outputs.approval_runner }}

    steps:
      - name: Prepare persistent production runner workspace
        shell: bash
        run: |
          set -euo pipefail

          sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

          find "$GITHUB_WORKSPACE" \
            -type d \
            -name __pycache__ \
            -prune \
            -exec rm -rf {} +

      - name: Checkout trusted deployment coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted coordinator and request provenance
        id: authorization
        shell: bash
        env:
          COORDINATOR_SHA: ${{ github.sha }}
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_ACTOR: ${{ github.event.workflow_run.actor.login }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$COORDINATOR_SHA" ]; then
            echo "Checked-out coordinator does not match the workflow revision" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$COORDINATOR_SHA" origin/master; then
            echo "Production deploy coordinator is not in trusted master history" >&2
            exit 1
          fi

          case "$EVENT_HEAD_BRANCH" in
            deploy/production-backend/*)
              service="${EVENT_HEAD_BRANCH#deploy/production-backend/}"
              ;;
            *)
              echo "Unauthorized production backend ref: $EVENT_HEAD_BRANCH" >&2
              exit 1
              ;;
          esac

          if [ -z "$service" ] || printf '%s' "$service" | grep -Fq '/'; then
            echo "Deploy ref must select exactly one service" >&2
            exit 1
          fi

          if ! printf '%s' "$EVENT_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Deploy ref target must be an immutable full commit SHA" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ["REPOSITORY"]
          request_run_id = os.environ["REQUEST_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          event_head_branch = os.environ["EVENT_HEAD_BRANCH"]
          event_head_sha = os.environ["EVENT_HEAD_SHA"]
          event_actor = os.environ["EVENT_ACTOR"]

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{request_run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  run = json.load(response)
          except (urllib.error.URLError, json.JSONDecodeError) as exception:
              raise SystemExit(
                  f"Could not fetch deploy request provenance: {exception}"
              ) from exception

          workflow_name = run.get("name")
          workflow_path = run.get("path")
          event_name = run.get("event")
          conclusion = run.get("conclusion")
          head_branch = run.get("head_branch")
          head_sha = run.get("head_sha")
          head_repository = (run.get("head_repository") or {}).get("full_name")
          request_actor = (run.get("actor") or {}).get("login")

          if workflow_name != "Production Backend Deploy Request":
              raise SystemExit(
                  f"Unexpected deploy request workflow name: {workflow_name}"
              )

          if workflow_path != ".github/workflows/production-backend-deploy-request.yml":
              raise SystemExit(
                  f"Deploy request used an unauthorized workflow path: {workflow_path}"
              )

          if event_name != "push":
              raise SystemExit(
                  "Production backend deploy request must originate from a push event"
              )

          if conclusion != "success":
              raise SystemExit("Production backend deploy request did not succeed")

          if head_repository != repository:
              raise SystemExit(
                  "Production backend deploy request came from another repository"
              )

          if head_branch != event_head_branch or head_sha != event_head_sha:
              raise SystemExit(
                  "workflow_run event does not match fetched request provenance"
              )

          if not request_actor or request_actor != event_actor:
              raise SystemExit("Production backend deploy request actor is invalid")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  f"service={event_head_branch.removeprefix('deploy/production-backend/')}\n"
              )
              output.write(f"target_sha={event_head_sha}\n")
              output.write(f"authorization_ref={event_head_branch}\n")
              output.write(f"request_actor={request_actor}\n")
              output.write(f"request_run_id={request_run_id}\n")
          PY

          python3 scripts/production_source_revision.py \
            "$EVENT_HEAD_SHA" \
            --trusted-ref origin/master

          service_json="$(python3 scripts/production_service_catalog.py show "$service")"

          SERVICE_JSON="$service_json" python3 - <<'PY'
          import json
          import os

          service = json.loads(os.environ["SERVICE_JSON"])

          if service.get("kind") != "application":
              raise SystemExit("Deploy ref only accepts application services")

          deploy = service.get("deploy")

          if not isinstance(deploy, dict):
              raise SystemExit("Deploy ref service is not runtime-deployable")

          if deploy.get("type") not in {"swarm", "compose"}:
              raise SystemExit("Deploy ref service uses an unsupported runtime")
          PY

      - name: Verify target CI gates
        shell: bash
        env:
          TARGET_SHA: ${{ steps.authorization.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          changed_paths="$RUNNER_TEMP/production-target-changed-paths.txt"

          if git rev-parse "${TARGET_SHA}^" >/dev/null 2>&1; then
            git diff --name-only "${TARGET_SHA}^" "$TARGET_SHA" > "$changed_paths"
          else
            printf '%s\n' 'settings.gradle.kts' > "$changed_paths"
          fi

          policy_json="$(python3 scripts/resolve_backend_ci_changes.py --paths-file "$changed_paths")"
          read -r stack_smoke_required integration_verify_required <<< "$(
            POLICY_JSON="$policy_json" python3 - <<'PY'
          import json
          import os

          policy = json.loads(os.environ["POLICY_JSON"])
          print(
              str(bool(policy.get("stack_smoke_required"))).lower(),
              str(bool(policy.get("integration_verify_required"))).lower(),
          )
          PY
          )"

          echo "Target Stack Smoke required: $stack_smoke_required"
          echo "Target Integration Verify required: $integration_verify_required"

          STACK_SMOKE_REQUIRED="$stack_smoke_required" \
          INTEGRATION_VERIFY_REQUIRED="$integration_verify_required" \
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          query = urllib.parse.urlencode(
              {
                  "head_sha": target_sha,
                  "event": "push",
                  "per_page": 100,
              }
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs?{query}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          expected = {
              "Backend Verify": ".github/workflows/backend-verify.yml",
          }

          if os.environ["STACK_SMOKE_REQUIRED"] == "true":
              expected["Stack Smoke"] = ".github/workflows/stack-smoke.yml"

          if os.environ["INTEGRATION_VERIFY_REQUIRED"] == "true":
              expected["Integration Verify"] = ".github/workflows/integration-verify.yml"

          runs = payload.get("workflow_runs", [])

          for workflow_name, workflow_path in expected.items():
              matches = [
                  run
                  for run in runs
                  if run.get("name") == workflow_name
                  and run.get("path") == workflow_path
                  and run.get("head_sha") == target_sha
                  and run.get("head_branch") == "master"
                  and run.get("event") == "push"
              ]

              if not matches:
                  raise SystemExit(
                      f"Target SHA has no trusted {workflow_name} push run: {target_sha}"
                  )

              latest = max(matches, key=lambda run: int(run.get("id", 0)))

              if latest.get("status") != "completed" or latest.get("conclusion") != "success":
                  raise SystemExit(
                      f"Target SHA {workflow_name} gate is not successful: "
                      f"status={latest.get('status')} conclusion={latest.get('conclusion')}"
                  )

              print(
                  f"Verified target CI gate: {workflow_name} "
                  f"run={latest.get('id')} sha={target_sha}"
              )
          PY

      - name: Capture and verify canonical production state
        id: state
        shell: bash
        env:
          SERVICE: ${{ steps.authorization.outputs.service }}
          TARGET_SHA: ${{ steps.authorization.outputs.target_sha }}
        run: |
          set -euo pipefail

          state_file="$RUNNER_TEMP/mnemos-production-backend-current-state.json"

          sudo -n test -f /var/lib/mnemos-deploy/current-state.json
          sudo -n cp /var/lib/mnemos-deploy/current-state.json "$state_file"
          sudo -n chown "$(id -u):$(id -g)" "$state_file"
          chmod 0600 "$state_file"

          python3 scripts/production_deployment_state.py \
            state-validate \
            --input "$state_file"

          sudo -n env \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/production_runtime_state.py \
              verify \
              --state "$state_file"

          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh
          sudo -n sh scripts/verify-production-telegram-poller.sh

          current_source_sha="$(
            STATE_FILE="$state_file" SERVICE="$SERVICE" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["STATE_FILE"]).read_text(encoding="utf-8"))
          source_sha = (
              state.get("release_manifest", {})
              .get("services", {})
              .get(os.environ["SERVICE"], {})
              .get("source_sha", "")
          )
          print(source_sha)
          PY
          )"

          tooling_revision="$(
            STATE_FILE="$state_file" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["STATE_FILE"]).read_text(encoding="utf-8"))
          print(state.get("tooling_revision", ""))
          PY
          )"

          if ! printf '%s' "$current_source_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Current production source SHA is invalid for $SERVICE" >&2
            exit 1
          fi

          if ! printf '%s' "$tooling_revision" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Current production tooling revision is invalid" >&2
            exit 1
          fi

          python3 scripts/production_source_revision.py \
            "$tooling_revision" \
            --trusted-ref origin/master

          if ! git merge-base --is-ancestor "$current_source_sha" "$TARGET_SHA"; then
            echo "Automatic production service rollback is not allowed" >&2
            echo "Current: $current_source_sha" >&2
            echo "Target:  $TARGET_SHA" >&2
            exit 1
          fi

          if [ "$current_source_sha" = "$TARGET_SHA" ]; then
            has_action=false
          else
            has_action=true
          fi

          echo "CURRENT_STATE_FILE=$state_file" >> "$GITHUB_ENV"
          echo "current_source_sha=$current_source_sha" >> "$GITHUB_OUTPUT"
          echo "tooling_revision=$tooling_revision" >> "$GITHUB_OUTPUT"
          echo "has_action=$has_action" >> "$GITHUB_OUTPUT"

      - name: Create exact one-service audited plan
        if: steps.state.outputs.has_action == 'true'
        id: plan
        shell: bash
        env:
          SERVICE: ${{ steps.authorization.outputs.service }}
          TARGET_SHA: ${{ steps.authorization.outputs.target_sha }}
          TOOLING_REVISION: ${{ steps.state.outputs.tooling_revision }}
          TRANSITION_ACTOR: ${{ steps.authorization.outputs.request_actor }}
          AUTHORIZATION_REF: ${{ steps.authorization.outputs.authorization_ref }}
          REQUEST_RUN_ID: ${{ steps.authorization.outputs.request_run_id }}
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/mnemos-production-backend-plan"

          rm -rf "$output_dir"
          install --directory --mode=0700 "$output_dir"

          python3 scripts/production_release_plan.py \
            --current-state "$CURRENT_STATE_FILE" \
            --set "$SERVICE=$TARGET_SHA" \
            --actor "$TRANSITION_ACTOR" \
            --reason "Authorized by ${AUTHORIZATION_REF} at request run ${REQUEST_RUN_ID} -> ${TARGET_SHA}" \
            --output-dir "$output_dir"

          python3 scripts/production_audit_bundle.py \
            create \
            --directory "$output_dir" \
            --kind release-plan

          python3 scripts/production_audit_bundle.py \
            verify \
            --directory "$output_dir" \
            --kind release-plan

          PLAN_DIR="$output_dir" \
          SERVICE="$SERVICE" \
          TARGET_SHA="$TARGET_SHA" \
          TOOLING_REVISION="$TOOLING_REVISION" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan_dir = Path(os.environ["PLAN_DIR"])
          service = os.environ["SERVICE"]
          target_sha = os.environ["TARGET_SHA"]
          tooling_revision = os.environ["TOOLING_REVISION"]

          plan = json.loads(
              (plan_dir / "deployment-plan.json").read_text(encoding="utf-8")
          )
          transition = json.loads(
              (plan_dir / "transition.json").read_text(encoding="utf-8")
          )
          target_state = json.loads(
              (plan_dir / "target-state.json").read_text(encoding="utf-8")
          )

          if plan.get("mode") != "scoped":
              raise SystemExit("Backend deploy ref requires a scoped plan")

          if plan.get("action_count") != 1:
              raise SystemExit("Backend deploy ref requires exactly one action")

          actions = plan.get("actions")

          if not isinstance(actions, list) or len(actions) != 1:
              raise SystemExit("Backend deploy plan has invalid actions")

          action = actions[0]

          if action.get("service") != service:
              raise SystemExit("Plan service does not match deploy ref service")

          if action.get("operation") != "image-update":
              raise SystemExit("Backend deploy ref only accepts image updates")

          if action.get("to", {}).get("source_sha") != target_sha:
              raise SystemExit("Plan target source does not match authorized SHA")

          if transition.get("from_tooling_revision") != tooling_revision:
              raise SystemExit("Transition source tooling revision changed")

          if transition.get("to_tooling_revision") != tooling_revision:
              raise SystemExit("Scoped backend deploy cannot change tooling revision")

          target_entry = (
              target_state
              .get("release_manifest", {})
              .get("services", {})
              .get(service, {})
          )

          if target_entry.get("source_sha") != target_sha:
              raise SystemExit("Target state source does not match authorized SHA")
          PY

          transition_id="$(
            PLAN_DIR="$output_dir" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          transition = json.loads(
              (Path(os.environ["PLAN_DIR"]) / "transition.json").read_text(encoding="utf-8")
          )
          print(transition.get("transition_id", ""))
          PY
          )"

          if ! printf '%s' "$transition_id" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Generated transition ID is invalid" >&2
            exit 1
          fi

          echo "PLAN_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "transition_id=$transition_id" >> "$GITHUB_OUTPUT"
          echo "approval_runner=$RUNNER_NAME" >> "$GITHUB_OUTPUT"

      - name: Summarize authorized deployment
        shell: bash
        env:
          SERVICE: ${{ steps.authorization.outputs.service }}
          TARGET_SHA: ${{ steps.authorization.outputs.target_sha }}
          AUTHORIZATION_REF: ${{ steps.authorization.outputs.authorization_ref }}
          REQUEST_RUN_ID: ${{ steps.authorization.outputs.request_run_id }}
          CURRENT_SOURCE_SHA: ${{ steps.state.outputs.current_source_sha }}
          HAS_ACTION: ${{ steps.state.outputs.has_action }}
          TRANSITION_ID: ${{ steps.plan.outputs.transition_id }}
        run: |
          {
            echo "## Production backend deploy authorization"
            echo
            echo "Request run: \`$REQUEST_RUN_ID\`"
            echo "Ref: \`$AUTHORIZATION_REF\`"
            echo "Service: \`$SERVICE\`"
            echo "Current: \`$CURRENT_SOURCE_SHA\`"
            echo "Target: \`$TARGET_SHA\`"
            echo "Runtime action required: \`$HAS_ACTION\`"

            if [ "$HAS_ACTION" = "true" ]; then
              echo "Transition: \`$TRANSITION_ID\`"
            fi

            echo
            echo "The mutation workflow was loaded from trusted master, not from the deploy ref."
            echo "The target SHA was independently verified as reachable from trusted master history."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Securely persist approved plan on production runner
        if: steps.state.outputs.has_action == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # All production mutation jobs use the same hardened runner host.
          # Refuse collisions/replays, and restrict access to root.
          spool_root=/var/lib/mnemos-deploy/approved-backend-plans
          spool="$spool_root/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          sudo -n install -d -o root -g root -m 0700 "$spool_root"

          if sudo -n test -e "$spool"; then
            echo "Approved plan spool already exists for this workflow run" >&2
            exit 1
          fi

          sudo -n install -d -o root -g root -m 0700 "$spool"
          sudo -n cp -a "$PLAN_DIR/." "$spool/"
          sudo -n chown -R root:root "$spool"
          sudo -n chmod -R go-rwx "$spool"

          sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 \
            scripts/production_audit_bundle.py \
              verify \
              --directory "$spool" \
              --kind release-plan

  publish:
    needs:
      - plan

    if: needs.plan.outputs.has_action == 'true'

    runs-on: [self-hosted, Linux, X64, mnemos-backend]

    permissions:
      contents: read
      packages: write

    timeout-minutes: 45

    steps:
      - name: Checkout exact authorized target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate immutable target
        shell: bash
        env:
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]; then
            echo "Builder checkout does not match authorized target" >&2
            exit 1
          fi

          python3 scripts/production_source_revision.py \
            "$TARGET_SHA" \
            --trusted-ref origin/master

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify production service catalog
        run: python3 scripts/verify-production-service-catalog.py

      - name: Configure isolated Docker publishing
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-backend-deploy-docker-auth
        run: |
          set -euo pipefail

          rm -rf "$DOCKER_CONFIG"
          install \
            --directory \
            --mode=0700 \
            "$DOCKER_CONFIG"

          docker buildx rm mnemos-backend-deploy-builder >/dev/null 2>&1 || true
          docker buildx create \
            --driver docker-container \
            --name mnemos-backend-deploy-builder \
            --use
          docker buildx inspect --bootstrap

      - name: Authenticate builder to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-backend-deploy-docker-auth
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish immutable selected service image
        shell: bash
        env:
          SERVICE: ${{ needs.plan.outputs.service }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-backend-deploy-docker-auth
        run: |
          set -euo pipefail

          python3 scripts/publish-production-service-image.py \
            --service "$SERVICE" \
            --registry "ghcr.io/${{ github.repository_owner }}" \
            --tag "$TARGET_SHA" \
            --push

          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/mnemos-${SERVICE}:${TARGET_SHA}" \
            >/dev/null

      - name: Remove builder credentials and builder
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-backend-deploy-docker-auth
        run: |
          set +e

          docker buildx rm mnemos-backend-deploy-builder >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"

  execute:
    needs:
      - plan
      - publish

    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.has_action == 'true' &&
      needs.publish.result == 'success'

    environment: production

    runs-on:
      - self-hosted
      - mnemos-production

    permissions:
      actions: read
      contents: read
      packages: read

    timeout-minutes: 30

    steps:
      - name: Prepare persistent production runner workspace
        shell: bash
        run: |
          set -euo pipefail

          sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

          find "$GITHUB_WORKSPACE" \
            -type d \
            -name __pycache__ \
            -prune \
            -exec rm -rf {} +

      - name: Checkout pinned production deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.tooling_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned tooling checkout
        shell: bash
        env:
          TOOLING_REVISION: ${{ needs.plan.outputs.tooling_revision }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$TOOLING_REVISION" ]; then
            echo "Execution tooling does not match production state" >&2
            exit 1
          fi

      - name: Restore immutable approved plan from production runner
        shell: bash
        env:
          APPROVAL_RUNNER: ${{ needs.plan.outputs.approval_runner }}
        run: |
          set -euo pipefail

          if [ -z "$APPROVAL_RUNNER" ] || [ "$RUNNER_NAME" != "$APPROVAL_RUNNER" ]; then
            echo "Approved plan is bound to a different production runner" >&2
            exit 1
          fi

          spool="/var/lib/mnemos-deploy/approved-backend-plans/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          plan_dir="$RUNNER_TEMP/mnemos-production-backend-approved-plan"

          sudo -n test -d "$spool"
          sudo -n test -f "$spool/audit-manifest.json"
          install -d -m 0700 "$plan_dir"
          sudo -n cp -a "$spool/." "$plan_dir/"
          sudo -n chown -R "$(id -u):$(id -g)" "$plan_dir"
          chmod -R go-rwx "$plan_dir"

          # The next step independently verifies the complete audit manifest,
          # expected transition id, service, target revision and tooling pin.

      - name: Verify plan integrity and immutable authorization
        shell: bash
        env:
          PLAN_DIR: ${{ runner.temp }}/mnemos-production-backend-approved-plan
          SERVICE: ${{ needs.plan.outputs.service }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          TOOLING_REVISION: ${{ needs.plan.outputs.tooling_revision }}
          EXPECTED_TRANSITION_ID: ${{ needs.plan.outputs.transition_id }}
        run: |
          set -euo pipefail

          python3 scripts/production_audit_bundle.py \
            verify \
            --directory "$PLAN_DIR" \
            --kind release-plan

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan_dir = Path(os.environ["PLAN_DIR"])
          service = os.environ["SERVICE"]
          target_sha = os.environ["TARGET_SHA"]
          tooling_revision = os.environ["TOOLING_REVISION"]
          expected_transition_id = os.environ["EXPECTED_TRANSITION_ID"]

          transition = json.loads(
              (plan_dir / "transition.json").read_text(encoding="utf-8")
          )
          plan = transition.get("plan", {})

          if transition.get("transition_id") != expected_transition_id:
              raise SystemExit("Approved transition ID changed")

          if transition.get("from_tooling_revision") != tooling_revision:
              raise SystemExit("Approved source tooling revision changed")

          if transition.get("to_tooling_revision") != tooling_revision:
              raise SystemExit("Scoped backend deploy cannot change tooling")

          if plan.get("mode") != "scoped" or plan.get("action_count") != 1:
              raise SystemExit("Approved backend deploy is not exactly one scoped action")

          actions = plan.get("actions")

          if not isinstance(actions, list) or len(actions) != 1:
              raise SystemExit("Approved backend deploy action list is invalid")

          action = actions[0]

          if action.get("service") != service:
              raise SystemExit("Approved action service changed")

          if action.get("operation") != "image-update":
              raise SystemExit("Approved action is not an image update")

          if action.get("to", {}).get("source_sha") != target_sha:
              raise SystemExit("Approved target source changed")
          PY

      - name: Verify current production state and render exact dry run
        shell: bash
        env:
          PLAN_DIR: ${{ runner.temp }}/mnemos-production-backend-approved-plan
          SERVICE: ${{ needs.plan.outputs.service }}
          EXPECTED_TRANSITION_ID: ${{ needs.plan.outputs.transition_id }}
        run: |
          set -euo pipefail

          sudo -n env \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/production_deployment_executor.py \
              --transition "$PLAN_DIR/transition.json" \
              --target-state "$PLAN_DIR/target-state.json" \
              --expected-transition-id "$EXPECTED_TRANSITION_ID" \
              > "$RUNNER_TEMP/mnemos-production-backend-dry-run.json"

          SERVICE="$SERVICE" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          dry_run = json.loads(
              Path(
                  os.environ["RUNNER_TEMP"],
                  "mnemos-production-backend-dry-run.json",
              ).read_text(encoding="utf-8")
          )
          service = os.environ["SERVICE"]

          if dry_run.get("action_count") != 1:
              raise SystemExit("Dry run is not exactly one action")

          actions = dry_run.get("actions")

          if not isinstance(actions, list) or len(actions) != 1:
              raise SystemExit("Dry run action list is invalid")

          if actions[0].get("service") != service:
              raise SystemExit("Dry run service does not match authorization")
          PY

      - name: Prepare isolated production registry credentials
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-production-docker-auth
          sudo -n install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0700 \
            /run/mnemos-production-docker-auth

      - name: Authenticate production Docker to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-production-docker-auth \
              docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Execute exact one-service transition
        shell: bash
        env:
          PLAN_DIR: ${{ runner.temp }}/mnemos-production-backend-approved-plan
          EXPECTED_TRANSITION_ID: ${{ needs.plan.outputs.transition_id }}
          MNEMOS_PRODUCTION_DEPLOY_ENABLED: ${{ vars.MNEMOS_PRODUCTION_DEPLOY_ENABLED }}
          MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED: "true"
        run: |
          set -euo pipefail

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-production-docker-auth \
            PYTHONDONTWRITEBYTECODE=1 \
            MNEMOS_PRODUCTION_DEPLOY_ENABLED="$MNEMOS_PRODUCTION_DEPLOY_ENABLED" \
            MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED="$MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED" \
            python3 scripts/production_deployment_executor.py \
              --transition "$PLAN_DIR/transition.json" \
              --target-state "$PLAN_DIR/target-state.json" \
              --expected-transition-id "$EXPECTED_TRANSITION_ID" \
              --execute

      - name: Verify exact post-deploy production state
        shell: bash
        env:
          SERVICE: ${{ needs.plan.outputs.service }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
        run: |
          set -euo pipefail

          sudo -n env \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/production_runtime_state.py \
              verify \
              --state /var/lib/mnemos-deploy/current-state.json

          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh
          sudo -n sh scripts/verify-production-telegram-poller.sh

          actual_source="$(
            sudo -n env \
              PYTHONDONTWRITEBYTECODE=1 \
              SERVICE="$SERVICE" \
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(
              Path("/var/lib/mnemos-deploy/current-state.json").read_text(encoding="utf-8")
          )
          source_sha = (
              state.get("release_manifest", {})
              .get("services", {})
              .get(os.environ["SERVICE"], {})
              .get("source_sha", "")
          )
          print(source_sha)
          PY
          )"

          if [ "$actual_source" != "$TARGET_SHA" ]; then
            echo "Canonical production state does not match authorized target" >&2
            exit 1
          fi

      - name: Collect branch-authorized execution audit
        if: always()
        shell: bash
        env:
          PLAN_DIR: ${{ runner.temp }}/mnemos-production-backend-approved-plan
          SERVICE: ${{ needs.plan.outputs.service }}
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          EXPECTED_TRANSITION_ID: ${{ needs.plan.outputs.transition_id }}
          AUTHORIZATION_REF: ${{ needs.plan.outputs.authorization_ref }}
          REQUEST_ACTOR: ${{ needs.plan.outputs.request_actor }}
          REQUEST_RUN_ID: ${{ needs.plan.outputs.request_run_id }}
        run: |
          set -euo pipefail

          audit_dir="$RUNNER_TEMP/mnemos-production-backend-execution-audit"
          transition_digest="${EXPECTED_TRANSITION_ID#sha256:}"

          rm -rf "$audit_dir"
          install --directory --mode=0700 "$audit_dir"

          if sudo -n test -f /var/lib/mnemos-deploy/current-state.json; then
            sudo -n cp \
              /var/lib/mnemos-deploy/current-state.json \
              "$audit_dir/current-state.json"
          fi

          if sudo -n test -d "/var/lib/mnemos-deploy/transitions/$transition_digest"; then
            sudo -n cp -R \
              "/var/lib/mnemos-deploy/transitions/$transition_digest" \
              "$audit_dir/execution-attempts"
          fi

          sudo -n chown -R "$(id -u):$(id -g)" "$audit_dir"

          cp "$PLAN_DIR/transition.json" "$audit_dir/approved-transition.json"
          cp "$PLAN_DIR/audit-manifest.json" "$audit_dir/approved-plan-audit-manifest.json"

          AUDIT_DIR="$audit_dir" \
          WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          REQUEST_RUN_ID="$REQUEST_RUN_ID" \
          REQUEST_ACTOR="$REQUEST_ACTOR" \
          AUTHORIZATION_REF="$AUTHORIZATION_REF" \
          SERVICE="$SERVICE" \
          TARGET_SHA="$TARGET_SHA" \
          EXPECTED_TRANSITION_ID="$EXPECTED_TRANSITION_ID" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "request_run_id": os.environ["REQUEST_RUN_ID"],
              "actor": os.environ["REQUEST_ACTOR"],
              "authorization_mechanism": "service-deploy-branch-workflow-run",
              "authorization_ref": os.environ["AUTHORIZATION_REF"],
              "service": os.environ["SERVICE"],
              "target_sha": os.environ["TARGET_SHA"],
              "transition_id": os.environ["EXPECTED_TRANSITION_ID"],
          }

          path = Path(os.environ["AUDIT_DIR"]) / "workflow-execution.json"
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
          )
          PY

          python3 scripts/production_audit_bundle.py \
            create \
            --directory "$audit_dir" \
            --kind execution-attempt

          echo "EXECUTION_AUDIT_DIR=$audit_dir" >> "$GITHUB_ENV"

      - name: Archive execution audit on production runner
        if: always() && env.EXECUTION_AUDIT_DIR != ''
        shell: bash
        run: |
          set -euo pipefail

          # Root-only durable audit archive: keep at least 90 days.
          # This is separate from GitHub Actions artifact storage limits.
          audit_root=/var/lib/mnemos-deploy/backend-execution-audits
          audit_archive="$audit_root/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          sudo -n install -d -o root -g root -m 0700 "$audit_root"

          if sudo -n test -e "$audit_archive"; then
            echo "Execution audit already archived for this workflow run" >&2
            exit 1
          fi

          sudo -n install -d -o root -g root -m 0700 "$audit_archive"
          sudo -n cp -a "$EXECUTION_AUDIT_DIR/." "$audit_archive/"
          sudo -n chown -R root:root "$audit_archive"
          sudo -n chmod -R go-rwx "$audit_archive"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 \
            scripts/production_audit_bundle.py \
              verify \
              --directory "$audit_archive" \
              --kind execution-attempt

          echo "Execution audit retained in root-only production runner archive." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove production registry credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-production-docker-auth
