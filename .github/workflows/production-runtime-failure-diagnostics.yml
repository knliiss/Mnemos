name: Production Runtime Failure Diagnostics

on:
  push:
    branches:
      - fix/production-runtime-config
    paths:
      - .github/workflows/production-runtime-failure-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect-failed-release:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 10

    steps:
      - name: Inspect failed release containers
        shell: bash
        run: |
          set -euo pipefail

          release="8cf36034cb5228afbd656419bee94e5a00ac1237"
          services=(
            account-service
            bet-service
            event-service
            gateway-service
            notification-service
            payment-service
            realtime-service
            wallet-service
            telegram-bot-service
          )

          redact() {
            sed -E \
              -e 's/((password|token|secret|api[-_]?key|authorization)[^=:]{0,32}[=:][[:space:]]*)[^[:space:],;]+/\1<redacted>/Ig' \
              -e 's/(Bearer[[:space:]]+)[A-Za-z0-9._~+\/-]+/\1<redacted>/Ig'
          }

          echo "=== STACK SERVICES ==="
          docker service ls | redact

          for service in "${services[@]}"; do
            swarm_service="mnemos_${service}"

            echo
            echo "=== ${swarm_service} TASKS ==="
            docker service ps \
              --no-trunc \
              --format '{{.ID}} {{.Name}} {{.Image}} {{.CurrentState}} {{.Error}}' \
              "$swarm_service" 2>&1 | redact || true

            echo "=== ${swarm_service} RELEASE CONTAINERS ==="

            found=false

            while IFS= read -r container_id; do
              [ -n "$container_id" ] || continue

              image="$(docker inspect --format '{{.Config.Image}}' "$container_id" 2>/dev/null || true)"

              case "$image" in
                *":${release}"*)
                  found=true
                  echo "--- container ${container_id} image=${image} ---" | redact
                  docker inspect \
                    --format 'state={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' \
                    "$container_id" 2>&1 | redact || true

                  echo "--- logs ${container_id} ---"
                  docker logs --tail 180 "$container_id" 2>&1 | redact || true
                  ;;
              esac
            done < <(
              docker ps -aq \
                --filter "label=com.docker.swarm.service.name=${swarm_service}" \
                2>/dev/null || true
            )

            if [ "$found" = false ]; then
              echo "No retained container found for ${swarm_service}:${release}"
            fi
          done
