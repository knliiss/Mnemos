name: Refine Public Profile Comments

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - ".github/workflows/refine-public-profile-comments.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply comments UI fixes
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()

              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:80]!r}")

              path.write_text(text.replace(old, new, 1))

          svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
            <g fill="#9EA69A">
              <rect x="6" y="8" width="24" height="3"/>
              <rect x="3" y="11" width="3" height="17"/>
              <rect x="6" y="28" width="6" height="3"/>
              <rect x="12" y="31" width="3" height="5"/>
              <rect x="15" y="28" width="12" height="3"/>
              <rect x="27" y="11" width="3" height="17"/>
            </g>
            <g fill="#D4D9D0">
              <rect x="10" y="14" width="15" height="3"/>
              <rect x="10" y="20" width="11" height="3"/>
            </g>
            <g fill="#7F877B">
              <rect x="19" y="20" width="23" height="3"/>
              <rect x="16" y="23" width="3" height="14"/>
              <rect x="19" y="37" width="12" height="3"/>
              <rect x="31" y="40" width="3" height="4"/>
              <rect x="34" y="37" width="5" height="3"/>
              <rect x="39" y="23" width="3" height="14"/>
            </g>
            <g fill="#B8BEB4">
              <rect x="22" y="26" width="14" height="3"/>
              <rect x="22" y="32" width="9" height="3"/>
            </g>
            <rect x="24" y="14" width="4" height="4" fill="#C7F24A"/>
            <rect x="35" y="30" width="4" height="4" fill="#A47AAA"/>
            <rect x="8" y="24" width="3" height="3" fill="#D6A34D"/>
          </svg>
          '''

          illustration_path = Path("apps/mini-app-mockup/public/ui-illustrations/mnemos-comments.svg")
          illustration_path.write_text(svg)

          profile_path = Path("apps/mini-app-mockup/src/features/PublicProfileRethink.tsx")
          replace_once(
              profile_path,
              '            <CommentAvatar author={latestComment?.author ?? profile.nickname} compact />',
              '            <img\n              className="public-profile-comments-preview__illustration"\n              src="/ui-illustrations/mnemos-comments.svg"\n              alt=""\n            />',
          )
          replace_once(
              profile_path,
              '                  <img src="/ui-illustrations/mnemos-user-mark.svg" alt="" />',
              '                  <img src="/ui-illustrations/mnemos-comments.svg" alt="" />',
          )

          css_path = Path("apps/mini-app-mockup/src/public-profile.css")
          replace_once(
              css_path,
              '''.public-profile-comments-preview__art .public-profile-comment-avatar {
            width: 42px;
            height: 42px;
          }

          .public-profile-comments-preview__art .public-profile-comment-avatar img {
            width: 30px;
            height: 30px;
          }
          ''',
              '''.public-profile-comments-preview__illustration {
            width: 46px;
            height: 46px;
            image-rendering: pixelated;
            filter: drop-shadow(0 0 10px rgba(199, 242, 74, 0.08));
          }
          ''',
          )
          replace_once(
              css_path,
              '''.public-profile-comments-preview__copy > strong {
            display: -webkit-box;
            overflow: hidden;
            color: #b9bfb4;
            font-size: 10.5px;
            font-weight: 590;
            line-height: 1.3;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          }
          ''',
              '''.public-profile-comments-preview__copy > strong {
            display: block;
            overflow: hidden;
            color: #b9bfb4;
            font-size: 10.5px;
            font-weight: 590;
            line-height: 1.3;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
          ''',
          )
          replace_once(
              css_path,
              '''.public-profile-comments-layer {
            position: fixed;
            z-index: 1800;
            inset: 0;
            display: flex;
          ''',
              '''.public-profile-comments-layer {
            position: fixed;
            z-index: 1800;
            inset: 0;
            display: flex;
            padding-inline: max(0px, calc((100vw - 430px) / 2));
          ''',
          )
          replace_once(
              css_path,
              '  width: min(100%, 760px);\n  height: min(82dvh, 760px);',
              '  width: min(100%, 430px);\n  height: min(82dvh, 720px);',
          )

          main_path = Path("apps/mini-app-mockup/src/main.tsx")
          replace_once(
              main_path,
              '  "/ui-illustrations/mnemos-user-mark.svg",\n',
              '  "/ui-illustrations/mnemos-user-mark.svg",\n  "/ui-illustrations/mnemos-comments.svg",\n',
          )
          PY

      - name: Build mockup
        working-directory: apps/mini-app-mockup
        run: |
          npm install
          npm run build

      - name: Commit refined comments UI
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/refine-public-profile-comments.yml
          rm -rf apps/mini-app-mockup/dist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            .github/workflows/refine-public-profile-comments.yml \
            apps/mini-app-mockup/public/ui-illustrations/mnemos-comments.svg \
            apps/mini-app-mockup/src/features/PublicProfileRethink.tsx \
            apps/mini-app-mockup/src/public-profile.css \
            apps/mini-app-mockup/src/main.tsx

          git commit -m "refine public profile comments"
          git push origin HEAD:feat/frontend-integration
