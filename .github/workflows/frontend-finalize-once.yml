name: Frontend finalize once

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - .github/workflows/frontend-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration
          fetch-depth: 0

      - name: Setup Node 25.9.0
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Normalize production frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          root = Path("apps/mini-app")
          src = root / "src"

          text_extensions = {".ts", ".tsx", ".css"}
          files = [path for path in src.rglob("*") if path.is_file() and path.suffix in text_extensions]

          replacements = {
              "components/CristalixHead": "components/profile/CristalixHead",
              "components/EventArt": "components/events/EventArt",
              "components/PersonalizationPreview": "components/personalization/PersonalizationPreview",
              "components/ErrorMascot": "components/errors/ErrorMascot",
              "components/ErrorNotificationBridge": "components/errors/ErrorNotificationBridge",
              "components/ErrorNotifications": "components/errors/ErrorNotifications",
              "components/RootNavIllustration": "components/navigation/RootNavIllustration",
              "events-r2-": "events-",
              "event-r4-": "event-",
              "bets-r2-": "bets-",
              "creator-r2-": "creator-",
              "account-member-v4__": "account-member__",
              "store-category-v5__": "store-category__",
              "account-personalization-category-v5__": "account-personalization-category__",
              "account-personalization-v5__": "account-personalization__",
              "personalization-detail-v5__": "personalization-detail__",
              "review-overhaul-screen": "review-screen",
              "AccountMemberManagementProduction": "AccountMemberManagement",
              "CreatorStudioProduction": "CreatorStudio",
              "CreatorRevenueProduction": "CreatorRevenue",
              "CreatorEditorProduction": "CreatorEditor",
          }

          for path in files:
              original = path.read_text()
              updated = original

              for before, after in replacements.items():
                  updated = updated.replace(before, after)

              if updated != original:
                  path.write_text(updated)

          package_json = root / "package.json"
          package_text = package_json.read_text()
          package_text = package_text.replace('"*.{js,json,ts,html,md}"', '"*.{js,json,ts,html}"')
          package_json.write_text(package_text)

          old_component_files = [
              src / "product-ui/components/CristalixHead.tsx",
              src / "product-ui/components/EventArt.tsx",
              src / "product-ui/components/PersonalizationPreview.tsx",
              src / "product-ui/components/ErrorMascot.tsx",
              src / "product-ui/components/ErrorNotificationBridge.tsx",
              src / "product-ui/components/ErrorNotifications.tsx",
              src / "product-ui/components/ErrorNotifications.test.ts",
              src / "product-ui/components/RootNavIllustration.tsx",
          ]

          for path in old_component_files:
              if path.exists():
                  path.unlink()

          components_root = src / "product-ui/components"
          root_component_files = [path for path in components_root.iterdir() if path.is_file()]
          if root_component_files:
              print("Unexpected files left directly in product-ui/components:")
              for path in root_component_files:
                  print(f"  - {path}")
              raise SystemExit(1)

          forbidden_imports = [
              "components/CristalixHead",
              "components/EventArt",
              "components/PersonalizationPreview",
              "components/ErrorMascot",
              "components/ErrorNotificationBridge",
              "components/ErrorNotifications",
              "components/RootNavIllustration",
          ]

          historical_patterns = [
              re.compile(r"-r\d+-"),
              re.compile(r"-v\d+__"),
              re.compile(r"overhaul", re.IGNORECASE),
              re.compile(r"\b[A-Za-z][A-Za-z0-9]*Production\b"),
          ]

          violations: list[str] = []
          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()
              relative = path.relative_to(root)

              for value in forbidden_imports:
                  if value in text and f"components/{value.split('/')[-1]}" in text:
                      violations.append(f"{relative}: stale component import {value}")

              for pattern in historical_patterns:
                  matches = sorted(set(pattern.findall(text)))
                  if matches:
                      violations.append(f"{relative}: historical tokens {matches[:8]}")

          if violations:
              print("Frontend structural audit failed:")
              for violation in violations:
                  print(f"  - {violation}")
              raise SystemExit(1)

          hashes: dict[str, list[Path]] = {}
          for path in files:
              if not path.exists() or path.name.endswith(".d.ts"):
                  continue

              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              hashes.setdefault(digest, []).append(path)

          duplicates = [paths for paths in hashes.values() if len(paths) > 1]
          if duplicates:
              print("Byte-identical production source files found:")
              for group in duplicates:
                  print("  - " + ", ".join(str(path.relative_to(root)) for path in group))
              raise SystemExit(1)

          forbidden_names = []
          for path in src.rglob("*"):
              if not path.is_file():
                  continue

              lowered = path.name.lower()
              if "mockdata" in lowered or "mockstore" in lowered:
                  forbidden_names.append(path.relative_to(root))

          if forbidden_names:
              print("Production mock fixture files remain:")
              for path in forbidden_names:
                  print(f"  - {path}")
              raise SystemExit(1)

          print("Production frontend structural audit passed")
          PY

      - name: Install dependencies
        working-directory: apps/mini-app
        run: npm ci

      - name: Security audit
        working-directory: apps/mini-app
        run: npm audit --audit-level=high

      - name: Auto-fix lint
        working-directory: apps/mini-app
        run: npm run lint -- --fix

      - name: Format
        working-directory: apps/mini-app
        run: npm run format

      - name: Lint
        working-directory: apps/mini-app
        run: npm run lint

      - name: Check formatting
        working-directory: apps/mini-app
        run: npm run format:check

      - name: Test
        working-directory: apps/mini-app
        run: npm test

      - name: Build
        working-directory: apps/mini-app
        run: npm run build

      - name: Check bundle budgets
        working-directory: apps/mini-app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dist = Path("dist/assets")
          css_limit = 450 * 1024
          js_limit = 500 * 1024

          css_files = list(dist.glob("*.css"))
          js_files = list(dist.glob("*.js"))

          if not css_files:
              raise SystemExit("No production CSS bundle found")

          if not js_files:
              raise SystemExit("No production JS bundle found")

          oversized_css = [path for path in css_files if path.stat().st_size > css_limit]
          oversized_js = [path for path in js_files if path.stat().st_size > js_limit]

          if oversized_css or oversized_js:
              for path in oversized_css:
                  print(f"CSS budget exceeded: {path.name} = {path.stat().st_size} bytes")
              for path in oversized_js:
                  print(f"JS budget exceeded: {path.name} = {path.stat().st_size} bytes")
              raise SystemExit(1)

          print("Bundle budgets passed")
          for path in sorted(css_files + js_files):
              print(f"{path.name}: {path.stat().st_size} bytes")
          PY

      - name: Remove generated output and workflow
        shell: bash
        run: |
          rm -rf apps/mini-app/dist
          rm -f .github/workflows/frontend-finalize-once.yml

      - name: Commit verified frontend
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No frontend changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finalize production frontend structure"
          git push origin HEAD:feat/frontend-integration
