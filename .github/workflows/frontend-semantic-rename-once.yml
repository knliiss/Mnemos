name: Frontend semantic rename once

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - .github/workflows/frontend-semantic-rename-once.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration
          fetch-depth: 0

      - name: Rename historical frontend identifiers
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path("apps/mini-app/src")
          replacements = {
              "events-r2-": "events-",
              "event-r4-": "event-",
              "bets-r2-": "bets-",
              "creator-r2-": "creator-",
              "account-member-v4__": "account-member__",
              "store-category-v5__": "store-category__",
              "account-personalization-category-v5__": "account-personalization-category__",
              "account-personalization-v5__": "account-personalization__",
              "personalization-detail-v5__": "personalization-detail__",
              "review-overhaul-screen": "review-screen",
              "AccountMemberManagementProduction": "AccountMemberManagement",
              "CreatorStudioProduction": "CreatorStudio",
              "CreatorRevenueProduction": "CreatorRevenue",
              "CreatorEditorProduction": "CreatorEditor",
              "mnemos-r2-orbit": "mnemos-orbit",
          }

          changed = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".ts", ".tsx", ".css"}:
                  continue

              original = path.read_text()
              updated = original
              for before, after in replacements.items():
                  updated = updated.replace(before, after)

              if updated != original:
                  path.write_text(updated)
                  changed.append(path)

          report = Path(".github/frontend-semantic-result.txt")
          lines = [f"changed={len(changed)}"]
          lines.extend(str(path) for path in changed)
          report.write_text("\n".join(lines) + "\n")
          PY

      - name: Audit TypeScript historical names
        shell: bash
        run: |
          set -euo pipefail

          {
            echo
            echo "typescript_historical_tokens:"
            grep -RInE --include='*.ts' --include='*.tsx' \
              '(^|[^[:alnum:]])(r2|r3|r4|v2|v3|v4|v5|overhaul|polished|round-four|final)([^[:alnum:]]|$)|[A-Za-z][A-Za-z0-9]*Production' \
              apps/mini-app/src || true
          } >> .github/frontend-semantic-result.txt

      - name: Commit semantic names and report
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mini-app .github/frontend-semantic-result.txt
          git commit -m "normalize frontend semantic naming"
          git push origin HEAD:feat/frontend-integration
