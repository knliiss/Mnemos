name: Apply public profile comments UI

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - ".github/workflows/apply-public-profile-comments-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration

      - name: Update comments UI
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path("apps/mini-app-mockup")
          profile = root / "src/features/PublicProfileRethink.tsx"
          css = root / "src/public-profile.css"
          main = root / "src/main.tsx"
          icon = root / "public/ui-illustrations/mnemos-comments.svg"

          profile_text = profile.read_text()
          profile_text = profile_text.replace(
              '<CommentAvatar author={latestComment?.author ?? profile.nickname} compact />',
              '<img className="public-profile-comments-preview__illustration" src="/ui-illustrations/mnemos-comments.svg" alt="" />',
          )
          profile_text = profile_text.replace(
              '<span className="public-profile-comments-sheet__mark" aria-hidden="true">\n                  <img src="/ui-illustrations/mnemos-user-mark.svg" alt="" />\n                </span>',
              '<span className="public-profile-comments-sheet__mark" aria-hidden="true">\n                  <img src="/ui-illustrations/mnemos-comments.svg" alt="" />\n                </span>',
          )

          if "currentUser" in profile_text:
              raise SystemExit("Public profile comments must not expose Mnemos user identity")

          profile.write_text(profile_text)

          css_text = css.read_text()
          css_text = css_text.replace(
              '''.public-profile-comments-preview__art .public-profile-comment-avatar {\n  width: 42px;\n  height: 42px;\n}\n\n.public-profile-comments-preview__art .public-profile-comment-avatar img {\n  width: 30px;\n  height: 30px;\n}\n''',
              '''.public-profile-comments-preview__illustration {\n  width: 46px;\n  height: 46px;\n  object-fit: contain;\n  image-rendering: pixelated;\n  filter: drop-shadow(0 0 10px rgba(199, 242, 74, 0.08));\n}\n''',
          )
          css_text = css_text.replace(
              '''.public-profile-comments-preview__copy > strong {\n  display: -webkit-box;\n  overflow: hidden;\n  color: #b9bfb4;\n  font-size: 10.5px;\n  font-weight: 590;\n  line-height: 1.3;\n  -webkit-box-orient: vertical;\n  -webkit-line-clamp: 2;\n}\n''',
              '''.public-profile-comments-preview__copy > strong {\n  display: block;\n  overflow: hidden;\n  color: #b9bfb4;\n  font-size: 10.5px;\n  font-weight: 590;\n  line-height: 1.3;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n''',
          )
          css_text = css_text.replace(
              '''.public-profile-comments-layer {\n  position: fixed;\n  z-index: 1800;\n  inset: 0;\n''',
              '''.public-profile-comments-layer {\n  position: fixed;\n  z-index: 1800;\n  top: 0;\n  right: max(0px, calc((100vw - 430px) / 2));\n  bottom: 0;\n  left: max(0px, calc((100vw - 430px) / 2));\n''',
          )
          css_text = css_text.replace("  width: min(100%, 760px);\n", "  width: 100%;\n")
          css_text = css_text.replace("  height: min(82dvh, 760px);\n", "  height: min(76dvh, 680px);\n")
          css_text = css_text.replace("  max-height: calc(100dvh - 14px);\n", "  max-height: calc(100dvh - 24px);\n")
          css.write_text(css_text)

          main_text = main.read_text()
          preload_anchor = '  "/ui-illustrations/mnemos-user-mark.svg",\n'
          preload_entry = '  "/ui-illustrations/mnemos-comments.svg",\n'
          if preload_entry not in main_text:
              main_text = main_text.replace(preload_anchor, preload_anchor + preload_entry)
          main.write_text(main_text)

          icon.write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">\n  <g fill="#687166">\n    <rect x="19" y="5" width="17" height="3"/>\n    <rect x="16" y="8" width="3" height="14"/>\n    <rect x="36" y="8" width="3" height="14"/>\n    <rect x="19" y="22" width="11" height="3"/>\n    <rect x="30" y="22" width="3" height="6"/>\n    <rect x="33" y="22" width="3" height="3"/>\n  </g>\n\n  <g fill="#C5CBC0">\n    <rect x="9" y="14" width="18" height="3"/>\n    <rect x="6" y="17" width="3" height="15"/>\n    <rect x="27" y="17" width="3" height="15"/>\n    <rect x="9" y="32" width="12" height="3"/>\n    <rect x="21" y="32" width="3" height="6"/>\n    <rect x="24" y="32" width="3" height="3"/>\n  </g>\n\n  <rect x="11" y="23" width="3" height="3" fill="#C7F24A"/>\n  <rect x="17" y="23" width="3" height="3" fill="#A47AAA"/>\n  <rect x="23" y="23" width="3" height="3" fill="#D6A34D"/>\n\n  <rect x="22" y="12" width="3" height="3" fill="#879079"/>\n  <rect x="28" y="12" width="3" height="3" fill="#7A5D7D"/>\n  <rect x="39" y="9" width="3" height="3" fill="#C7F24A"/>\n  <rect x="5" y="35" width="3" height="3" fill="#A47AAA"/>\n</svg>\n''')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build mockup
        working-directory: apps/mini-app-mockup
        run: |
          npm install
          npm run build

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            apps/mini-app-mockup/src/features/PublicProfileRethink.tsx \
            apps/mini-app-mockup/src/public-profile.css \
            apps/mini-app-mockup/src/main.tsx \
            apps/mini-app-mockup/public/ui-illustrations/mnemos-comments.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "refine public profile comments ui"
          git push origin HEAD:feat/frontend-integration
