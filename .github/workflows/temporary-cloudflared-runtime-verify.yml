name: Temporary Cloudflared Runtime Verify

on:
  push:
    branches:
      - fix/reconcile-cloudflared-runtime-policy

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify runtime policy reconciliation
        run: python3 scripts/verify-production-runtime-policy.py

      - name: Verify Swarm stack normalization
        run: python3 scripts/verify-production-swarm-stack-normalizer.py
