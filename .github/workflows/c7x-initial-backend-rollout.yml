name: C7x Initial Backend Production Rollout

on:
  workflow_run:
    workflows:
      - C7x Initial Backend Rollout Request
    types:
      - completed

concurrency:
  group: mnemos-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: >-
      github.repository == 'knliiss/Mnemos' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'deploy/c7x-initial-backend' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, mnemos-backend]
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout immutable trusted master commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm immutable request and master ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_ID: ${{ github.event.workflow_run.id }}
          REQUEST_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$REQUEST_SHA" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/master
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ["REPOSITORY"]
          run_id = os.environ["REQUEST_ID"]
          sha = os.environ["REQUEST_SHA"]
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit("Invalid immutable request id")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Invalid immutable source SHA")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              run = json.load(response)
          expected = {
              "name": "C7x Initial Backend Rollout Request",
              "path": ".github/workflows/c7x-initial-backend-request.yml",
              "event": "push",
              "head_branch": "deploy/c7x-initial-backend",
              "head_sha": sha,
              "conclusion": "success",
          }
          for key, val in expected.items():
              if run.get(key) != val:
                  raise SystemExit("Rejected C7x production request: " + key)
          if (run.get("head_repository") or {}).get("full_name") != repo:
              raise SystemExit("Request originated outside trusted repository")
          print("Immutable C7x initial rollout authorization verified")
          PY

      - name: Check bootstrap Python syntax and production catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rollout-initial-c7x-production.py
          python3 scripts/verify-production-service-catalog.py
          python3 scripts/verify-production-release-manifest.py

      - name: Configure pinned Java toolchain
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build the three verified service JARs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :apps:bot-management-service:bootJar \
            :apps:gateway-service:bootJar \
            :apps:realtime-service:bootJar \
            --no-daemon

      - name: Push three immutable production images without Actions artifacts
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/c7x-initial-ghcr-auth
          TARGET_SHA: ${{ github.sha }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          cleanup() {
            docker buildx rm c7x-initial-build >/dev/null 2>&1 || true
            rm -rf "$DOCKER_CONFIG"
          }
          trap cleanup EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" --password-stdin >/dev/null
          docker buildx rm c7x-initial-build >/dev/null 2>&1 || true
          docker buildx create --driver docker-container \
            --name c7x-initial-build --use
          docker buildx inspect --bootstrap
          for service in bot-management-service gateway-service realtime-service; do
            python3 scripts/publish-production-service-image.py \
              --service "$service" --registry "$REGISTRY" \
              --tag "$TARGET_SHA" --push --skip-assemble
          done
          for service in bot-management-service gateway-service realtime-service; do
            docker buildx imagetools inspect "$REGISTRY/mnemos-$service:$TARGET_SHA" >/dev/null
            echo "Verified immutable image published: $service"
          done

  deploy:
    needs: publish
    if: needs.publish.result == 'success'
    environment: production
    runs-on: [self-hosted, mnemos-production]
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - name: Repair production checkout directory ownership
        shell: bash
        run: |
          set -euo pipefail
          sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Checkout exact production coordinator commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm trusted coordinator commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master

      - name: Prepare private registry credentials and pull target images
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          AUTH_PATH: ${{ runner.temp }}/c7x-initial-prod-registry
        run: |
          set -euo pipefail
          sudo -n install -d -m 0700 "$AUTH_PATH"
          printf '%s' "$GHCR_TOKEN" | sudo -n env DOCKER_CONFIG="$AUTH_PATH" \
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin >/dev/null
          for service in bot-management-service gateway-service realtime-service; do
            sudo -n env DOCKER_CONFIG="$AUTH_PATH" \
              docker pull "$REGISTRY/mnemos-$service:$SOURCE_SHA" >/dev/null
            echo "Target image available on production host: $service"
          done

      - name: Execute scoped first-install with drift checks and automatic rollback
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          AUTH_PATH: ${{ runner.temp }}/c7x-initial-prod-registry
        run: |
          set -euo pipefail
          sudo -n env \
            DOCKER_CONFIG="$AUTH_PATH" \
            C7X_ROLLOUT_SHA="$SOURCE_SHA" \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/rollout-initial-c7x-production.py

      - name: Remove private production registry credentials
        if: always()
        shell: bash
        env:
          AUTH_PATH: ${{ runner.temp }}/c7x-initial-prod-registry
        run: |
          sudo -n rm -rf -- "$AUTH_PATH"

      - name: Record audited result
        if: success()
        shell: bash
        run: |
          {
            echo "## C7x initial production rollout"
            echo
            echo "Three services updated: bot-management, gateway, realtime."
            echo "Unrelated production service image versions preserved."
            echo "Canonical deployment state migrated from 16 to 17 services."
            echo "Availability, runtime state and API boundary verified."
          } >> "$GITHUB_STEP_SUMMARY"
