name: Assemble Guide weapon atlas

on:
  push:
    branches:
      - fix/guides-shared-item-art
    paths:
      - ".github/asset-staging/guide-weapon/**"

permissions:
  contents: write

concurrency:
  group: assemble-guide-weapon-atlas
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/guides-shared-item-art
          fetch-depth: 0

      - name: Assemble verified inventory-rendered atlas
        shell: bash
        run: |
          set -euo pipefail

          stage_dir=.github/asset-staging/guide-weapon
          expected_chunks=16
          actual_chunks="$(find "$stage_dir" -maxdepth 1 -type f -name '*.b64' | wc -l | tr -d ' ')"

          if [ "$actual_chunks" -ne "$expected_chunks" ]; then
            echo "Waiting for all atlas chunks: ${actual_chunks}/${expected_chunks}"
            exit 0
          fi

          : > /tmp/guide-weapon-atlas.b64
          for index in $(seq 0 15); do
            chunk="$(printf '%03d' "$index")"
            test -f "$stage_dir/$chunk.b64"
            cat "$stage_dir/$chunk.b64" >> /tmp/guide-weapon-atlas.b64
          done

          tr -d '\n\r' < /tmp/guide-weapon-atlas.b64 | base64 --decode > /tmp/weapon-atlas.webp

          expected_sha=c53c3f474a5dc9d1848bdefb67940434d74f6faf5730e6ad71883fc50d9e9e1c
          actual_sha="$(sha256sum /tmp/weapon-atlas.webp | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          python3 - <<'PY'
          from pathlib import Path
          import struct

          data = Path('/tmp/weapon-atlas.webp').read_bytes()
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('invalid WebP container')

          offset = 12
          size = None
          while offset + 8 <= len(data):
              kind = data[offset:offset + 4]
              length = struct.unpack_from('<I', data, offset + 4)[0]
              payload = offset + 8
              if kind == b'VP8X' and length >= 10:
                  width = 1 + int.from_bytes(data[payload + 4:payload + 7], 'little')
                  height = 1 + int.from_bytes(data[payload + 7:payload + 10], 'little')
                  size = (width, height)
                  break
              if kind == b'VP8L' and length >= 5 and data[payload] == 0x2F:
                  bits = int.from_bytes(data[payload + 1:payload + 5], 'little')
                  size = ((bits & 0x3FFF) + 1, ((bits >> 14) & 0x3FFF) + 1)
                  break
              if kind == b'VP8 ' and length >= 10 and data[payload + 3:payload + 6] == b'\x9d\x01\x2a':
                  width = int.from_bytes(data[payload + 6:payload + 8], 'little') & 0x3FFF
                  height = int.from_bytes(data[payload + 8:payload + 10], 'little') & 0x3FFF
                  size = (width, height)
                  break
              offset = payload + length + (length % 2)

          if size != (768, 1792):
              raise SystemExit(f'unexpected atlas dimensions: {size}')
          PY

          cp /tmp/weapon-atlas.webp apps/mini-app/public/guides/entities/weapon-atlas.webp
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-guide-assets.mjs')
          text = path.read_text()
          old = '["entities/weapon-atlas.webp", [1536, 3584]]'
          new = '["entities/weapon-atlas.webp", [768, 1792]]'
          if old not in text:
              raise SystemExit('expected Guide weapon atlas dimension guard was not found')
          path.write_text(text.replace(old, new, 1))
          PY

          rm -rf "$stage_dir"
          node scripts/verify-guide-assets.mjs apps/mini-app/public/guides

      - name: Commit assembled atlas
        shell: bash
        run: |
          set -euo pipefail

          if [ -d .github/asset-staging/guide-weapon ]; then
            echo "Atlas is not complete yet; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mini-app/public/guides/entities/weapon-atlas.webp scripts/verify-guide-assets.mjs .github/asset-staging/guide-weapon

          if git diff --cached --quiet; then
            echo "No assembled atlas changes to commit."
            exit 0
          fi

          git commit -m "Use shared inventory-rendered Guide weapon atlas"
          git push origin HEAD:fix/guides-shared-item-art
