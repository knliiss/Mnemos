name: Telegram Menu Regressions Verify

on:
  push:
    branches:
      - fix/telegram-menu-regressions

concurrency:
  group: telegram-menu-regressions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify production secret scripts
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/migrate-production-env.sh
          sh -n scripts/validate-compose-secrets.sh
          sh scripts/verify-compose-secret-validation.sh

      - name: Verify affected backend modules
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :apps:telegram-bot-service:test \
            :apps:personalization-service:test \
            :apps:bet-service:test \
            --no-daemon
