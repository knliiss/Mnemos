name: Temporary Inventory Artwork Rebuild

on:
  push:
    branches:
      - fix/inventory-artwork-and-3d-heads

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/inventory-artwork-and-3d-heads
          fetch-depth: 0

      - name: Prepare Python renderer
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/inventory-artwork-venv"
          "$RUNNER_TEMP/inventory-artwork-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            numpy==2.3.2 \
            Pillow==11.3.0

      - name: Restore corrected inventory weapon atlas
        shell: bash
        run: |
          set -euo pipefail

          target="apps/mini-app/public/event-icons/sao-tracked-item-models.webp"
          cat .tmp/inventory-artwork/weapon-atlas.part* | base64 --decode > "$target"
          test "$(stat -c '%s' "$target")" = "30280"
          echo "50ee039550e4294cd4e456cc55892c8c75a3b6577a956a337daa67f778dc00db  $target" | sha256sum --check --strict

      - name: Rebuild pet inventory atlas
        shell: bash
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/inventory-artwork-venv/bin/python" scripts/render_sao_pet_artwork.py

      - name: Validate inventory artwork
        shell: bash
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/inventory-artwork-venv/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              Path("apps/mini-app/public/event-icons/sao-tracked-item-models.webp"): (512, 512),
              Path("apps/mini-app/public/event-icons/sao-pets.webp"): (1024, 960),
          }

          for path, expected_size in expected.items():
              payload = path.read_bytes()
              if payload[:4] != b"RIFF" or payload[8:12] != b"WEBP":
                  raise SystemExit(f"Invalid WebP payload: {path}")

              image = Image.open(path)
              image.load()

              if image.size != expected_size:
                  raise SystemExit(f"Unexpected artwork size for {path}: {image.size}")

              if image.getbbox() is None:
                  raise SystemExit(f"Artwork is fully transparent: {path}")

              print(f"validated {path}: {image.size}, {len(payload)} bytes")

          source = Path("apps/mini-app/src/ui/components/events/saoPetArtwork.ts").read_text()
          if "SAO_PET_ATLAS_ITEM_COUNT = 231" not in source:
              raise SystemExit("PET atlas mapping does not contain all 231 current pets")
          PY

      - name: Commit generated inventory artwork
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .tmp/inventory-artwork
          rm -f .github/workflows/tmp-rebuild-inventory-artwork.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "Rebuild SAO inventory artwork"
          git push origin HEAD:fix/inventory-artwork-and-3d-heads
