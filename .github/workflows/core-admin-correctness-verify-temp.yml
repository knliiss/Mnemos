name: Core Admin Correctness Verify Temp

on:
  push:
    branches:
      - fix/core-admin-correctness

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify targeted services
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :apps:account-service:ktlintCheck \
            :apps:account-service:test \
            :apps:reward-service:ktlintCheck \
            :apps:reward-service:test \
            :apps:moderation-service:ktlintCheck \
            :apps:moderation-service:test \
            --stacktrace

      - name: Verify Keycloak configuration references
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'moderation-service-admin-roles' infrastructure/keycloak/config/30-client-scopes.yaml
          grep -Fq 'moderation-service-admin-roles' infrastructure/keycloak/config/40-clients.yaml
          grep -A8 -F 'clientScope: moderation-service-admin-roles' infrastructure/keycloak/config/30-client-scopes.yaml | grep -Fq 'view-users'
          grep -A8 -F 'clientScope: moderation-service-admin-roles' infrastructure/keycloak/config/30-client-scopes.yaml | grep -Fq 'query-users'

          if grep -A8 -F 'clientScope: moderation-service-admin-roles' infrastructure/keycloak/config/30-client-scopes.yaml | grep -Fq 'manage-users'; then
            echo 'Moderation service must remain read-only in Keycloak' >&2
            exit 1
          fi
