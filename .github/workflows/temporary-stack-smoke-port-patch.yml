name: Temporary Stack Smoke Port Patch

on:
  push:
    branches:
      - fix/collector-credential-preflight

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/collector-credential-preflight

      - name: Patch isolated port allocation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/stack-smoke.yml')
          text = workflow.read_text(encoding='utf-8')
          needle = '          port_base=$((40000 + GITHUB_RUN_ID % 10000))\n'
          replacement = '''          preferred_port_base=$((40000 + GITHUB_RUN_ID % 18000))
          port_base=""

          for attempt in $(seq 0 199); do
            candidate=$((40000 + (preferred_port_base - 40000 + attempt * 7) % 18000))
            candidate=$((candidate - candidate % 7))
            block_free=true

            for offset in $(seq 0 6); do
              port=$((candidate + offset))

              if [ "$port" -gt 65535 ] || ss -H -ltn "sport = :$port" | grep -q .; then
                block_free=false
                break
              fi
            done

            if [ "$block_free" = true ]; then
              port_base="$candidate"
              break
            fi
          done

          if [ -z "$port_base" ]; then
            echo "Could not find a free seven-port block for Stack Smoke" >&2
            exit 1
          fi

          echo "Using isolated host port block ${port_base}-$((port_base + 6))"
'''

          if replacement not in text:
              if needle not in text:
                  raise SystemExit('stack smoke port allocation insertion point not found')
              text = text.replace(needle, replacement, 1)
              workflow.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit patch when needed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Stack Smoke port allocation already patched"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/stack-smoke.yml
          git commit -m "Allocate free ports for Stack Smoke"
          git push origin HEAD:fix/collector-credential-preflight
