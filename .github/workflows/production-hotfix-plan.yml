name: Production Hotfix Plan

on:
  workflow_dispatch:
    inputs:
      service:
        description: Deployable service from the production service catalog
        required: true
        type: string
      source_sha:
        description: Full repository commit SHA for the target service image
        required: true
        type: string
      current_state_json:
        description: Current production deployment state JSON
        required: true
        type: string
      target_tooling_revision:
        description: Optional full tooling commit SHA; blank keeps current tooling
        required: false
        type: string
      reason:
        description: Reason recorded in the deployment transition
        required: true
        type: string

concurrency:
  group: production-hotfix-plan-${{ inputs.service }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64, mnemos-backend]
    timeout-minutes: 10

    steps:
      - name: Checkout exact planning revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact planning revision
        shell: bash
        env:
          PLANNING_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$PLANNING_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Planning head SHA must be a full lowercase Git commit SHA" >&2
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$PLANNING_HEAD_SHA" ]; then
            echo "Checked-out planning tooling does not match the workflow run head SHA" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$PLANNING_HEAD_SHA" origin/master; then
            echo "Planning head SHA is not reachable from trusted master history" >&2
            exit 1
          fi

      - name: Materialize and validate current deployment state
        shell: bash
        env:
          CURRENT_STATE_JSON: ${{ inputs.current_state_json }}
        run: |
          set -euo pipefail

          state_file="$RUNNER_TEMP/mnemos-current-production-state.json"
          umask 077
          printf '%s\n' "$CURRENT_STATE_JSON" > "$state_file"

          python3 scripts/production_deployment_state.py \
            state-validate \
            --input "$state_file"

          echo "CURRENT_STATE_FILE=$state_file" >> "$GITHUB_ENV"

      - name: Validate trusted target revisions
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_TOOLING_REVISION: ${{ inputs.target_tooling_revision }}
        run: |
          set -euo pipefail

          python3 scripts/production_source_revision.py \
            "$SOURCE_SHA" \
            --trusted-ref origin/master

          if [ -n "$TARGET_TOOLING_REVISION" ]; then
            python3 scripts/production_source_revision.py \
              "$TARGET_TOOLING_REVISION" \
              --trusted-ref origin/master
          fi

      - name: Create scoped hotfix plan bundle
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_TOOLING_REVISION: ${{ inputs.target_tooling_revision }}
          TRANSITION_ACTOR: ${{ github.actor }}
          TRANSITION_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          output_dir="$RUNNER_TEMP/mnemos-production-hotfix-plan"
          rm -rf "$output_dir"
          install --directory --mode=0700 "$output_dir"

          set -- \
            --current-state "$CURRENT_STATE_FILE" \
            --service "$SERVICE" \
            --source-sha "$SOURCE_SHA" \
            --actor "$TRANSITION_ACTOR" \
            --reason "$TRANSITION_REASON" \
            --output-dir "$output_dir"

          if [ -n "$TARGET_TOOLING_REVISION" ]; then
            set -- "$@" --tooling-revision "$TARGET_TOOLING_REVISION"
          fi

          python3 scripts/production_hotfix_plan.py "$@"
          cp "$CURRENT_STATE_FILE" "$output_dir/current-state.json"
          python3 scripts/production_audit_bundle.py \
            create \
            --directory "$output_dir" \
            --kind hotfix-plan
          python3 scripts/production_audit_bundle.py \
            verify \
            --directory "$output_dir" \
            --kind hotfix-plan

          echo "HOTFIX_PLAN_DIR=$output_dir" >> "$GITHUB_ENV"

      - name: Summarize plan
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$HOTFIX_PLAN_DIR/deployment-plan.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))

          print("## Production hotfix plan")
          print()
          print(f"Plan: `{plan['plan_id']}`")
          print(f"Mode: `{plan['mode']}`")
          print(f"Actions: `{plan['action_count']}`")
          print()

          for action in plan["actions"]:
              print(
                  f"- `{action['service']}`: `{action['from']['image']}` "
                  f"→ `{action['to']['image']}`"
              )

          print()
          print("Artifact integrity is recorded in `audit-manifest.json`.")
          print("This workflow only creates a plan artifact. It cannot mutate production.")
          PY

      - name: Upload hotfix plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-hotfix-plan-${{ inputs.service }}-${{ inputs.source_sha }}
          path: ${{ env.HOTFIX_PLAN_DIR }}
          if-no-files-found: error
          retention-days: 30
