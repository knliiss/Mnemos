name: Production Zero Downtime Verify

on:
  push:
    branches:
      - fix/zero-downtime-production-deploy

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Make and production tooling
        shell: bash
        run: |
          set -euo pipefail

          make make-verify
          python3 scripts/verify-production-stack-renderer.py
          python3 scripts/verify-production-runtime-policy.py
          sh scripts/verify-ci-workflow-security.sh
          git diff --check origin/master...HEAD

      - name: Verify obsolete rollout paths are gone
        shell: bash
        run: |
          set -euo pipefail

          obsolete=(
            .github/workflows/production-pr-backend-verify.yml
            .github/workflows/production-pr-ci-recovery.yml
            .github/workflows/production-pr-final-stack-smoke.yml
            .github/workflows/production-pr-stack-smoke.yml
            .github/workflows/production-pr79-rollout.yml
            .github/workflows/production-runtime-diagnostic.yml
          )

          for path in "${obsolete[@]}"; do
            if [ -e "$path" ]; then
              echo "Obsolete production workflow is still present: $path" >&2
              exit 1
            fi
          done

      - name: Verify rollout cannot perform a full-stack deploy
        shell: bash
        run: |
          set -euo pipefail

          rollout=.github/workflows/production-zero-downtime-rollout.yml

          if [ ! -f "$rollout" ]; then
            echo "Zero-downtime production rollout workflow is missing" >&2
            exit 1
          fi

          if grep -Eq 'docker[[:space:]]+stack[[:space:]]+deploy|deploy-production-apps\.sh|start-production-infra\.sh|wait-production-stack\.sh' "$rollout"; then
            echo "Zero-downtime rollout contains a forbidden full-stack deployment path" >&2
            exit 1
          fi

  production-preflight:
    needs: static
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 10

    steps:
      - name: Checkout candidate tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify production can accept active-active policy
        shell: bash
        run: |
          set -euo pipefail

          swarm_state="$(sudo -n docker info --format '{{.Swarm.LocalNodeState}} {{.Swarm.ControlAvailable}}')"

          if [ "$swarm_state" != "active true" ]; then
            echo "Production runner is not an active Swarm manager: $swarm_state" >&2
            exit 1
          fi

          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/verify-production-telegram-poller.sh

          echo "===== TARGET RUNTIME BASELINE ====="
          for service in moderation-service personalization-service player-directory-service; do
            runtime="mnemos_${service}"
            sudo -n docker service ls \
              --filter "name=$runtime" \
              --format '{{.Name}} {{.Replicas}} {{.Image}}'
          done

          echo "===== HOST MEMORY ====="
          free -m

          available_mib="$(free -m | awk '/^Mem:/ { print $7 }')"

          if [ -z "$available_mib" ] || [ "$available_mib" -lt 1536 ]; then
            echo "Production host has insufficient immediately available memory for safe replica expansion: ${available_mib:-unknown} MiB" >&2
            exit 1
          fi

          echo "Production zero-downtime preflight verified"
