name: Telegram Pack Preview Verify Temp

on:
  push:
    branches:
      - fix/telegram-pack-menu-preview

permissions:
  contents: read

concurrency:
  group: telegram-pack-preview-verify-temp
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify notification pack services
        run: >-
          ./gradlew
          :apps:personalization-service:ktlintCheck
          :apps:personalization-service:test
          :apps:telegram-bot-service:ktlintCheck
          :apps:telegram-bot-service:test
          --stacktrace
