name: Production Recovery

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified production image SHA
        required: true
        type: string
  push:
    branches:
      - master
    paths:
      - .github/workflows/production-recovery.yml

concurrency:
  group: mnemos-production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  RECOVERY_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '2145ee542b867a58c0815bd4d1480eb4ad9b423b' }}

jobs:
  recover:
    if: vars.MNEMOS_PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on:
      - self-hosted
      - mnemos-production

    permissions:
      actions: read
      contents: read
      packages: read

    timeout-minutes: 20

    steps:
      - name: Checkout current recovery scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 1

      - name: Require verified existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ env.RECOVERY_RELEASE_TAG }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_tag must be a full 40-character commit SHA" >&2
            exit 1
          fi

          RUNS_FILE="$(mktemp)"
          trap 'rm -f "$RUNS_FILE"' EXIT

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RUNS_FILE" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&event=push&status=success&per_page=100"

          for workflow in "Backend Verify" "Stack Smoke"; do
            count="$(
              python3 - "$RUNS_FILE" "$workflow" "$RELEASE_SHA" <<'PY'
          import json
          import sys

          runs_file, workflow_name, release_sha = sys.argv[1:]

          with open(runs_file, encoding="utf-8") as source:
              payload = json.load(source)

          count = sum(
              1
              for run in payload.get("workflow_runs", [])
              if run.get("name") == workflow_name
              and run.get("head_sha") == release_sha
              and run.get("head_branch") == "master"
              and run.get("event") == "push"
              and run.get("conclusion") == "success"
          )

          print(count)
          PY
            )"

            if [ "$count" -lt 1 ]; then
              echo "$workflow is not green for verified release $RELEASE_SHA" >&2
              exit 1
            fi
          done

          echo "Verified existing production release: $RELEASE_SHA"

      - name: Prepare isolated registry credential directory
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-production-docker-auth
          sudo -n install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0700 \
            /run/mnemos-production-docker-auth

      - name: Authenticate production Docker to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-production-docker-auth \
              docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Verify production infrastructure
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env \
            MNEMOS_PRODUCTION_ENV_FILE=/etc/mnemos/mnemos.env \
            MNEMOS_SWARM_NETWORK=mnemos-production-network \
            sh scripts/verify-production-infra.sh

      - name: Back up current release when available
        shell: bash
        run: |
          set -euo pipefail

          if sudo -n test -s /var/lib/mnemos-deploy/current-release; then
            sudo -n /opt/mnemos/current/scripts/run-production-backup.sh
          else
            echo "No recorded production release; skipping recovery backup"
          fi

      - name: Recover production application stack
        shell: bash
        env:
          MNEMOS_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          MNEMOS_RELEASE_TAG: ${{ env.RECOVERY_RELEASE_TAG }}
          MNEMOS_PRODUCTION_ENV_FILE: /etc/mnemos/mnemos.env
          MNEMOS_SWARM_NETWORK: mnemos-production-network
          MNEMOS_SWARM_STACK_NAME: mnemos
        run: |
          set -euo pipefail

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-production-docker-auth \
            MNEMOS_IMAGE_REGISTRY="$MNEMOS_IMAGE_REGISTRY" \
            MNEMOS_RELEASE_TAG="$MNEMOS_RELEASE_TAG" \
            MNEMOS_PRODUCTION_ENV_FILE="$MNEMOS_PRODUCTION_ENV_FILE" \
            MNEMOS_SWARM_NETWORK="$MNEMOS_SWARM_NETWORK" \
            MNEMOS_SWARM_STACK_NAME="$MNEMOS_SWARM_STACK_NAME" \
            sh scripts/deploy-production-apps.sh

      - name: Verify recovered production health
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /opt/mnemos/current/scripts/check-production-health.sh

      - name: Remove production registry credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo -n rm -rf /run/mnemos-production-docker-auth
