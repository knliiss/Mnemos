name: C7x Interface Preview
on:
  push:
    branches:
      - feat/c7x-remote-agents
    paths:
      - ".github/workflows/c7x-frontend-preview.yml"
concurrency:
  group: c7x-frontend-preview
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  canceled-preview:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "C7x preview permanently disabled"
