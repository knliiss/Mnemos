name: Mini App Mockup

on:
  push:
    branches:
      - feat/frontend-mockup
    paths:
      - "apps/mini-app-mockup/**"
      - ".github/workflows/mini-app-mockup.yml"
  pull_request:
    paths:
      - "apps/mini-app-mockup/**"

concurrency:
  group: mini-app-mockup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mini-app-mockup

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Capture mobile visual audit
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/mnemos-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is unavailable on this runner"
            exit 1
          fi

          mkdir -p visual-audit

          capture() {
            local name="$1"
            local width="$2"
            local path="$3"

            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=1200 \
              --window-size="${width},844" \
              --screenshot="$PWD/visual-audit/${name}.png" \
              "http://127.0.0.1:4173/${path}"
          }

          # Five primary product tabs.
          capture bets 390 "?screen=bets"
          capture events-360 360 "?screen=events"
          capture events-390 390 "?screen=events"
          capture events-430 430 "?screen=events"
          capture account-360 360 "?screen=account"
          capture account-390 390 "?screen=account"
          capture account-430 430 "?screen=account"
          capture account-user-hub 390 "?screen=account&hub=1"
          capture account-picker 390 "?screen=account&hub=1&accounts=1"
          capture search 390 "?screen=search"
          capture store 390 "?screen=personalization-store"

          # Events and subscriptions. Capture multiple families so contextual art is actually reviewed.
          capture event-detail-sword 390 "?screen=event-detail&p.eventId=ev-1"
          capture event-detail-booster 390 "?screen=event-detail&p.eventId=ev-2"
          capture event-detail-eclipse 390 "?screen=event-detail&p.eventId=ev-3"
          capture event-detail-raid 390 "?screen=event-detail&p.eventId=ev-4"
          capture event-detail-jewelry 390 "?screen=event-detail&p.eventId=ev-5"
          capture event-detail-moon 390 "?screen=event-detail&p.eventId=ev-6"
          capture event-detail-aura 390 "?screen=event-detail&p.eventId=ev-7"
          capture event-detail-pet 390 "?screen=event-detail&p.eventId=ev-8"
          capture subscriptions 390 "?screen=subscriptions"

          # Account management.
          capture member 390 "?screen=member&p.memberId=member-2"
          capture roles 390 "?screen=roles"
          capture role-editor 390 "?screen=role-editor&p.roleId=role-admin"
          capture account-wallet 390 "?screen=account-wallet"
          capture account-invites 390 "?screen=account-invites"
          capture account-settings 390 "?screen=account-settings"
          capture account-create 390 "?screen=account-create"
          capture account-join 390 "?screen=account-join"

          # Public profile and user wallet.
          capture public-profile 390 "?screen=public-profile&p.accountId=profile-north"
          capture user-wallet 390 "?screen=user-wallet"

          # Personalization marketplace.
          capture personalization-owned 390 "?screen=personalization-owned&p.target=ALL"
          capture personalization-detail 390 "?screen=personalization-detail&p.personalizationId=p-1"

          # Creator workspace.
          capture creator 390 "?screen=creator-studio"
          capture creator-revenue 390 "?screen=creator-revenue"
          capture creator-editor 390 "?screen=personalization-editor&p.personalizationId=new"

          # Staff workspaces.
          capture moderation 390 "?screen=moderation"
          capture administration 390 "?screen=administration"
          capture moderation-user 390 "?screen=moderation-user&p.userId=0198f6ce-e934-7000-8000-000000000021"
          capture personalization-review 390 "?screen=personalization-review"
          capture bet-admin 390 "?screen=bet-admin"
          capture bet-admin-rounds 390 "?screen=bet-admin&p.section=rounds"
          capture bet-admin-history 390 "?screen=bet-admin&p.section=history"
          capture bet-admin-round-detail 390 "?screen=bet-admin&p.section=round&p.roundId=history-moon-1"
          capture bet-admin-create-round 390 "?screen=bet-admin&p.section=create-round"
          capture bet-admin-races 390 "?screen=bet-admin&p.section=races"
          capture badge-admin 390 "?screen=badge-admin"

      - name: Upload visual audit
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: mini-app-visual-audit
          path: apps/mini-app-mockup/visual-audit
          if-no-files-found: error
          retention-days: 7

      - name: Publish visual audit status
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
          else
            STATE="failure"
          fi

          PAYLOAD="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "Mini App Mockup visual audit: $JOB_STATUS" \
            --arg context "mini-app-mockup/visual-audit" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$PAYLOAD" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}"
