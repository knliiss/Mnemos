name: Mini App Mockup

on:
  push:
    branches:
      - feat/frontend-mockup
    paths:
      - "apps/mini-app-mockup/**"
      - ".github/workflows/mini-app-mockup.yml"
  pull_request:
    paths:
      - "apps/mini-app-mockup/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mini-app-mockup

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Capture mobile visual audit
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/mnemos-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is unavailable on this runner"
            exit 1
          fi

          mkdir -p visual-audit

          capture() {
            local name="$1"
            local width="$2"
            local path="$3"

            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size="${width},844" \
              --screenshot="$PWD/visual-audit/${name}.png" \
              "http://127.0.0.1:4173/${path}"
          }

          # Root shells at the Telegram-Mini-App widths we care about.
          capture events-360 360 "?screen=events"
          capture events-390 390 "?screen=events"
          capture events-430 430 "?screen=events"
          capture account 390 "?screen=account"
          capture me 390 "?screen=me"

          # Events area.
          capture event-detail 390 "?screen=event-detail&p.eventId=ev-1"
          capture bets 390 "?screen=bets"
          capture subscriptions 390 "?screen=subscriptions"

          # Account area.
          capture member 390 "?screen=member&p.memberId=member-2"
          capture roles 390 "?screen=roles"
          capture role-editor 390 "?screen=role-editor&p.roleId=role-admin"
          capture account-wallet 390 "?screen=account-wallet"
          capture account-invites 390 "?screen=account-invites"
          capture account-settings 390 "?screen=account-settings"
          capture account-create 390 "?screen=account-create"

          # People / user area.
          capture search 390 "?screen=search"
          capture public-profile 390 "?screen=public-profile&p.accountId=profile-north"
          capture user-wallet 390 "?screen=user-wallet"
          capture settings 390 "?screen=settings"

          # Personalization marketplace.
          capture store 390 "?screen=personalization-store"
          capture personalization-owned 390 "?screen=personalization-owned"
          capture personalization-detail 390 "?screen=personalization-detail&p.personalizationId=p-1"

          # Creator workspace.
          capture creator 390 "?screen=creator-studio"
          capture creator-revenue 390 "?screen=creator-revenue"
          capture creator-editor 390 "?screen=personalization-editor&p.personalizationId=new"

          # Staff workspace.
          capture moderation 390 "?screen=moderation"
          capture moderation-user 390 "?screen=moderation-user&p.accountId=profile-north"
          capture personalization-review 390 "?screen=personalization-review"
          capture bet-admin 390 "?screen=bet-admin"
          capture badge-admin 390 "?screen=badge-admin"

      - name: Upload visual audit
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: mini-app-visual-audit
          path: apps/mini-app-mockup/visual-audit
          if-no-files-found: error
          retention-days: 7
