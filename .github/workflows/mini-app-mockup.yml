name: Mini App Mockup

on:
  push:
    branches:
      - feat/frontend-mockup
    paths:
      - "apps/mini-app-mockup/**"
      - ".github/workflows/mini-app-mockup.yml"
  pull_request:
    paths:
      - "apps/mini-app-mockup/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mini-app-mockup

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
