name: Maintain Production Mini App

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - ".github/workflows/cleanup-production-css.yml"

concurrency:
  group: maintain-production-mini-app
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mini-app/.node-version
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mini-app
        run: npm ci

      - name: Format production frontend
        working-directory: apps/mini-app
        run: npm run format

      - name: Audit CSS structure
        working-directory: apps/mini-app
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs"
          import path from "node:path"
          import postcss from "postcss"

          const sourceRoot = path.resolve("src")
          const repositoryRoot = path.resolve("../..")
          const reportPath = path.join(repositoryRoot, ".github/production-css-audit.txt")
          const revisionPattern = /(?:-round-(?:one|two|three|four|five|six|seven|eight|nine|ten|\d+)|-(?:v|r)\d+|-(?:final|polished|overhaul|rethink))(?=(?:__|--|-|$))/
          const classPattern = /\.([A-Za-z_][A-Za-z0-9_-]*)/g

          function listCssFiles(directory) {
            return fs
              .readdirSync(directory, { withFileTypes: true })
              .flatMap((entry) => {
                const fullPath = path.join(directory, entry.name)

                if (entry.isDirectory()) {
                  return listCssFiles(fullPath)
                }

                return entry.isFile() && entry.name.endsWith(".css") ? [fullPath] : []
              })
              .sort()
          }

          function relative(filePath) {
            return path.relative(repositoryRoot, filePath).replaceAll(path.sep, "/")
          }

          function atRuleContext(rule) {
            const context = []
            let parent = rule.parent

            while (parent) {
              if (parent.type === "atrule") {
                context.unshift(`@${parent.name} ${parent.params}`.trim())
              }

              parent = parent.parent
            }

            return context.join(" > ") || "top-level"
          }

          const legacyClasses = new Map()
          const duplicateSelectors = []

          for (const filePath of listCssFiles(sourceRoot)) {
            const source = fs.readFileSync(filePath, "utf8")
            const root = postcss.parse(source, { from: filePath })
            const selectors = new Map()

            root.walkRules((rule) => {
              const line = rule.source?.start?.line ?? 0
              const context = atRuleContext(rule)
              const selector = rule.selector.replace(/\s+/g, " ").trim()
              const key = `${context}||${selector}`
              const lines = selectors.get(key) ?? []

              lines.push(line)
              selectors.set(key, lines)

              for (const match of rule.selector.matchAll(classPattern)) {
                const className = match[1]

                if (!revisionPattern.test(className)) {
                  continue
                }

                const locations = legacyClasses.get(className) ?? []
                locations.push(`${relative(filePath)}:${line}`)
                legacyClasses.set(className, locations)
              }
            })

            for (const [key, lines] of selectors) {
              if (lines.length < 2) {
                continue
              }

              const separator = key.indexOf("||")
              duplicateSelectors.push({
                file: relative(filePath),
                context: key.slice(0, separator),
                selector: key.slice(separator + 2),
                lines,
              })
            }
          }

          const report = []
          const sortedLegacyClasses = [...legacyClasses.entries()].sort(([left], [right]) =>
            left.localeCompare(right),
          )

          report.push(`legacy_class_count=${sortedLegacyClasses.length}`)
          report.push("")
          report.push("[legacy-classes]")

          for (const [className, locations] of sortedLegacyClasses) {
            report.push(`${className} -> ${className.replace(revisionPattern, "")}`)

            for (const location of [...new Set(locations)].sort()) {
              report.push(`  ${location}`)
            }
          }

          duplicateSelectors.sort((left, right) => {
            return (
              left.file.localeCompare(right.file) ||
              left.context.localeCompare(right.context) ||
              left.selector.localeCompare(right.selector)
            )
          })

          report.push("")
          report.push(`duplicate_selector_count=${duplicateSelectors.length}`)
          report.push("")
          report.push("[duplicate-selectors]")

          for (const duplicate of duplicateSelectors) {
            report.push(`${duplicate.file} :: ${duplicate.context}`)
            report.push(`  ${duplicate.selector}`)
            report.push(`  lines=${duplicate.lines.join(",")}`)
          }

          fs.writeFileSync(reportPath, `${report.join("\n")}\n`, "utf8")
          NODE

      - name: Verify production frontend
        working-directory: apps/mini-app
        shell: bash
        run: |
          set -uo pipefail

          report="../../.github/mini-app-verification.txt"
          : > "$report"

          run_check() {
            local name="$1"
            shift
            local log
            log="$(mktemp)"

            if "$@" >"$log" 2>&1; then
              echo "$name=PASS" >> "$report"
            else
              echo "$name=FAIL" >> "$report"
              echo "" >> "$report"
              echo "[$name]" >> "$report"
              tail -n 160 "$log" >> "$report"
              echo "" >> "$report"
            fi

            rm -f "$log"
          }

          run_check audit npm run audit
          run_check lint npm run lint
          run_check format npm run format:check
          run_check test npm test
          run_check build npm run build

          if [ -d dist/assets ]; then
            oversized_js="$(find dist/assets -type f -name '*.js' -size +500k -print)"
            oversized_css="$(find dist/assets -type f -name '*.css' -size +450k -print)"

            if [ -z "$oversized_js" ] && [ -z "$oversized_css" ]; then
              echo "bundle_budget=PASS" >> "$report"
            else
              echo "bundle_budget=FAIL" >> "$report"
              echo "" >> "$report"
              echo "[bundle_budget]" >> "$report"
              [ -n "$oversized_js" ] && printf 'JavaScript chunks over 500 KiB:\n%s\n' "$oversized_js" >> "$report"
              [ -n "$oversized_css" ] && printf 'CSS chunks over 450 KiB:\n%s\n' "$oversized_css" >> "$report"
            fi
          else
            echo "bundle_budget=SKIPPED" >> "$report"
          fi

      - name: Ensure branch stayed unchanged
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin feat/frontend-integration

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feat/frontend-integration)" ]; then
            echo "feat/frontend-integration changed during maintenance"
            exit 1
          fi

      - name: Commit maintenance result
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/cleanup-production-css.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/mini-app .github/production-css-audit.txt .github/mini-app-verification.txt .github/workflows/cleanup-production-css.yml
          git commit -m "format and audit production mini app"
          git push origin HEAD:feat/frontend-integration
