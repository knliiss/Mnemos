name: Audit Production CSS Naming

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - ".github/workflows/cleanup-production-css.yml"
      - "apps/mini-app/src/**"

concurrency:
  group: cleanup-production-css
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration
          fetch-depth: 0

      - name: Build naming audit
        shell: python
        run: |
          from collections import defaultdict
          from pathlib import Path
          import re

          source_root = Path("apps/mini-app/src")
          report_path = Path(".github/production-css-naming-audit.txt")
          class_pattern = re.compile(r"\.([A-Za-z_][A-Za-z0-9_-]*)")
          revision_pattern = re.compile(
              r"(?:"
              r"-round-(?:one|two|three|four|five|six|seven|eight|nine|ten|\d+)"
              r"|-(?:v|r)\d+"
              r"|-(?:final|polished|overhaul|rethink)"
              r")(?=(?:__|--|-|$))"
          )

          locations = defaultdict(set)

          for path in sorted(source_root.rglob("*.css")):
              text = path.read_text(encoding="utf-8")

              for line_number, line in enumerate(text.splitlines(), 1):
                  for class_name in class_pattern.findall(line):
                      locations[class_name].add(f"{path}:{line_number}")

          legacy_classes = sorted(
              class_name
              for class_name in locations
              if revision_pattern.search(class_name)
          )
          candidates = {
              class_name: revision_pattern.sub("", class_name)
              for class_name in legacy_classes
          }
          reverse = defaultdict(list)

          for old_name, new_name in candidates.items():
              reverse[new_name].append(old_name)

          lines = [
              f"legacy_class_count={len(legacy_classes)}",
              "",
          ]

          for old_name in legacy_classes:
              new_name = candidates[old_name]
              conflicts = []

              if new_name in locations and new_name not in candidates:
                  conflicts.append(f"existing:{new_name}")

              if len(reverse[new_name]) > 1:
                  conflicts.append(
                      "mapped-by:" + ",".join(sorted(reverse[new_name]))
                  )

              status = "COLLISION " + " ".join(conflicts) if conflicts else "OK"
              lines.append(f"{old_name} -> {new_name} [{status}]")

              for location in sorted(locations[old_name]):
                  lines.append(f"  {location}")

          report_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Ensure branch stayed unchanged
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin feat/frontend-integration

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feat/frontend-integration)" ]; then
            echo "feat/frontend-integration changed during audit; latest source push will rerun this workflow"
            exit 1
          fi

      - name: Commit audit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/cleanup-production-css.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/production-css-naming-audit.txt .github/workflows/cleanup-production-css.yml
          git commit -m "audit production css class naming"
          git push origin HEAD:feat/frontend-integration
