name: Cleanup Production CSS

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - ".github/workflows/cleanup-production-css.yml"

concurrency:
  group: cleanup-production-css
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration
          fetch-depth: 0

      - name: Normalize revision-style CSS class names
        shell: python
        run: |
          from pathlib import Path
          import re

          source_root = Path("apps/mini-app/src")
          source_extensions = {".css", ".ts", ".tsx"}

          class_pattern = re.compile(r"\.([A-Za-z_][A-Za-z0-9_-]*)")
          revision_pattern = re.compile(
              r"(?:"
              r"-round-(?:one|two|three|four|five|six|seven|eight|nine|ten|\d+)"
              r"|-(?:v|r)\d+"
              r"|-(?:final|polished|overhaul|rethink)"
              r")(?=(?:__|--|-|$))"
          )

          css_files = sorted(source_root.rglob("*.css"))
          css_classes = set()

          for path in css_files:
              css_classes.update(class_pattern.findall(path.read_text(encoding="utf-8")))

          mapping = {}
          for class_name in sorted(css_classes):
              normalized = revision_pattern.sub("", class_name)

              if normalized != class_name:
                  mapping[class_name] = normalized

          reverse_mapping = {}
          collisions = []

          for old_name, new_name in mapping.items():
              existing = reverse_mapping.get(new_name)

              if existing and existing != old_name:
                  collisions.append(f"{existing} and {old_name} -> {new_name}")

              if new_name in css_classes and new_name not in mapping:
                  collisions.append(f"{old_name} -> existing class {new_name}")

              reverse_mapping[new_name] = old_name

          if collisions:
              print("Unsafe normalization collisions detected:")
              print("\n".join(collisions))
              raise SystemExit(1)

          print(f"Normalizing {len(mapping)} CSS class names")

          replacements = sorted(
              mapping.items(),
              key=lambda item: len(item[0]),
              reverse=True,
          )
          changed_files = []

          for path in sorted(source_root.rglob("*")):
              if not path.is_file() or path.suffix not in source_extensions:
                  continue

              original = path.read_text(encoding="utf-8")
              updated = original

              for old_name, new_name in replacements:
                  token_pattern = re.compile(
                      rf"(?<![A-Za-z0-9_-]){re.escape(old_name)}(?![A-Za-z0-9_-])"
                  )
                  updated = token_pattern.sub(new_name, updated)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed_files.append(path.as_posix())

          remaining = []

          for path in css_files:
              for line_number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(),
                  1,
              ):
                  for class_name in class_pattern.findall(line):
                      if revision_pattern.search(class_name):
                          remaining.append(f"{path}:{line_number}: .{class_name}")

          if remaining:
              print("Revision-style CSS class names remain:")
              print("\n".join(remaining[:100]))
              raise SystemExit(1)

          print(f"Changed {len(changed_files)} source files")
          for path in changed_files:
              print(path)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mini-app/.node-version
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mini-app
        run: npm ci

      - name: Format source
        working-directory: apps/mini-app
        run: npm run format

      - name: Verify production frontend
        working-directory: apps/mini-app
        run: npm run verify

      - name: Ensure branch stayed unchanged
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin feat/frontend-integration

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feat/frontend-integration)" ]; then
            echo "feat/frontend-integration changed during cleanup; refusing to overwrite concurrent work"
            exit 1
          fi

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/cleanup-production-css.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/mini-app/src .github/workflows/cleanup-production-css.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "normalize production css class names"
          git push origin HEAD:feat/frontend-integration
