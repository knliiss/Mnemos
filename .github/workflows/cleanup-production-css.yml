name: Maintain Production Mini App Final Pass

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - ".github/workflows/cleanup-production-css.yml"

concurrency:
  group: maintain-production-mini-app
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mini-app/.node-version
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        id: install
        continue-on-error: true
        working-directory: apps/mini-app
        run: npm ci

      - name: Format production frontend
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: apps/mini-app
        run: npm run format

      - name: Audit legacy source names
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          source_root = Path("apps/mini-app/src")
          report_path = Path(".github/production-css-audit.txt")
          extensions = {".ts", ".tsx", ".css"}
          legacy_pattern = re.compile(
              r"[A-Za-z_][A-Za-z0-9_-]*"
              r"(?:-round-(?:one|two|three|four|five|six|seven|eight|nine|ten|\d+)"
              r"|-(?:v|r)\d+"
              r"|-(?:final|polished|overhaul|rethink))"
              r"[A-Za-z0-9_-]*"
          )

          locations: dict[str, set[str]] = {}

          for path in sorted(source_root.rglob("*")):
              if not path.is_file() or path.suffix not in extensions:
                  continue

              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):
                  for token in legacy_pattern.findall(line):
                      locations.setdefault(token, set()).add(f"{path.as_posix()}:{line_number}")

          lines = [f"legacy_name_count={len(locations)}", "", "[legacy-names]"]

          for token in sorted(locations):
              lines.append(token)
              lines.extend(f"  {location}" for location in sorted(locations[token]))

          report_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Audit duplicate CSS selectors
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: apps/mini-app
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs"
          import path from "node:path"
          import postcss from "postcss"

          const cssPath = path.resolve("src/product-ui/product.css")
          const reportPath = path.resolve("../../.github/production-css-audit.txt")
          const root = postcss.parse(fs.readFileSync(cssPath, "utf8"), { from: cssPath })
          const selectors = new Map()

          function contextFor(rule) {
            const context = []
            let parent = rule.parent

            while (parent) {
              if (parent.type === "atrule") {
                context.unshift(`@${parent.name} ${parent.params}`.trim())
              }

              parent = parent.parent
            }

            return context.join(" > ") || "top-level"
          }

          root.walkRules((rule) => {
            const selector = rule.selector.replace(/\s+/g, " ").trim()
            const context = contextFor(rule)
            const key = `${context}||${selector}`
            const lines = selectors.get(key) ?? []

            lines.push(rule.source?.start?.line ?? 0)
            selectors.set(key, lines)
          })

          const duplicates = [...selectors.entries()]
            .filter(([, lines]) => lines.length > 1)
            .map(([key, lines]) => {
              const separator = key.indexOf("||")

              return {
                context: key.slice(0, separator),
                selector: key.slice(separator + 2),
                lines,
              }
            })
            .sort((left, right) => {
              return (
                left.context.localeCompare(right.context) ||
                left.selector.localeCompare(right.selector)
              )
            })

          const report = fs.readFileSync(reportPath, "utf8").trimEnd().split("\n")
          report.push("", `duplicate_selector_count=${duplicates.length}`, "", "[duplicate-selectors]")

          for (const duplicate of duplicates) {
            report.push(`${duplicate.context} :: ${duplicate.selector}`)
            report.push(`  lines=${duplicate.lines.join(",")}`)
          }

          fs.writeFileSync(reportPath, `${report.join("\n")}\n`, "utf8")
          NODE

      - name: Verify production frontend
        if: always()
        working-directory: apps/mini-app
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: |
          set -uo pipefail

          report="../../.github/mini-app-verification.txt"
          : > "$report"

          if [ "$INSTALL_OUTCOME" != "success" ]; then
            echo "install=FAIL" >> "$report"
            echo "audit=SKIPPED" >> "$report"
            echo "lint=SKIPPED" >> "$report"
            echo "format=SKIPPED" >> "$report"
            echo "test=SKIPPED" >> "$report"
            echo "build=SKIPPED" >> "$report"
            echo "bundle_budget=SKIPPED" >> "$report"
            exit 0
          fi

          echo "install=PASS" >> "$report"

          run_check() {
            local name="$1"
            shift
            local log
            log="$(mktemp)"

            if "$@" >"$log" 2>&1; then
              echo "$name=PASS" >> "$report"
            else
              echo "$name=FAIL" >> "$report"
              echo "" >> "$report"
              echo "[$name]" >> "$report"
              tail -n 160 "$log" >> "$report"
              echo "" >> "$report"
            fi

            rm -f "$log"
          }

          run_check audit npm run audit
          run_check lint npm run lint
          run_check format npm run format:check
          run_check test npm test
          run_check build npm run build

          if [ -d dist/assets ]; then
            oversized_js="$(find dist/assets -type f -name '*.js' -size +500k -print)"
            oversized_css="$(find dist/assets -type f -name '*.css' -size +450k -print)"

            if [ -z "$oversized_js" ] && [ -z "$oversized_css" ]; then
              echo "bundle_budget=PASS" >> "$report"
            else
              echo "bundle_budget=FAIL" >> "$report"
              echo "" >> "$report"
              echo "[bundle_budget]" >> "$report"
              [ -n "$oversized_js" ] && printf 'JavaScript chunks over 500 KiB:\n%s\n' "$oversized_js" >> "$report"
              [ -n "$oversized_css" ] && printf 'CSS chunks over 450 KiB:\n%s\n' "$oversized_css" >> "$report"
            fi
          else
            echo "bundle_budget=SKIPPED" >> "$report"
          fi

      - name: Ensure branch stayed unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin feat/frontend-integration

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feat/frontend-integration)" ]; then
            echo "feat/frontend-integration changed during maintenance"
            exit 1
          fi

      - name: Commit maintenance result
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin feat/frontend-integration

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feat/frontend-integration)" ]; then
            echo "Skipping stale maintenance result"
            exit 1
          fi

          rm .github/workflows/cleanup-production-css.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/mini-app .github/production-css-audit.txt .github/mini-app-verification.txt .github/workflows/cleanup-production-css.yml
          git commit -m "format and audit production mini app"
          git push origin HEAD:feat/frontend-integration
