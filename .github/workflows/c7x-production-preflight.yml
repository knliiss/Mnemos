name: C7x Production Read-Only Preflight

on:
  workflow_run:
    workflows:
      - C7x Production Read-Only Preflight Request
    types:
      - completed

concurrency:
  group: mnemos-c7x-production-preflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: >-
      github.repository == 'knliiss/Mnemos' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'deploy/c7x-production-preflight' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, mnemos-production]
    timeout-minutes: 10
    steps:
      - name: Repair checkout workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Checkout trusted master diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify request provenance and trusted master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ github.event.workflow_run.id }}
          REQUEST_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"
          git merge-base --is-ancestor "$TRUSTED_SHA" origin/master
          git merge-base --is-ancestor "$REQUEST_SHA" origin/master
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          run_id = os.environ["REQUEST_ID"]
          sha = os.environ["REQUEST_SHA"]
          repo = os.environ["REPOSITORY"]
          if not re.fullmatch(r"[1-9][0-9]*", run_id) or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Invalid immutable diagnostic request")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          expected = {
              "name": "C7x Production Read-Only Preflight Request",
              "path": ".github/workflows/c7x-production-preflight-request.yml",
              "event": "push",
              "head_branch": "deploy/c7x-production-preflight",
              "head_sha": sha,
              "conclusion": "success",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit("Untrusted preflight request provenance: " + key)
          if (run.get("head_repository") or {}).get("full_name") != repo:
              raise SystemExit("Diagnostic request repository does not match")
          print("Trusted production read-only request verified")
          PY

      - name: Inspect only selected live service image revisions
        shell: bash
        run: |
          set -euo pipefail
          for name in mnemos_gateway-service mnemos_realtime-service mnemos_bot-management-service; do
            if image="$(sudo -n docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$name" 2>/dev/null)"; then
              case "$image" in
                */mnemos-*:*)
                  revision="${image##*:}"
                  revision="${revision%%@*}"
                  ;;
                *)
                  revision="unknown image format"
                  ;;
              esac
              echo "$name: present; image revision=$revision"
              sudo -n docker service ps --no-trunc --format '{{.CurrentState}}' "$name" | head -n 3
            else
              echo "$name: MISSING in production Swarm"
            fi
          done

      - name: Inspect canonical state membership without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/var/lib/mnemos-deploy/current-state.json")
          if not path.is_file():
              print("Canonical production state file: missing")
          else:
              state = json.loads(path.read_text(encoding="utf-8"))
              manifest = state.get("release_manifest", {}).get("services", {})
              for name in ("gateway-service", "realtime-service", "bot-management-service"):
                  item = manifest.get(name)
                  print(f"Canonical state {name}: " + (str(item.get("source_sha", "no SHA")) if item else "NOT LISTED"))
              print(f"Canonical state deployable service count: {len(manifest)}")
          PY
