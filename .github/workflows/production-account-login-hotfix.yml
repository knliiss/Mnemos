name: Production Account Login Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/production-account-login-hotfix.yml

concurrency:
  group: mnemos-production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  RELEASE_SHA: 2145ee542b867a58c0815bd4d1480eb4ad9b423b

jobs:
  rollout:
    if: vars.MNEMOS_PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 10

    steps:
      - name: Prepare isolated registry credentials
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-account-hotfix-docker-auth
          sudo -n install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0700 \
            /run/mnemos-account-hotfix-docker-auth

      - name: Authenticate production Docker to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-account-hotfix-docker-auth \
              docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Verify Keycloak hotfix is already deployed
        shell: bash
        run: |
          set -euo pipefail

          expected="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mnemos-keycloak:${RELEASE_SHA}"
          current="$(sudo -n docker inspect --format '{{ .Config.Image }}' mnemos-keycloak)"
          health="$(sudo -n docker inspect --format '{{ if .State.Health }}{{ .State.Health.Status }}{{ else }}{{ .State.Status }}{{ end }}' mnemos-keycloak)"

          echo "Keycloak image: $current"
          echo "Keycloak health: $health"

          case "$current" in
            "$expected" | "$expected"@sha256:*)
              ;;
            *)
              echo "Keycloak is not on the login hotfix release: expected=$expected current=$current" >&2
              exit 1
              ;;
          esac

          case "$health" in
            healthy | running)
              ;;
            *)
              echo "Keycloak is not healthy: $health" >&2
              exit 1
              ;;
          esac

      - name: Pull account-service hotfix image
        shell: bash
        run: |
          set -euo pipefail

          target="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mnemos-account-service:${RELEASE_SHA}"

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-account-hotfix-docker-auth \
            docker pull "$target"

      - name: Update only account-service
        shell: bash
        run: |
          set -euo pipefail

          service="mnemos_account-service"
          target="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mnemos-account-service:${RELEASE_SHA}"
          current="$(sudo -n docker service inspect --format '{{ .Spec.TaskTemplate.ContainerSpec.Image }}' "$service")"

          echo "Current account-service image: $current"
          echo "Target account-service image:  $target"

          case "$current" in
            "$target" | "$target"@sha256:*)
              echo "account-service is already on the hotfix image"
              exit 0
              ;;
          esac

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-account-hotfix-docker-auth \
            docker service update \
              --with-registry-auth \
              --image "$target" \
              "$service"

      - name: Verify account-service rollout
        shell: bash
        run: |
          set -euo pipefail

          service="mnemos_account-service"
          target="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mnemos-account-service:${RELEASE_SHA}"
          deadline=$((SECONDS + 240))
          stable_since=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            image="$(sudo -n docker service inspect --format '{{ .Spec.TaskTemplate.ContainerSpec.Image }}' "$service")"
            replicas="$(sudo -n docker service ls --filter "name=$service" --format '{{ .Replicas }}')"
            update_state="$(sudo -n docker service inspect --format '{{ if .UpdateStatus }}{{ .UpdateStatus.State }}{{ else }}stable{{ end }}' "$service")"

            actual="${replicas%%/*}"
            desired="${replicas##*/}"

            image_ok=false
            case "$image" in
              "$target" | "$target"@sha256:*)
                image_ok=true
                ;;
            esac

            state_ok=false
            case "$update_state" in
              stable | completed)
                state_ok=true
                ;;
            esac

            if [ "$image_ok" = true ] && [ "$actual" = "$desired" ] && [ "$desired" != "0" ] && [ "$state_ok" = true ]; then
              if [ "$stable_since" -eq 0 ]; then
                stable_since="$SECONDS"
              fi

              if [ $((SECONDS - stable_since)) -ge 10 ]; then
                echo "account-service hotfix converged: image=$image replicas=$replicas state=$update_state"
                sudo -n docker service ps \
                  --no-trunc \
                  --format 'table {{.Name}}\t{{.Image}}\t{{.CurrentState}}\t{{.Error}}' \
                  "$service"
                exit 0
              fi
            else
              stable_since=0
            fi

            sleep 3
          done

          echo "account-service hotfix did not converge" >&2
          sudo -n docker service inspect "$service" >&2 || true
          sudo -n docker service ps \
            --no-trunc \
            --format 'table {{.Name}}\t{{.Image}}\t{{.CurrentState}}\t{{.Error}}' \
            "$service" >&2 || true
          exit 1

      - name: Verify running account-service containers
        shell: bash
        run: |
          set -euo pipefail

          running="$(
            sudo -n docker ps \
              --filter label=com.docker.swarm.service.name=mnemos_account-service \
              --format '{{ .ID }}' | \
              wc -l | \
              tr -d ' '
          )"

          if [ "$running" -lt 1 ]; then
            echo "No running account-service containers found" >&2
            exit 1
          fi

          echo "Running account-service containers: $running"
          sudo -n docker ps \
            --filter label=com.docker.swarm.service.name=mnemos_account-service \
            --format 'table {{.ID}}\t{{.Image}}\t{{.Status}}'

      - name: Remove registry credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo -n rm -rf /run/mnemos-account-hotfix-docker-auth
