name: Temporary SAO Model Atlas Production Verification

on:
  push:
    branches:
      - ops/render-sao-json-models-helper

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify production model atlas
        shell: bash
        run: |
          set -euo pipefail

          target="$RUNNER_TEMP/sao-tracked-item-models.webp"
          curl --fail --silent --show-error --location \
            https://app.knalis.rest/event-icons/sao-tracked-item-models.webp \
            --output "$target"

          test "$(stat -c %s "$target")" = "11020"
          test "$(sha256sum "$target" | cut -d' ' -f1)" = "4dcf39f462d69a004bfc1839b60c5fd07db9b89a0ee98a392d186d5e002aa6ef"
          test "$(head -c 4 "$target")" = "RIFF"
          test "$(dd if="$target" bs=1 skip=8 count=4 status=none)" = "WEBP"

          echo "production_model_atlas=verified"
