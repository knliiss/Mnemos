name: Temporary SAO JSON Model Artwork Routing

on:
  push:
    branches:
      - ops/render-sao-json-models-helper

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/render-sao-json-models
          fetch-depth: 0

      - name: Route JSON-backed items to rendered model atlas
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          artwork_path = Path("apps/mini-app/src/ui/components/events/saoTrackedItemArtwork.ts")
          artwork = artwork_path.read_text(encoding="utf-8")

          old_header = '''export type SaoItemAtlasSprite = {
            column: number
            row: number
          }

          export const SAO_ITEM_ATLAS_PATH = "/event-icons/sao-tracked-items.webp"
          export const SAO_ITEM_ATLAS_COLUMNS = 16
          export const SAO_ITEM_ATLAS_ROWS = 11
          '''.replace("          ", "")

          new_header = '''export type SaoItemAtlas = {
            path: string
            columns: number
            rows: number
          }

          export type SaoItemAtlasSprite = {
            column: number
            row: number
            atlas: SaoItemAtlas
          }

          export const SAO_ITEM_ATLAS_PATH = "/event-icons/sao-tracked-items.webp"
          export const SAO_ITEM_ATLAS_COLUMNS = 16
          export const SAO_ITEM_ATLAS_ROWS = 11
          export const SAO_MODEL_ITEM_ATLAS_PATH = "/event-icons/sao-tracked-item-models.webp"
          export const SAO_MODEL_ITEM_ATLAS_COLUMNS = 8
          export const SAO_MODEL_ITEM_ATLAS_ROWS = 8

          const TRACKED_ITEM_ATLAS: SaoItemAtlas = {
            path: SAO_ITEM_ATLAS_PATH,
            columns: SAO_ITEM_ATLAS_COLUMNS,
            rows: SAO_ITEM_ATLAS_ROWS,
          }

          const MODEL_ITEM_ATLAS: SaoItemAtlas = {
            path: SAO_MODEL_ITEM_ATLAS_PATH,
            columns: SAO_MODEL_ITEM_ATLAS_COLUMNS,
            rows: SAO_MODEL_ITEM_ATLAS_ROWS,
          }
          '''.replace("          ", "")

          if old_header not in artwork:
              raise SystemExit("SAO artwork header did not match expected source")

          artwork = artwork.replace(old_header, new_header, 1)

          model_index = '''
          const MODEL_ITEM_ATLAS_INDEX: Record<string, number> = {
            l10_11: 0,
            l10_12: 1,
            l11_11: 2,
            l11_12: 3,
            l12_11: 4,
            l12_12: 5,
            l13_11: 6,
            l13_12: 7,
            l14_11: 8,
            l14_12: 9,
            l15_11: 10,
            l15_12: 11,
            l16_11: 12,
            l16_12: 13,
            l17_11: 14,
            l17_12: 15,
            l18_11: 16,
            l18_12: 17,
            l19_11: 18,
            l19_12: 19,
            l1_8: 20,
            l1_9: 21,
            l20_11: 22,
            l20_12: 23,
            l21_10: 24,
            l21_11: 25,
            l21_12: 26,
            l22_10: 27,
            l22_11: 28,
            l22_12: 29,
            l23_10: 30,
            l23_11: 31,
            l23_12: 32,
            l24_10: 33,
            l24_11: 34,
            l24_12: 35,
            l25_10: 36,
            l25_11: 37,
            l25_12: 38,
            l26_10: 39,
            l26_11: 40,
            l26_12: 41,
            l27_10: 42,
            l27_11: 43,
            l27_12: 44,
            l28_10: 45,
            l28_11: 46,
            l28_12: 47,
            l2_10: 48,
            l3_10: 49,
            l4_10: 50,
            l5_10: 51,
            l6_10: 52,
            l7_10: 53,
            l7_11: 54,
            l8_11: 55,
            l9_10: 56,
            l9_11: 57,
            l9_12: 58,
          }
          '''.replace("          ", "")

          resolve_marker = "export function resolveSaoItemAtlasSprite"
          resolve_start = artwork.index(resolve_marker)
          artwork = artwork[:resolve_start].rstrip() + "\n\n" + model_index.strip() + "\n\n" + '''export function resolveSaoItemAtlasSprite(localizationKey?: string): SaoItemAtlasSprite | null {
            if (!localizationKey?.startsWith("sao.item.") || !localizationKey.endsWith(".name")) {
              return null
            }

            const itemId = localizationKey.slice("sao.item.".length, -".name".length)
            const modelIndex = MODEL_ITEM_ATLAS_INDEX[itemId]

            if (modelIndex !== undefined) {
              return toSprite(modelIndex, MODEL_ITEM_ATLAS)
            }

            const index = ITEM_ATLAS_INDEX[itemId]

            if (index === undefined) {
              return null
            }

            return toSprite(index, TRACKED_ITEM_ATLAS)
          }

          function toSprite(index: number, atlas: SaoItemAtlas): SaoItemAtlasSprite {
            return {
              column: index % atlas.columns,
              row: Math.floor(index / atlas.columns),
              atlas,
            }
          }
          '''.replace("          ", "")

          artwork_path.write_text(artwork, encoding="utf-8")

          event_art_path = Path("apps/mini-app/src/ui/components/events/EventArt.tsx")
          event_art = event_art_path.read_text(encoding="utf-8")

          old_import = '''import {
            resolveSaoItemAtlasSprite,
            SAO_ITEM_ATLAS_COLUMNS,
            SAO_ITEM_ATLAS_PATH,
            SAO_ITEM_ATLAS_ROWS,
            type SaoItemAtlasSprite,
          } from "./saoTrackedItemArtwork"
          '''.replace("          ", "")
          new_import = '''import {
            resolveSaoItemAtlasSprite,
            type SaoItemAtlasSprite,
          } from "./saoTrackedItemArtwork"
          '''.replace("          ", "")

          if old_import not in event_art:
              raise SystemExit("EventArt atlas import did not match expected source")

          event_art = event_art.replace(old_import, new_import, 1)

          old_style = '''function itemSpriteStyle(sprite: SaoItemAtlasSprite, contentSize: number): CSSProperties {
            return {
              backgroundImage: `url(${SAO_ITEM_ATLAS_PATH})`,
              backgroundRepeat: "no-repeat",
              backgroundSize: `${SAO_ITEM_ATLAS_COLUMNS * contentSize}px ${SAO_ITEM_ATLAS_ROWS * contentSize}px`,
              backgroundPosition: `${-sprite.column * contentSize}px ${-sprite.row * contentSize}px`,
              imageRendering: "pixelated",
            }
          }
          '''.replace("          ", "")
          new_style = '''function itemSpriteStyle(sprite: SaoItemAtlasSprite, contentSize: number): CSSProperties {
            return {
              backgroundImage: `url(${sprite.atlas.path})`,
              backgroundRepeat: "no-repeat",
              backgroundSize: `${sprite.atlas.columns * contentSize}px ${sprite.atlas.rows * contentSize}px`,
              backgroundPosition: `${-sprite.column * contentSize}px ${-sprite.row * contentSize}px`,
              imageRendering: "pixelated",
            }
          }
          '''.replace("          ", "")

          if old_style not in event_art:
              raise SystemExit("EventArt sprite style did not match expected source")

          event_art = event_art.replace(old_style, new_style, 1)
          event_art_path.write_text(event_art, encoding="utf-8")

          test_path = Path("apps/mini-app/src/ui/components/events/saoTrackedItemArtwork.test.ts")
          test_path.write_text(
              '''import { describe, expect, it } from "vitest"
          import { resolveSaoItemAtlasSprite } from "./saoTrackedItemArtwork"

          describe("SAO tracked item artwork", () => {
            it("maps regular tracked items to the original atlas", () => {
              expect(resolveSaoItemAtlasSprite("sao.item.d1_324.name")).toEqual({
                column: 0,
                row: 3,
                atlas: {
                  path: "/event-icons/sao-tracked-items.webp",
                  columns: 16,
                  rows: 11,
                },
              })
            })

            it("keeps the reused blazing ring artwork in the original atlas", () => {
              expect(resolveSaoItemAtlasSprite("sao.item.d3_504.name")).toEqual({
                column: 5,
                row: 10,
                atlas: {
                  path: "/event-icons/sao-tracked-items.webp",
                  columns: 16,
                  rows: 11,
                },
              })
            })

            it("uses rendered JSON model artwork when the resource pack defines a model", () => {
              expect(resolveSaoItemAtlasSprite("sao.item.l1_8.name")).toEqual({
                column: 4,
                row: 2,
                atlas: {
                  path: "/event-icons/sao-tracked-item-models.webp",
                  columns: 8,
                  rows: 8,
                },
              })
            })

            it("rejects unknown and non-item localization keys", () => {
              expect(resolveSaoItemAtlasSprite("sao.event.darkness.name")).toBeNull()
              expect(resolveSaoItemAtlasSprite("sao.item.unknown.name")).toBeNull()
            })
          })
          '''.replace("          ", ""),
              encoding="utf-8",
          )
          PY

          cd apps/mini-app
          npm ci
          npm run format

          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/mini-app/src/ui/components/events/EventArt.tsx \
            apps/mini-app/src/ui/components/events/saoTrackedItemArtwork.ts \
            apps/mini-app/src/ui/components/events/saoTrackedItemArtwork.test.ts
          git commit -m "Render JSON-backed SAO item artwork"
          git push origin HEAD:fix/render-sao-json-models
