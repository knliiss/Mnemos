name: Event Verification Hosted

on:
  push:
    branches:
      - event-verification-fix
    paths:
      - ".github/workflows/event-verification-hosted.yml"
      - "apps/event-service/**"
      - "contracts/**"
      - "libraries/**"
      - "build-logic/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"

permissions:
  contents: read

jobs:
  event-service-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify event-service
        run: ./gradlew :apps:event-service:check --no-daemon
