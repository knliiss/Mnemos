name: Cancel Stale Production Recovery

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cancel-stale-production-recovery.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Cancel stale recovery run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "33230942737"
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/cancel"
          )"

          case "$status" in
            202)
              echo "Cancellation accepted for stale production recovery run $RUN_ID"
              ;;
            409)
              echo "Recovery run $RUN_ID is already completed or no longer cancellable"
              ;;
            *)
              cat "$response_file" >&2 || true
              echo "Failed to cancel recovery run $RUN_ID: HTTP $status" >&2
              exit 1
              ;;
          esac

          rm -f "$response_file"
