name: Backend Verify

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/backend-verify.yml"
      - ".github/workflows/production*.yml"
      - ".env.example"
      - "Makefile"
      - "make/**"
      - "apps/**"
      - "!apps/mini-app/**"
      - "contracts/**"
      - "libraries/**"
      - "keycloak-extensions/**"
      - "build-logic/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - "infrastructure/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - ".github/workflows/backend-verify.yml"
      - ".github/workflows/production*.yml"
      - ".env.example"
      - "Makefile"
      - "make/**"
      - "apps/**"
      - "!apps/mini-app/**"
      - "contracts/**"
      - "libraries/**"
      - "keycloak-extensions/**"
      - "build-logic/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - "infrastructure/**"

concurrency:
  group: backend-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, mnemos-backend]
    timeout-minutes: 45

    steps:
      - name: Clean generated workspace state
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$GITHUB_WORKSPACE" ]; then
            exit 0
          fi

          stale_root="$(dirname "$GITHUB_WORKSPACE")/.ci-stale"
          mkdir -p "$stale_root"

          docker_available=false

          if timeout 5s docker info >/dev/null 2>&1; then
            docker_available=true
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              alpine:3.22 \
              chown -R "$(id -u):$(id -g)" /workspace

            if [ -d "$stale_root" ]; then
              docker run --rm \
                --volume "$stale_root:/stale" \
                alpine:3.22 \
                chown -R "$(id -u):$(id -g)" /stale
              rm -rf -- "$stale_root"/*
            fi
          else
            echo "::warning::Docker daemon is unavailable; generated state will be quarantined without recursive deletion"
          fi

          cleanup_failed=0
          quarantine_index=0
          while IFS= read -r -d '' path; do
            if [ "$docker_available" = true ] && rm -rf -- "$path"; then
              continue
            fi

            quarantine_index=$((quarantine_index + 1))
            stale_path="$stale_root/${GITHUB_RUN_ID}-${quarantine_index}"

            if ! mv -- "$path" "$stale_path"; then
              echo "::warning::Could not remove or quarantine generated path: $path"
              cleanup_failed=1
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type d \
              \( \
                -name build -o \
                -name .gradle -o \
                -name .kotlin -o \
                -name __pycache__ -o \
                -name '*.ci-stale-*' \
              \) \
              -prune \
              -print0
          )

          if [ "$cleanup_failed" -ne 0 ]; then
            echo "::warning::Some generated workspace state could not be cleaned"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Resolve affected backend projects
        id: backend_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed_paths="$RUNNER_TEMP/backend-changed-paths.txt"
          result="$RUNNER_TEMP/backend-ci-changes.json"

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PULL_REQUEST_BASE_SHA"
              head_sha="$PULL_REQUEST_HEAD_SHA"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              ;;
            *)
              echo "Unsupported Backend Verify event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Backend Verify head SHA is invalid: $head_sha" >&2
            exit 1
          fi

          if printf '%s' "$base_sha" | grep -Eq '^[0-9a-f]{40}$' && \
             [ "$base_sha" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git diff \
              --name-only \
              "$base_sha" \
              "$head_sha" > "$changed_paths"
          else
            echo "No usable event base SHA; forcing full backend verification" >&2
            printf '%s\n' 'settings.gradle.kts' > "$changed_paths"
          fi

          python3 scripts/resolve_backend_ci_changes.py \
            --paths-file "$changed_paths" > "$result"

          python3 - "$result" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          result_path, output_path = sys.argv[1:]
          result = json.load(open(result_path, encoding="utf-8"))

          with open(output_path, "a", encoding="utf-8") as output:
              output.write("check_tasks=" + " ".join(result["check_tasks"]) + "\n")
              output.write("verification_tasks=" + " ".join(result["verification_tasks"]) + "\n")
              output.write("fast_path=" + str(result["fast_path"]).lower() + "\n")
              output.write("stack_smoke_required=" + str(result["stack_smoke_required"]).lower() + "\n")
              output.write(
                  "dependency_scan_required="
                  + str(result["dependency_scan_required"]).lower()
                  + "\n"
              )
              output.write("full_backend=" + str(result["full_backend"]).lower() + "\n")
          PY

          cat "$result"

      - name: Verify Make wiring
        if: steps.backend_changes.outputs.fast_path != 'true'
        run: make make-verify

      - name: Verify infrastructure configuration
        if: steps.backend_changes.outputs.fast_path != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sh -n infrastructure/postgres/init-service-database-access.sh
          sh -n infrastructure/kafka/init-kafka-tls.sh
          sh -n infrastructure/redis/redis-entrypoint.sh
          sh -n scripts/docker-compose-env.sh
          sh -n scripts/ensure-kafka-tls-secret.sh
          sh -n scripts/validate-compose-secrets.sh
          sh -n scripts/verify-compose-secret-validation.sh
          sh -n scripts/verify-resource-server-audience.sh
          sh -n scripts/verify-internal-api-authorization.sh
          sh -n scripts/verify-kafka-transport-security.sh
          sh -n scripts/verify-app-container-security.sh
          sh -n scripts/verify-workflow-action-pins.sh
          sh -n scripts/verify-cloudflare-deploy-security.sh
          sh -n scripts/verify-ci-workflow-security.sh
          sh -n scripts/verify-production-release-security.sh
          sh -n scripts/verify-production-hotfix-plan-security.sh
          sh -n scripts/verify-production-backup-tooling.sh
          sh -n scripts/verify-production-monitoring-tooling.sh
          sh -n scripts/check-production-health.sh
          sh -n scripts/verify-telegram-init-data-transport.sh
          sh -n scripts/verify-keycloak-session-security.sh
          sh -n scripts/verify-postgres-legacy-ownership-migration.sh
          sh -n scripts/verify-no-insecure-credential-defaults.sh
          sh -n scripts/generate-kafka-message-keys.sh
          sh -n scripts/verify-compose-env-isolation.sh
          sh -n scripts/verify-kafka-message-auth.sh
          sh -n scripts/verify-kafka-message-auth-runtime.sh
          sh -n scripts/verify-kafka-service-config.sh
          sh -n scripts/verify-redis-service-config.sh
          sh -n scripts/verify-redis-service-isolation-runtime.sh
          sh -n scripts/publish-production-images.sh
          sh -n scripts/production-infra.sh
          sh -n scripts/start-production-infra.sh
          sh -n scripts/render-production-app-stack.sh
          sh -n scripts/sync-production-kafka-truststore.sh
          sh -n scripts/sync-production-cloudflare-tunnel-secret.sh
          sh -n scripts/set-production-cloudflare-tunnel-token.sh
          sh -n scripts/prune-production-cloudflare-tunnel-secrets.sh
          sh -n scripts/wait-production-stack.sh
          sh -n scripts/verify-production-infra.sh
          sh -n scripts/deploy-production-apps.sh
          sh -n scripts/install-production-runtime.sh
          sh -n scripts/bootstrap-production-env.sh
          sh -n scripts/set-production-external-value.sh
          sh -n scripts/validate-production-env.sh
          sh -n scripts/verify-production-infra-compose.sh
          sh -n scripts/backup-production.sh
          sh -n scripts/verify-production-backup.sh
          sh -n scripts/backup-production-offsite.sh
          sh -n scripts/run-production-backup.sh
          sh -n scripts/restore-production-core.sh
          sh -n scripts/restore-production-redis.sh
          python3 -m py_compile scripts/resolve_backend_ci_changes.py
          python3 -m py_compile scripts/verify-backend-ci-changes.py
          python3 -m py_compile scripts/production_release_manifest.py
          python3 -m py_compile scripts/production_deployment_plan.py
          python3 -m py_compile scripts/production_deployment_state.py
          python3 -m py_compile scripts/production_hotfix_plan.py
          python3 -m py_compile scripts/render-production-stack.py
          python3 -m py_compile scripts/normalize-production-swarm-stack.py
          python3 -m py_compile scripts/verify-production-stack-renderer.py
          python3 -m py_compile scripts/verify-production-stack-manifest-renderer.py
          python3 -m py_compile scripts/verify-production-swarm-stack-normalizer.py
          python3 scripts/verify-backend-ci-changes.py
          sh scripts/verify-compose-secret-validation.sh
          sh scripts/verify-resource-server-audience.sh
          sh scripts/verify-internal-api-authorization.sh
          sh scripts/verify-kafka-transport-security.sh
          sh scripts/verify-app-container-security.sh
          sh scripts/verify-workflow-action-pins.sh
          sh scripts/verify-cloudflare-deploy-security.sh
          sh scripts/verify-ci-workflow-security.sh
          sh scripts/verify-production-release-security.sh
          sh scripts/verify-production-hotfix-plan-security.sh
          sh scripts/verify-production-backup-tooling.sh
          sh scripts/verify-production-monitoring-tooling.sh
          sh scripts/verify-telegram-init-data-transport.sh
          sh scripts/verify-keycloak-session-security.sh
          sh scripts/verify-no-insecure-credential-defaults.sh
          sh scripts/verify-kafka-service-config.sh
          sh scripts/verify-redis-service-config.sh
          sh scripts/verify-production-infra-compose.sh
          python3 scripts/verify-production-stack-renderer.py
          python3 scripts/verify-production-stack-manifest-renderer.py
          python3 scripts/verify-production-swarm-stack-normalizer.py

      - name: Scan backend dependencies
        if: steps.backend_changes.outputs.dependency_scan_required == 'true'
        shell: bash
        env:
          NVD_API_KEY: ${{ github.event_name == 'push' && secrets.NVD_API_KEY || '' }}
        run: |
          set -euo pipefail

          if [ -z "${NVD_API_KEY:-}" ]; then
            unset NVD_API_KEY
          fi

          ./gradlew dependencyCheckAggregate --no-daemon --no-configuration-cache --no-parallel

      - name: Verify backend
        if: steps.backend_changes.outputs.verification_tasks != ''
        shell: bash
        env:
          VERIFICATION_TASKS: ${{ steps.backend_changes.outputs.verification_tasks }}
        run: |
          set -euo pipefail

          read -r -a tasks <<< "$VERIFICATION_TASKS"
          ./gradlew "${tasks[@]}"

  report:
    if: always() && github.event_name == 'push'
    needs: check
    runs-on: [self-hosted, Linux, X64, mnemos-backend]

    permissions:
      statuses: write

    steps:
      - name: Publish verification status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ needs.check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$CHECK_STATUS" = "success" ]; then
            STATE="success"
          else
            STATE="failure"
          fi

          PAYLOAD="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "Backend verify: $CHECK_STATUS" \
            --arg context "backend/verify" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$PAYLOAD" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}"
