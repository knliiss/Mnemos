name: Production C7x Secrets Request

on:
  push:
    branches:
      - "deploy/production-c7x-secrets"

permissions:
  contents: read

jobs:
  request:
    if: github.repository == 'knliiss/Mnemos' && github.event.created == true
    runs-on: [self-hosted, Linux, X64, mnemos-backend]
    timeout-minutes: 5
    steps:
      - name: Record read-only one-time production preparation request
        shell: bash
        run: |
          set -euo pipefail
          echo "Request created for trusted Mnemos production C7x credentials preparation."
          echo "No secrets or production privileges are available in this job."
