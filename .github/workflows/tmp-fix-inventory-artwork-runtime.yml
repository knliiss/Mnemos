name: Temporary Frontend Inventory Artwork Repair

on:
  push:
    branches:
      - fix/inventory-artwork-runtime-correctness

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/inventory-artwork-runtime-correctness
          fetch-depth: 0

      - name: Apply exact frontend fixes
        shell: bash
        run: |
          set -euo pipefail

          git mv \
            apps/mini-app/src/ui/components/profile/minecraftHeadRenderer.ts \
            apps/mini-app/src/ui/shared/minecraftHeadRenderer.ts

          python3 - <<'PY'
          from pathlib import Path

          head = Path('apps/mini-app/src/ui/shared/minecraftHeadRenderer.ts')
          text = head.read_text()
          text = text.replace('const HEAD_YAW_DEGREES = -30', 'const HEAD_YAW_DEGREES = 45')
          text = text.replace('const HEAD_PITCH_DEGREES = 20', 'const HEAD_PITCH_DEGREES = 30')
          head.write_text(text)

          cristalix = Path('apps/mini-app/src/ui/components/profile/CristalixHead.tsx')
          text = cristalix.read_text()
          text = text.replace(
              'import { createSteveHeadTexture, renderMinecraftHead } from "./minecraftHeadRenderer"',
              'import { createSteveHeadTexture, renderMinecraftHead } from "../../shared/minecraftHeadRenderer"',
          )
          cristalix.write_text(text)

          tracked = Path('apps/mini-app/src/ui/components/events/saoTrackedItemArtwork.ts')
          text = tracked.read_text().replace(
              '/event-icons/sao-tracked-item-models.webp',
              '/event-icons/sao-tracked-item-models-inventory-v2.webp',
          )
          tracked.write_text(text)
          PY

          cp \
            apps/mini-app/public/event-icons/sao-tracked-item-models.webp \
            apps/mini-app/public/event-icons/sao-tracked-item-models-inventory-v2.webp

          cat > apps/mini-app/src/ui/components/events/saoPetInventoryArtwork.ts <<'EOF'
          const PET_TEXTURE_BASE_URL = "https://rustorage.c7x.dev/butowka/sao/global/img/pet"
          const PET_ITEM_ID = /^pet_l\d+_\d+$/

          export function resolveSaoPetInventoryTextureUrl(localizationKey?: string): string | null {
            if (!localizationKey?.startsWith("sao.item.") || !localizationKey.endsWith(".name")) {
              return null
            }

            const itemId = localizationKey.slice("sao.item.".length, -".name".length)

            if (!PET_ITEM_ID.test(itemId)) {
              return null
            }

            return `${PET_TEXTURE_BASE_URL}/${itemId}.png`
          }
          EOF

          cat > apps/mini-app/src/ui/components/events/saoPetInventoryArtwork.test.ts <<'EOF'
          import { describe, expect, it } from "vitest"
          import { resolveSaoPetInventoryTextureUrl } from "./saoPetInventoryArtwork"

          describe("SAO PET inventory artwork", () => {
            it("maps a canonical PET localization key to its inventory head texture", () => {
              expect(resolveSaoPetInventoryTextureUrl("sao.item.pet_l9_4.name")).toBe(
                "https://rustorage.c7x.dev/butowka/sao/global/img/pet/pet_l9_4.png",
              )
            })

            it("rejects non-PET and malformed localization keys", () => {
              expect(resolveSaoPetInventoryTextureUrl("sao.item.l9_4.name")).toBeNull()
              expect(resolveSaoPetInventoryTextureUrl("sao.item.pet_bad.name")).toBeNull()
              expect(resolveSaoPetInventoryTextureUrl("sao.event.pet_l9_4.name")).toBeNull()
            })
          })
          EOF

          cat > apps/mini-app/src/ui/components/events/PetInventoryArt.tsx <<'EOF'
          import { useEffect, useRef, useState } from "react"
          import { renderMinecraftHead } from "../../shared/minecraftHeadRenderer"

          const FALLBACK_PET_ASSET = "/event-icons/pet.png"

          type Props = {
            textureUrl: string
          }

          export function PetInventoryArt({ textureUrl }: Props) {
            const canvasRef = useRef<HTMLCanvasElement>(null)
            const [loadedTextureUrl, setLoadedTextureUrl] = useState<string | null>(null)
            const [failedTextureUrl, setFailedTextureUrl] = useState<string | null>(null)

            const loaded = loadedTextureUrl === textureUrl
            const failed = failedTextureUrl === textureUrl

            useEffect(() => {
              const canvas = canvasRef.current

              if (!canvas) {
                return
              }

              const image = new Image()
              image.decoding = "async"

              image.onload = () => {
                if (!renderMinecraftHead(canvas, image, 1)) {
                  setFailedTextureUrl(textureUrl)
                  return
                }

                setFailedTextureUrl((current) => (current === textureUrl ? null : current))
                setLoadedTextureUrl(textureUrl)
              }

              image.onerror = () => {
                setLoadedTextureUrl((current) => (current === textureUrl ? null : current))
                setFailedTextureUrl(textureUrl)
              }

              image.src = textureUrl

              return () => {
                image.onload = null
                image.onerror = null
              }
            }, [textureUrl])

            if (failed) {
              return (
                <img
                  className="event-art__image"
                  src={FALLBACK_PET_ASSET}
                  alt=""
                  draggable={false}
                  decoding="async"
                />
              )
            }

            return (
              <canvas
                ref={canvasRef}
                className={`event-art__image event-art__pet-head ${loaded ? "is-loaded" : ""}`}
                aria-hidden="true"
              />
            )
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/mini-app/src/ui/components/events/EventArt.tsx')
          text = path.read_text()

          text = text.replace(
              'import { resolveSaoPetAtlasSprite } from "./saoPetArtwork"\n',
              'import { PetInventoryArt } from "./PetInventoryArt"\n'
              'import { resolveSaoPetInventoryTextureUrl } from "./saoPetInventoryArtwork"\n',
          )

          text = text.replace(
              '  const itemSprite = resolveEventItemSprite(event)\n\n  return (\n    <ArtFrame\n      variant={getVariant(event)}\n      size={size}\n      extraClass={rarityClass}\n      itemSprite={itemSprite}\n    />\n  )',
              '  const itemSprite = resolveEventItemSprite(event)\n  const petTextureUrl = resolveEventPetTextureUrl(event)\n\n  return (\n    <ArtFrame\n      variant={getVariant(event)}\n      size={size}\n      extraClass={rarityClass}\n      itemSprite={itemSprite}\n      petTextureUrl={petTextureUrl}\n    />\n  )',
          )

          text = text.replace(
              '  if (event.meta === "PET") {\n    return resolveSaoPetAtlasSprite(event.localizationKey)\n  }\n\n  return resolveSaoItemAtlasSprite(event.localizationKey)\n}',
              '  if (event.meta === "PET") {\n    return null\n  }\n\n  return resolveSaoItemAtlasSprite(event.localizationKey)\n}\n\nfunction resolveEventPetTextureUrl(event: FeedEvent): string | null {\n  if (event.kind !== "ITEM_DROP" || event.meta !== "PET") {\n    return null\n  }\n\n  return resolveSaoPetInventoryTextureUrl(event.localizationKey)\n}',
          )

          text = text.replace(
              '  itemSprite = null,\n}: {\n  variant: Variant\n  size: number\n  extraClass?: string\n  itemSprite?: SaoItemAtlasSprite | null\n}) {\n  const asset = itemSprite ? null : eventAssets[variant]',
              '  itemSprite = null,\n  petTextureUrl = null,\n}: {\n  variant: Variant\n  size: number\n  extraClass?: string\n  itemSprite?: SaoItemAtlasSprite | null\n  petTextureUrl?: string | null\n}) {\n  const asset = itemSprite || petTextureUrl ? null : eventAssets[variant]',
          )

          text = text.replace(
              '${asset || itemSprite ? "event-art--asset" : "event-art--vectorized"}',
              '${asset || itemSprite || petTextureUrl ? "event-art--asset" : "event-art--vectorized"}',
          )

          text = text.replace(
              '      {itemSprite ? (\n        <span className="event-art__image" style={itemSpriteStyle(itemSprite, contentSize)} />\n      ) : asset ? (',
              '      {petTextureUrl ? (\n        <PetInventoryArt textureUrl={petTextureUrl} />\n      ) : itemSprite ? (\n        <span className="event-art__image" style={itemSpriteStyle(itemSprite, contentSize)} />\n      ) : asset ? (',
          )

          path.write_text(text)
          PY

          rm -f \
            apps/mini-app/public/event-icons/sao-pets.webp \
            apps/mini-app/src/ui/components/events/saoPetArtwork.ts \
            apps/mini-app/src/ui/components/events/saoPetArtwork.test.ts \
            scripts/render_sao_pet_artwork.py \
            scripts/sao-artwork/pet-idle-pose.json \
            scripts/sao-artwork/pet-model.json

          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix runtime inventory artwork rendering"
          git push origin HEAD:fix/inventory-artwork-runtime-correctness
