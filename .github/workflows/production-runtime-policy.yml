name: Production Runtime Policy

on:
  workflow_dispatch:
    inputs:
      tooling_revision:
        description: Exact master SHA containing the approved runtime policy
        required: true
        type: string
      authorization:
        description: Type APPLY followed by the exact tooling SHA
        required: true
        type: string
      reason:
        description: Reason for the production policy reconciliation
        required: true
        type: string
  workflow_run:
    workflows:
      - Production Runtime Policy Request
    types:
      - completed

concurrency:
  group: mnemos-production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  TOOLING_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.tooling_revision || github.event.workflow_run.head_sha }}
  AUTHORIZATION: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization || '' }}
  RECONCILIATION_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || 'Authorized by deploy/production-runtime-policy' }}

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 30

    steps:
      - name: Repair production runner workspace ownership
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Checkout trusted master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate explicit production authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUEST_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          REQUEST_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          REQUEST_EVENT: ${{ github.event.workflow_run.event }}
          REQUEST_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REQUEST_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUEST_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$TOOLING_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "tooling_revision must be a full 40-character commit SHA" >&2
            exit 1
          fi

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ "$AUTHORIZATION" != "APPLY $TOOLING_REVISION" ]; then
                echo "authorization must exactly equal: APPLY <tooling_revision>" >&2
                exit 1
              fi

              if [ "$GITHUB_REF" != "refs/heads/master" ]; then
                echo "Production runtime policy can only be manually dispatched from master" >&2
                exit 1
              fi

              if [ "$GITHUB_SHA" != "$TOOLING_REVISION" ]; then
                echo "Dispatched master revision does not match the approved tooling SHA" >&2
                exit 1
              fi
              ;;
            workflow_run)
              if [ "$REQUEST_WORKFLOW_NAME" != "Production Runtime Policy Request" ]; then
                echo "Unexpected upstream workflow: $REQUEST_WORKFLOW_NAME" >&2
                exit 1
              fi

              if [ "$REQUEST_WORKFLOW_PATH" != ".github/workflows/production-runtime-policy-request.yml" ]; then
                echo "Unexpected upstream workflow path: $REQUEST_WORKFLOW_PATH" >&2
                exit 1
              fi

              if [ "$REQUEST_EVENT" != "push" ]; then
                echo "Runtime policy request must originate from a push" >&2
                exit 1
              fi

              if [ "$REQUEST_BRANCH" != "deploy/production-runtime-policy" ]; then
                echo "Runtime policy request used an unauthorized ref: $REQUEST_BRANCH" >&2
                exit 1
              fi

              if [ "$REQUEST_HEAD_SHA" != "$TOOLING_REVISION" ]; then
                echo "Runtime policy request head SHA changed" >&2
                exit 1
              fi

              if [ "$REQUEST_CONCLUSION" != "success" ]; then
                echo "Runtime policy request did not succeed" >&2
                exit 1
              fi

              run_json="$(
                curl \
                  --fail-with-body \
                  --silent \
                  --show-error \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${REPOSITORY}/actions/runs/${REQUEST_RUN_ID}"
              )"

              RUN_JSON="$run_json" python3 -c 'import json, os, sys; run = json.loads(os.environ["RUN_JSON"]); expected = {"name": "Production Runtime Policy Request", "path": ".github/workflows/production-runtime-policy-request.yml", "event": "push", "head_branch": "deploy/production-runtime-policy", "head_sha": os.environ["TOOLING_REVISION"], "conclusion": "success"}; mismatches = [key for key, value in expected.items() if run.get(key) != value]; sys.exit(f"Runtime policy request metadata mismatch: {mismatches[0]}") if mismatches else None'

              master_sha="$(git rev-parse origin/master)"

              if [ "$TOOLING_REVISION" != "$master_sha" ]; then
                echo "deploy/production-runtime-policy must point exactly at current master HEAD" >&2
                echo "tooling_revision=$TOOLING_REVISION" >&2
                echo "master_sha=$master_sha" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported production runtime policy event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          python3 scripts/production_source_revision.py \
            "$TOOLING_REVISION" \
            --trusted-ref origin/master

      - name: Checkout approved production tooling
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TOOLING_REVISION"

      - name: Verify checked-out tooling revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOOLING_REVISION"

      - name: Verify production baseline availability
        shell: bash
        run: |
          set -euo pipefail
          sudo -n sh scripts/validate-production-env.sh
          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh

      - name: Reconcile runtime policy without image replacement
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/reconcile-production-runtime-policy.py

      - name: Verify production availability after reconciliation
        shell: bash
        run: |
          set -euo pipefail
          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh

      - name: Install approved production tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo -n sh scripts/install-production-runtime.sh "$TOOLING_REVISION"

      - name: Reconcile declarative Keycloak configuration
        shell: bash
        run: |
          set -euo pipefail

          keycloak_image="$(
            sudo -n docker inspect \
              --format '{{.Config.Image}}' \
              mnemos-keycloak
          )"

          case "$keycloak_image" in
            */mnemos-keycloak:*)
              image_registry="${keycloak_image%/mnemos-keycloak:*}"
              release_tag="${keycloak_image##*:}"
              ;;
            *)
              echo "Could not derive production infrastructure image coordinates from: $keycloak_image" >&2
              exit 1
              ;;
          esac

          if [ -z "$image_registry" ] || [ -z "$release_tag" ]; then
            echo "Production infrastructure image coordinates are empty" >&2
            exit 1
          fi

          sudo -n env \
            MNEMOS_IMAGE_REGISTRY="$image_registry" \
            MNEMOS_RELEASE_TAG="$release_tag" \
            sh scripts/production-infra.sh \
              run \
              --rm \
              --no-deps \
              --volume "$GITHUB_WORKSPACE/infrastructure/keycloak/config:/config:ro" \
              keycloak-config

      - name: Verify moderation Keycloak query permission
        shell: bash
        run: |
          set -euo pipefail

          read_env_value() {
            key="$1"

            value="$(
              sudo -n awk -v key="$key" '
                index($0, key "=") == 1 {
                  count++
                  value = substr($0, length(key) + 2)
                }
                END {
                  if (count != 1) {
                    exit 1
                  }
                  print value
                }
              ' /etc/mnemos/mnemos.env
            )"

            case "$value" in
              \"*\")
                value="${value#\"}"
                value="${value%\"}"
                ;;
              \'*\')
                value="${value#\'}"
                value="${value%\'}"
                ;;
            esac

            if [ -z "$value" ]; then
              echo "Production env value is missing or blank: $key" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          host_bind_address="$(read_env_value MNEMOS_HOST_BIND_ADDRESS)"
          keycloak_host_port="$(read_env_value KEYCLOAK_HOST_PORT)"
          moderation_client_id="$(read_env_value MNEMOS_MODERATION_SERVICE_CLIENT_ID)"
          moderation_client_secret="$(read_env_value KEYCLOAK_MODERATION_SERVICE_CLIENT_SECRET)"

          if [ -z "$host_bind_address" ] || [ -z "$keycloak_host_port" ]; then
            echo "Production Keycloak host coordinates are missing" >&2
            exit 1
          fi

          sudo -n docker exec \
            mnemos-keycloak \
            /opt/keycloak/bin/kcadm.sh \
              get users \
              --no-config \
              --server http://127.0.0.1:8080 \
              --realm mnemos \
              --client "$moderation_client_id" \
              --secret "$moderation_client_secret" \
              --query "q=mnemos_user_id:__mnemos_permission_probe__" \
              --query "max=1" \
              >/dev/null

          echo "Moderation Keycloak query permission verified"

      - name: Record exact live production state
        shell: bash
        run: |
          set -euo pipefail

          state_tmp="$(sudo -n mktemp)"
          trap 'sudo -n rm -f "$state_tmp"' EXIT

          sudo -n env \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/production_runtime_state.py \
            observe \
            --tooling-revision "$TOOLING_REVISION" \
            --output "$state_tmp"

          sudo -n install --directory --mode=0700 /var/lib/mnemos-deploy
          sudo -n install \
            --owner=root \
            --group=root \
            --mode=0600 \
            "$state_tmp" \
            /var/lib/mnemos-deploy/current-state.json

          sudo -n env \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/production_runtime_state.py \
            verify \
            --state /var/lib/mnemos-deploy/current-state.json

      - name: Final production availability gate
        shell: bash
        run: |
          set -euo pipefail
          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh
          sudo -n sh scripts/verify-production-telegram-poller.sh

      - name: Summarize production reconciliation
        shell: bash
        run: |
          {
            echo "## Production runtime policy"
            echo
            echo "Tooling revision: \`$TOOLING_REVISION\`"
            echo "Authorization event: \`$GITHUB_EVENT_NAME\`"
            echo "Reason: $RECONCILIATION_REASON"
            echo
            echo "Runtime policy, declarative Keycloak configuration, canonical state, and final health were reconciled and verified."
          } >> "$GITHUB_STEP_SUMMARY"
