name: Backend Verify

on:
  push:
    branches:
      - fix/production-runtime-config
    paths:
      - ".github/workflows/production-pr-backend-verify.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout recovery revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify config-only recovery boundary
        shell: bash
        env:
          SOURCE_RELEASE: 8cf36034cb5228afbd656419bee94e5a00ac1237
        run: |
          set -euo pipefail

          git cat-file -e "${SOURCE_RELEASE}^{commit}"

          changed_paths="$RUNNER_TEMP/runtime-recovery-paths.txt"
          git diff --name-only "$SOURCE_RELEASE" "$GITHUB_SHA" > "$changed_paths"

          if grep -Ev \
            '^(\.github/workflows/(backend-verify|production-pr79-rollout|stack-smoke|production-pr-ci-recovery|production-pr-backend-verify|production-pr-stack-smoke)\.yml|infrastructure/production/compose\.app-overrides\.yml|make/validation\.mk|scripts/verify-production-app-overrides\.py)$' \
            "$changed_paths" | grep -q .; then
            echo "Runtime recovery contains application/build changes and cannot use config-only verification:" >&2
            cat "$changed_paths" >&2
            exit 1
          fi

          if grep -Eq '^(apps|libraries|contracts|keycloak-extensions|build-logic|gradle)/|^(build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties)$' "$changed_paths"; then
            echo "Runtime recovery unexpectedly changes executable application/build inputs" >&2
            cat "$changed_paths" >&2
            exit 1
          fi

          echo "Config-only recovery boundary verified"

      - name: Verify Make wiring
        run: make make-verify

      - name: Verify CI and production configuration guards
        shell: bash
        run: |
          set -euo pipefail

          sh -n scripts/verify-ci-workflow-security.sh
          sh -n scripts/verify-production-release-security.sh
          sh -n scripts/verify-production-infra-compose.sh
          sh -n scripts/render-production-app-stack.sh

          python3 -m py_compile scripts/verify-production-app-overrides.py
          python3 -m py_compile scripts/render-production-stack.py
          python3 -m py_compile scripts/normalize-production-swarm-stack.py

          sh scripts/verify-ci-workflow-security.sh
          sh scripts/verify-production-release-security.sh
          sh scripts/verify-production-infra-compose.sh
          python3 scripts/verify-production-stack-renderer.py
          python3 scripts/verify-production-stack-manifest-renderer.py
          python3 scripts/verify-production-swarm-stack-normalizer.py
          python3 scripts/verify-production-app-overrides.py

      - name: Verify repository diff cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
