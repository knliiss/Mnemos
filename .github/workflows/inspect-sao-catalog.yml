name: Inspect SAO catalog

on:
  push:
    branches:
      - feat/sao-localization-presentation
    paths:
      - .github/workflows/inspect-sao-catalog.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sao-localization-presentation
          fetch-depth: 0

      - name: Fetch and inspect live SAO localization
        shell: python
        run: |
          import collections
          import hashlib
          import json
          import re
          import urllib.request
          from pathlib import Path

          manifest_url = "https://webdata.c7x.dev/client/lang.json"

          with urllib.request.urlopen(manifest_url, timeout=20) as response:
              manifest = json.load(response)

          ru = next(language for language in manifest["langs"] if language["lang"] == "ru_RU")
          sao = next(pie for pie in ru["pies"] if pie["pieKey"] == "sao")

          with urllib.request.urlopen(sao["url"], timeout=20) as response:
              payload = response.read()

          actual_hash = hashlib.sha256(payload).hexdigest()
          if actual_hash != sao["hash"]:
              raise RuntimeError(f"hash mismatch: expected {sao['hash']}, got {actual_hash}")

          pack = json.loads(payload)
          properties = pack["properties"]

          item_properties = {
              key: value
              for key, value in sorted(properties.items())
              if key.startswith("sao.item.")
          }

          interesting_terms = (
              "location",
              "floor",
              "drop",
              "loot",
              "boss",
              "mob",
              "dungeon",
              "raid",
              "zone",
              "region",
              "island",
              "level",
          )
          related_properties = {
              key: value
              for key, value in sorted(properties.items())
              if any(term in key.lower() for term in interesting_terms)
          }
          event_properties = {
              key: value
              for key, value in sorted(properties.items())
              if key.startswith("sao.event.") or key.startswith("sao.msg.")
          }

          raw_report = {
              "locale": "ru_RU",
              "hash": sao["hash"],
              "itemPropertyCount": len(item_properties),
              "itemNameCount": sum(key.endswith(".name") for key in item_properties),
              "itemProperties": item_properties,
              "relatedProperties": related_properties,
              "eventProperties": event_properties,
          }

          style_pattern = re.compile(r"^¨([0-9a-fA-F]{6})")
          location_pattern = re.compile(r"(?:^|_)l(\d+)(?:_|$)")

          def family(item_id):
              if re.match(r"^l\d", item_id):
                  return "WEAPON"
              if item_id.startswith("pet"):
                  return "PET"
              if item_id.startswith("aura"):
                  return "AURA"
              if item_id.startswith("book"):
                  return "BOOK"
              if re.match(r"^d\d", item_id):
                  return "JEWELRY"
              return "OTHER"

          def location_candidate(item_id, item_family):
              match = location_pattern.search(item_id)
              if match:
                  return int(match.group(1))
              if item_family == "WEAPON":
                  match = re.match(r"^l(\d+)(?:_|$)", item_id)
                  if match:
                      return int(match.group(1))
              if item_family == "JEWELRY":
                  match = re.match(r"^d(\d+)(?:_|$)", item_id)
                  if match:
                      return int(match.group(1))
              return None

          tracked = []
          colors_by_family = collections.defaultdict(collections.Counter)
          locations_by_family = collections.defaultdict(collections.Counter)
          unknown_style = []

          for key, value in sorted(item_properties.items()):
              if not key.endswith(".name"):
                  continue

              item_id = key[len("sao.item."):-len(".name")]
              item_family = family(item_id)
              if item_family == "OTHER":
                  continue

              style_match = style_pattern.match(value)
              style = style_match.group(1).lower() if style_match else None
              display_name = style_pattern.sub("", value).strip()
              location = location_candidate(item_id, item_family)

              colors_by_family[item_family][style or "<none>"] += 1
              locations_by_family[item_family][str(location) if location is not None else "<none>"] += 1

              if style is None:
                  unknown_style.append(key)

              tracked.append({
                  "key": key,
                  "id": item_id,
                  "name": display_name,
                  "family": item_family,
                  "style": style,
                  "locationCandidate": location,
              })

          rarity_properties = {
              key: value
              for key, value in sorted(properties.items())
              if key.startswith("sao.enum.rarity.")
          }
          location_named_properties = {
              key: value
              for key, value in sorted(properties.items())
              if key.startswith("sao.location.")
              or key.startswith("sao.locations.")
              or key.startswith("sao.floor.")
              or key.startswith("sao.zone.")
          }

          summary = {
              "hash": sao["hash"],
              "trackedItemCount": len(tracked),
              "countsByFamily": dict(collections.Counter(item["family"] for item in tracked)),
              "stylesByFamily": {
                  item_family: dict(sorted(counter.items()))
                  for item_family, counter in sorted(colors_by_family.items())
              },
              "locationCandidatesByFamily": {
                  item_family: dict(sorted(counter.items(), key=lambda pair: pair[0]))
                  for item_family, counter in sorted(locations_by_family.items())
              },
              "rarityProperties": rarity_properties,
              "locationNamedProperties": location_named_properties,
              "unknownStyleKeys": unknown_style,
              "trackedItems": tracked,
              "eventProperties": event_properties,
          }

          output_dir = Path("tmp")
          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / "sao-live-catalog-analysis.json").write_text(
              json.dumps(raw_report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (output_dir / "sao-catalog-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

      - name: Commit inspection report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/sao-live-catalog-analysis.json tmp/sao-catalog-summary.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Capture SAO catalog metadata summary"
          git push origin HEAD:feat/sao-localization-presentation
