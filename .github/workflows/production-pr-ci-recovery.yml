name: Production PR CI Recovery

on:
  push:
    branches:
      - fix/production-runtime-config

permissions:
  contents: read
  actions: write

jobs:
  cancel-unavailable-backend-runner-jobs:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 5

    steps:
      - name: Cancel queued backend-runner workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_BRANCH: fix/production-runtime-config
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["RECOVERY_BRANCH"]

          target_paths = {
              ".github/workflows/backend-verify.yml",
              ".github/workflows/stack-smoke.yml",
          }

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          active_runs = {}

          for status in ("queued", "in_progress"):
              query = urllib.parse.urlencode(
                  {
                      "branch": branch,
                      "status": status,
                      "per_page": 100,
                  }
              )
              payload = request_json(
                  f"{api_url}/repos/{repository}/actions/runs?{query}"
              )

              for run in payload.get("workflow_runs", []):
                  if run.get("path") in target_paths:
                      active_runs[run["id"]] = run

          if not active_runs:
              print("No unavailable-runner workflows need cancellation")
              raise SystemExit(0)

          for run_id, run in sorted(active_runs.items()):
              print(
                  "Force-cancelling "
                  f"{run['name']} #{run['run_number']} ({run_id}) "
                  f"from {run['path']}"
              )

              result = subprocess.run(
                  [
                      "curl",
                      "--fail-with-body",
                      "--silent",
                      "--show-error",
                      "--request",
                      "POST",
                      "--header",
                      "Accept: application/vnd.github+json",
                      "--header",
                      f"Authorization: Bearer {token}",
                      "--header",
                      "X-GitHub-Api-Version: 2022-11-28",
                      f"{api_url}/repos/{repository}/actions/runs/{run_id}/force-cancel",
                  ],
                  capture_output=True,
                  text=True,
              )

              if result.returncode == 0:
                  continue

              output = (result.stdout or "") + (result.stderr or "")

              if "Cannot cancel a workflow run that is completed" in output:
                  print(f"Run {run_id} completed before cancellation; continuing")
                  continue

              print(output, end="")
              raise SystemExit(result.returncode)
          PY
