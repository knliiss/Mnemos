name: Temporary Production Infrastructure Diagnostics 2026-09-13

on:
  push:
    branches:
      - ops/production-diagnostics-20260913

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, mnemos-production]
    timeout-minutes: 10

    steps:
      - name: Inspect production infrastructure
        shell: bash
        run: |
          set +e

          echo '===== HOST / REBOOT ====='
          date -u
          uptime
          last -x reboot shutdown 2>/dev/null | head -n 20 || true
          systemctl --failed --no-pager 2>/dev/null || true

          echo
          echo '===== ALL SWARM SERVICES ====='
          sudo -n docker service ls --format 'table {{.Name}}\t{{.Mode}}\t{{.Replicas}}\t{{.Image}}\t{{.Ports}}'

          echo
          echo '===== INFRA CONTAINERS ====='
          sudo -n docker ps -a \
            --format '{{.ID}}|{{.Names}}|{{.Image}}|{{.Status}}|{{.Networks}}' \
            | grep -Ei 'redis|kafka|postgres|keycloak|zookeeper|mnemos|infra' \
            | head -n 200 || true

          echo
          echo '===== DOCKER NETWORKS ====='
          sudo -n docker network ls --format 'table {{.ID}}\t{{.Name}}\t{{.Driver}}\t{{.Scope}}'

          echo
          echo '===== RELEVANT NETWORK MEMBERS ====='
          while read -r network; do
            [ -n "$network" ] || continue
            echo
            echo "--- $network ---"
            sudo -n docker network inspect "$network" \
              --format 'name={{.Name}} id={{.Id}} driver={{.Driver}} scope={{.Scope}} attachable={{.Attachable}}{{range $id, $c := .Containers}}{{println}}{{printf "%s|%s|%s" $id $c.Name $c.IPv4Address}}{{end}}' 2>&1 \
              | head -n 160
          done < <(sudo -n docker network ls --format '{{.Name}}' | grep -Ei 'mnemos|redis|kafka|infra|backend|public' | sort -u)

          echo
          echo '===== REDIS / KAFKA CONTAINER STATE ====='
          while IFS='|' read -r cid name image status networks; do
            case "$name $image" in
              *[Rr][Ee][Dd][Ii][Ss]*|*[Kk][Aa][Ff][Kk][Aa]*) ;;
              *) continue ;;
            esac
            echo
            echo "--- $name ---"
            echo "id=$cid image=$image status=$status networks=$networks"
            sudo -n docker inspect "$cid" --format 'state={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} restart={{.HostConfig.RestartPolicy.Name}}' 2>&1
            sudo -n timeout 5s docker logs --since 90m "$cid" 2>&1 \
              | grep -Ei 'ERROR|WARN|FATAL|panic|failed|failure|OOM|OutOfMemory|refused|unreachable|timeout|timed out|shutdown|terminated|ready|started' \
              | tail -n 120 || true
          done < <(sudo -n docker ps -a --format '{{.ID}}|{{.Names}}|{{.Image}}|{{.Status}}|{{.Networks}}')

          echo
          echo '===== SERVICE DISCOVERY FROM APP CONTAINERS ====='
          for svc in gateway-service realtime-service event-service notification-service profile-service; do
            cid="$(sudo -n docker ps -q --filter label=com.docker.swarm.service.name=mnemos_${svc} | head -n 1)"
            [ -n "$cid" ] || continue
            echo
            echo "--- $svc container=$cid ---"
            sudo -n docker exec "$cid" sh -lc '
              for host in redis kafka account-service event-service gateway-service; do
                printf "%s => " "$host"
                if command -v getent >/dev/null 2>&1; then getent hosts "$host" || true; else cat /etc/hosts | grep -w "$host" || true; fi
              done
            ' 2>&1 || true
          done

          echo
          echo '===== HOST ROUTING ====='
          ip -br addr 2>/dev/null || true
          ip route 2>/dev/null || true

          echo
          echo '===== DOCKER DAEMON EVENTS / ERRORS ====='
          sudo -n journalctl --since '90 minutes ago' -u docker --no-pager 2>/dev/null \
            | grep -Ei 'error|warn|failed|failure|restart|shutdown|network|overlay|vxlan|endpoint|sandbox|daemon' \
            | tail -n 240 || true

          echo
          echo '===== KERNEL NETWORK / OOM / REBOOT SIGNALS ====='
          sudo -n journalctl --since '90 minutes ago' -k --no-pager 2>/dev/null \
            | grep -Ei 'oom|out of memory|panic|watchdog|reset|reboot|shutdown|docker|vxlan|overlay|bridge|veth|network|nf_conntrack' \
            | tail -n 240 || true
