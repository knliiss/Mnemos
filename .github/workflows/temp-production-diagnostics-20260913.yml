name: Temporary Production Root Cause Diagnostics 2026-09-13

on:
  push:
    branches:
      - ops/production-diagnostics-20260913

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, mnemos-production]
    timeout-minutes: 10

    steps:
      - name: Inspect Redis crash and reboot cause
        shell: bash
        run: |
          set +e

          echo '===== REDIS CURRENT STATE ====='
          sudo -n docker ps -a --filter name='^/mnemos-redis$' --format 'id={{.ID}} name={{.Names}} image={{.Image}} status={{.Status}} networks={{.Networks}}'
          sudo -n docker inspect mnemos-redis --format 'state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} restart_count={{.RestartCount}}' 2>&1 || true

          echo
          echo '===== REDIS REQUIRED ENV PRESENCE (VALUES HIDDEN) ====='
          for key in REDIS_ADMIN_PASSWORD REDIS_GATEWAY_PASSWORD REDIS_REALTIME_PASSWORD REDIS_NOTIFICATION_PASSWORD REDIS_TELEGRAM_BOT_PASSWORD; do
            if sudo -n docker inspect mnemos-redis --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -q "^${key}=."; then
              echo "$key=present"
            else
              echo "$key=MISSING_OR_EMPTY"
            fi
          done

          echo
          echo '===== REDIS LAST LOGS ====='
          sudo -n docker logs --tail 160 mnemos-redis 2>&1 \
            | sed -E 's/(password|pass|token|secret)([=: ]+)[^ ,;]+/\1\2<redacted>/Ig' || true

          echo
          echo '===== REDIS DATA VOLUME METADATA ====='
          sudo -n docker inspect mnemos-redis --format '{{range .Mounts}}type={{.Type}} name={{.Name}} destination={{.Destination}} rw={{.RW}}{{println}}{{end}}' 2>&1 || true
          volume="$(sudo -n docker inspect mnemos-redis --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}' 2>/dev/null)"
          if [ -n "$volume" ]; then
            mountpoint="$(sudo -n docker volume inspect "$volume" --format '{{.Mountpoint}}' 2>/dev/null)"
            echo "volume=$volume"
            sudo -n find "$mountpoint" -maxdepth 3 -printf '%M %u:%g %s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | head -n 100
          fi

          echo
          echo '===== PRODUCTION HEALTH SERVICE ====='
          sudo -n systemctl status mnemos-production-health.service --no-pager -l 2>&1 | tail -n 100 || true
          sudo -n journalctl -u mnemos-production-health.service --since '60 minutes ago' --no-pager 2>&1 | tail -n 160 || true

          echo
          echo '===== PREVIOUS BOOT END (-1) ====='
          sudo -n journalctl -b -1 -e --no-pager 2>/dev/null | tail -n 220 || true

          echo
          echo '===== PREVIOUS BOOT END (-2) ====='
          sudo -n journalctl -b -2 -e --no-pager 2>/dev/null | tail -n 160 || true

          echo
          echo '===== REBOOT / SHUTDOWN COMMAND SIGNALS ====='
          sudo -n journalctl --since '45 minutes ago' --no-pager 2>/dev/null \
            | grep -Ei 'reboot|shutdown|poweroff|systemd-logind|systemd-shutdown|watchdog|panic|oom|out of memory|apt|unattended|needrestart' \
            | tail -n 200 || true

          echo
          echo '===== GHCR AUTH PRESENCE (NO CREDENTIALS) ====='
          for cfg in /root/.docker/config.json /home/*/.docker/config.json; do
            if sudo -n test -f "$cfg"; then
              echo "config=$cfg"
              if command -v jq >/dev/null 2>&1; then
                sudo -n jq -r '(.auths // {}) | keys[]' "$cfg" 2>/dev/null | sed 's/^/auth_host=/'
              else
                echo 'jq=unavailable'
              fi
            fi
          done
