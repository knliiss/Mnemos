name: Temporary Production Convergence Verification 2026-09-13

on:
  push:
    branches:
      - ops/production-diagnostics-20260913

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, mnemos-production]
    timeout-minutes: 10

    steps:
      - name: Wait for production convergence
        shell: bash
        run: |
          set -u

          echo '===== REDIS STATE ====='
          sudo -n docker inspect mnemos-redis --format 'state={{.State.Status}} health={{.State.Health.Status}} restart_count={{.RestartCount}}'
          sudo -n docker exec mnemos-redis sh -lc 'REDISCLI_AUTH="$REDIS_ADMIN_PASSWORD" redis-cli --user redis_admin ping'

          echo '===== WAIT FOR PRODUCTION HEALTH ====='
          for i in $(seq 1 36); do
            echo "--- health attempt $i/36 ---"
            if sudo -n /opt/mnemos/current/scripts/check-production-health.sh; then
              echo 'PRODUCTION_HEALTHY'
              echo '===== FINAL SERVICES ====='
              sudo -n docker service ls
              echo '===== FINAL CONTAINERS ====='
              sudo -n docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
              exit 0
            fi
            sleep 10
          done

          echo '===== CONVERGENCE FAILED =====' >&2
          sudo -n docker service ls || true
          for service in $(sudo -n docker service ls --format '{{.Name}}'); do
            echo "===== SERVICE $service ====="
            sudo -n docker service ps "$service" --no-trunc --format 'name={{.Name}} desired={{.DesiredState}} current={{.CurrentState}} error={{.Error}} image={{.Image}}' | head -n 20 || true
          done
          echo '===== CONTAINERS ====='
          sudo -n docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | head -n 80 || true
          exit 1
