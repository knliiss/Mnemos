name: Production Targeted Execution

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Successful Production Hotfix Plan or Production Release Plan workflow run ID
        required: true
        type: string
      artifact_name:
        description: Exact plan artifact name from the planning workflow run
        required: true
        type: string
      plan_kind:
        description: Integrity-manifest kind expected in the plan artifact
        required: true
        type: choice
        options:
          - hotfix-plan
          - release-plan
      tooling_revision:
        description: Full 40-character deployment tooling commit SHA recorded by the transition
        required: true
        type: string
      expected_transition_id:
        description: Exact sha256 transition ID approved for execution
        required: true
        type: string
      authorization:
        description: Type APPLY followed by a space and the exact transition ID
        required: true
        type: string
      reason:
        description: Live-chat authorization reference/reason for the execution audit
        required: true
        type: string

concurrency:
  group: mnemos-production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  execute:
    if: >-
      github.ref == 'refs/heads/master' &&
      vars.MNEMOS_PRODUCTION_EXECUTION_ENABLED == 'true'
    environment: production
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      packages: read

    steps:
      - name: Validate immutable execution inputs
        shell: bash
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          TOOLING_REVISION: ${{ inputs.tooling_revision }}
          EXPECTED_TRANSITION_ID: ${{ inputs.expected_transition_id }}
          AUTHORIZATION: ${{ inputs.authorization }}
          EXECUTION_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$PLAN_RUN_ID" | grep -Eq '^[1-9][0-9]*$'; then
            echo "plan_run_id must be a positive GitHub Actions run ID" >&2
            exit 1
          fi

          if ! printf '%s' "$TOOLING_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "tooling_revision must be a full lowercase 40-character Git SHA" >&2
            exit 1
          fi

          if ! printf '%s' "$EXPECTED_TRANSITION_ID" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "expected_transition_id must be a full sha256 transition ID" >&2
            exit 1
          fi

          if [ "$AUTHORIZATION" != "APPLY $EXPECTED_TRANSITION_ID" ]; then
            echo "authorization must exactly equal: APPLY $EXPECTED_TRANSITION_ID" >&2
            exit 1
          fi

          if [ -z "$(printf '%s' "$EXECUTION_REASON" | tr -d '[:space:]')" ]; then
            echo "reason must not be blank" >&2
            exit 1
          fi

      - name: Verify planning workflow provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_KIND: ${{ inputs.plan_kind }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          run_json="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${PLAN_RUN_ID}"
          )"

          workflow_name="$(printf '%s' "$run_json" | jq -r '.name // empty')"
          workflow_path="$(printf '%s' "$run_json" | jq -r '.path // empty')"
          event_name="$(printf '%s' "$run_json" | jq -r '.event // empty')"
          head_branch="$(printf '%s' "$run_json" | jq -r '.head_branch // empty')"
          head_sha="$(printf '%s' "$run_json" | jq -r '.head_sha // empty')"
          conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // empty')"

          case "$PLAN_KIND" in
            hotfix-plan)
              expected_workflow_name="Production Hotfix Plan"
              expected_workflow_path=".github/workflows/production-hotfix-plan.yml"
              ;;
            release-plan)
              expected_workflow_name="Production Release Plan"
              expected_workflow_path=".github/workflows/production-release-plan.yml"
              ;;
            *)
              echo "Unsupported plan kind: $PLAN_KIND" >&2
              exit 1
              ;;
          esac

          if [ "$workflow_name" != "$expected_workflow_name" ]; then
            echo "Planning run workflow name does not match plan kind: $workflow_name" >&2
            exit 1
          fi

          if [ "$workflow_path" != "$expected_workflow_path" ]; then
            echo "Planning run uses an unauthorized workflow path: $workflow_path" >&2
            exit 1
          fi

          if [ "$event_name" != "workflow_dispatch" ]; then
            echo "Planning run must be manually dispatched" >&2
            exit 1
          fi

          if [ "$head_branch" != "master" ]; then
            echo "Planning run must originate from master" >&2
            exit 1
          fi

          if ! printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Planning run must expose an exact lowercase 40-character head SHA" >&2
            exit 1
          fi

          if [ "$conclusion" != "success" ]; then
            echo "Planning run must have succeeded" >&2
            exit 1
          fi

          echo "PLANNING_WORKFLOW_PATH=$workflow_path" >> "$GITHUB_ENV"
          echo "PLANNING_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"

      - name: Checkout pinned deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tooling_revision }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out tooling revision
        shell: bash
        env:
          TOOLING_REVISION: ${{ inputs.tooling_revision }}
        run: |
          set -euo pipefail

          checked_out_sha="$(git rev-parse HEAD)"

          if [ "$checked_out_sha" != "$TOOLING_REVISION" ]; then
            echo "Checked-out tooling revision does not match approved revision" >&2
            exit 1
          fi

      - name: Download approved plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/mnemos-production-approved-plan
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Verify plan integrity and exact transition
        shell: bash
        env:
          PLAN_DIR: ${{ runner.temp }}/mnemos-production-approved-plan
          PLAN_KIND: ${{ inputs.plan_kind }}
          TOOLING_REVISION: ${{ inputs.tooling_revision }}
          EXPECTED_TRANSITION_ID: ${{ inputs.expected_transition_id }}
        run: |
          set -euo pipefail

          python3 scripts/production_audit_bundle.py \
            verify \
            --directory "$PLAN_DIR" \
            --kind "$PLAN_KIND"

          python3 - "$PLAN_DIR/transition.json" <<'PY'
          import json
          import os
          import sys

          transition = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_transition_id = os.environ["EXPECTED_TRANSITION_ID"]
          tooling_revision = os.environ["TOOLING_REVISION"]
          plan_kind = os.environ["PLAN_KIND"]
          plan = transition.get("plan", {})

          if transition.get("transition_id") != expected_transition_id:
              raise SystemExit("Transition ID does not match the explicitly approved ID")

          if transition.get("from_tooling_revision") != tooling_revision:
              raise SystemExit("Transition source tooling revision does not match checked-out tooling")

          if transition.get("to_tooling_revision") != tooling_revision:
              raise SystemExit("Scoped execution cannot change the tooling revision")

          if plan.get("mode") != "scoped":
              raise SystemExit("Targeted execution refuses non-scoped deployment plans")

          action_count = plan.get("action_count")

          if not isinstance(action_count, int) or action_count < 1:
              raise SystemExit("Targeted execution requires at least one scoped action")

          if plan_kind == "hotfix-plan" and action_count != 1:
              raise SystemExit("Hotfix execution must contain exactly one service action")
          PY

      - name: Verify current production state and render exact dry run
        shell: bash
        env:
          PLAN_DIR: ${{ runner.temp }}/mnemos-production-approved-plan
          EXPECTED_TRANSITION_ID: ${{ inputs.expected_transition_id }}
        run: |
          set -euo pipefail

          sudo -n python3 scripts/production_deployment_executor.py \
            --transition "$PLAN_DIR/transition.json" \
            --target-state "$PLAN_DIR/target-state.json" \
            --expected-transition-id "$EXPECTED_TRANSITION_ID" \
            > "$RUNNER_TEMP/mnemos-production-execution-dry-run.json"

          python3 - "$RUNNER_TEMP/mnemos-production-execution-dry-run.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          dry_run = json.load(open(sys.argv[1], encoding="utf-8"))

          print("## Approved production transition")
          print()
          print(f"Transition: `{dry_run['transition_id']}`")
          print(f"Scoped actions: `{dry_run['action_count']}`")
          print()

          for action in dry_run["actions"]:
              print(f"- `{action['service']}`")
          PY

      - name: Prepare isolated production registry credentials
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-production-docker-auth
          sudo -n install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0700 \
            /run/mnemos-production-docker-auth

      - name: Authenticate production Docker to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-production-docker-auth \
              docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Execute exact scoped transition
        shell: bash
        env:
          PLAN_DIR: ${{ runner.temp }}/mnemos-production-approved-plan
          EXPECTED_TRANSITION_ID: ${{ inputs.expected_transition_id }}
          MNEMOS_PRODUCTION_DEPLOY_ENABLED: ${{ vars.MNEMOS_PRODUCTION_DEPLOY_ENABLED }}
          MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED: ${{ vars.MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-production-docker-auth \
            MNEMOS_PRODUCTION_DEPLOY_ENABLED="$MNEMOS_PRODUCTION_DEPLOY_ENABLED" \
            MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED="$MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED" \
            python3 scripts/production_deployment_executor.py \
              --transition "$PLAN_DIR/transition.json" \
              --target-state "$PLAN_DIR/target-state.json" \
              --expected-transition-id "$EXPECTED_TRANSITION_ID" \
              --execute

      - name: Collect execution audit record
        if: always()
        shell: bash
        env:
          EXPECTED_TRANSITION_ID: ${{ inputs.expected_transition_id }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          EXECUTION_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          audit_dir="$RUNNER_TEMP/mnemos-production-execution-audit"
          transition_digest="${EXPECTED_TRANSITION_ID#sha256:}"
          rm -rf "$audit_dir"
          install --directory --mode=0700 "$audit_dir"

          if sudo -n test -f /var/lib/mnemos-deploy/current-state.json; then
            sudo -n cp /var/lib/mnemos-deploy/current-state.json "$audit_dir/current-state.json"
          fi

          if sudo -n test -d "/var/lib/mnemos-deploy/transitions/$transition_digest"; then
            sudo -n cp -R \
              "/var/lib/mnemos-deploy/transitions/$transition_digest" \
              "$audit_dir/execution-attempts"
          fi

          sudo -n chown -R "$(id -u):$(id -g)" "$audit_dir"

          jq -n \
            --arg workflow_run_id "${{ github.run_id }}" \
            --arg actor "${{ github.actor }}" \
            --arg plan_run_id "$PLAN_RUN_ID" \
            --arg planning_workflow_path "$PLANNING_WORKFLOW_PATH" \
            --arg planning_head_sha "$PLANNING_HEAD_SHA" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg transition_id "$EXPECTED_TRANSITION_ID" \
            --arg reason "$EXECUTION_REASON" \
            '{workflow_run_id:$workflow_run_id,actor:$actor,plan_run_id:$plan_run_id,planning_workflow_path:$planning_workflow_path,planning_head_sha:$planning_head_sha,artifact_name:$artifact_name,transition_id:$transition_id,reason:$reason}' \
            > "$audit_dir/workflow-execution.json"

          python3 scripts/production_audit_bundle.py \
            create \
            --directory "$audit_dir" \
            --kind execution-attempt

          echo "EXECUTION_AUDIT_DIR=$audit_dir" >> "$GITHUB_ENV"

      - name: Upload execution audit artifact
        if: always() && env.EXECUTION_AUDIT_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-execution-audit-${{ github.run_id }}
          path: ${{ env.EXECUTION_AUDIT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove production registry credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-production-docker-auth
