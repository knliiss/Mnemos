name: Realtime Production Diagnostics

on:
  push:
    branches:
      - chore/realtime-production-diagnostics

concurrency:
  group: mnemos-realtime-production-diagnostics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 10

    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify diagnostics-only diff
        shell: bash
        env:
          BASELINE_SHA: eec78c3f63644942e748e7f5c857b7f6c7a3a2fe
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASELINE_SHA" HEAD)"
          test "$changed" = ".github/workflows/realtime-production-diagnostics.yml"

      - name: Capture collector report counters
        shell: bash
        run: |
          set -euo pipefail
          logs="$(sudo -n docker service logs --since 3h --timestamps --raw mnemos_realtime-service 2>&1 || true)"
          for pattern in 'EVENT_REPORT' 'REPORT_QUEUED' 'Failed to publish collector report' 'DELIVERY_UNAVAILABLE' 'NOT_OBSERVING' 'TOO_MANY_IN_FLIGHT'; do
            printf '%s=' "$pattern"
            printf '%s\n' "$logs" | grep -E -i -c "$pattern" || true
          done

      - name: Capture Kafka topics and consumer lag
        shell: bash
        run: |
          set -euo pipefail
          container="$(sudo -n docker ps --format '{{.ID}} {{.Names}} {{.Image}}' | awk 'tolower($0) ~ /kafka|redpanda/ {print $1; exit}')"
          if [ -z "$container" ]; then
            echo 'No Kafka/Redpanda container found'
            exit 0
          fi

          echo "container=$container"
          sudo -n docker exec "$container" sh -lc '
            set -e
            if [ -x /opt/kafka/bin/kafka-topics.sh ]; then
              TOPICS=/opt/kafka/bin/kafka-topics.sh
              GROUPS=/opt/kafka/bin/kafka-consumer-groups.sh
            elif command -v kafka-topics.sh >/dev/null 2>&1; then
              TOPICS=$(command -v kafka-topics.sh)
              GROUPS=$(command -v kafka-consumer-groups.sh)
            else
              echo "Kafka CLI not found"
              exit 0
            fi

            echo "=== topics ==="
            "$TOPICS" --bootstrap-server localhost:9092 --list | grep -E "collector|event|notification" || true
            echo "=== collector ingress ==="
            "$TOPICS" --bootstrap-server localhost:9092 --describe --topic mnemos.collector.ingress.v2 || true
            echo "=== event collector consumer group ==="
            "$GROUPS" --bootstrap-server localhost:9092 --describe --group mnemos-event-service-collector-ingress || true
            echo "=== all event-service groups ==="
            "$GROUPS" --bootstrap-server localhost:9092 --all-groups --describe 2>/dev/null | grep -E "mnemos-event-service|mnemos.collector.ingress.v2" || true
          '

      - name: Capture focused pipeline logs
        shell: bash
        run: |
          set -euo pipefail
          echo '=== realtime ==='
          sudo -n docker service logs --since 3h --timestamps --raw mnemos_realtime-service 2>&1 \
            | grep -E -i 'EVENT_REPORT|REPORT_QUEUED|publish collector report|DELIVERY_UNAVAILABLE|NOT_OBSERVING|TOO_MANY_IN_FLIGHT|collector transport response|observation lease renewed' \
            | tail -n 2500 || true
          echo '=== event-service ==='
          sudo -n docker service logs --since 3h --timestamps --raw mnemos_event-service 2>&1 \
            | grep -E -i 'collector|ingress|REPORT_QUEUED|dead.?letter|deserial|protocol|Kafka.*(error|warn)|ERROR|Exception' \
            | tail -n 2500 || true
          echo '=== notification-service ==='
          sudo -n docker service logs --since 3h --timestamps --raw mnemos_notification-service 2>&1 \
            | grep -E -i 'notification|event|dead.?letter|Kafka.*(error|warn)|ERROR|Exception' \
            | tail -n 1500 || true
          echo '=== bot ==='
          sudo -n docker service logs --since 3h --timestamps --raw mnemos_telegram-bot-service 2>&1 \
            | grep -E -i 'notification|409|telegram.*(error|warn)|ERROR|Exception' \
            | tail -n 1500 || true
