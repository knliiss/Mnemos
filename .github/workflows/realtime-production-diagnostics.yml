name: Realtime Production Diagnostics

on:
  push:
    branches:
      - chore/realtime-production-diagnostics

concurrency:
  group: mnemos-realtime-production-diagnostics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 3

    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify diagnostics-only diff
        shell: bash
        env:
          BASELINE_SHA: eec78c3f63644942e748e7f5c857b7f6c7a3a2fe
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASELINE_SHA" HEAD)"
          test "$changed" = ".github/workflows/realtime-production-diagnostics.yml"

      - name: Verify deployed event-service revision
        shell: bash
        run: |
          set -euo pipefail

          echo '=== event-service image ==='
          sudo -n docker service inspect \
            --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' \
            mnemos_event-service

          echo '=== event-service running tasks ==='
          sudo -n docker service ps \
            --filter desired-state=running \
            --format '{{.Name}}|{{.Image}}|{{.CurrentState}}|{{.Error}}' \
            mnemos_event-service

      - name: Capture post-deploy database freshness
        shell: bash
        run: |
          set -euo pipefail

          sudo -n bash <<'BASH'
          set -euo pipefail

          read_env() {
            local key="$1"

            awk -v key="$key" '
              index($0, key "=") == 1 {
                print substr($0, length(key) + 2)
                exit
              }
            ' /etc/mnemos/mnemos.env
          }

          app_postgres_db="$(read_env APP_POSTGRES_DB)"
          app_postgres_user="$(read_env APP_POSTGRES_USER)"
          app_postgres_password="$(read_env APP_POSTGRES_PASSWORD)"

          if [ -z "$app_postgres_db" ] || [ -z "$app_postgres_user" ] || [ -z "$app_postgres_password" ]; then
            echo 'Required application PostgreSQL settings are missing' >&2
            exit 1
          fi

          pg_container="$(docker ps --filter 'name=app-postgres' --format '{{.Names}}' | head -n 1)"

          if [ -z "$pg_container" ]; then
            echo 'Application PostgreSQL container was not found' >&2
            exit 1
          fi

          docker exec \
            -e PGPASSWORD="$app_postgres_password" \
            "$pg_container" \
            psql \
              -U "$app_postgres_user" \
              -d "$app_postgres_db" \
              -v ON_ERROR_STOP=1 \
              -At \
              -F '|' <<'SQL'
          SELECT 'DATABASE_NOW', now()::text, 0;

          SELECT
              'ITEM_DROP',
              COALESCE(MAX(occurred_at)::text, 'null'),
              COUNT(*) FILTER (WHERE occurred_at >= now() - interval '20 minutes')
          FROM event.item_drop_events;

          SELECT
              'BOOSTER',
              COALESCE(MAX(activated_at)::text, 'null'),
              COUNT(*) FILTER (WHERE activated_at >= now() - interval '20 minutes')
          FROM event.booster_events;

          SELECT
              'RAID',
              COALESCE(MAX(started_at)::text, 'null'),
              COUNT(*) FILTER (WHERE started_at >= now() - interval '20 minutes')
          FROM event.raid_events;

          SELECT
              'GLOBAL',
              COALESCE(MAX(started_at)::text, 'null'),
              COUNT(*) FILTER (WHERE started_at >= now() - interval '20 minutes')
          FROM event.global_events;

          SELECT
              'NOTIFICATION_INBOX',
              COALESCE(MAX(recorded_at)::text, 'null'),
              COUNT(*) FILTER (WHERE recorded_at >= now() - interval '20 minutes')
          FROM notification.inbox_events;
          SQL
          BASH

      - name: Capture bounded post-deploy errors
        shell: bash
        run: |
          set -euo pipefail

          for service in event-service notification-service telegram-bot-service; do
            echo "=== $service recent errors ==="
            timeout 15s sudo -n docker service logs \
              --since 10m \
              --tail 300 \
              --timestamps \
              --raw \
              "mnemos_${service}" 2>&1 \
              | grep -E -i 'ERROR|Exception|409|dead.?letter|deserial|protocol' \
              | tail -n 100 || true
          done
