name: Realtime Production Diagnostics

on:
  push:
    branches:
      - chore/realtime-production-diagnostics

concurrency:
  group: mnemos-realtime-production-diagnostics
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 10

    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify diagnostics-only diff
        shell: bash
        env:
          BASELINE_SHA: eec78c3f63644942e748e7f5c857b7f6c7a3a2fe
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASELINE_SHA" HEAD)"
          test "$changed" = ".github/workflows/realtime-production-diagnostics.yml"

      - name: Capture service state
        shell: bash
        run: |
          set -euo pipefail
          for service in realtime-service event-service notification-service telegram-bot-service; do
            echo "=== $service ==="
            sudo -n docker service inspect "mnemos_${service}" --format 'image={{.Spec.TaskTemplate.ContainerSpec.Image}} replicas={{.Spec.Mode.Replicated.Replicas}}' || true
            sudo -n docker service ps "mnemos_${service}" --no-trunc --format 'task={{.Name}} desired={{.DesiredState}} current={{.CurrentState}} error={{.Error}}' || true
          done

      - name: Capture realtime collector delivery logs
        shell: bash
        run: |
          set -euo pipefail
          sudo -n docker service logs --since 6h --timestamps --raw mnemos_realtime-service 2>&1 \
            | grep -E -i -C 4 'collector|EVENT_REPORT|report|Kafka|DELIVERY_UNAVAILABLE|NOT_OBSERVING|TOO_MANY_IN_FLIGHT|Failed to publish|ERROR|Exception|WARN' \
            | tail -n 5000 || true

      - name: Capture event ingestion logs
        shell: bash
        run: |
          set -euo pipefail
          sudo -n docker service logs --since 6h --timestamps --raw mnemos_event-service 2>&1 \
            | grep -E -i -C 4 'collector|ingress|event|Kafka|deserial|consumer|ERROR|Exception|WARN' \
            | tail -n 5000 || true

      - name: Capture notification delivery logs
        shell: bash
        run: |
          set -euo pipefail
          sudo -n docker service logs --since 6h --timestamps --raw mnemos_notification-service 2>&1 \
            | grep -E -i -C 4 'event|notification|Kafka|consumer|telegram|ERROR|Exception|WARN' \
            | tail -n 5000 || true

      - name: Capture Telegram bot logs
        shell: bash
        run: |
          set -euo pipefail
          sudo -n docker service logs --since 6h --timestamps --raw mnemos_telegram-bot-service 2>&1 \
            | grep -E -i -C 4 'notification|event|Kafka|409|telegram|ERROR|Exception|WARN' \
            | tail -n 5000 || true

      - name: Capture Kafka container and topic metadata
        shell: bash
        run: |
          set -euo pipefail
          echo '=== kafka-like containers ==='
          sudo -n docker ps --format '{{.Names}} {{.Image}}' | grep -E -i 'kafka|redpanda' || true
          echo '=== recent kafka-like logs ==='
          for container in $(sudo -n docker ps --format '{{.Names}}' | grep -E -i 'kafka|redpanda' || true); do
            echo "--- $container ---"
            sudo -n docker logs --since 2h --timestamps "$container" 2>&1 \
              | grep -E -i -C 2 'ERROR|WARN|consumer|group|offset|auth|acl|denied' \
              | tail -n 1500 || true
          done
