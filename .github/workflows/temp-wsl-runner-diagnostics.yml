name: Temporary WSL Runner Diagnostics

on:
  push:
    branches:
      - feat/production-deployment
    paths:
      - ".github/workflows/temp-wsl-runner-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, mnemos-frontend]
    timeout-minutes: 5

    steps:
      - name: Inspect backend runner and Docker state
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Backend runner processes ==="
          ps -eo pid,ppid,stat,etime,args | \
            grep -E 'actions-runner|Runner\.(Listener|Worker)|docker compose|docker-compose|make .*ENV_FILE=.env.ci' | \
            grep -v grep || true

          echo "=== Docker daemon ==="
          timeout --foreground 20s docker version || true

          echo "=== Smoke containers ==="
          timeout --foreground 20s docker ps -a \
            --format '{{.ID}} {{.Names}} {{.Status}}' | \
            grep 'mnemos-ci-' || true
