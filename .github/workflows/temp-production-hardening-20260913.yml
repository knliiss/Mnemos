name: Temporary Production Runtime Hardening 2026-09-13

on:
  push:
    branches:
      - ops/production-diagnostics-20260913

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: [self-hosted, mnemos-production]
    timeout-minutes: 20
    env:
      TOOLING_REVISION: daf35deec5e0a41172afa73de89e1f68d36ee8dc

    steps:
      - name: Prepare runner workspace
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Checkout pinned merged master tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: daf35deec5e0a41172afa73de89e1f68d36ee8dc
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOOLING_REVISION"

      - name: Preflight production health
        shell: bash
        run: |
          set -euo pipefail
          sudo -n sh scripts/validate-production-env.sh
          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh

      - name: Reconcile runtime policy without image replacement
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/reconcile-production-runtime-policy.py

      - name: Verify after policy reconciliation
        shell: bash
        run: |
          set -euo pipefail
          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh

      - name: Install merged production tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo -n sh scripts/install-production-runtime.sh "$TOOLING_REVISION"
          test "$(cat /proc/sys/vm/overcommit_memory)" = 1
          test "$(sudo -n awk -F= '/^[[:space:]]*vm\.overcommit_memory[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2}' /etc/sysctl.d/99-mnemos-redis.conf)" = 1

      - name: Record exact live production state
        shell: bash
        run: |
          set -euo pipefail
          state_tmp="$(sudo -n mktemp)"
          trap 'sudo -n rm -f "$state_tmp"' EXIT

          sudo -n env \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/production_runtime_state.py \
              observe \
              --tooling-revision "$TOOLING_REVISION" \
              --output "$state_tmp"

          sudo -n install --directory --mode=0700 /var/lib/mnemos-deploy
          sudo -n install \
            --owner=root \
            --group=root \
            --mode=0600 \
            "$state_tmp" \
            /var/lib/mnemos-deploy/current-state.json

          sudo -n env \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/production_runtime_state.py \
              verify \
              --state /var/lib/mnemos-deploy/current-state.json

      - name: Final production gate
        shell: bash
        run: |
          set -euo pipefail
          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh
          sudo -n sh scripts/verify-production-telegram-poller.sh
          sudo -n docker inspect mnemos-redis --format 'redis_state={{.State.Status}} redis_health={{.State.Health.Status}} restart_count={{.RestartCount}}'
          echo "runtime_current=$(readlink -f /opt/mnemos/current)"
          echo 'PRODUCTION_RUNTIME_HARDENING_SUCCESS'
