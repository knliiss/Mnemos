name: Temporary Production Hardening 2026-09-13

on:
  push:
    branches:
      - ops/production-diagnostics-20260913

permissions:
  contents: read
  packages: read

jobs:
  harden:
    runs-on: [self-hosted, mnemos-production]
    timeout-minutes: 15

    steps:
      - name: Apply Redis kernel hardening and refresh durable GHCR auth when available
        shell: bash
        env:
          SECRET_MNEMOS_GHCR_PULL_TOKEN: ${{ secrets.MNEMOS_GHCR_PULL_TOKEN }}
          SECRET_GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          SECRET_GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SECRET_CR_PAT: ${{ secrets.CR_PAT }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          echo '===== REDIS KERNEL HARDENING ====='
          printf '%s\n' 'vm.overcommit_memory = 1' | sudo -n tee /etc/sysctl.d/99-mnemos-redis.conf >/dev/null
          sudo -n chmod 0644 /etc/sysctl.d/99-mnemos-redis.conf
          sudo -n sysctl -p /etc/sysctl.d/99-mnemos-redis.conf

          current_overcommit="$(cat /proc/sys/vm/overcommit_memory)"
          persistent_overcommit="$(sudo -n awk -F= '/^[[:space:]]*vm\.overcommit_memory[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2}' /etc/sysctl.d/99-mnemos-redis.conf)"
          echo "runtime_vm_overcommit_memory=$current_overcommit"
          echo "persistent_vm_overcommit_memory=$persistent_overcommit"
          test "$current_overcommit" = 1
          test "$persistent_overcommit" = 1

          echo
          echo '===== LONG-LIVED GHCR SECRET PRESENCE ====='
          selected_token=''
          selected_name=''
          if [ -n "$SECRET_MNEMOS_GHCR_PULL_TOKEN" ]; then
            selected_token="$SECRET_MNEMOS_GHCR_PULL_TOKEN"
            selected_name='MNEMOS_GHCR_PULL_TOKEN'
          elif [ -n "$SECRET_GHCR_PULL_TOKEN" ]; then
            selected_token="$SECRET_GHCR_PULL_TOKEN"
            selected_name='GHCR_PULL_TOKEN'
          elif [ -n "$SECRET_GHCR_TOKEN" ]; then
            selected_token="$SECRET_GHCR_TOKEN"
            selected_name='GHCR_TOKEN'
          elif [ -n "$SECRET_CR_PAT" ]; then
            selected_token="$SECRET_CR_PAT"
            selected_name='CR_PAT'
          fi

          for name in MNEMOS_GHCR_PULL_TOKEN GHCR_PULL_TOKEN GHCR_TOKEN CR_PAT; do
            var="SECRET_${name}"
            if [ -n "${!var}" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done

          if [ -n "$selected_token" ]; then
            echo "selected_secret=$selected_name"
            auth_dir="$(mktemp -d)"
            sudo -n install -d -m 0700 -o root -g root "$auth_dir/root"
            trap 'sudo -n rm -rf "$auth_dir"' EXIT

            printf '%s' "$selected_token" | sudo -n env DOCKER_CONFIG="$auth_dir/root" docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin >/dev/null

            test_image="$(sudo -n docker service ls --format '{{.Image}}' | sed '/^ghcr\.io\/knliiss\/mnemos-/!d' | head -n 1)"
            test -n "$test_image"
            echo "registry_pull_test_image=$test_image"
            sudo -n env DOCKER_CONFIG="$auth_dir/root" docker pull "$test_image" >/dev/null
            echo 'registry_pull_test=success'

            refreshed=0
            while IFS= read -r service; do
              [ -n "$service" ] || continue
              image="$(sudo -n docker service inspect "$service" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
              case "$image" in
                ghcr.io/knliiss/mnemos-*)
                  echo "refresh_registry_auth=$service"
                  sudo -n env DOCKER_CONFIG="$auth_dir/root" docker service update --detach=true --with-registry-auth "$service" >/dev/null
                  refreshed=$((refreshed + 1))
                  ;;
              esac
            done < <(sudo -n docker service ls --format '{{.Name}}')
            echo "services_registry_auth_refreshed=$refreshed"
          else
            echo 'selected_secret=none'
            echo 'durable_registry_auth_refresh=skipped'
          fi

          echo
          echo '===== PRODUCTION HEALTH ====='
          sudo -n /opt/mnemos/current/scripts/check-production-health.sh
          sudo -n docker inspect mnemos-redis --format 'redis_state={{.State.Status}} redis_health={{.State.Health.Status}} restart_count={{.RestartCount}}'
          echo 'PRODUCTION_HARDENING_STEP_COMPLETE'
