name: Finalize public profile thread privacy

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - ".github/workflows/finalize-public-profile-thread-fix.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration

      - name: Keep comment ownership private
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path("apps/mini-app-mockup")
          feature = root / "src/features/PublicProfileRethink.tsx"
          model = root / "src/model.ts"
          mock = root / "src/mockData.ts"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          model_text = model.read_text()
          model_text = replace_once(
              model_text,
              'export type ProfileComment = { id: string; authorAccountId: string; author: string; content: string; likes: number; replies: number; createdAt: string; liked: boolean; createdByUserId?: string; pending?: boolean; failed?: boolean }',
              'export type ProfileComment = { id: string; authorAccountId: string; author: string; content: string; likes: number; replies: number; createdAt: string; liked: boolean; pending?: boolean; failed?: boolean }',
              "public comment model",
          )
          model.write_text(model_text)

          mock_text = mock.read_text()
          mock_text = mock_text.replace(', createdByUserId: "0198f6ce-e934-7000-8000-000000000031"', '')
          mock_text = mock_text.replace(', createdByUserId: "0198f6ce-e934-7000-8000-000000000032"', '')
          if "createdByUserId" in mock_text:
              raise SystemExit("mockData still exposes comment user ownership")
          mock.write_text(mock_text)

          feature_text = feature.read_text()
          feature_text = replace_once(
              feature_text,
              'import { currentUser, feed, initialComments, profiles } from "../mockData"',
              'import { feed, initialComments, profiles } from "../mockData"',
              "remove current user import",
          )
          feature_text = replace_once(
              feature_text,
              '''type ProfileReply = {\n  id: string''',
              '''type ThreadComment = ProfileComment & {\n  canDelete?: boolean\n}\n\ntype ProfileReply = {\n  id: string''',
              "local comment ownership type",
          )
          feature_text = replace_once(
              feature_text,
              '  createdByUserId: string\n  content: string',
              '  canDelete: boolean\n  content: string',
              "reply ownership flag",
          )
          feature_text = feature_text.replace(
              '    createdByUserId: "0198f6ce-e934-7000-8000-000000000033",',
              '    canDelete: false,',
          )
          feature_text = feature_text.replace(
              '    createdByUserId: "0198f6ce-e934-7000-8000-000000000034",',
              '    canDelete: false,',
          )
          feature_text = replace_once(
              feature_text,
              '  const [comments, setComments] = useState<ProfileComment[]>([',
              '  const [comments, setComments] = useState<ThreadComment[]>([',
              "thread comments state",
          )
          feature_text = feature_text.replace(
              '      createdByUserId: currentUser.id,',
              '      canDelete: true,',
              1,
          )
          feature_text = feature_text.replace(
              '          createdByUserId: currentUser.id,',
              '          canDelete: true,',
              2,
          )
          feature_text = replace_once(
              feature_text,
              '    if (!comment || comment.createdByUserId !== currentUser.id) {',
              '    if (!comment || !comment.canDelete) {',
              "comment delete authorization",
          )
          feature_text = replace_once(
              feature_text,
              '    if (!reply || reply.createdByUserId !== currentUser.id) {',
              '    if (!reply || !reply.canDelete) {',
              "reply delete authorization",
          )
          feature_text = feature_text.replace(
              'comment.createdByUserId === currentUser.id',
              'comment.canDelete',
          )
          feature_text = feature_text.replace(
              'reply.createdByUserId === currentUser.id',
              'reply.canDelete',
          )

          if "createdByUserId" in feature_text or "currentUser" in feature_text:
              raise SystemExit("public profile still exposes concrete Mnemos user identity")

          feature.write_text(feature_text)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build mockup
        working-directory: apps/mini-app-mockup
        run: |
          npm install
          npm run build

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            apps/mini-app-mockup/src/features/PublicProfileRethink.tsx \
            apps/mini-app-mockup/src/model.ts \
            apps/mini-app-mockup/src/mockData.ts

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "keep comment ownership private"
          git push origin HEAD:feat/frontend-integration
