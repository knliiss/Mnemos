name: Production Release Rollout

on:
  push:
    branches:
      - master

concurrency:
  group: mnemos-production-release-rollout-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'chore/production-release-rollout')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write

    env:
      APPLICATION_SOURCE_SHA: 4d1b00601f4c32cd104f82ea437d2df88545a03d
      GREEN_BACKEND_SHA: 8cf36034cb5228afbd656419bee94e5a00ac1237
      GREEN_STACK_SMOKE_SHA: 1bc64eef1676457f52b812a0b1e106bad54045b6

    steps:
      - name: Checkout immutable application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 4d1b00601f4c32cd104f82ea437d2df88545a03d
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted green application evidence
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$APPLICATION_SOURCE_SHA" ]; then
            echo "Application checkout does not match pinned source SHA" >&2
            exit 1
          fi

          for green_sha in "$GREEN_BACKEND_SHA" "$GREEN_STACK_SMOKE_SHA"; do
            if ! git cat-file -e "${green_sha}^{commit}"; then
              echo "Pinned green evidence commit is unavailable: $green_sha" >&2
              exit 1
            fi

            if ! git merge-base --is-ancestor "$green_sha" "$APPLICATION_SOURCE_SHA"; then
              echo "Pinned green evidence is not an ancestor of application source: $green_sha" >&2
              exit 1
            fi
          done

          protected_inputs=(
            apps
            libraries
            contracts
            keycloak-extensions
            build-logic
            gradle
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
          )

          if ! git diff --quiet \
            "$GREEN_STACK_SMOKE_SHA" \
            "$APPLICATION_SOURCE_SHA" \
            -- "${protected_inputs[@]}"; then
            echo "Application/build inputs changed after the pinned green Stack Smoke" >&2
            git diff --name-only \
              "$GREEN_STACK_SMOKE_SHA" \
              "$APPLICATION_SOURCE_SHA" \
              -- "${protected_inputs[@]}" >&2
            exit 1
          fi

          if ! git diff --quiet \
            "$GREEN_BACKEND_SHA" \
            "$APPLICATION_SOURCE_SHA" \
            -- "${protected_inputs[@]}"; then
            echo "Application/build inputs changed after the pinned green Backend Verify" >&2
            git diff --name-only \
              "$GREEN_BACKEND_SHA" \
              "$APPLICATION_SOURCE_SHA" \
              -- "${protected_inputs[@]}" >&2
            exit 1
          fi

          echo "Application source is covered by pinned green Backend Verify and Stack Smoke evidence"

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify current release tooling inputs
        shell: bash
        run: |
          set -euo pipefail

          make make-verify
          make production-service-catalog-verify
          make production-audit-bundle-verify
          make production-release-plan-verify
          make production-targeted-execution-verify
          git diff --check

      - name: Assemble production artifacts
        run: ./gradlew assemble --no-daemon

      - name: Configure isolated Docker publishing
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-production-release-docker-auth
        run: |
          set -euo pipefail

          rm -rf "$DOCKER_CONFIG"
          install --directory --mode=0700 "$DOCKER_CONFIG"

          docker buildx rm mnemos-production-release-builder >/dev/null 2>&1 || true
          docker buildx create \
            --driver docker-container \
            --name mnemos-production-release-builder \
            --use
          docker buildx inspect --bootstrap

      - name: Authenticate publisher to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-production-release-docker-auth
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish immutable application images
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-production-release-docker-auth
          MNEMOS_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          MNEMOS_IMAGE_TAG: 4d1b00601f4c32cd104f82ea437d2df88545a03d
          MNEMOS_IMAGE_PUSH: "true"
        run: |
          set -euo pipefail

          read_env_value() {
            key="$1"
            value="$(sed -n "s/^${key}=//p" .env.example)"

            if [ -z "$value" ]; then
              echo "${key} is missing from .env.example" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          export POSTGRES_VERSION="$(read_env_value POSTGRES_VERSION)"
          export KEYCLOAK_VERSION="$(read_env_value KEYCLOAK_VERSION)"
          export KEYCLOAK_CONFIG_CLI_VERSION="$(read_env_value KEYCLOAK_CONFIG_CLI_VERSION)"
          export KAFKA_VERSION="$(read_env_value KAFKA_VERSION)"
          export REDIS_VERSION="$(read_env_value REDIS_VERSION)"
          export MINIO_MC_VERSION="$(read_env_value MINIO_MC_VERSION)"

          sh scripts/publish-production-images.sh

      - name: Remove publishing credentials and builder
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-production-release-docker-auth
        run: |
          set +e
          docker buildx rm mnemos-production-release-builder >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"

  deploy:
    needs: publish
    if: >-
      contains(github.event.head_commit.message, 'chore/production-release-rollout') &&
      vars.MNEMOS_PRODUCTION_EXECUTION_ENABLED == 'true'
    environment: production
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 60

    permissions:
      contents: read
      packages: read

    env:
      APPLICATION_SOURCE_SHA: 4d1b00601f4c32cd104f82ea437d2df88545a03d
      TOOLING_REVISION: 57f33951f03842d00d353127b207550d53ed7fdd

    steps:
      - name: Checkout pinned production tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 57f33951f03842d00d353127b207550d53ed7fdd
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted deployment boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$TOOLING_REVISION" ]; then
            echo "Deployment tooling checkout is not the recorded tooling revision" >&2
            exit 1
          fi

          comparison="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/compare/${TOOLING_REVISION}...${APPLICATION_SOURCE_SHA}"
          )"

          comparison_status="$(printf '%s' "$comparison" | jq -r '.status // empty')"

          if [ "$comparison_status" != "ahead" ] && [ "$comparison_status" != "identical" ]; then
            echo "Application source is not trusted history after tooling revision: $comparison_status" >&2
            exit 1
          fi

          python3 -m py_compile \
            scripts/production_release_plan.py \
            scripts/production_deployment_executor.py \
            scripts/production_deployment_executor_base.py \
            scripts/production_runtime_state.py
          python3 scripts/verify-production-stack-renderer.py
          python3 scripts/verify-production-runtime-policy.py
          sh scripts/verify-production-deployment-executor-security.sh

      - name: Verify exact production baseline
        shell: bash
        run: |
          set -euo pipefail

          sudo -n sh scripts/validate-production-env.sh
          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh
          sudo -n sh scripts/verify-production-telegram-poller.sh

          if ! sudo -n test -f /var/lib/mnemos-deploy/current-state.json; then
            echo "Recorded production deployment state is missing" >&2
            exit 1
          fi

          sudo -n python3 scripts/production_runtime_state.py \
            verify \
            --state /var/lib/mnemos-deploy/current-state.json

          state_copy="$RUNNER_TEMP/mnemos-production-current-state.json"
          sudo -n install \
            --owner="$(id -u)" \
            --group="$(id -g)" \
            --mode=0600 \
            /var/lib/mnemos-deploy/current-state.json \
            "$state_copy"

          python3 - "$state_copy" "$TOOLING_REVISION" <<'PY'
          import json
          import sys

          state = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]

          if state.get("tooling_revision") != expected:
              raise SystemExit(
                  f"Recorded tooling revision changed: {state.get('tooling_revision')} != {expected}"
              )
          PY

          echo "CURRENT_STATE_COPY=$state_copy" >> "$GITHUB_ENV"

      - name: Create and verify audited full application release plan
        shell: bash
        run: |
          set -euo pipefail

          plan_dir="$RUNNER_TEMP/mnemos-production-release-plan"
          rm -rf "$plan_dir"
          install --directory --mode=0700 "$plan_dir"

          services="$(python3 scripts/production_service_catalog.py list --kind application)"

          if [ -z "$services" ]; then
            echo "Production application service catalog is empty" >&2
            exit 1
          fi

          set -- \
            --current-state "$CURRENT_STATE_COPY" \
            --actor "$GITHUB_ACTOR" \
            --reason "User-authorized full Mnemos production release" \
            --output-dir "$plan_dir"

          for service in $services; do
            set -- "$@" --set "$service=$APPLICATION_SOURCE_SHA"
          done

          python3 scripts/production_release_plan.py "$@"
          python3 scripts/production_audit_bundle.py \
            create \
            --directory "$plan_dir" \
            --kind release-plan
          python3 scripts/production_audit_bundle.py \
            verify \
            --directory "$plan_dir" \
            --kind release-plan

          python3 - "$plan_dir/deployment-plan.json" "$APPLICATION_SOURCE_SHA" $services <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_source = sys.argv[2]
          expected_services = set(sys.argv[3:])
          actions = plan.get("actions")

          if plan.get("mode") != "scoped" or not isinstance(actions, list):
              raise SystemExit("Production release plan is not a scoped action list")

          actual_services = {action.get("service") for action in actions}

          if actual_services != expected_services:
              raise SystemExit(
                  f"Release plan action set mismatch: actual={sorted(actual_services)} expected={sorted(expected_services)}"
              )

          for action in actions:
              target = action.get("to", {})

              if target.get("source_sha") != expected_source:
                  raise SystemExit(
                      f"Unexpected target revision for {action.get('service')}: {target.get('source_sha')}"
                  )
          PY

          transition_id="$(jq -r '.transition_id // empty' "$plan_dir/transition.json")"

          if ! printf '%s' "$transition_id" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Generated production transition ID is invalid" >&2
            exit 1
          fi

          echo "PLAN_DIR=$plan_dir" >> "$GITHUB_ENV"
          echo "TRANSITION_ID=$transition_id" >> "$GITHUB_ENV"

      - name: Render exact production dry run
        shell: bash
        run: |
          set -euo pipefail

          sudo -n python3 scripts/production_deployment_executor.py \
            --transition "$PLAN_DIR/transition.json" \
            --target-state "$PLAN_DIR/target-state.json" \
            --expected-transition-id "$TRANSITION_ID" \
            > "$RUNNER_TEMP/mnemos-production-release-dry-run.json"

          cat "$RUNNER_TEMP/mnemos-production-release-dry-run.json"

      - name: Verify execution gates
        shell: bash
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.MNEMOS_PRODUCTION_DEPLOY_ENABLED }}
          SCOPED_DEPLOY_ENABLED: ${{ vars.MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail

          if [ "$PRODUCTION_DEPLOY_ENABLED" != "true" ]; then
            echo "MNEMOS_PRODUCTION_DEPLOY_ENABLED is not true" >&2
            exit 1
          fi

          if [ "$SCOPED_DEPLOY_ENABLED" != "true" ]; then
            echo "MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED is not true" >&2
            exit 1
          fi

      - name: Prepare isolated production registry credentials
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-production-docker-auth
          sudo -n install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0700 \
            /run/mnemos-production-docker-auth

      - name: Authenticate production Docker to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-production-docker-auth \
              docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Execute audited production release
        shell: bash
        env:
          MNEMOS_PRODUCTION_DEPLOY_ENABLED: ${{ vars.MNEMOS_PRODUCTION_DEPLOY_ENABLED }}
          MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED: ${{ vars.MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-production-docker-auth \
            MNEMOS_PRODUCTION_DEPLOY_ENABLED="$MNEMOS_PRODUCTION_DEPLOY_ENABLED" \
            MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED="$MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED" \
            python3 scripts/production_deployment_executor.py \
              --transition "$PLAN_DIR/transition.json" \
              --target-state "$PLAN_DIR/target-state.json" \
              --expected-transition-id "$TRANSITION_ID" \
              --execute

      - name: Verify deployed production state
        shell: bash
        run: |
          set -euo pipefail

          sudo -n python3 scripts/production_runtime_state.py \
            verify \
            --state /var/lib/mnemos-deploy/current-state.json
          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh
          sudo -n sh scripts/verify-production-telegram-poller.sh

          state_copy="$RUNNER_TEMP/mnemos-production-deployed-state.json"
          sudo -n install \
            --owner="$(id -u)" \
            --group="$(id -g)" \
            --mode=0600 \
            /var/lib/mnemos-deploy/current-state.json \
            "$state_copy"

          services="$(python3 scripts/production_service_catalog.py list --kind application)"

          python3 - "$state_copy" "$APPLICATION_SOURCE_SHA" $services <<'PY'
          import json
          import sys

          state = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_source = sys.argv[2]
          expected_services = set(sys.argv[3:])
          deployed = state["release_manifest"]["services"]

          for service in expected_services:
              actual = deployed[service]["source_sha"]

              if actual != expected_source:
                  raise SystemExit(
                      f"Production service revision mismatch: {service}={actual}, expected={expected_source}"
                  )
          PY

          for service in $services; do
            runtime="mnemos_${service}"
            sudo -n docker service ls \
              --filter "name=$runtime" \
              --format '{{.Name}} {{.Replicas}} {{.Image}}'
          done

      - name: Collect production release audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          audit_dir="$RUNNER_TEMP/mnemos-production-release-audit"
          rm -rf "$audit_dir"
          install --directory --mode=0700 "$audit_dir"

          if [ -n "${PLAN_DIR:-}" ] && [ -d "$PLAN_DIR" ]; then
            cp -R "$PLAN_DIR" "$audit_dir/release-plan"
          fi

          if sudo -n test -f /var/lib/mnemos-deploy/current-state.json; then
            sudo -n cp /var/lib/mnemos-deploy/current-state.json "$audit_dir/current-state.json"
          fi

          if [ -n "${TRANSITION_ID:-}" ]; then
            transition_digest="${TRANSITION_ID#sha256:}"

            if sudo -n test -d "/var/lib/mnemos-deploy/transitions/$transition_digest"; then
              sudo -n cp -R \
                "/var/lib/mnemos-deploy/transitions/$transition_digest" \
                "$audit_dir/execution-attempts"
            fi
          fi

          sudo -n chown -R "$(id -u):$(id -g)" "$audit_dir"
          echo "RELEASE_AUDIT_DIR=$audit_dir" >> "$GITHUB_ENV"

      - name: Upload production release audit
        if: always() && env.RELEASE_AUDIT_DIR != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-audit-${{ github.run_id }}
          path: ${{ env.RELEASE_AUDIT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove production registry credentials
        if: always()
        shell: bash
        run: |
          set +e
          sudo -n rm -rf /run/mnemos-production-docker-auth
