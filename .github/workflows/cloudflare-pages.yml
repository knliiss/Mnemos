name: Cloudflare Pages Production Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full master commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY followed by the exact source SHA
        required: true
        type: string

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: vars.MNEMOS_CLOUDFLARE_PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, mnemos-frontend]
    timeout-minutes: 15

    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      VITE_KEYCLOAK_URL: https://auth.knalis.rest
      VITE_KEYCLOAK_REALM: mnemos
      VITE_KEYCLOAK_CLIENT_ID: mnemos-mini-app
      VITE_API_URL: https://api.knalis.rest

    steps:
      - name: Checkout trusted master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0

      - name: Validate production authorization
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "source_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi

          if [ "$CONFIRMATION" != "DEPLOY $SOURCE_SHA" ]; then
            echo "confirmation must exactly equal: DEPLOY $SOURCE_SHA" >&2
            exit 1
          fi

          git cat-file -e "$SOURCE_SHA^{commit}"

          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/master; then
            echo "source_sha is not reachable from trusted master history" >&2
            exit 1
          fi

      - name: Checkout exact source revision
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: apps/mini-app/.node-version
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mini-app
        run: npm ci

      - name: Verify Mini App
        working-directory: apps/mini-app
        run: |
          npm run lint
          npm run test -- --run
          npm run build

      - name: Upload immutable production artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mini-app-production-${{ inputs.source_sha }}
          path: apps/mini-app/dist
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: vars.MNEMOS_CLOUDFLARE_PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: [self-hosted, Linux, X64, mnemos-frontend]
    timeout-minutes: 10
    environment: production

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Download immutable production artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mini-app-production-${{ inputs.source_sha }}
          path: apps/mini-app/dist

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: apps/mini-app/.node-version

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is missing" >&2
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing" >&2
            exit 1
          fi

      - name: Deploy exact artifact to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/mini-app/dist --project-name=mnemos-mini-app --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
