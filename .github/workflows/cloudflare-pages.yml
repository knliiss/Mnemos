name: Cloudflare Pages Production Deploy

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full master commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY followed by the exact source SHA
        required: true
        type: string
  push:
    branches:
      - deploy/production-frontend

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
  CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || '' }}

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, mnemos-frontend]
    timeout-minutes: 15
    outputs:
      bundle_sha256: ${{ steps.fingerprint.outputs.bundle_sha256 }}

    env:
      VITE_KEYCLOAK_URL: https://auth.knalis.rest
      VITE_KEYCLOAK_REALM: mnemos
      VITE_KEYCLOAK_CLIENT_ID: mnemos-mini-app
      VITE_API_URL: https://api.knalis.rest

    steps:
      - name: Checkout trusted master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0

      - name: Validate production authorization
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "source_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi

          git cat-file -e "$SOURCE_SHA^{commit}"

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ "$CONFIRMATION" != "DEPLOY $SOURCE_SHA" ]; then
                echo "confirmation must exactly equal: DEPLOY $SOURCE_SHA" >&2
                exit 1
              fi

              if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/master; then
                echo "source_sha is not reachable from trusted master history" >&2
                exit 1
              fi
              ;;
            push)
              if [ "$GITHUB_REF" != "refs/heads/deploy/production-frontend" ]; then
                echo "push-triggered production deploys are restricted to deploy/production-frontend" >&2
                exit 1
              fi

              master_sha="$(git rev-parse origin/master)"

              if [ "$SOURCE_SHA" != "$master_sha" ]; then
                echo "deploy/production-frontend must point exactly at the current master HEAD" >&2
                echo "source_sha=$SOURCE_SHA" >&2
                echo "master_sha=$master_sha" >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported production deployment event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

      - name: Checkout exact source revision
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: apps/mini-app/.node-version
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mini-app
        run: npm ci

      - name: Verify Mini App
        working-directory: apps/mini-app
        run: |
          npm run lint
          npm run test -- --run
          node ../../scripts/verify-guide-assets.mjs apps/mini-app/public/guides
          npm run build
          node ../../scripts/verify-guide-assets.mjs apps/mini-app/dist/guides

      - name: Fingerprint production bundle without storing GitHub artifacts
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/mini-app/dist/index.html
          bundle_sha256="$(find apps/mini-app/dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          echo "bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64, mnemos-frontend]
    timeout-minutes: 15
    environment: production
    env:
      VITE_KEYCLOAK_URL: https://auth.knalis.rest
      VITE_KEYCLOAK_REALM: mnemos
      VITE_KEYCLOAK_CLIENT_ID: mnemos-mini-app
      VITE_API_URL: https://api.knalis.rest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact deployment revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: apps/mini-app/.node-version

      - name: Rebuild the immutable verified source without GitHub artifacts
        working-directory: apps/mini-app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node ../../scripts/verify-guide-assets.mjs apps/mini-app/dist/guides

      - name: Confirm deterministic bundle matches the isolated build job
        shell: bash
        env:
          EXPECTED_BUNDLE_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_BUNDLE_SHA256" | grep -Eq '^[0-9a-f]{64}
      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is missing" >&2
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing" >&2
            exit 1
          fi

      - name: Deploy exact artifact to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/mini-app/dist --project-name=mnemos-mini-app --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
; then
            echo "Missing or invalid verified bundle fingerprint" >&2
            exit 1
          fi
          bundle_sha256="$(find apps/mini-app/dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          if [ "$bundle_sha256" != "$EXPECTED_BUNDLE_SHA256" ]; then
            echo "Production bundle differs from the verified build; deployment stopped" >&2
            exit 1
          fi
          echo "Production bundle reproducibility verified."

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is missing" >&2
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing" >&2
            exit 1
          fi

      - name: Deploy exact artifact to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/mini-app/dist --project-name=mnemos-mini-app --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
