name: Production State Inspect

on:
  push:
    branches:
      - feat/production-deployment
    paths:
      - .github/workflows/production-state-inspect.yml

permissions: {}

concurrency:
  group: production-state-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 5

    steps:
      - name: Inspect non-destructive production state
        shell: bash
        run: |
          set -euo pipefail

          echo '=== host ==='
          uname -a
          free -h
          df -h /

          echo '=== docker ==='
          sudo -n docker version --format 'server={{.Server.Version}}'
          sudo -n docker info --format 'swarm={{.Swarm.LocalNodeState}} live_restore={{.LiveRestoreEnabled}} logging={{.LoggingDriver}}'
          sudo -n docker node ls --format 'node={{.Hostname}} status={{.Status}} availability={{.Availability}} manager={{.ManagerStatus}}' || true
          sudo -n docker stack ls --format 'stack={{.Name}} services={{.Services}}'
          sudo -n docker ps -a --format 'container={{.Names}} status={{.Status}} image={{.Image}}'
          sudo -n docker volume ls --format 'volume={{.Name}}'

          echo '=== mnemos runtime ==='
          sudo -n stat -c '%n mode=%a owner=%U:%G' /etc/mnemos /etc/mnemos/mnemos.env /opt/mnemos/current 2>/dev/null || true
          sudo -n readlink -f /opt/mnemos/current || true
          command -v restic || true
          systemctl is-enabled mnemos-production-backup.timer 2>/dev/null || true
          systemctl is-active mnemos-production-backup.timer 2>/dev/null || true

          echo '=== env presence only ==='
          sudo -n bash -c '
            set -euo pipefail
            source /etc/mnemos/mnemos.env
            for name in \
              MNEMOS_TELEGRAM_BOT_TOKEN \
              MNEMOS_SUPER_ADMIN_TELEGRAM_ID \
              CRISTALIX_INTERACTIVE_PROJECT_TOKEN \
              CRISTALIX_INTERACTIVE_PROJECT_KEY \
              CRISTALIX_MONITORING_PROJECT_TOKEN \
              CRISTALIX_MONITORING_PROJECT_KEY \
              CRISTALIX_RESERVE_PROJECT_TOKEN \
              CRISTALIX_RESERVE_PROJECT_KEY \
              RESTIC_REPOSITORY; do
              if [[ -n "${!name:-}" ]]; then
                echo "$name=set"
              else
                echo "$name=missing"
              fi
            done
          '
