name: Temporary Force Cancel Stale CI

on:
  push:
    branches:
      - feat/production-deployment
    paths:
      - ".github/workflows/temp-force-cancel-stale-ci.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: [self-hosted, mnemos-production]
    timeout-minutes: 5

    steps:
      - name: Force cancel stale smoke run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response_code="$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/33161721206/force-cancel")"

          if [ "$response_code" != "202" ]; then
            echo "Force-cancel request returned HTTP ${response_code}" >&2
            exit 1
          fi

          echo "Stale Stack Smoke run force-cancelled"
