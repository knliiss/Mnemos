name: Stack Smoke

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "apps/**"
      - "!apps/mini-app/**"
      - "contracts/**"
      - "libraries/**"
      - "keycloak-extensions/**"
      - "infrastructure/compose/**"
      - "infrastructure/kafka/**"
      - "infrastructure/keycloak/**"
      - "infrastructure/minio-init/**"
      - "infrastructure/postgres/**"
      - "infrastructure/redis/**"
      - "make/**"
      - "scripts/docker-compose-env.sh"
      - "scripts/ensure-kafka-tls-secret.sh"
      - "scripts/validate-compose-secrets.sh"
      - "scripts/generate-kafka-message-keys.sh"
      - "scripts/verify-compose-env-isolation.sh"
      - "scripts/verify-compose-secret-validation.sh"
      - "scripts/verify-internal-api-authorization.sh"
      - "scripts/verify-kafka-acl-reconciliation-runtime.sh"
      - "scripts/verify-kafka-message-auth.sh"
      - "scripts/verify-kafka-message-auth-runtime.sh"
      - "scripts/verify-kafka-service-config.sh"
      - "scripts/verify-kafka-transport-security.sh"
      - "scripts/verify-minio-policy-reconciliation-runtime.sh"
      - "scripts/verify-postgres-legacy-ownership-migration.sh"
      - "scripts/verify-redis-service-config.sh"
      - "scripts/verify-redis-service-isolation-runtime.sh"
      - "scripts/verify-resource-server-audience.sh"
      - "build.gradle.kts"
      - ".dockerignore"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/ci/compose-isolation.override.yml"
      - ".github/workflows/stack-smoke.yml"

concurrency:
  group: stack-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, mnemos-backend]
    timeout-minutes: 30

    steps:
      - name: Clean generated workspace state
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$GITHUB_WORKSPACE" ]; then
            exit 0
          fi

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.22 \
            chown -R "$(id -u):$(id -g)" /workspace

          find "$GITHUB_WORKSPACE" \
            -type d \
            \( \
              -name build -o \
              -name .gradle -o \
              -name .kotlin -o \
              -name __pycache__ \
            \) \
            -prune \
            -exec rm -rf -- {} +

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare isolated environment
        shell: bash
        run: |
          set -euo pipefail

          cp .env.example .env.ci

          set_env() {
            local key="$1"
            local value="$2"

            sed -i "s|^${key}=.*|${key}=${value}|" .env.ci
          }

          for key in $(sh scripts/validate-compose-secrets.sh --list-required); do
            set_env "$key" "ci-${GITHUB_RUN_ID}-${key}-secure-value"
          done

          preferred_port_base=$((40000 + (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 7919) % 18000))
          port_base=""

          for attempt in $(seq 0 199); do
            candidate=$((40000 + (preferred_port_base - 40000 + attempt * 7) % 18000))
            candidate=$((candidate - candidate % 7))
            block_free=true

            for offset in $(seq 0 6); do
              port=$((candidate + offset))

              if [ "$port" -gt 65535 ] || ss -H -ltn "sport = :$port" | grep -q .; then
                block_free=false
                break
              fi
            done

            if [ "$block_free" = true ]; then
              port_base="$candidate"
              break
            fi
          done

          if [ -z "$port_base" ]; then
            echo "Could not find a free seven-port block for Stack Smoke" >&2
            exit 1
          fi

          echo "Using isolated host port block ${port_base}-$((port_base + 6))"

          set_env COMPOSE_PROJECT_NAME "mnemos-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set_env APP_POSTGRES_HOST_PORT "$port_base"
          set_env KEYCLOAK_POSTGRES_HOST_PORT "$((port_base + 1))"
          set_env KEYCLOAK_HOST_PORT "$((port_base + 2))"
          set_env KAFKA_HOST_PORT "$((port_base + 3))"
          set_env REDIS_HOST_PORT "$((port_base + 4))"
          set_env GATEWAY_HOST_PORT "$((port_base + 5))"

          set_env MNEMOS_FRONTEND_ORIGIN "http://127.0.0.1:$((port_base + 6))"
          set_env MNEMOS_API_ORIGIN "http://127.0.0.1:$((port_base + 5))"
          set_env MNEMOS_AUTH_ORIGIN "http://127.0.0.1:$((port_base + 2))"

          sh scripts/validate-compose-secrets.sh .env.ci
          sh scripts/verify-kafka-service-config.sh
          sh scripts/verify-kafka-transport-security.sh
          sh scripts/verify-redis-service-config.sh
          sh scripts/generate-kafka-message-keys.sh .env.ci
          sh scripts/verify-kafka-message-auth.sh .env.ci

          for key in \
            SOCIAL_SERVICE_KAFKA_SIGNING_PRIVATE_KEY \
            PROFILE_SERVICE_KAFKA_SIGNING_PRIVATE_KEY \
            MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS; do
            if ! grep -Eq "^${key}=.+" .env.ci; then
              echo "Generated environment is missing ${key}" >&2
              exit 1
            fi
          done

          compose_command="sh scripts/docker-compose-env.sh .env.ci"

          for file in infrastructure/compose/compose.*.yml infrastructure/compose/apps/compose.*.yml; do
            compose_command+=" -f ${file}"
          done

          compose_command+=" -f .github/ci/compose-isolation.override.yml"
          echo "CI_COMPOSE_COMMAND=${compose_command}" >> "$GITHUB_ENV"

          echo "MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS=account-service=stale-shell-key" >> "$GITHUB_ENV"
          echo "ACCOUNT_SERVICE_KAFKA_SIGNING_PRIVATE_KEY=stale-shell-private-key" >> "$GITHUB_ENV"
          echo "KAFKA_ACCOUNT_SERVICE_PASSWORD=stale-shell-password" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          $CI_COMPOSE_COMMAND config --quiet

      - name: Build stack
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean build --console=plain --no-build-cache

          while IFS= read -r -d '' artifact; do
            echo "Verifying ${artifact}"
            jar tf "$artifact" >/dev/null
          done < <(
            find apps \
              -path '*/build/libs/*-service.jar' \
              -type f \
              -print0
          )

          $CI_COMPOSE_COMMAND build --no-cache --quiet

      - name: Start clean stack
        shell: bash
        run: |
          set -euo pipefail

          set +e
          timeout --kill-after=15s 8m \
            env STARTUP_CHECK_DELAY=45 \
            make ENV_FILE=.env.ci DC="$CI_COMPOSE_COMMAND" up
          startup_status=$?
          set -e

          if [ "$startup_status" -ne 0 ]; then
            if [ "$startup_status" -eq 124 ] || [ "$startup_status" -eq 137 ]; then
              echo "Stack startup exceeded the 8 minute startup window" >&2
            else
              echo "Stack startup failed with exit code ${startup_status}" >&2
            fi

            exit "$startup_status"
          fi

          sleep 20

          timeout --kill-after=10s 3m \
            make ENV_FILE=.env.ci DC="$CI_COMPOSE_COMMAND" status

          timeout --kill-after=10s 2m \
            sh scripts/verify-kafka-message-auth-runtime.sh .env.ci

          timeout --kill-after=10s 2m \
            sh scripts/verify-kafka-acl-reconciliation-runtime.sh .env.ci

      - name: Verify Redis service isolation
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/verify-redis-service-isolation-runtime.sh .env.ci

      - name: Verify MinIO isolation
        shell: bash
        run: |
          set -euo pipefail

          minio_init_container="$($CI_COMPOSE_COMMAND ps -aq minio-init)"

          if [ -z "$minio_init_container" ]; then
            echo "minio-init container is missing" >&2
            exit 1
          fi

          minio_init_state="$(docker inspect -f '{{.State.Status}}' "$minio_init_container")"
          minio_init_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$minio_init_container")"

          if [ "$minio_init_state" != "exited" ] || [ "$minio_init_exit_code" != "0" ]; then
            echo "minio-init did not complete successfully" >&2
            exit 1
          fi

          if $CI_COMPOSE_COMMAND exec -T personalization-service sh -c \
            'env | grep -q "^MINIO_ROOT_"'; then
            echo "personalization-service must not receive MinIO root credentials" >&2
            exit 1
          fi

          $CI_COMPOSE_COMMAND exec -T personalization-service sh -ec \
            'test -n "$MINIO_PERSONALIZATION_ACCESS_KEY" && test -n "$MINIO_PERSONALIZATION_SECRET_KEY"'

          sh scripts/verify-minio-policy-reconciliation-runtime.sh .env.ci

      - name: Verify Flyway schemas
        shell: bash
        run: |
          set -euo pipefail

          schemas=(
            account
            bet
            event
            moderation
            notification
            payment
            personalization
            player_directory
            profile
            realtime
            reward
            social
            wallet
          )

          for schema in "${schemas[@]}"; do
            migrations="$($CI_COMPOSE_COMMAND exec -T app-postgres \
              psql \
              --username mnemos \
              --dbname mnemos \
              --tuples-only \
              --no-align \
              --command "SELECT COUNT(*) FROM ${schema}.flyway_schema_history WHERE success = true;")"

            migrations="$(echo "$migrations" | tr -d '[:space:]')"

            if [ -z "$migrations" ] || [ "$migrations" -lt 1 ]; then
              echo "No successful Flyway migrations found for schema ${schema}" >&2
              exit 1
            fi

            echo "${schema}: ${migrations} migrations"
          done

      - name: Verify PostgreSQL service isolation
        shell: bash
        run: |
          set -euo pipefail

          read_env() {
            local key="$1"

            awk -F= -v key="$key" '
              $1 == key {
                print substr($0, length(key) + 2)
                exit
              }
            ' .env.ci
          }

          admin_user="$(read_env APP_POSTGRES_USER)"
          database="$(read_env APP_POSTGRES_DB)"
          schemas=(
            account
            wallet
            event
            notification
            reward
            bet
            moderation
            realtime
            personalization
            social
            profile
            player_directory
            payment
          )
          mappings=""

          for schema in "${schemas[@]}"; do
            role_key="$(printf '%s_POSTGRES_USER' "$schema" | tr '[:lower:]' '[:upper:]')"
            role="$(read_env "$role_key")"

            if [ -z "$role" ]; then
              echo "Missing PostgreSQL role for ${schema}" >&2
              exit 1
            fi

            if [ -n "$mappings" ]; then
              mappings+=","
            fi

            mappings+="('${role}','${schema}')"
          done

          query_count() {
            local query="$1"

            $CI_COMPOSE_COMMAND exec -T app-postgres \
              psql \
              --username "$admin_user" \
              --dbname "$database" \
              --tuples-only \
              --no-align \
              --command "$query" |
              tr -d '[:space:]'
          }

          unsafe_roles="$(query_count "
            WITH service_roles(role_name, own_schema) AS (VALUES ${mappings})
            SELECT COUNT(*)
            FROM service_roles service
            JOIN pg_roles role ON role.rolname = service.role_name
            WHERE role.rolsuper
               OR role.rolcreatedb
               OR role.rolcreaterole
               OR role.rolbypassrls;
          ")"

          wrong_owners="$(query_count "
            WITH service_roles(role_name, own_schema) AS (VALUES ${mappings})
            SELECT COUNT(*)
            FROM service_roles service
            JOIN pg_namespace namespace ON namespace.nspname = service.own_schema
            JOIN pg_roles owner ON owner.oid = namespace.nspowner
            WHERE owner.rolname <> service.role_name;
          ")"

          cross_schema_access="$(query_count "
            WITH service_roles(role_name, own_schema) AS (VALUES ${mappings})
            SELECT COUNT(*)
            FROM service_roles caller
            CROSS JOIN service_roles target
            WHERE caller.role_name <> target.role_name
              AND has_schema_privilege(caller.role_name, target.own_schema, 'USAGE');
          ")"

          if [ "$unsafe_roles" != "0" ]; then
            echo "One or more service database roles have elevated PostgreSQL privileges" >&2
            exit 1
          fi

          if [ "$wrong_owners" != "0" ]; then
            echo "One or more service schemas have the wrong PostgreSQL owner" >&2
            exit 1
          fi

          if [ "$cross_schema_access" != "0" ]; then
            echo "One or more service roles can access another service schema" >&2
            exit 1
          fi

          echo "PostgreSQL service isolation verified"

      - name: Verify PostgreSQL legacy ownership migration
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/verify-postgres-legacy-ownership-migration.sh \
            .env.ci \
            .github/ci/compose-isolation.override.yml

      - name: Diagnose stack failure
        if: failure()
        shell: bash
        run: |
          set +e

          if [ -z "${CI_COMPOSE_COMMAND:-}" ]; then
            echo "Compose command was not initialized; failure happened during environment preparation."
            exit 0
          fi

          run_diagnostic() {
            label="$1"
            command="$2"

            echo "=== ${label} ==="
            timeout --kill-after=5s 30s bash -c "$command" </dev/null || true
          }

          run_diagnostic "Compose state" \
            "$CI_COMPOSE_COMMAND ps -a"

          run_diagnostic "Application logs" \
            "$CI_COMPOSE_COMMAND logs --no-color --tail=120 account-service wallet-service event-service notification-service reward-service bet-service moderation-service realtime-service personalization-service social-service profile-service player-directory-service payment-service gateway-service telegram-bot-service"

          run_diagnostic "PostgreSQL security init logs" \
            "$CI_COMPOSE_COMMAND logs --no-color --tail=200 app-postgres-security-init"

          run_diagnostic "Kafka TLS init logs" \
            "$CI_COMPOSE_COMMAND logs --no-color --tail=200 kafka-tls-init"

          echo "=== Kafka health ==="
          kafka_container="$(timeout --kill-after=5s 30s bash -c "$CI_COMPOSE_COMMAND ps -q kafka" </dev/null || true)"
          if [ -n "$kafka_container" ]; then
            timeout --kill-after=5s 30s docker inspect \
              --format '{{json .State.Health}}' \
              "$kafka_container" || true
          fi

          run_diagnostic "Kafka logs" \
            "$CI_COMPOSE_COMMAND logs --no-color --tail=300 kafka"

          run_diagnostic "Kafka init logs" \
            "$CI_COMPOSE_COMMAND logs --no-color --tail=200 kafka-init"

          run_diagnostic "Redis logs" \
            "$CI_COMPOSE_COMMAND logs --no-color --tail=200 redis"

          run_diagnostic "Keycloak config logs" \
            "$CI_COMPOSE_COMMAND logs --no-color --tail=200 keycloak-config"

          run_diagnostic "MinIO logs" \
            "$CI_COMPOSE_COMMAND logs --no-color --tail=200 minio"

          run_diagnostic "MinIO init logs" \
            "$CI_COMPOSE_COMMAND logs --no-color --tail=200 minio-init"

      - name: Cleanup isolated stack
        if: always()
        shell: bash
        run: |
          set +e

          if [ -n "${CI_COMPOSE_COMMAND:-}" ]; then
            timeout --kill-after=10s 2m bash -c \
              "$CI_COMPOSE_COMMAND down --volumes --remove-orphans" || true
          fi

          rm -f .env.ci
