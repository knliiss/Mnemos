name: Frontend Cleanup

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - "scripts/frontend-cleanup.mjs"
      - ".github/workflows/frontend-cleanup.yml"

concurrency:
  group: frontend-cleanup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          PAYLOAD="$(jq -n \
            --arg state "pending" \
            --arg target_url "$RUN_URL" \
            --arg description "Frontend cleanup is running" \
            --arg context "frontend-cleanup" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$PAYLOAD" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mini-app
        run: |
          npm ci
          npm install --no-save purgecss

      - name: Prune unused styles
        run: node scripts/frontend-cleanup.mjs

      - name: Format
        working-directory: apps/mini-app
        run: npm run format

      - name: Lint
        working-directory: apps/mini-app
        run: npm run lint

      - name: Check formatting
        working-directory: apps/mini-app
        run: npm run format:check

      - name: Test
        working-directory: apps/mini-app
        run: npm test -- --run

      - name: Build
        working-directory: apps/mini-app
        run: npm run build

      - name: Remove generated build output
        run: rm -rf apps/mini-app/dist

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi

          git commit -m "prune unused frontend styles"
          git push origin HEAD:feat/frontend-integration

      - name: Publish cleanup status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
          else
            STATE="failure"
          fi

          FINAL_SHA="$(git rev-parse HEAD)"
          PAYLOAD="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "Frontend cleanup: $JOB_STATUS" \
            --arg context "frontend-cleanup" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$PAYLOAD" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${FINAL_SHA}"
