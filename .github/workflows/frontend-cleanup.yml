# finalization trigger
name: Frontend Finalization

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - "scripts/finalize-mini-app.py"
      - ".github/workflows/frontend-cleanup.yml"

concurrency:
  group: frontend-finalization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration
          fetch-depth: 0

      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg target_url "$RUN_URL" --arg description "Frontend finalization is running" --arg context "mini-app/finalize" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" --data "$payload" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}"

      - name: Apply migration
        run: python3 scripts/finalize-mini-app.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mini-app
        run: npm ci

      - name: Format frontend
        working-directory: apps/mini-app
        run: npm run format

      - name: Lint frontend
        working-directory: apps/mini-app
        run: npm run lint

      - name: Test frontend
        working-directory: apps/mini-app
        run: npm test

      - name: Build frontend
        working-directory: apps/mini-app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format social service
        run: ./gradlew :apps:social-service:ktlintFormat --no-daemon

      - name: Test social service
        run: ./gradlew :apps:social-service:test --no-daemon

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/mini-app/dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "finalize production mini app"
          git push origin HEAD:feat/frontend-integration

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          payload="$(jq -n --arg state "$state" --arg target_url "$RUN_URL" --arg description "Frontend finalization: $JOB_STATUS" --arg context "mini-app/finalize" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" --data "$payload" "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}"
