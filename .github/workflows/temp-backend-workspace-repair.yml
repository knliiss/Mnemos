name: Temporary Backend Workspace Repair

on:
  push:
    branches:
      - feat/production-deployment
    paths:
      - ".github/workflows/temp-backend-workspace-repair.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, Linux, X64, mnemos-backend]

    steps:
      - name: Repair Docker-created workspace ownership
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.20.3 \
            sh -ec 'chown -R "$HOST_UID:$HOST_GID" /workspace'

          stale_provider="$GITHUB_WORKSPACE/keycloak-extensions/telegram-authenticator/build/libs/mnemos-telegram-authenticator.jar"

          if [ -d "$stale_provider" ]; then
            rm -rf "$stale_provider"
          fi

          if [ -d "$stale_provider" ]; then
            echo "Stale Keycloak provider bind-mount directory still exists" >&2
            exit 1
          fi

          echo "Backend runner workspace ownership repaired"
