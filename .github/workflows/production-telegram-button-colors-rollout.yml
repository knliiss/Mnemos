name: Production Telegram Button Colors Rollout

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/production-telegram-button-colors-rollout.yml

concurrency:
  group: mnemos-production-telegram-button-colors
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.head_commit.message == 'chore: execute Telegram button color production rollout'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    env:
      SOURCE_SHA: 5e871fc9c6aa63304787cb7ea3dfaeee3ac8bf74
      SERVICE: telegram-bot-service

    steps:
      - name: Checkout trusted repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source boundary
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/production_source_revision.py \
            "$SOURCE_SHA" \
            --trusted-ref origin/master

          git checkout --detach "$SOURCE_SHA"

          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "Immutable source checkout mismatch" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify Telegram service source
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-production-service-catalog.py
          ./gradlew \
            :apps:telegram-bot-service:ktlintCheck \
            :apps:telegram-bot-service:test \
            --no-daemon

      - name: Configure isolated Docker publishing
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-telegram-color-docker-auth
        run: |
          set -euo pipefail

          rm -rf "$DOCKER_CONFIG"
          install --directory --mode=0700 "$DOCKER_CONFIG"

          docker buildx rm mnemos-telegram-color-builder >/dev/null 2>&1 || true
          docker buildx create \
            --driver docker-container \
            --name mnemos-telegram-color-builder \
            --use
          docker buildx inspect --bootstrap

      - name: Authenticate publisher to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-telegram-color-docker-auth
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish immutable Telegram service image
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-telegram-color-docker-auth
        run: |
          set -euo pipefail

          python3 scripts/publish-production-service-image.py \
            --service "$SERVICE" \
            --registry "ghcr.io/${{ github.repository_owner }}" \
            --tag "$SOURCE_SHA" \
            --push

      - name: Remove publisher credentials and builder
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-telegram-color-docker-auth
        run: |
          set +e
          docker buildx rm mnemos-telegram-color-builder >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"

  deploy:
    needs: publish
    if: needs.publish.result == 'success'
    environment: production
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read
      actions: read

    env:
      SOURCE_SHA: 5e871fc9c6aa63304787cb7ea3dfaeee3ac8bf74
      PREVIOUS_SOURCE_SHA: 4d1b00601f4c32cd104f82ea437d2df88545a03d
      PINNED_TOOLING_REVISION: 57f33951f03842d00d353127b207550d53ed7fdd
      SERVICE: telegram-bot-service

    steps:
      - name: Checkout authorized rollout revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted tooling and source boundary
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "Rollout checkout mismatch" >&2
            exit 1
          fi

          python3 scripts/production_source_revision.py \
            "$SOURCE_SHA" \
            --trusted-ref HEAD

          if ! git diff --quiet \
            "$PINNED_TOOLING_REVISION" \
            HEAD \
            -- scripts infrastructure/production; then
            echo "Production tooling differs from the pinned verified revision" >&2
            exit 1
          fi

          python3 -m py_compile \
            scripts/production_hotfix_plan.py \
            scripts/production_deployment_executor.py \
            scripts/production_deployment_state.py \
            scripts/production_audit_bundle.py

      - name: Verify exact production baseline
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/verify-production-stack-renderer.py
          python3 scripts/verify-production-runtime-policy.py
          bash scripts/verify-production-deployment-executor-security.sh
          bash scripts/validate-production-env.sh
          bash scripts/verify-production-availability.sh
          bash scripts/check-production-health.sh
          bash scripts/verify-production-telegram-poller.sh

          state_file="$RUNNER_TEMP/mnemos-current-production-state.json"
          sudo -n cp /var/lib/mnemos-deploy/current-state.json "$state_file"
          sudo -n chown "$(id -u):$(id -g)" "$state_file"

          python3 scripts/production_deployment_state.py \
            state-validate \
            --input "$state_file"

          CURRENT_STATE_FILE="$state_file" \
          PREVIOUS_SOURCE_SHA="$PREVIOUS_SOURCE_SHA" \
          PINNED_TOOLING_REVISION="$PINNED_TOOLING_REVISION" \
          python3 - <<'PY'
          import json
          import os

          state = json.load(open(os.environ["CURRENT_STATE_FILE"], encoding="utf-8"))

          if state["tooling_revision"] != os.environ["PINNED_TOOLING_REVISION"]:
              raise SystemExit("Production tooling revision does not match the verified baseline")

          services = state["release_manifest"]["services"]
          expected = os.environ["PREVIOUS_SOURCE_SHA"]

          for name, entry in services.items():
              if entry.get("kind") != "application":
                  continue
              if entry.get("source_sha") != expected:
                  raise SystemExit(
                      f"Unexpected application source before scoped rollout: {name}={entry.get('source_sha')}"
                  )
          PY

          echo "CURRENT_STATE_FILE=$state_file" >> "$GITHUB_ENV"

      - name: Create and verify audited one-service transition
        shell: bash
        run: |
          set -euo pipefail

          plan_dir="$RUNNER_TEMP/mnemos-telegram-button-colors-plan"
          rm -rf "$plan_dir"
          install --directory --mode=0700 "$plan_dir"

          python3 scripts/production_hotfix_plan.py \
            --current-state "$CURRENT_STATE_FILE" \
            --service "$SERVICE" \
            --source-sha "$SOURCE_SHA" \
            --actor "${{ github.actor }}" \
            --reason "Explicit user authorization: deploy Telegram button color hierarchy" \
            --output-dir "$plan_dir"

          cp "$CURRENT_STATE_FILE" "$plan_dir/current-state.json"

          python3 scripts/production_audit_bundle.py \
            create \
            --directory "$plan_dir" \
            --kind hotfix-plan

          python3 scripts/production_audit_bundle.py \
            verify \
            --directory "$plan_dir" \
            --kind hotfix-plan

          PLAN_DIR="$plan_dir" SOURCE_SHA="$SOURCE_SHA" SERVICE="$SERVICE" python3 - <<'PY'
          import json
          import os

          plan_dir = os.environ["PLAN_DIR"]
          expected_service = os.environ["SERVICE"]
          expected_source = os.environ["SOURCE_SHA"]

          transition = json.load(open(f"{plan_dir}/transition.json", encoding="utf-8"))
          plan = transition["plan"]

          if plan.get("mode") != "scoped" or plan.get("action_count") != 1:
              raise SystemExit("Production rollout must contain exactly one scoped action")

          action = plan["actions"][0]
          if action.get("service") != expected_service:
              raise SystemExit("Scoped action targets an unexpected service")

          if action.get("to", {}).get("source_sha") != expected_source:
              raise SystemExit("Scoped action targets an unexpected source SHA")

          print(transition["transition_id"])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"EXPECTED_TRANSITION_ID={transition['transition_id']}\n")
          PY

          echo "PLAN_DIR=$plan_dir" >> "$GITHUB_ENV"

      - name: Render exact production dry run
        shell: bash
        run: |
          set -euo pipefail

          sudo -n python3 scripts/production_deployment_executor.py \
            --transition "$PLAN_DIR/transition.json" \
            --target-state "$PLAN_DIR/target-state.json" \
            --expected-transition-id "$EXPECTED_TRANSITION_ID" \
            > "$RUNNER_TEMP/mnemos-telegram-button-colors-dry-run.json"

          PLAN_DIR="$PLAN_DIR" python3 - <<'PY'
          import json
          import os

          plan = json.load(open(f"{os.environ['PLAN_DIR']}/deployment-plan.json", encoding="utf-8"))
          if [action["service"] for action in plan["actions"]] != ["telegram-bot-service"]:
              raise SystemExit("Dry-run plan is not Telegram-only")
          PY

      - name: Prepare isolated production registry credentials
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-production-docker-auth
          sudo -n install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0700 \
            /run/mnemos-production-docker-auth

      - name: Authenticate production Docker and verify image
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-production-docker-auth \
              docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-production-docker-auth \
            docker manifest inspect \
            "ghcr.io/${{ github.repository_owner }}/mnemos-telegram-bot-service:$SOURCE_SHA" \
            >/dev/null

      - name: Execute explicitly authorized scoped rollout
        shell: bash
        run: |
          set -euo pipefail

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-production-docker-auth \
            MNEMOS_PRODUCTION_DEPLOY_ENABLED=true \
            MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED=true \
            python3 scripts/production_deployment_executor.py \
              --transition "$PLAN_DIR/transition.json" \
              --target-state "$PLAN_DIR/target-state.json" \
              --expected-transition-id "$EXPECTED_TRANSITION_ID" \
              --execute

      - name: Verify deployed production state
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/verify-production-availability.sh
          bash scripts/check-production-health.sh
          bash scripts/verify-production-telegram-poller.sh

          final_state="$RUNNER_TEMP/mnemos-final-production-state.json"
          sudo -n cp /var/lib/mnemos-deploy/current-state.json "$final_state"
          sudo -n chown "$(id -u):$(id -g)" "$final_state"

          python3 scripts/production_deployment_state.py \
            state-validate \
            --input "$final_state"

          FINAL_STATE="$final_state" \
          SOURCE_SHA="$SOURCE_SHA" \
          PREVIOUS_SOURCE_SHA="$PREVIOUS_SOURCE_SHA" \
          PINNED_TOOLING_REVISION="$PINNED_TOOLING_REVISION" \
          python3 - <<'PY'
          import json
          import os

          state = json.load(open(os.environ["FINAL_STATE"], encoding="utf-8"))

          if state["tooling_revision"] != os.environ["PINNED_TOOLING_REVISION"]:
              raise SystemExit("Tooling revision changed during scoped rollout")

          services = state["release_manifest"]["services"]

          for name, entry in services.items():
              if entry.get("kind") != "application":
                  continue

              expected = (
                  os.environ["SOURCE_SHA"]
                  if name == "telegram-bot-service"
                  else os.environ["PREVIOUS_SOURCE_SHA"]
              )

              if entry.get("source_sha") != expected:
                  raise SystemExit(
                      f"Unexpected final application source: {name}={entry.get('source_sha')} expected={expected}"
                  )

          print("Scoped Telegram production state verified")
          PY

          docker service ps \
            --filter desired-state=running \
            --format '{{.Name}} {{.Image}} {{.CurrentState}}' \
            mnemos_telegram-bot-service

          cp "$final_state" "$PLAN_DIR/final-state.json"

      - name: Upload rollout audit artifact
        if: always() && env.PLAN_DIR != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-telegram-button-colors-${{ github.run_id }}
          path: ${{ env.PLAN_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove production registry credentials
        if: always()
        shell: bash
        run: |
          set +e
          sudo -n rm -rf /run/mnemos-production-docker-auth
