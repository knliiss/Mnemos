name: Production Telegram Button Colors Rollout

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/production-telegram-button-colors-rollout.yml

concurrency:
  group: mnemos-production-telegram-button-colors
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  execute:
    if: >-
      startsWith(github.event.head_commit.message, 'chore: execute published Telegram button color rollout')
    environment: production
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      packages: read

    env:
      SOURCE_SHA: 5e871fc9c6aa63304787cb7ea3dfaeee3ac8bf74
      PREVIOUS_SOURCE_SHA: 4d1b00601f4c32cd104f82ea437d2df88545a03d
      PINNED_TOOLING_REVISION: 57f33951f03842d00d353127b207550d53ed7fdd
      SERVICE: telegram-bot-service
      PUBLISH_RUN_ID: "33672850121"
      PUBLISH_RUN_HEAD_SHA: 58f6ca219bd712e407367e763c7372852345ad41

    steps:
      - name: Checkout authorized execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable image publication evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          run_file="$RUNNER_TEMP/mnemos-telegram-publish-run.json"
          jobs_file="$RUNNER_TEMP/mnemos-telegram-publish-jobs.json"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}" \
            > "$run_file"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${PUBLISH_RUN_ID}/jobs?per_page=100" \
            > "$jobs_file"

          python3 - \
            "$run_file" \
            "$jobs_file" \
            "$PUBLISH_RUN_HEAD_SHA" <<'PY'
          import json
          import sys

          run_path, jobs_path, expected_head_sha = sys.argv[1:]

          with open(run_path, encoding="utf-8") as handle:
              run = json.load(handle)

          with open(jobs_path, encoding="utf-8") as handle:
              jobs = json.load(handle)

          if run.get("name") != "Production Telegram Button Colors Rollout":
              raise SystemExit("Published image evidence came from an unexpected workflow")

          if run.get("path") != ".github/workflows/production-telegram-button-colors-rollout.yml":
              raise SystemExit("Published image evidence came from an unexpected workflow path")

          if run.get("event") != "push":
              raise SystemExit("Published image evidence did not originate from the authorized push trigger")

          if run.get("head_sha") != expected_head_sha:
              raise SystemExit("Published image evidence head SHA changed")

          publish_jobs = [job for job in jobs.get("jobs", []) if job.get("name") == "publish"]

          if len(publish_jobs) != 1 or publish_jobs[0].get("conclusion") != "success":
              raise SystemExit("Expected exactly one successful Telegram image publish job")

          print("Immutable Telegram image publication evidence verified")
          PY

      - name: Verify trusted tooling and source boundary
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Execution checkout mismatch" >&2
            exit 1
          fi

          for revision in "$PINNED_TOOLING_REVISION" "$SOURCE_SHA"; do
            if ! git cat-file -e "${revision}^{commit}"; then
              echo "Required revision is unavailable: $revision" >&2
              exit 1
            fi

            if ! git merge-base --is-ancestor "$revision" HEAD; then
              echo "Required revision is outside trusted master history: $revision" >&2
              exit 1
            fi
          done

          if ! git diff --quiet \
            "$PINNED_TOOLING_REVISION" \
            HEAD \
            -- scripts infrastructure/production; then
            echo "Production tooling differs from the pinned verified revision" >&2
            git diff --name-only \
              "$PINNED_TOOLING_REVISION" \
              HEAD \
              -- scripts infrastructure/production >&2
            exit 1
          fi

          python3 -m py_compile \
            scripts/production_hotfix_plan.py \
            scripts/production_deployment_executor.py \
            scripts/production_runtime_state.py \
            scripts/production_deployment_state.py \
            scripts/production_audit_bundle.py

          python3 scripts/verify-production-stack-renderer.py
          python3 scripts/verify-production-runtime-policy.py
          sudo -n sh scripts/verify-production-deployment-executor-security.sh

      - name: Verify exact production baseline
        shell: bash
        run: |
          set -euo pipefail

          sudo -n sh scripts/validate-production-env.sh
          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh
          sudo -n sh scripts/verify-production-telegram-poller.sh

          if ! sudo -n test -f /var/lib/mnemos-deploy/current-state.json; then
            echo "Recorded production deployment state is missing" >&2
            exit 1
          fi

          sudo -n python3 scripts/production_runtime_state.py \
            verify \
            --state /var/lib/mnemos-deploy/current-state.json

          state_file="$RUNNER_TEMP/mnemos-current-production-state.json"
          sudo -n install \
            --owner="$(id -u)" \
            --group="$(id -g)" \
            --mode=0600 \
            /var/lib/mnemos-deploy/current-state.json \
            "$state_file"

          python3 scripts/production_deployment_state.py \
            state-validate \
            --input "$state_file"

          CURRENT_STATE_FILE="$state_file" \
          PREVIOUS_SOURCE_SHA="$PREVIOUS_SOURCE_SHA" \
          PINNED_TOOLING_REVISION="$PINNED_TOOLING_REVISION" \
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["CURRENT_STATE_FILE"], encoding="utf-8") as handle:
              state = json.load(handle)

          if state["tooling_revision"] != os.environ["PINNED_TOOLING_REVISION"]:
              raise SystemExit("Production tooling revision does not match the verified baseline")

          services = state["release_manifest"]["services"]
          expected = os.environ["PREVIOUS_SOURCE_SHA"]

          for name, entry in services.items():
              if entry.get("kind") != "application":
                  continue

              if entry.get("source_sha") != expected:
                  raise SystemExit(
                      f"Unexpected application source before scoped rollout: "
                      f"{name}={entry.get('source_sha')} expected={expected}"
                  )

          print("Exact pre-rollout application state verified")
          PY

          echo "CURRENT_STATE_FILE=$state_file" >> "$GITHUB_ENV"

      - name: Create and verify audited one-service transition
        shell: bash
        run: |
          set -euo pipefail

          plan_dir="$RUNNER_TEMP/mnemos-telegram-button-colors-plan"
          rm -rf "$plan_dir"
          install --directory --mode=0700 "$plan_dir"

          python3 scripts/production_hotfix_plan.py \
            --current-state "$CURRENT_STATE_FILE" \
            --service "$SERVICE" \
            --source-sha "$SOURCE_SHA" \
            --actor "$GITHUB_ACTOR" \
            --reason "Explicit user authorization: deploy Telegram button color hierarchy" \
            --output-dir "$plan_dir"

          cp "$CURRENT_STATE_FILE" "$plan_dir/current-state.json"

          python3 scripts/production_audit_bundle.py \
            create \
            --directory "$plan_dir" \
            --kind hotfix-plan

          python3 scripts/production_audit_bundle.py \
            verify \
            --directory "$plan_dir" \
            --kind hotfix-plan

          PLAN_DIR="$plan_dir" SOURCE_SHA="$SOURCE_SHA" SERVICE="$SERVICE" python3 - <<'PY'
          import json
          import os
          import re

          plan_dir = os.environ["PLAN_DIR"]
          expected_service = os.environ["SERVICE"]
          expected_source = os.environ["SOURCE_SHA"]

          with open(f"{plan_dir}/deployment-plan.json", encoding="utf-8") as handle:
              deployment_plan = json.load(handle)

          with open(f"{plan_dir}/transition.json", encoding="utf-8") as handle:
              transition = json.load(handle)

          actions = deployment_plan.get("actions")

          if deployment_plan.get("mode") != "scoped" or not isinstance(actions, list):
              raise SystemExit("Production rollout plan is not scoped")

          if deployment_plan.get("action_count") != 1 or len(actions) != 1:
              raise SystemExit("Production rollout must contain exactly one scoped action")

          action = actions[0]

          if action.get("service") != expected_service:
              raise SystemExit("Scoped action targets an unexpected service")

          if action.get("to", {}).get("source_sha") != expected_source:
              raise SystemExit("Scoped action targets an unexpected source SHA")

          transition_id = transition.get("transition_id", "")

          if not re.fullmatch(r"sha256:[0-9a-f]{64}", transition_id):
              raise SystemExit("Generated production transition ID is invalid")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"EXPECTED_TRANSITION_ID={transition_id}\n")

          print(f"Verified Telegram-only transition: {transition_id}")
          PY

          echo "PLAN_DIR=$plan_dir" >> "$GITHUB_ENV"

      - name: Render exact production dry run
        shell: bash
        run: |
          set -euo pipefail

          dry_run="$RUNNER_TEMP/mnemos-telegram-button-colors-dry-run.json"

          sudo -n python3 scripts/production_deployment_executor.py \
            --transition "$PLAN_DIR/transition.json" \
            --target-state "$PLAN_DIR/target-state.json" \
            --expected-transition-id "$EXPECTED_TRANSITION_ID" \
            > "$dry_run"

          python3 - "$dry_run" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              dry_run = json.load(handle)

          actions = dry_run.get("actions")

          if dry_run.get("action_count") != 1 or not isinstance(actions, list) or len(actions) != 1:
              raise SystemExit("Dry run must contain exactly one action")

          if actions[0].get("service") != "telegram-bot-service":
              raise SystemExit("Dry run is not Telegram-only")

          print("Exact Telegram-only production dry run verified")
          PY

      - name: Prepare isolated production registry credentials
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-production-docker-auth
          sudo -n install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0700 \
            /run/mnemos-production-docker-auth

      - name: Authenticate production Docker and verify published image
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-production-docker-auth \
              docker login ghcr.io \
                --username "$GITHUB_ACTOR" \
                --password-stdin

          image="ghcr.io/${{ github.repository_owner }}/mnemos-telegram-bot-service:$SOURCE_SHA"

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-production-docker-auth \
            docker manifest inspect "$image" >/dev/null

          echo "Verified published production image: $image"

      - name: Execute explicitly authorized scoped rollout
        shell: bash
        run: |
          set -euo pipefail

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-production-docker-auth \
            MNEMOS_PRODUCTION_DEPLOY_ENABLED=true \
            MNEMOS_PRODUCTION_SCOPED_DEPLOY_ENABLED=true \
            python3 scripts/production_deployment_executor.py \
              --transition "$PLAN_DIR/transition.json" \
              --target-state "$PLAN_DIR/target-state.json" \
              --expected-transition-id "$EXPECTED_TRANSITION_ID" \
              --execute

      - name: Verify deployed production state
        shell: bash
        run: |
          set -euo pipefail

          sudo -n python3 scripts/production_runtime_state.py \
            verify \
            --state /var/lib/mnemos-deploy/current-state.json

          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh
          sudo -n sh scripts/verify-production-telegram-poller.sh

          final_state="$RUNNER_TEMP/mnemos-final-production-state.json"
          sudo -n install \
            --owner="$(id -u)" \
            --group="$(id -g)" \
            --mode=0600 \
            /var/lib/mnemos-deploy/current-state.json \
            "$final_state"

          python3 scripts/production_deployment_state.py \
            state-validate \
            --input "$final_state"

          FINAL_STATE="$final_state" \
          SOURCE_SHA="$SOURCE_SHA" \
          PREVIOUS_SOURCE_SHA="$PREVIOUS_SOURCE_SHA" \
          PINNED_TOOLING_REVISION="$PINNED_TOOLING_REVISION" \
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["FINAL_STATE"], encoding="utf-8") as handle:
              state = json.load(handle)

          if state["tooling_revision"] != os.environ["PINNED_TOOLING_REVISION"]:
              raise SystemExit("Tooling revision changed during scoped rollout")

          services = state["release_manifest"]["services"]

          for name, entry in services.items():
              if entry.get("kind") != "application":
                  continue

              expected = (
                  os.environ["SOURCE_SHA"]
                  if name == "telegram-bot-service"
                  else os.environ["PREVIOUS_SOURCE_SHA"]
              )

              if entry.get("source_sha") != expected:
                  raise SystemExit(
                      f"Unexpected final application source: "
                      f"{name}={entry.get('source_sha')} expected={expected}"
                  )

          print("Scoped Telegram production state verified")
          PY

          sudo -n docker service ls \
            --filter name=mnemos_telegram-bot-service \
            --format '{{.Name}} {{.Replicas}} {{.Image}}'

          sudo -n docker service ps \
            --filter desired-state=running \
            --format '{{.Name}} {{.Image}} {{.CurrentState}}' \
            mnemos_telegram-bot-service

      - name: Collect rollout audit record
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          audit_dir="$RUNNER_TEMP/mnemos-telegram-button-colors-audit"
          rm -rf "$audit_dir"
          install --directory --mode=0700 "$audit_dir"

          if [ -n "${PLAN_DIR:-}" ] && [ -d "$PLAN_DIR" ]; then
            cp -R "$PLAN_DIR" "$audit_dir/hotfix-plan"
          fi

          if sudo -n test -f /var/lib/mnemos-deploy/current-state.json; then
            sudo -n cp /var/lib/mnemos-deploy/current-state.json "$audit_dir/current-state.json"
          fi

          if [ -n "${EXPECTED_TRANSITION_ID:-}" ]; then
            transition_digest="${EXPECTED_TRANSITION_ID#sha256:}"

            if sudo -n test -d "/var/lib/mnemos-deploy/transitions/$transition_digest"; then
              sudo -n cp -R \
                "/var/lib/mnemos-deploy/transitions/$transition_digest" \
                "$audit_dir/execution-attempts"
            fi
          fi

          sudo -n chown -R "$(id -u):$(id -g)" "$audit_dir"
          echo "ROLLOUT_AUDIT_DIR=$audit_dir" >> "$GITHUB_ENV"

      - name: Upload rollout audit artifact
        if: always() && env.ROLLOUT_AUDIT_DIR != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-telegram-button-colors-${{ github.run_id }}
          path: ${{ env.ROLLOUT_AUDIT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove production registry credentials
        if: always()
        shell: bash
        run: |
          set +e
          sudo -n rm -rf /run/mnemos-production-docker-auth
