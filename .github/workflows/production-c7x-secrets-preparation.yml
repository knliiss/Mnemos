name: Production C7x Secrets Preparation

on:
  workflow_run:
    workflows:
      - Production C7x Secrets Request
    types:
      - completed

concurrency:
  group: mnemos-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  provision:
    if: >-
      github.repository == 'knliiss/Mnemos' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'deploy/production-c7x-secrets' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: production
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 10
    steps:
      - name: Repair production runner checkout directory ownership
        shell: bash
        run: |
          set -euo pipefail
          sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Check out trusted master coordinator commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authenticated request and immutable trusted coordinator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUEST_SHA: ${{ github.event.workflow_run.head_sha }}
          COORDINATOR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$COORDINATOR_SHA" ]
          git merge-base --is-ancestor "$COORDINATOR_SHA" origin/master
          git merge-base --is-ancestor "$REQUEST_SHA" origin/master
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          sha = os.environ["REQUEST_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Invalid immutable request source SHA")
          request_id = os.environ["REQUEST_RUN_ID"]
          if not re.fullmatch(r"[1-9][0-9]*", request_id):
              raise SystemExit("Invalid GitHub Actions request ID")
          repo = os.environ["REPOSITORY"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{request_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              job = json.load(response)
          checks = {
              "name": "Production C7x Secrets Request",
              "path": ".github/workflows/production-c7x-secrets-request.yml",
              "event": "push",
              "head_branch": "deploy/production-c7x-secrets",
              "head_sha": sha,
              "conclusion": "success",
          }
          for key, expected in checks.items():
              if job.get(key) != expected:
                  raise SystemExit("Untrusted production request provenance: " + key)
          if (job.get("head_repository") or {}).get("full_name") != repo:
              raise SystemExit("Untrusted GitHub request repository")
          print("Immutable trusted production credential request verified.")
          PY

      - name: Prepare and validate C7x secrets without disclosing values
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env PYTHONDONTWRITEBYTECODE=1 \
            python3 scripts/prepare-production-bot-management-secrets.py

      - name: Write non-sensitive audit summary
        shell: bash
        run: |
          {
            echo "## Mnemos C7x credentials preparation"
            echo
            echo "Trusted, root-owned production env was validated and updated if needed."
            echo "No secret values were printed, downloaded or uploaded."
            echo "No application service or Docker stack was restarted."
          } >> "$GITHUB_STEP_SUMMARY"
