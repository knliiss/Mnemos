name: Temporary Runtime State Temp Verify

on:
  push:
    branches:
      - fix/production-runtime-state-temp-permissions

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Make wiring and production runtime policy
        run: |
          make make-verify
          python3 scripts/verify-production-runtime-policy.py
