name: Cleanup Legacy Frontend Naming

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - ".github/workflows/cleanup-legacy-frontend.yml"

permissions:
  contents: write

concurrency:
  group: cleanup-legacy-frontend
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mini-app
        run: npm ci

      - name: Rename legacy frontend classes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          source_root = Path("apps/mini-app/src")
          replacements = {
              "account-settings-hero-v2__copy": "account-settings-hero__copy",
              "account-settings-hero-v2__stats": "account-settings-hero__stats",
              "account-transfer-summary-v2__avatar": "account-transfer-summary__avatar",
              "account-member-v4": "account-member",
              "store-category-v5": "personalization-store-category",
              "account-personalization-category-v5": "account-personalization-category",
              "account-personalization-v5": "account-personalization",
              "personalization-detail-v5": "personalization-detail",
              "creator-r2": "creator",
              "profile-r2": "profile",
              "events-r2": "events",
              "bets-r2": "bets",
              "event-r4": "event-detail",
          }

          changed_files = []
          replacement_counts = {source: 0 for source in replacements}

          for path in sorted(source_root.rglob("*")):
              if not path.is_file() or path.suffix not in {".ts", ".tsx", ".css"}:
                  continue

              content = path.read_text(encoding="utf-8")
              updated = content

              for source, target in replacements.items():
                  count = updated.count(source)

                  if count:
                      replacement_counts[source] += count
                      updated = updated.replace(source, target)

              if updated != content:
                  path.write_text(updated, encoding="utf-8")
                  changed_files.append(path.as_posix())

          print("Changed files:")
          for path in changed_files:
              print(f"  {path}")

          print("Replacement counts:")
          for source, count in replacement_counts.items():
              print(f"  {source}: {count}")
          PY

      - name: Remove markdown files from mini app
        shell: bash
        run: find apps/mini-app -type f -name '*.md' -delete

      - name: Format frontend
        working-directory: apps/mini-app
        run: npm run format

      - name: Ensure targeted legacy names are gone
        shell: bash
        run: |
          set -euo pipefail

          if grep -R -n -E \
            'account-settings-hero-v2|account-transfer-summary-v2|account-member-v4|store-category-v5|account-personalization(-category)?-v5|personalization-detail-v5|creator-r2|profile-r2|events-r2|bets-r2|event-r4' \
            apps/mini-app/src --include='*.ts' --include='*.tsx' --include='*.css'; then
            echo "Targeted legacy frontend names remain"
            exit 1
          fi

      - name: Verify frontend
        working-directory: apps/mini-app
        run: npm run verify

      - name: Verify diff whitespace
        run: git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin feat/frontend-integration

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feat/frontend-integration)" ]; then
            echo "Branch changed during cleanup; refusing to overwrite newer work"
            exit 1
          fi

          rm .github/workflows/cleanup-legacy-frontend.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- apps/mini-app .github/workflows/cleanup-legacy-frontend.yml

          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi

          git commit -m "clean legacy frontend naming"
          git push origin HEAD:feat/frontend-integration
