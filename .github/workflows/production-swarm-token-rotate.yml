name: Production Swarm Token Rotate

on:
  push:
    branches:
      - feat/production-deployment
    paths:
      - .github/workflows/production-swarm-token-rotate.yml

permissions: {}

jobs:
  rotate:
    runs-on:
      - self-hosted
      - mnemos-production

    timeout-minutes: 5

    steps:
      - name: Rotate leaked Swarm join tokens
        shell: bash
        run: |
          set -euo pipefail

          test "$(sudo -n docker info --format '{{.Swarm.LocalNodeState}}')" = 'active'

          sudo -n docker swarm join-token --rotate -q worker >/dev/null
          sudo -n docker swarm join-token --rotate -q manager >/dev/null

          echo 'Docker Swarm worker and manager join tokens rotated.'
