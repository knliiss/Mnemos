name: C7x Initial Rollout Safety Verify

on:
  pull_request:
    paths:
      - "scripts/rollout-initial-c7x-production.py"
      - ".github/workflows/c7x-initial-backend-*.yml"
      - ".github/workflows/c7x-initial-rollout-safety.yml"
  push:
    branches:
      - ops/c7x-initial-backend-rollout
    paths:
      - "scripts/rollout-initial-c7x-production.py"
      - ".github/workflows/c7x-initial-backend-*.yml"
      - ".github/workflows/c7x-initial-rollout-safety.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, mnemos-frontend]
    timeout-minutes: 5
    steps:
      - name: Checkout unprivileged validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Python/YAML syntax and production policy invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/rollout-initial-c7x-production.py
          python3 scripts/verify-production-service-catalog.py
          python3 scripts/verify-production-release-manifest.py
          python3 scripts/verify-production-deployment-state.py
          python3 - <<'PY'
          from pathlib import Path
          request = Path(".github/workflows/c7x-initial-backend-request.yml").read_text()
          rollout = Path(".github/workflows/c7x-initial-backend-rollout.yml").read_text()
          assert "  push:" in request
          assert "  workflow_run:" in rollout
          assert "environment: production" in rollout
          assert "group: mnemos-production-deploy" in rollout
          assert "cancel-in-progress: false" in rollout
          assert "persist-credentials: false" in rollout
          assert "if: needs.publish.result == 'success'" in rollout
          assert "C7x Initial Backend Rollout Request" in rollout
          print("C7x production workflow safety invariants validated")
          PY
