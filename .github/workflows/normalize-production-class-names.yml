name: Normalize Production Class Names

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - ".github/workflows/normalize-production-class-names.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration
          fetch-depth: 0

      - name: Normalize legacy revision class names
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("apps/mini-app/src")
          source_extensions = {".ts", ".tsx", ".css"}
          css_class = re.compile(r"\.([A-Za-z_][A-Za-z0-9_-]*)")
          legacy_marker = re.compile(
              r"(?:-round-(?:one|two|three|four|five|six|seven|eight|nine|ten|\d+)|-(?:v|r)\d+|-(?:final|polished|overhaul|rethink))"
          )
          normalizers = [
              re.compile(r"-round-(?:one|two|three|four|five|six|seven|eight|nine|ten|\d+)(?=(?:__|--|-|$))"),
              re.compile(r"-(?:v|r)\d+(?=(?:__|--|-|$))"),
              re.compile(r"-(?:final|polished|overhaul|rethink)(?=(?:__|--|-|$))"),
          ]

          css_files = sorted(root.rglob("*.css"))
          all_classes = set()

          for path in css_files:
              all_classes.update(css_class.findall(path.read_text(encoding="utf-8")))

          legacy_classes = sorted(name for name in all_classes if legacy_marker.search(name))
          mapping = {}

          for old_name in legacy_classes:
              new_name = old_name

              for pattern in normalizers:
                  new_name = pattern.sub("", new_name)

              if new_name == old_name:
                  continue

              mapping[old_name] = new_name

          reverse = {}
          collisions = []

          for old_name, new_name in mapping.items():
              previous = reverse.get(new_name)

              if previous and previous != old_name:
                  collisions.append(f"{previous} and {old_name} -> {new_name}")

              if new_name in all_classes and new_name not in mapping:
                  collisions.append(f"{old_name} -> existing class {new_name}")

              reverse[new_name] = old_name

          if collisions:
              print("Unsafe class-name collisions detected:")
              print("\n".join(collisions))
              raise SystemExit(1)

          print(f"Legacy CSS classes found: {len(mapping)}")

          for old_name, new_name in mapping.items():
              print(f"{old_name} -> {new_name}")

          changed_files = []

          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.suffix not in source_extensions:
                  continue

              original = path.read_text(encoding="utf-8")
              updated = original

              for old_name, new_name in mapping.items():
                  token = re.compile(
                      rf"(?<![A-Za-z0-9_-]){re.escape(old_name)}(?![A-Za-z0-9_-])"
                  )
                  updated = token.sub(new_name, updated)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed_files.append(path.as_posix())

          remaining = []

          for path in css_files:
              for name in css_class.findall(path.read_text(encoding="utf-8")):
                  if legacy_marker.search(name):
                      remaining.append(f"{path}: {name}")

          if remaining:
              print("Legacy revision classes remain after normalization:")
              print("\n".join(remaining[:100]))
              raise SystemExit(1)

          print(f"Changed files: {len(changed_files)}")
          for path in changed_files:
              print(path)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mini-app/.node-version
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mini-app
        run: npm ci

      - name: Format
        working-directory: apps/mini-app
        run: npm run format

      - name: Lint
        working-directory: apps/mini-app
        run: npm run lint

      - name: Test
        working-directory: apps/mini-app
        run: npm test

      - name: Build
        working-directory: apps/mini-app
        run: npm run build

      - name: Ensure branch did not move
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin feat/frontend-integration

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/feat/frontend-integration)" ]; then
            echo "feat/frontend-integration changed while normalization was running. Refusing to overwrite concurrent work."
            exit 1
          fi

      - name: Commit verified normalization
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/normalize-production-class-names.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mini-app/src .github/workflows/normalize-production-class-names.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "normalize production class naming"
          git push origin HEAD:feat/frontend-integration
