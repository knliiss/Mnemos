name: Temporary Production Ingress Probe

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 5

    steps:
      - name: Checkout current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: e83985a9c5f1856aa9e2a7648f286f2dbe2bfa52
          fetch-depth: 1
          persist-credentials: false

      - name: Probe external production ingress
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            url="$1"
            name="$2"

            echo "===== $name: $url ====="
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 5 \
              --max-time 15 \
              --output /tmp/mnemos-probe-body \
              --write-out 'http=%{http_code} remote_ip=%{remote_ip} time=%{time_total}\n' \
              "$url" || true

            head -c 500 /tmp/mnemos-probe-body 2>/dev/null || true
            echo
          }

          probe "https://app.knalis.rest" "APP"
          probe "https://api.knalis.rest" "API"
          probe "https://auth.knalis.rest/realms/mnemos/.well-known/openid-configuration" "AUTH"

          echo "===== CLOUDFLARED ====="
          sudo -n docker service ps \
            --no-trunc \
            --format '{{.Name}}|{{.CurrentState}}|{{.Error}}|{{.Image}}' \
            mnemos_cloudflared

          echo "===== CLOUDFLARED RECENT LOGS ====="
          sudo -n docker service logs \
            --since 10m \
            --tail 100 \
            mnemos_cloudflared 2>&1 |
            sed -E \
              -e 's/[0-9a-f]{64}/<redacted-hex64>/g' \
              -e 's/(token|secret|password)([=:][^[:space:]]*)/\1=<redacted>/Ig' || true

          echo "===== INTERNAL GATEWAY ====="
          gateway_task="$(
            sudo -n docker ps \
              --filter label=com.docker.swarm.service.name=mnemos_gateway-service \
              --format '{{.ID}}' |
              head -n 1
          )"

          if [ -n "$gateway_task" ]; then
            sudo -n docker exec "$gateway_task" \
              wget -q -O - http://127.0.0.1:8080/actuator/health/readiness || true
            echo
          fi
