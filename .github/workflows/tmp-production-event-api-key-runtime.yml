name: Temporary SAO Localization Diagnostics

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Inspect canonical SAO jewelry localization
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            https://webdata.c7x.dev/client/lang.json \
            --output "$RUNNER_TEMP/lang.json"

          python3 - <<'PY' "$RUNNER_TEMP/lang.json"
          import json
          import sys

          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))

          print("top_level_type=" + type(data).__name__)
          if isinstance(data, dict):
              print("top_level_keys=" + ",".join(list(data)[:20]))

          targets = {
              "sao.item.d1_284.name",
              "sao.item.d1_324.name",
              "sao.item.d1_404.name",
              "sao.item.d1_444.name",
              "sao.item.d1_484.name",
              "sao.item.d1_503.name",
              "sao.item.d1_504.name",
              "sao.item.d2_44.name",
              "sao.item.d2_84.name",
              "sao.item.d2_124.name",
              "sao.item.d2_504.name",
              "sao.item.d3_44.name",
              "sao.item.d4_44.name",
          }

          def walk(value, trail=()):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in targets:
                          print("match=" + "/".join(trail + (key,)) + " => " + repr(child))
                      walk(child, trail + (str(key),))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, trail + (str(index),))

          walk(data)
          PY
