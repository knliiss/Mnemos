name: Temporary SAO Localization Diagnostics

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Resolve SAO jewelry localization values
        shell: bash
        run: |
          set -euo pipefail

          index="$RUNNER_TEMP/lang.json"
          curl --fail --silent --show-error --location \
            https://webdata.c7x.dev/client/lang.json \
            --output "$index"

          INDEX="$index" OUT="$RUNNER_TEMP" python3 - <<'PY'
          import json
          import os
          import subprocess

          index = json.load(open(os.environ["INDEX"], encoding="utf-8"))
          russian = next(entry for entry in index["langs"] if entry.get("lang") == "ru_RU")

          for position, pie in enumerate(russian.get("pies", [])):
              path = os.path.join(os.environ["OUT"], f"pie-{position}.json")
              subprocess.run(
                  ["curl", "--fail", "--silent", "--show-error", "--location", pie["url"], "--output", path],
                  check=True,
              )
              print(f"downloaded_pie={pie.get('pieKey')} path={path}")
          PY

          python3 - <<'PY' "$RUNNER_TEMP"
          import glob
          import json
          import os
          import re
          import sys

          directory = sys.argv[1]
          selected = {
              "sao.item.d1_284.name",
              "sao.item.d1_324.name",
              "sao.item.d1_404.name",
              "sao.item.d1_444.name",
              "sao.item.d1_484.name",
              "sao.item.d1_503.name",
              "sao.item.d1_504.name",
              "sao.item.d2_44.name",
              "sao.item.d2_84.name",
              "sao.item.d2_124.name",
              "sao.item.d2_504.name",
              "sao.item.d3_44.name",
              "sao.item.d4_44.name",
          }
          jewelry_pattern = re.compile(r"^sao\.item\.d[1-4]_\d+\.name$")

          found = {}

          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in selected or jewelry_pattern.match(str(key)):
                          found[str(key)] = child
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          for path in sorted(glob.glob(os.path.join(directory, "pie-*.json"))):
              try:
                  payload = json.load(open(path, encoding="utf-8"))
              except Exception as error:
                  print(f"parse_error={os.path.basename(path)}:{error}")
                  continue
              walk(payload)

          print(f"jewelry_key_count={len(found)}")
          for key in sorted(found):
              if key in selected:
                  print(f"selected={key} => {found[key]!r}")
          for key in sorted(found):
              print(f"jewelry={key} => {found[key]!r}")
          PY
