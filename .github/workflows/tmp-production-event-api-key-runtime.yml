name: Temporary Prioritize Emergency Event Deploy

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

permissions:
  actions: write
  contents: read

jobs:
  cancel-superseded-notification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Cancel notification deploy before production mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "33952675060"
        run: |
          set -euo pipefail

          response_file="$RUNNER_TEMP/cancel-response.json"
          status="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/cancel"
          )"

          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            cat "$response_file" >&2
            exit 1
          fi

          echo "Notification deploy cancellation request accepted or run already terminal."
