name: Temporary Production Outage Check

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 5

    steps:
      - name: Checkout current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: e83985a9c5f1856aa9e2a7648f286f2dbe2bfa52
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect production services
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SERVICE REPLICAS ====="
          sudo -n docker service ls \
            --format '{{.Name}}|{{.Replicas}}|{{.Image}}' |
            sort

          echo "===== NON-RUNNING APP TASKS ====="
          sudo -n docker service ls --format '{{.Name}}' |
            awk '/^mnemos_/' |
            while read -r service; do
              sudo -n docker service ps \
                --no-trunc \
                --filter desired-state=running \
                --format '{{.Name}}|{{.CurrentState}}|{{.Error}}|{{.Image}}' \
                "$service" |
                awk -F'|' '$2 !~ /^Running / { print }'
            done

          echo "===== AVAILABILITY ====="
          sudo -n sh scripts/verify-production-availability.sh

          echo "===== HEALTH ====="
          sudo -n sh scripts/check-production-health.sh

          echo "===== TELEGRAM POLLER ====="
          sudo -n sh scripts/verify-production-telegram-poller.sh
