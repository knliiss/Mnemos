name: Temporary SAO Atlas Recovery

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout atlas source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4dfd8fb8ef7b4e63662c381f4476d22811df1e59
          persist-credentials: false

      - name: Try independent WebP decoders
        shell: bash
        run: |
          set -euo pipefail

          atlas="apps/mini-app/public/event-icons/sao-tracked-items.webp"
          output="$RUNNER_TEMP/sao-tracked-items.png"

          file "$atlas"
          ffprobe -hide_banner "$atlas" || true

          if ffmpeg -v error -y -i "$atlas" "$output"; then
            echo "ffmpeg_decode=success"
            file "$output"
            python3 - <<'PY' "$output"
          import sys
          from PIL import Image

          path = sys.argv[1]
          image = Image.open(path).convert("RGBA")
          print(f"decoded_size={image.width}x{image.height}")
          visible = sum(1 for pixel in image.getdata() if pixel[3] != 0)
          print(f"visible_pixels={visible}")
          if image.size != (256, 176) or visible == 0:
              raise SystemExit("Recovered atlas is invalid")
          PY
            exit 0
          fi

          echo "ffmpeg_decode=failed"
          exit 1
