name: Temporary Emergency Event Service Check

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout emergency fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 76a5dfed11c327eba322834f4e4bc21881933081
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify event service
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :apps:event-service:check \
            :apps:event-service:bootJar \
            --no-daemon
