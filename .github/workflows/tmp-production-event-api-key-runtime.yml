name: Temporary SAO Artwork Diagnostics

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a8235ff2f338e50195546bf27e9578d6a7d12aaa
          persist-credentials: false

      - name: Inspect tracked item atlas and deployed asset
        shell: bash
        run: |
          set -euo pipefail

          atlas="apps/mini-app/public/event-icons/sao-tracked-items.webp"
          prod="$RUNNER_TEMP/prod-sao-tracked-items.webp"

          file "$atlas"
          identify "$atlas"

          echo "repo_sha256=$(sha256sum "$atlas" | awk '{print $1}')"

          curl --fail --silent --show-error --location \
            https://app.knalis.rest/event-icons/sao-tracked-items.webp \
            --output "$prod"

          file "$prod"
          identify "$prod"
          echo "prod_sha256=$(sha256sum "$prod" | awk '{print $1}')"

          if ! cmp --silent "$atlas" "$prod"; then
            echo "Production atlas differs from repository atlas" >&2
            exit 1
          fi

          mean_alpha="$(convert "$atlas" -alpha extract -format '%[fx:mean]' info:)"
          echo "atlas_mean_alpha=$mean_alpha"

          empty=0
          nonempty=0

          for index in $(seq 0 164); do
            column=$((index % 16))
            row=$((index / 16))
            x=$((column * 16))
            y=$((row * 16))

            alpha="$(
              convert "$atlas" \
                -crop "16x16+$x+$y" \
                +repage \
                -alpha extract \
                -format '%[fx:mean]' \
                info:
            )"

            if awk -v alpha="$alpha" 'BEGIN { exit !(alpha < 0.001) }'; then
              echo "empty_cell=$index"
              empty=$((empty + 1))
            else
              nonempty=$((nonempty + 1))
            fi
          done

          echo "nonempty_cells=$nonempty"
          echo "empty_cells=$empty"

          test "$nonempty" -gt 0
