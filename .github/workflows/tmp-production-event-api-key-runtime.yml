name: Temporary Production Event Service Diagnostics

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

concurrency:
  group: mnemos-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 5

    steps:
      - name: Checkout trusted master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 37cd08e9d1a1c64d866a214cb0405a16fe1816da
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact trusted revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "37cd08e9d1a1c64d866a214cb0405a16fe1816da"

      - name: Inspect failed event-service task
        shell: bash
        run: |
          set -euo pipefail

          service="mnemos_event-service"
          target_image="ghcr.io/knliiss/mnemos-event-service:37cd08e9d1a1c64d866a214cb0405a16fe1816da"

          task_id="$(
            sudo -n docker service ps \
              --no-trunc \
              --format '{{.ID}}|{{.Image}}|{{.CurrentState}}' \
              "$service" |
              awk -F'|' -v image="$target_image" '$2 == image && $3 ~ /^Failed / { print $1; exit }'
          )"

          if [ -z "$task_id" ]; then
            echo "No failed task found for target image" >&2
            sudo -n docker service ps \
              --no-trunc \
              --format '{{.ID}} {{.Image}} {{.CurrentState}} {{.Error}}' \
              "$service"
            exit 1
          fi

          container_id="$(
            sudo -n docker inspect \
              --format '{{.Status.ContainerStatus.ContainerID}}' \
              "$task_id"
          )"

          if [ -z "$container_id" ]; then
            echo "Failed task has no container id" >&2
            sudo -n docker inspect \
              --format 'task={{.ID}} state={{.Status.State}} message={{.Status.Message}} error={{.Status.Err}}' \
              "$task_id"
            exit 1
          fi

          echo "Failed task: $task_id"
          sudo -n docker inspect \
            --format 'state={{.Status.State}} message={{.Status.Message}} error={{.Status.Err}}' \
            "$task_id"

          echo "===== EVENT SERVICE STARTUP LOG ====="
          sudo -n docker logs \
            --tail 250 \
            "$container_id" 2>&1 |
            sed -E \
              -e 's/(password|secret|token|api[-_]?key)([=:][^[:space:]]*)/\1=<redacted>/Ig' \
              -e 's/[0-9a-f]{64}/<redacted-hex64>/g'

          echo "===== CURRENT PRODUCTION HEALTH ====="
          sudo -n sh scripts/verify-production-availability.sh
          sudo -n sh scripts/check-production-health.sh
