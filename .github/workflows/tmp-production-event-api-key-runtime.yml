name: Temporary Production Atlas Verification

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout production source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false

      - name: Verify live SAO tracked item atlas
        shell: bash
        run: |
          set -euo pipefail

          expected="apps/mini-app/public/event-icons/sao-tracked-items.webp"
          live="$RUNNER_TEMP/sao-tracked-items.webp"

          curl --fail --silent --show-error --location \
            https://app.knalis.rest/event-icons/sao-tracked-items.webp \
            --output "$live"

          expected_size="$(wc -c < "$expected")"
          live_size="$(wc -c < "$live")"
          expected_sha="$(sha256sum "$expected" | cut -d' ' -f1)"
          live_sha="$(sha256sum "$live" | cut -d' ' -f1)"
          magic="$(od -An -tx1 -N12 "$live" | tr -d ' \n')"

          echo "expected_size=$expected_size"
          echo "live_size=$live_size"
          echo "expected_sha=$expected_sha"
          echo "live_sha=$live_sha"
          echo "magic=$magic"

          test "$expected_size" -gt 0
          test "$expected_size" = "$live_size"
          test "$expected_sha" = "$live_sha"
          test "${magic:0:8}" = "52494646"
          test "${magic:16:8}" = "57454250"
          cmp --silent "$expected" "$live"
