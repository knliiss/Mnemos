name: Temporary SAO Localization Diagnostics

on:
  push:
    branches:
      - ops/production-event-api-key-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Search SAO payload for resource-pack identities
        shell: bash
        run: |
          set -euo pipefail

          index="$RUNNER_TEMP/lang.json"
          sao="$RUNNER_TEMP/sao.json"

          curl --fail --silent --show-error --location \
            https://webdata.c7x.dev/client/lang.json \
            --output "$index"

          INDEX="$index" SAO="$sao" python3 - <<'PY'
          import json
          import os
          import subprocess

          index = json.load(open(os.environ["INDEX"], encoding="utf-8"))
          russian = next(entry for entry in index["langs"] if entry.get("lang") == "ru_RU")
          pie = next(pie for pie in russian["pies"] if pie.get("pieKey") == "sao")
          print("sao_hash=" + pie["hash"])
          subprocess.run(
              ["curl", "--fail", "--silent", "--show-error", "--location", pie["url"], "--output", os.environ["SAO"]],
              check=True,
          )
          PY

          python3 - <<'PY' "$sao"
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          needles = (
              "bracelet_a_1", "bracelet_a_2", "bracelet_b_1", "bracelet_c_1",
              "necklace_a_1", "necklace_b_1", "necklace_c_1", "necklace_d_1", "necklace_e_1",
              "ring_a_1", "ring_b_1", "ring_c_1", "ring_d_1", "ring_e_1",
              "d2_n_1", "d2_n_4", "d2_n_52",
              "d3ring1", "d3ring4", "d3ring49",
              "d4ring1", "d4ring4", "d4ring52",
          )

          matches = []

          def walk(value, trail=()):
              if isinstance(value, dict):
                  for key, child in value.items():
                      text = str(key)
                      if any(needle.lower() in text.lower() for needle in needles):
                          matches.append(("key", "/".join(trail + (text,)), repr(child)[:1200]))
                      walk(child, trail + (text,))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, trail + (str(index),))
              elif isinstance(value, str):
                  if any(needle.lower() in value.lower() for needle in needles):
                      matches.append(("value", "/".join(trail), repr(value)[:1200]))

          walk(payload)
          print("identity_matches=" + str(len(matches)))
          for kind, trail, value in matches:
              print(f"{kind}_match={trail} => {value}")
          PY
