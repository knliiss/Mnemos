name: Mini App Lock Refresh

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - "apps/mini-app/package.json"
      - ".github/workflows/mini-app-lock-refresh.yml"

concurrency:
  group: mini-app-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Refresh lockfile and security fixes
        working-directory: apps/mini-app
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Commit lockfile
        run: |
          if git diff --quiet -- apps/mini-app/package-lock.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mini-app/package-lock.json
          git commit -m "chore(mini-app): refresh dependency lockfile"
          git push origin HEAD:feat/frontend-integration
