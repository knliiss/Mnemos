name: Actions Artifact Cleanup

on:
  workflow_run:
    workflows:
      - Actions Artifact Cleanup Request
    types:
      - completed

concurrency:
  group: mnemos-actions-artifact-cleanup
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: >-
      github.repository == 'knliiss/Mnemos' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'ops/request-ci-artifact-cleanup' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, mnemos-backend]
    timeout-minutes: 10
    steps:
      - name: Check out pinned trusted master coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable trusted cleanup request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COORDINATOR_SHA: ${{ github.sha }}
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUEST_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COORDINATOR_SHA"
          git merge-base --is-ancestor "$COORDINATOR_SHA" origin/master
          git merge-base --is-ancestor "$REQUEST_SHA" origin/master
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repo = os.environ["REPOSITORY"]
          run_id = os.environ["REQUEST_RUN_ID"]
          sha = os.environ["REQUEST_SHA"]
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit("Invalid request ID")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Invalid trusted request SHA")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              run = json.load(response)
          expected = {
              "name": "Actions Artifact Cleanup Request",
              "path": ".github/workflows/actions-artifact-cleanup-request.yml",
              "event": "push",
              "head_branch": "ops/request-ci-artifact-cleanup",
              "head_sha": sha,
              "conclusion": "success",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit("Invalid artifact cleanup request: " + key)
          if (run.get("head_repository") or {}).get("full_name") != repo:
              raise SystemExit("Request is not from the trusted repository")
          print("Artifact cleanup request provenance verified.")
          PY

      - name: Delete only stale non-production Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/cleanup-old-github-artifacts.py
