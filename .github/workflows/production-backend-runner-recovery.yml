name: Production CI Queue Recovery

on:
  push:
    branches:
      - fix/production-runtime-config
    paths:
      - ".github/workflows/production-backend-runner-recovery.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel-obsolete-smoke-run:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 5

    steps:
      - name: Force cancel obsolete Stack Smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OBSOLETE_RUN_ID: "33594606634"
        run: |
          set -euo pipefail

          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${OBSOLETE_RUN_ID}"

          read_status() {
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}" | \
              python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])'
          }

          status="$(read_status)"

          if [ "$status" = "completed" ]; then
            echo "Obsolete Stack Smoke is already completed"
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api_url}/force-cancel"

          for attempt in $(seq 1 20); do
            status="$(read_status)"

            if [ "$status" = "completed" ]; then
              echo "Obsolete Stack Smoke force-cancelled"
              exit 0
            fi

            sleep 3
          done

          echo "Force-cancel request was accepted but the obsolete run is still completing" >&2
          exit 1
