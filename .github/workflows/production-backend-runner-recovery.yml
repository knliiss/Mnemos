name: Production Runtime Config Validation

on:
  push:
    branches:
      - fix/production-runtime-config
    paths:
      - ".github/workflows/production-backend-runner-recovery.yml"

permissions:
  contents: read
  packages: read

jobs:
  validate-runtime-config:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 15

    steps:
      - name: Clean privileged Python cache
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo -n find "$GITHUB_WORKSPACE" \
              -type d \
              -name __pycache__ \
              -prune \
              -exec rm -rf {} +
          fi

      - name: Checkout validation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify config-only recovery boundary
        shell: bash
        env:
          SOURCE_RELEASE: 8cf36034cb5228afbd656419bee94e5a00ac1237
        run: |
          set -euo pipefail

          git cat-file -e "${SOURCE_RELEASE}^{commit}"

          changed_paths="$RUNNER_TEMP/runtime-config-validation-paths.txt"
          git diff --name-only "$SOURCE_RELEASE" "$GITHUB_SHA" > "$changed_paths"

          if grep -Ev \
            '^(\.github/workflows/(backend-verify|production-backend-runner-recovery|production-pr79-rollout|stack-smoke)\.yml|infrastructure/production/compose\.app-overrides\.yml|make/validation\.mk|scripts/verify-production-app-overrides\.py)$' \
            "$changed_paths" | grep -q .; then
            echo "Runtime-config recovery contains unexpected paths:" >&2
            cat "$changed_paths" >&2
            exit 1
          fi

          grep -Fq 'promote-production-images:' .github/workflows/production-pr79-rollout.yml
          grep -Fq 'SOURCE_RELEASE: 8cf36034cb5228afbd656419bee94e5a00ac1237' .github/workflows/production-pr79-rollout.yml
          grep -Fq "contains(github.event.head_commit.message, 'fix/production-runtime-config')" .github/workflows/production-pr79-rollout.yml

          echo "Config-only recovery boundary verified"

      - name: Verify production runtime configuration
        shell: bash
        env:
          MNEMOS_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          MNEMOS_RELEASE_TAG: 8cf36034cb5228afbd656419bee94e5a00ac1237
          MNEMOS_SWARM_NETWORK: mnemos-production-network
          MNEMOS_KAFKA_TRUSTSTORE_CONFIG: mnemos-validation-kafka-truststore
          MNEMOS_CLOUDFLARE_TUNNEL_SECRET: mnemos-validation-cloudflare-secret
        run: |
          set -euo pipefail

          python3 -B scripts/verify-production-app-overrides.py
          sudo -n sh scripts/validate-production-env.sh

          stack_file="$RUNNER_TEMP/mnemos-runtime-config-validation.yml"
          trap 'rm -f "$stack_file"' EXIT

          sudo -n env \
            MNEMOS_IMAGE_REGISTRY="$MNEMOS_IMAGE_REGISTRY" \
            MNEMOS_RELEASE_TAG="$MNEMOS_RELEASE_TAG" \
            MNEMOS_SWARM_NETWORK="$MNEMOS_SWARM_NETWORK" \
            MNEMOS_KAFKA_TRUSTSTORE_CONFIG="$MNEMOS_KAFKA_TRUSTSTORE_CONFIG" \
            MNEMOS_CLOUDFLARE_TUNNEL_SECRET="$MNEMOS_CLOUDFLARE_TUNNEL_SECRET" \
            sh scripts/render-production-app-stack.sh "$stack_file"

          sudo -n docker stack config --compose-file "$stack_file" >/dev/null
          echo "Production runtime configuration validated"

      - name: Prepare isolated registry validation credentials
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-runtime-config-validation-docker-auth
          sudo -n install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0700 \
            /run/mnemos-runtime-config-validation-docker-auth

      - name: Authenticate source image validation to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-runtime-config-validation-docker-auth \
              docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Verify source release image manifests
        shell: bash
        env:
          SOURCE_RELEASE: 8cf36034cb5228afbd656419bee94e5a00ac1237
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail

          images="$(python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(
              Path("infrastructure/production/service-catalog.json").read_text(
                  encoding="utf-8"
              )
          )

          for specification in catalog["services"].values():
              image = specification.get("image")
              if not image:
                  raise SystemExit("Production service catalog contains a missing image")
              print(image)
          PY
          )"

          count=0

          for image in $images; do
            source_image="${IMAGE_REGISTRY}/${image}:${SOURCE_RELEASE}"

            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-runtime-config-validation-docker-auth \
              docker manifest inspect "$source_image" >/dev/null

            count=$((count + 1))
          done

          if [ "$count" -ne 22 ]; then
            echo "Expected 22 production images, validated ${count}" >&2
            exit 1
          fi

          echo "Validated ${count} source release image manifests"

      - name: Remove registry validation credentials
        if: always()
        shell: bash
        run: |
          set +e
          sudo -n rm -rf /run/mnemos-runtime-config-validation-docker-auth
