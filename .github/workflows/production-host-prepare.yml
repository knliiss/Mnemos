name: Production Host Prepare

on:
  push:
    branches:
      - feat/production-deployment
    paths:
      - .github/workflows/production-host-prepare.yml

concurrency:
  group: production-host-prepare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on:
      - self-hosted
      - mnemos-production

    timeout-minutes: 15

    steps:
      - name: Checkout preparation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare production host without deploying services
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          sudo -n sh scripts/configure-production-host.sh
          sudo -n sh scripts/install-production-runtime.sh "$RELEASE_SHA"

          if sudo -n test ! -e /etc/mnemos/mnemos.env; then
            sudo -n sh scripts/bootstrap-production-env.sh
          else
            echo 'Production environment already exists; leaving it unchanged.'
          fi

          swarm_state="$(sudo -n docker info --format '{{.Swarm.LocalNodeState}}')"

          if [ "$swarm_state" = 'inactive' ]; then
            sudo -n docker swarm init
          elif [ "$swarm_state" != 'active' ]; then
            echo "Unexpected Docker Swarm state: $swarm_state" >&2
            exit 1
          fi

      - name: Verify prepared host state
        shell: bash
        run: |
          set -euo pipefail

          sudo -n test -L /opt/mnemos/current
          sudo -n test -f /etc/mnemos/mnemos.env

          env_owner="$(sudo -n stat -c '%U:%G' /etc/mnemos/mnemos.env)"
          env_mode="$(sudo -n stat -c '%a' /etc/mnemos/mnemos.env)"

          if [ "$env_owner" != 'root:root' ] || [ "$env_mode" != '600' ]; then
            echo "Unexpected production env ownership/mode: $env_owner $env_mode" >&2
            exit 1
          fi

          sudo -n docker info --format 'swarm={{.Swarm.LocalNodeState}} logging={{.LoggingDriver}} live_restore={{.LiveRestoreEnabled}}'
          sudo -n docker node ls
          sudo -n stat -c '/etc/mnemos owner=%U:%G mode=%a' /etc/mnemos
          sudo -n stat -c '/etc/mnemos/mnemos.env owner=%U:%G mode=%a' /etc/mnemos/mnemos.env
          sudo -n readlink -f /opt/mnemos/current
          restic version
