name: Account Admin Control Plane Verify

on:
  push:
    branches:
      - feat/account-admin-control-plane
    paths:
      - ".github/workflows/account-admin-control-plane-verify.yml"
      - "apps/account-service/**"
      - "apps/realtime-service/**"
      - "apps/mini-app/**"
      - "contracts/account-contracts/**"
      - "libraries/**"
      - "build-logic/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"

concurrency:
  group: account-admin-control-plane-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify account and realtime services
        run: >-
          ./gradlew
          :apps:account-service:check
          :apps:realtime-service:check
          --no-daemon

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mini-app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: apps/mini-app/.node-version
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify browser security headers
        working-directory: .
        run: |
          set -euo pipefail
          sh -n scripts/verify-mini-app-security-headers.sh
          sh scripts/verify-mini-app-security-headers.sh

      - name: Check bundle budgets
        run: |
          set -euo pipefail

          oversized_js="$(find dist/assets -type f -name '*.js' -size +500k -print)"
          if [ -n "$oversized_js" ]; then
            echo "JavaScript chunks over 500 KiB:"
            echo "$oversized_js"
            exit 1
          fi

          oversized_css="$(find dist/assets -type f -name '*.css' -size +450k -print)"
          if [ -n "$oversized_css" ]; then
            echo "CSS chunks over 450 KiB:"
            echo "$oversized_css"
            exit 1
          fi
