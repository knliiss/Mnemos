name: Mini App Finalization

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - "scripts/finalize-mini-app.py"
      - ".github/workflows/mini-app.yml"

concurrency:
  group: mini-app-finalization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration
          fetch-depth: 0

      - name: Apply production migration
        run: python3 scripts/finalize-mini-app.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/mini-app
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: apps/mini-app
        run: npm audit --audit-level=high

      - name: Format frontend
        working-directory: apps/mini-app
        run: npm run format

      - name: Verify frontend
        working-directory: apps/mini-app
        run: npm run verify

      - name: Check bundle budgets
        working-directory: apps/mini-app
        shell: bash
        run: |
          set -euo pipefail

          oversized_js="$(find dist/assets -type f -name '*.js' -size +500k -print)"
          if [ -n "$oversized_js" ]; then
            echo "JavaScript chunks over 500 KiB:"
            echo "$oversized_js"
            exit 1
          fi

          oversized_css="$(find dist/assets -type f -name '*.css' -size +450k -print)"
          if [ -n "$oversized_css" ]; then
            echo "CSS chunks over 450 KiB:"
            echo "$oversized_css"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format social service
        run: ./gradlew :apps:social-service:ktlintFormat --no-daemon

      - name: Verify social service
        run: ./gradlew :apps:social-service:check --no-daemon

      - name: Commit verified finalization
        shell: bash
        run: |
          set -euo pipefail

          rm -rf apps/mini-app/dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "finalize production mini app"
            git push origin HEAD:feat/frontend-integration
          fi

          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish finalization status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
          else
            state="failure"
          fi

          sha="${FINAL_SHA:-${GITHUB_SHA}}"
          payload="$(jq -n \
            --arg state "$state" \
            --arg target_url "$RUN_URL" \
            --arg description "Production Mini App finalization: $JOB_STATUS" \
            --arg context "mini-app/verify" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${sha}"
