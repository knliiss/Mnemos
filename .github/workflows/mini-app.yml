name: Mini App Format

on:
  push:
    paths:
      - "apps/mini-app/**"
      - ".github/workflows/mini-app.yml"

concurrency:
  group: mini-app-format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, Linux, X64, mnemos-frontend]
    defaults:
      run:
        working-directory: apps/mini-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/mini-app/.node-version
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format source
        run: npm run format

      - name: Commit formatting
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- apps/mini-app; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mini-app
          git commit -m "Format mini app source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
