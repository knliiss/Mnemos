name: Production Telegram Bot Rollout

on:
  push:
    branches:
      - master

concurrency:
  group: mnemos-production-telegram-bot-rollout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-production-env:
    if: >-
      contains(github.event.head_commit.message, 'feat/telegram-bot-service') ||
      contains(github.event.head_commit.message, 'fix/production-writable-tmp') ||
      contains(github.event.head_commit.message, 'fix/production-runtime-config')
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 10

    steps:
      - name: Clean privileged Python cache
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo -n find "$GITHUB_WORKSPACE" \
              -type d \
              -name __pycache__ \
              -prune \
              -exec rm -rf {} +
          fi

      - name: Checkout merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify merged revision
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "Checked-out revision does not match merged master revision" >&2
            exit 1
          fi

      - name: Migrate and validate production environment
        shell: bash
        run: |
          set -euo pipefail

          sudo -n sh scripts/migrate-production-env.sh
          sudo -n sh scripts/validate-production-env.sh

  publish-production-images:
    if: >-
      contains(github.event.head_commit.message, 'feat/telegram-bot-service') ||
      contains(github.event.head_commit.message, 'fix/production-writable-tmp')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - mnemos-backend
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble production artifacts
        run: ./gradlew assemble --no-daemon

      - name: Configure isolated Docker publishing
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-telegram-bot-rollout-docker-auth
        run: |
          set -euo pipefail

          rm -rf "$DOCKER_CONFIG"
          install --directory --mode=0700 "$DOCKER_CONFIG"

          docker buildx rm mnemos-telegram-bot-rollout-builder >/dev/null 2>&1 || true
          docker buildx create \
            --driver docker-container \
            --name mnemos-telegram-bot-rollout-builder \
            --use
          docker buildx inspect --bootstrap

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-telegram-bot-rollout-docker-auth
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish immutable production images
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-telegram-bot-rollout-docker-auth
          MNEMOS_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          MNEMOS_IMAGE_TAG: ${{ github.sha }}
          MNEMOS_IMAGE_PUSH: "true"
        run: |
          set -euo pipefail

          read_env_value() {
            key="$1"
            value="$(sed -n "s/^${key}=//p" .env.example)"

            if [ -z "$value" ]; then
              echo "${key} is missing from .env.example" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          export POSTGRES_VERSION="$(read_env_value POSTGRES_VERSION)"
          export KEYCLOAK_VERSION="$(read_env_value KEYCLOAK_VERSION)"
          export KEYCLOAK_CONFIG_CLI_VERSION="$(read_env_value KEYCLOAK_CONFIG_CLI_VERSION)"
          export KAFKA_VERSION="$(read_env_value KAFKA_VERSION)"
          export REDIS_VERSION="$(read_env_value REDIS_VERSION)"
          export MINIO_MC_VERSION="$(read_env_value MINIO_MC_VERSION)"

          sh scripts/publish-production-images.sh

      - name: Remove publishing credentials and builder
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-telegram-bot-rollout-docker-auth
        run: |
          set +e

          docker buildx rm mnemos-telegram-bot-rollout-builder >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"

  promote-production-images:
    if: contains(github.event.head_commit.message, 'fix/production-runtime-config')
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Clean privileged Python cache
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo -n find "$GITHUB_WORKSPACE" \
              -type d \
              -name __pycache__ \
              -prune \
              -exec rm -rf {} +
          fi

      - name: Checkout merged revision with recovery parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify config-only recovery boundary
        shell: bash
        env:
          SOURCE_RELEASE: 8cf36034cb5228afbd656419bee94e5a00ac1237
        run: |
          set -euo pipefail

          git cat-file -e "${SOURCE_RELEASE}^{commit}"

          changed_paths="$RUNNER_TEMP/runtime-config-recovery-paths.txt"
          git diff --name-only "$SOURCE_RELEASE" "$GITHUB_SHA" > "$changed_paths"

          if grep -Ev \
            '^(\.github/workflows/(backend-verify|production-pr79-rollout|stack-smoke|production-pr-ci-recovery|production-pr-backend-verify|production-pr-stack-smoke|production-pr-final-stack-smoke)\.yml|infrastructure/(compose/compose\.kafka\.yml|production/compose\.app-overrides\.yml)|make/validation\.mk|scripts/verify-production-(app-overrides\.py|app-compose\.sh))$' \
            "$changed_paths" | grep -q .; then
            echo "Runtime-config image promotion refused because the recovery contains unexpected paths:" >&2
            cat "$changed_paths" >&2
            exit 1
          fi

          if [ ! -s "$changed_paths" ]; then
            echo "Runtime-config recovery unexpectedly contains no changes" >&2
            exit 1
          fi

          echo "Config-only recovery boundary verified"

      - name: Prepare isolated promotion credentials
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-runtime-config-promotion-docker-auth
          sudo -n install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0700 \
            /run/mnemos-runtime-config-promotion-docker-auth

      - name: Authenticate promotion to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-runtime-config-promotion-docker-auth \
              docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Promote validated production images
        shell: bash
        env:
          SOURCE_RELEASE: 8cf36034cb5228afbd656419bee94e5a00ac1237
          TARGET_RELEASE: ${{ github.sha }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail

          images="$(python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(
              Path("infrastructure/production/service-catalog.json").read_text(
                  encoding="utf-8"
              )
          )

          for specification in catalog["services"].values():
              image = specification.get("image")
              if not image:
                  raise SystemExit("Production service catalog contains a missing image")
              print(image)
          PY
          )"

          if [ -z "$images" ]; then
            echo "Production service catalog contains no images" >&2
            exit 1
          fi

          count=0

          for image in $images; do
            source_image="${IMAGE_REGISTRY}/${image}:${SOURCE_RELEASE}"
            target_image="${IMAGE_REGISTRY}/${image}:${TARGET_RELEASE}"

            echo "Promoting ${image} from ${SOURCE_RELEASE} to ${TARGET_RELEASE}"

            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-runtime-config-promotion-docker-auth \
              docker pull "$source_image"

            sudo -n docker tag "$source_image" "$target_image"

            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-runtime-config-promotion-docker-auth \
              docker push "$target_image"

            sudo -n docker image rm "$target_image" >/dev/null 2>&1 || true
            count=$((count + 1))
          done

          if [ "$count" -ne 22 ]; then
            echo "Expected 22 production images, promoted ${count}" >&2
            exit 1
          fi

          echo "Promoted ${count} production images"

      - name: Remove promotion credentials
        if: always()
        shell: bash
        run: |
          set +e
          sudo -n rm -rf /run/mnemos-runtime-config-promotion-docker-auth

  deploy-production:
    if: >-
      always() &&
      needs.migrate-production-env.result == 'success' &&
      (
        (
          needs.publish-production-images.result == 'success' &&
          needs.promote-production-images.result == 'skipped'
        ) ||
        (
          needs.publish-production-images.result == 'skipped' &&
          needs.promote-production-images.result == 'success'
        )
      )
    needs:
      - migrate-production-env
      - publish-production-images
      - promote-production-images
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read

    steps:
      - name: Clean privileged Python cache
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo -n find "$GITHUB_WORKSPACE" \
              -type d \
              -name __pycache__ \
              -prune \
              -exec rm -rf {} +
          fi

      - name: Checkout merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare isolated production registry credentials
        shell: bash
        run: |
          set -euo pipefail

          sudo -n rm -rf /run/mnemos-telegram-bot-rollout-docker-auth
          sudo -n install \
            --directory \
            --owner=root \
            --group=root \
            --mode=0700 \
            /run/mnemos-telegram-bot-rollout-docker-auth

      - name: Authenticate production Docker to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            sudo -n env \
              DOCKER_CONFIG=/run/mnemos-telegram-bot-rollout-docker-auth \
              docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Reconcile production infrastructure
        shell: bash
        run: |
          set -euo pipefail

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-telegram-bot-rollout-docker-auth \
            MNEMOS_IMAGE_REGISTRY=ghcr.io/${{ github.repository_owner }} \
            MNEMOS_RELEASE_TAG=${{ github.sha }} \
            sh scripts/start-production-infra.sh

      - name: Deploy production applications
        shell: bash
        run: |
          set -euo pipefail

          sudo -n env \
            DOCKER_CONFIG=/run/mnemos-telegram-bot-rollout-docker-auth \
            MNEMOS_IMAGE_REGISTRY=ghcr.io/${{ github.repository_owner }} \
            MNEMOS_RELEASE_TAG=${{ github.sha }} \
            sh scripts/deploy-production-apps.sh

      - name: Verify production runtime
        shell: bash
        run: |
          set -euo pipefail

          sudo -n sh scripts/verify-production-infra.sh
          sudo -n sh scripts/wait-production-stack.sh \
            mnemos \
            "${GITHUB_SHA}" \
            900

      - name: Remove production registry credentials
        if: always()
        shell: bash
        run: |
          set +e
          sudo -n rm -rf /run/mnemos-telegram-bot-rollout-docker-auth
