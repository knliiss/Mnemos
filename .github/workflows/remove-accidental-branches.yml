name: Remove accidental branches

on:
  push:
    branches:
      - feat/frontend-integration
    paths:
      - .github/workflows/remove-accidental-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-integration

      - name: Delete accidental branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for branch in tmp-never noop noop2; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done

      - name: Remove temporary workflow
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-accidental-branches.yml
          git commit -m "remove temporary branch cleanup workflow"
          git push origin HEAD:feat/frontend-integration
