name: C7x Initial Backend Rollout Request

on:
  push:
    branches:
      - deploy/c7x-initial-backend

permissions:
  contents: read

jobs:
  request:
    if: github.repository == 'knliiss/Mnemos'
    runs-on: [self-hosted, Linux, X64, mnemos-frontend]
    timeout-minutes: 5
    steps:
      - name: Checkout trusted master history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Verify explicitly authorized master release
        shell: bash
        env:
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/deploy/c7x-initial-backend"
          test "$REQUEST_SHA" = "$(git rev-parse origin/master)"
          python3 scripts/production_source_revision.py "$REQUEST_SHA" --trusted-ref origin/master

      - name: Record release request
        shell: bash
        run: |
          echo "Trusted C7x initial backend rollout requested."
          echo "This request job cannot mutate the production server or publish images."
