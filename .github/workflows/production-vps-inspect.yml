name: Production VPS Inspect

on:
  push:
    branches:
      - feat/production-deployment
    paths:
      - .github/workflows/production-vps-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on:
      - self-hosted
      - mnemos-production

    timeout-minutes: 10

    steps:
      - name: Inspect production host without mutation
        shell: bash
        run: |
          set -euo pipefail

          echo '=== host ==='
          hostname
          uname -srmo
          uptime
          free -h
          df -h /

          echo '=== docker ==='
          docker --version
          docker info --format 'Swarm={{.Swarm.LocalNodeState}} LiveRestore={{.LiveRestoreEnabled}} Logging={{.LoggingDriver}}'
          docker node ls --format 'Node={{.Hostname}} Status={{.Status}} Availability={{.Availability}} Manager={{.ManagerStatus}}'

          echo '=== stacks ==='
          docker stack ls

          echo '=== containers ==='
          docker ps -a --format 'Name={{.Names}} State={{.State}} Status={{.Status}}'

          echo '=== named volumes ==='
          docker volume ls --format '{{.Name}}' | sort

          echo '=== mnemos paths ==='
          stat -c '%n owner=%U:%G mode=%a' /etc/mnemos /etc/mnemos/mnemos.env /opt/mnemos 2>/dev/null || true

          echo '=== restic ==='
          restic version 2>/dev/null || true

          echo '=== timers ==='
          systemctl is-enabled mnemos-production-health.timer 2>/dev/null || true
          systemctl is-active mnemos-production-health.timer 2>/dev/null || true
          systemctl is-enabled mnemos-production-backup.timer 2>/dev/null || true
          systemctl is-active mnemos-production-backup.timer 2>/dev/null || true

          echo '=== health status ==='
          systemctl --no-pager --full status mnemos-production-health.service 2>/dev/null | tail -n 25 || true
