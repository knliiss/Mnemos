name: Finalize Guide NPC atlas

on:
  push:
    branches:
      - fix/guides-visual-assets-complete
    paths:
      - .github/workflows/finalize-guide-npc-atlas.yml
      - .github/asset-staging/**
      - .tmp-guide-assets/**

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/guides-visual-assets-complete
          fetch-depth: 0

      - name: Rebuild and validate NPC atlas
        shell: bash
        run: |
          set -euo pipefail
          cat .github/asset-staging/npc-atlas.webp.b64.* | tr -d '\r\n' > /tmp/npc-atlas.b64
          base64 --decode /tmp/npc-atlas.b64 > apps/mini-app/public/guides/entities/npc-atlas.webp

          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/mini-app/public/guides/entities/npc-atlas.webp")
          data = path.read_bytes()

          if data[:4] != b"RIFF" or data[8:12] != b"WEBP" or data[12:16] != b"VP8X":
              raise SystemExit("rebuilt npc-atlas.webp is not the expected WebP/VP8X source atlas")

          width = int.from_bytes(data[24:27], "little") + 1
          height = int.from_bytes(data[27:30], "little") + 1

          if (width, height) != (48, 672):
              raise SystemExit(f"unexpected npc atlas dimensions: {width}x{height}")

          print(f"validated npc atlas: {width}x{height}, {len(data)} bytes")
          PY

      - name: Commit source atlas and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r .github/asset-staging .tmp-guide-assets
          git rm .github/workflows/finalize-guide-npc-atlas.yml
          git add apps/mini-app/public/guides/entities/npc-atlas.webp

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Install complete source-backed Guide NPC atlas"
          git push origin HEAD:fix/guides-visual-assets-complete
