name: Production Service Image

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service name from infrastructure/production/service-catalog.json
        required: true
        type: string
      source_sha:
        description: Full lowercase 40-character commit SHA from trusted master history
        required: true
        type: string

concurrency:
  group: production-service-image-${{ inputs.service }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - mnemos-backend

    permissions:
      contents: read
      packages: write

    timeout-minutes: 40

    steps:
      - name: Checkout trusted repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and checkout immutable source revision
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          python3 scripts/production_source_revision.py \
            "$SOURCE_SHA" \
            --trusted-ref origin/master

          git checkout --detach "$SOURCE_SHA"

          resolved_sha="$(git rev-parse HEAD)"

          if [ "$resolved_sha" != "$SOURCE_SHA" ]; then
            echo "Checked-out source does not match requested immutable SHA" >&2
            exit 1
          fi

          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"
          echo "Building ${{ inputs.service }} from $resolved_sha"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify production service catalog
        run: python3 scripts/verify-production-service-catalog.py

      - name: Configure isolated Docker publishing
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-service-image-docker-auth
        run: |
          set -euo pipefail

          rm -rf "$DOCKER_CONFIG"
          install \
            --directory \
            --mode=0700 \
            "$DOCKER_CONFIG"

          docker buildx rm mnemos-service-image-builder >/dev/null 2>&1 || true
          docker buildx create \
            --driver docker-container \
            --name mnemos-service-image-builder \
            --use
          docker buildx inspect --bootstrap

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-service-image-docker-auth
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build and publish selected service image
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-service-image-docker-auth
        run: |
          set -euo pipefail

          python3 scripts/publish-production-service-image.py \
            --service "${{ inputs.service }}" \
            --registry "ghcr.io/${{ github.repository_owner }}" \
            --tag "${{ steps.source.outputs.sha }}" \
            --push

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Production service image"
            echo
            echo "Service: \`${{ inputs.service }}\`"
            echo "Source: \`${{ steps.source.outputs.sha }}\`"
            echo
            echo "The source SHA was verified as reachable from trusted master history."
            echo "This workflow publishes an immutable image only. It does not access or mutate the production runtime."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove publishing credentials and builder
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-service-image-docker-auth
        run: |
          set +e

          docker buildx rm mnemos-service-image-builder >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"
