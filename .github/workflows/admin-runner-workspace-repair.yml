name: Admin Runner Workspace Repair

on:
  push:
    branches:
      - feat/full-admin-control-plane
    paths:
      - .github/workflows/admin-runner-workspace-repair.yml

permissions:
  contents: read

concurrency:
  group: admin-runner-workspace-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: [self-hosted, Linux, X64, mnemos-backend]
    timeout-minutes: 5

    steps:
      - name: Repair workspace ownership
        shell: bash
        run: |
          set -euo pipefail

          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.20 \
            sh -c "chown -R ${runner_uid}:${runner_gid} /workspace"

          test -w "$GITHUB_WORKSPACE"
