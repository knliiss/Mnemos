name: One-time Telegram Service Verification
on:
  push:
    branches: [master]
    paths: [.github/workflows/one-time-telegram-recovery.yml]
permissions:
  contents: read
  issues: write
jobs:
  verify:
    if: github.repository == 'knliiss/Mnemos'
    runs-on: [self-hosted, mnemos-production]
    timeout-minutes: 8
    steps:
      - name: Checkout diagnostics script
        uses: actions/checkout@v4
      - name: Inspect Telegram bot without restarting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/diagnose-production-telegram-poller.py
