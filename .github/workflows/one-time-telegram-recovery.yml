name: One-time Telegram Service Recovery
on:
  push:
    branches: [master]
    paths: [.github/workflows/one-time-telegram-recovery.yml]
permissions:
  contents: read
  issues: write
jobs:
  restart:
    if: github.repository == 'knliiss/Mnemos'
    runs-on: [self-hosted, mnemos-production]
    timeout-minutes: 8
    steps:
      - name: Restart only Telegram bot and verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=mnemos_telegram-bot-service
          before="$(sudo -n docker service ls --filter "name=$SERVICE" --format '{{.Name}}|{{.Replicas}}')"
          test "$before" = "$SERVICE|1/1"
          old="$(sudo -n docker service ps "$SERVICE" --filter desired-state=running --format '{{.ID}}' | head -n 1)"
          test -n "$old"
          sudo -n docker service update --force --detach=true "$SERVICE"
          healthy=false
          new=""
          for i in $(seq 1 60); do
            sleep 4
            state="$(sudo -n docker service ls --filter "name=$SERVICE" --format '{{.Name}}|{{.Replicas}}')"
            new="$(sudo -n docker service ps "$SERVICE" --filter desired-state=running --format '{{.ID}}' | head -n 1)"
            if [ "$state" = "$SERVICE|1/1" ] && [ -n "$new" ] && [ "$new" != "$old" ]; then healthy=true; break; fi
          done
          {
            echo "# Telegram bot recovery"
            echo "Service: `$SERVICE`"
            echo "Before: `$before`"
            echo "After: `$state`"
            echo "Replacement task observed: `$([ "$new" != "$old" ] && echo yes || echo no)`"
            echo "Healthy replacement: `$healthy`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$healthy" = true
