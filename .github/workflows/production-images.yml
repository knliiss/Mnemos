name: Production Image Batch

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character Git commit SHA to build
        required: true
        type: string

concurrency:
  group: production-image-batch-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64, mnemos-backend]
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate immutable source revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character Git SHA" >&2
            exit 1
          fi

      - name: Checkout immutable source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify checked-out revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"

          if [ "$CHECKED_OUT_SHA" != "$SOURCE_SHA" ]; then
            echo "Checked-out SHA $CHECKED_OUT_SHA does not match requested SHA $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Assemble production artifacts
        run: ./gradlew assemble --no-daemon

      - name: Configure isolated Docker publishing
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-production-image-batch-docker-auth
        run: |
          set -euo pipefail

          rm -rf "$DOCKER_CONFIG"
          install \
            --directory \
            --mode=0700 \
            "$DOCKER_CONFIG"

          docker buildx rm mnemos-production-image-batch-builder >/dev/null 2>&1 || true

          docker buildx create \
            --driver docker-container \
            --name mnemos-production-image-batch-builder \
            --use

          docker buildx inspect --bootstrap

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-production-image-batch-docker-auth
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish immutable image batch
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-production-image-batch-docker-auth
          MNEMOS_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          MNEMOS_IMAGE_TAG: ${{ inputs.source_sha }}
          MNEMOS_IMAGE_PUSH: "true"
        run: |
          set -euo pipefail

          read_env_value() {
            key="$1"
            value="$(sed -n "s/^${key}=//p" .env.example)"

            if [ -z "$value" ]; then
              echo "${key} is missing from .env.example" >&2
              exit 1
            fi

            printf '%s' "$value"
          }

          POSTGRES_VERSION="$(read_env_value POSTGRES_VERSION)"
          KEYCLOAK_VERSION="$(read_env_value KEYCLOAK_VERSION)"
          KEYCLOAK_CONFIG_CLI_VERSION="$(read_env_value KEYCLOAK_CONFIG_CLI_VERSION)"
          KAFKA_VERSION="$(read_env_value KAFKA_VERSION)"
          REDIS_VERSION="$(read_env_value REDIS_VERSION)"
          MINIO_MC_VERSION="$(read_env_value MINIO_MC_VERSION)"

          export POSTGRES_VERSION
          export KEYCLOAK_VERSION
          export KEYCLOAK_CONFIG_CLI_VERSION
          export KAFKA_VERSION
          export REDIS_VERSION
          export MINIO_MC_VERSION

          sh scripts/publish-production-images.sh

      - name: Publish image summary
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          {
            echo "## Production image batch"
            echo
            echo "Immutable source SHA: \`$SOURCE_SHA\`"
            echo
            echo "Registry: \`$REGISTRY\`"
            echo
            echo "This workflow publishes images only. It has no production runtime job."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove publishing credentials and builder
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/mnemos-production-image-batch-docker-auth
        run: |
          set +e

          docker buildx rm mnemos-production-image-batch-builder >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"
