name: Production Runtime Diagnostic

on:
  push:
    branches:
      - fix/zero-downtime-production-deploy
    paths:
      - ".github/workflows/production-runtime-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - mnemos-production
    timeout-minutes: 10

    steps:
      - name: Checkout diagnostic tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Inspect competing Telegram runtimes
        shell: bash
        run: |
          set -euo pipefail

          echo "===== STACK ====="
          sudo -n docker stack services mnemos

          echo "===== ALL DOCKER CONTAINERS ====="
          sudo -n docker ps -a \
            --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Command}}'

          echo "===== RUNNING SYSTEMD UNITS ====="
          sudo -n systemctl list-units \
            --type=service \
            --state=running \
            --no-pager \
            --plain \
            | grep -Ei 'mnemos|telegram|bot|java|docker|container' || true

          echo "===== RELEVANT PROCESSES ====="
          sudo -n ps \
            -eo pid,ppid,user,lstart,args \
            --sort=pid \
            | grep -Ei 'mnemos|telegram|bot|java|spring|gradle' \
            | grep -Ev 'grep -Ei|production-runtime-diagnostic' || true

          echo "===== TELEGRAM BOT TASKS ====="
          sudo -n docker service ps \
            --no-trunc \
            --format 'table {{.Name}}\t{{.Image}}\t{{.CurrentState}}\t{{.Error}}' \
            mnemos_telegram-bot-service

          echo "===== TELEGRAM BOT RECENT CONFLICTS ====="
          sudo -n docker service logs \
            --raw \
            --timestamps \
            --since 15m \
            --tail 400 \
            mnemos_telegram-bot-service 2>&1 \
            | grep -E '409|Conflict|getUpdates|started|Started' || true

          echo "===== PUBLIC READINESS ====="
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 10 \
            https://api.knalis.rest/actuator/health/readiness
          echo
