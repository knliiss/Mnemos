name: Admin Frontend Format Repair

on:
  push:
    branches:
      - feat/full-admin-control-plane
    paths:
      - .github/workflows/admin-format-repair.yml

permissions:
  contents: write

concurrency:
  group: admin-frontend-format-repair
  cancel-in-progress: false

jobs:
  format:
    runs-on: [self-hosted, Linux, X64, mnemos-frontend]
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/full-admin-control-plane
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: apps/mini-app/.node-version
          cache: npm
          cache-dependency-path: apps/mini-app/package-lock.json

      - name: Install dependencies
        working-directory: apps/mini-app
        run: npm ci

      - name: Format Mini App
        working-directory: apps/mini-app
        run: npm run format

      - name: Commit formatting repair
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- apps/mini-app; then
            echo "Mini App formatting is already clean"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mini-app
          git commit -m "Format admin control plane frontend"
          git push origin HEAD:feat/full-admin-control-plane
