org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin 2.3.20+ enables the Build Tools API for JVM compilation by default.
# Keep the legacy runner until the current BTA plugin-classpath crash is fixed upstream.
kotlin.compiler.runViaBuildToolsApi=false
systemProp.kotlin.caching.enabled=false

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

kotlin.code.style=official
