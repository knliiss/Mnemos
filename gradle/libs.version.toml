[versions]
kotlin = "2.4.10"
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
mockito-kotlin = "6.3.0"
uuid-creator = "6.1.1"
telegram-bot = "10.1.0"
minio = "8.5.17"

[libraries]

spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }

spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }

jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }

uuid-creator = {module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator"}
telegram-bot = {module = "com.github.pengrad:java-telegram-bot-api", version.ref = "telegram-bot"}
minio = { module = "io.minio:minio", version.ref = "minio" }

[bundles]
spring-web = [
    "spring-boot-starter-web",
    "spring-boot-starter-validation",
    "spring-boot-starter-actuator"
]

spring-security = [
    "spring-boot-starter-security",
    "spring-boot-starter-oauth2-resource-server"
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }

spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
