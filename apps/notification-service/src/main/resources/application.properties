spring.application.name=notification-service

server.port=${SERVER_PORT:8084}

spring.datasource.url=jdbc:postgresql://localhost:5433/mnemos?currentSchema=notification
spring.datasource.username=${APP_POSTGRES_USER}
spring.datasource.password=${APP_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.schemas=notification

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

mnemos.inbox.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

logging.level.com.mnemos.messaging.outbox=DEBUG
logging.level.com.mnemos.messaging.kafka=DEBUG

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.repositories.enabled=false

spring.task.scheduling.pool.size=4

mnemos.notification.delivery.enabled=${NOTIFICATION_DELIVERY_ENABLED:false}
mnemos.notification.delivery.ttl=5m
mnemos.notification.dungeon.time-zone=Europe/Kyiv

mnemos.notification.processing.enabled=true
mnemos.notification.processing.dispatch-interval=250ms
mnemos.notification.processing.recovery-interval=10s
mnemos.notification.processing.claim-batch-size=100
mnemos.notification.processing.recovery-batch-size=100
mnemos.notification.processing.recipient-retry-delay=5s
mnemos.notification.processing.processing-retry-delay=1s

mnemos.notification.delivery.worker.interval=50ms
mnemos.notification.delivery.worker.recovery-interval=10s
mnemos.notification.delivery.worker.batch-size=4
mnemos.notification.delivery.worker.recovery-batch-size=100
mnemos.notification.delivery.worker.retry-delay=1s
mnemos.notification.delivery.worker.critical-weight=8
mnemos.notification.delivery.worker.high-weight=4
mnemos.notification.delivery.worker.normal-weight=2
mnemos.notification.delivery.worker.low-weight=1
mnemos.notification.delivery.worker.priority-recipient-weight=4
mnemos.notification.delivery.worker.elevated-recipient-weight=2
mnemos.notification.delivery.worker.standard-recipient-weight=1

mnemos.notification.policy.item-drop.aggregation-enabled=false
mnemos.notification.policy.item-drop.priority=HIGH

mnemos.notification.policy.booster.aggregation-enabled=true
mnemos.notification.policy.booster.aggregation-window=15s
mnemos.notification.policy.booster.priority=LOW

mnemos.notification.policy.dungeon.aggregation-enabled=true
mnemos.notification.policy.dungeon.aggregation-window=7s
mnemos.notification.policy.dungeon.priority=HIGH

mnemos.notification.policy.raid.aggregation-enabled=true
mnemos.notification.policy.raid.aggregation-window=1s
mnemos.notification.policy.raid.priority=CRITICAL

mnemos.notification.policy.global.aggregation-enabled=true
mnemos.notification.policy.global.aggregation-window=10s
mnemos.notification.policy.global.priority=NORMAL

mnemos.notification.policy.player-offline.aggregation-enabled=false
mnemos.notification.policy.player-offline.priority=HIGH

mnemos.notification.redis.aggregation.due-key=notification:{delivery}:aggregation:due
mnemos.notification.redis.aggregation.accepted-key-prefix=notification:{delivery}:aggregation:accepted:
mnemos.notification.redis.aggregation.bucket-key-prefix=notification:{delivery}:aggregation:bucket:
mnemos.notification.redis.aggregation.processing-key-prefix=notification:{delivery}:aggregation:processing:
mnemos.notification.redis.aggregation.processing-due-key=notification:{delivery}:aggregation:processing-due
mnemos.notification.redis.aggregation.accepted-ttl=24h
mnemos.notification.redis.aggregation.bucket-ttl=10m
mnemos.notification.redis.aggregation.processing-ttl=1h
mnemos.notification.redis.aggregation.visibility-timeout=1m

mnemos.notification.redis.immediate.ready-key=notification:{delivery}:immediate:ready
mnemos.notification.redis.immediate.accepted-key-prefix=notification:{delivery}:immediate:accepted:
mnemos.notification.redis.immediate.batch-key-prefix=notification:{delivery}:immediate:batch:
mnemos.notification.redis.immediate.processing-key-prefix=notification:{delivery}:immediate:processing:
mnemos.notification.redis.immediate.processing-due-key=notification:{delivery}:immediate:processing-due
mnemos.notification.redis.immediate.accepted-ttl=24h
mnemos.notification.redis.immediate.batch-ttl=1h
mnemos.notification.redis.immediate.processing-ttl=1h
mnemos.notification.redis.immediate.visibility-timeout=1m

mnemos.notification.redis.delivery.candidate-key-prefix=notification:{delivery}:candidate:
mnemos.notification.redis.delivery.lane-key-prefix=notification:{delivery}:lane:
mnemos.notification.redis.delivery.processing-key-prefix=notification:{delivery}:processing:
mnemos.notification.redis.delivery.processing-due-key=notification:{delivery}:processing-due
mnemos.notification.redis.delivery.candidate-ttl=24h
mnemos.notification.redis.delivery.processing-ttl=1h
mnemos.notification.redis.delivery.visibility-timeout=1m

mnemos.notification.message-pack.mode=${MESSAGE_PACK_MODE:LOCAL}

mnemos.clients.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
mnemos.clients.account-service.api-key=${NOTIFICATION_SERVICE_ACCOUNT_API_KEY:}

mnemos.clients.event-service.url=${EVENT_SERVICE_URL:http://localhost:8083}
mnemos.clients.event-service.api-key=${NOTIFICATION_SERVICE_EVENT_API_KEY:}

mnemos.clients.telegram-bot-service.url=${TELEGRAM_BOT_SERVICE_URL:http://localhost:8094}
mnemos.clients.telegram-bot-service.api-key=${NOTIFICATION_SERVICE_TELEGRAM_BOT_API_KEY:}

mnemos.security.internal.api-keys.telegram-bot-service=${TELEGRAM_BOT_SERVICE_NOTIFICATION_API_KEY:}
mnemos.security.internal.api-keys.crystalrun=crystalrun-internal-v1
