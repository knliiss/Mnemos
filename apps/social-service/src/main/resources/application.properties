spring.application.name=social-service
server.port=${SERVER_PORT:8090}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mnemos?currentSchema=social}
spring.datasource.username=${APP_POSTGRES_USER:mnemos}
spring.datasource.password=${APP_POSTGRES_PASSWORD:mnemos_local_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=social

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

mnemos.kafka.manage-topics=${MNEMOS_KAFKA_MANAGE_TOPICS:true}
mnemos.outbox.enabled=true
mnemos.outbox.publisher.enabled=true
mnemos.inbox.enabled=true

mnemos.social.account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
mnemos.social.account-service.api-key=${SOCIAL_SERVICE_ACCOUNT_API_KEY:}
mnemos.social.event-service.base-url=${EVENT_SERVICE_URL:http://localhost:8083}
mnemos.social.event-service.api-key=${SOCIAL_SERVICE_EVENT_API_KEY:}
mnemos.social.personalization-service.base-url=${PERSONALIZATION_SERVICE_URL:http://localhost:8089}
mnemos.social.personalization-service.api-key=${SOCIAL_SERVICE_PERSONALIZATION_API_KEY:}

mnemos.social.spotlight.price-prime=${SPOTLIGHT_PRICE_PRIME:25}
mnemos.social.spotlight.drop-max-age=2h
mnemos.social.spotlight.lifetime=1h
mnemos.social.spotlight.buyer-cooldown=20m
mnemos.social.spotlight.global-gap=15s
mnemos.social.spotlight.recipient-gap=30s
mnemos.social.spotlight.max-queue-delay=5m
