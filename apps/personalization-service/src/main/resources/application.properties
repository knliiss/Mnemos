spring.application.name=personalization-service
server.port=${SERVER_PORT:8089}

spring.datasource.url=jdbc:postgresql://localhost:5433/mnemos?currentSchema=personalization
spring.datasource.username=${APP_POSTGRES_USER}
spring.datasource.password=${APP_POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=personalization

spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=300KB

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

mnemos.security.public-paths[0]=/actuator/health
mnemos.security.public-paths[1]=/actuator/health/**
mnemos.security.public-paths[2]=/api/v1/personalizations/badges/*/image

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

mnemos.kafka.manage-topics=${MNEMOS_KAFKA_MANAGE_TOPICS:true}

mnemos.outbox.enabled=true
mnemos.outbox.publisher.enabled=true
mnemos.inbox.enabled=true

mnemos.clients.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
mnemos.clients.account-service.api-key=${PERSONALIZATION_SERVICE_ACCOUNT_API_KEY:}

mnemos.security.internal.api-keys.social-service=${SOCIAL_SERVICE_PERSONALIZATION_API_KEY:}
mnemos.security.internal.api-keys.profile-service=${PROFILE_SERVICE_PERSONALIZATION_API_KEY:}

mnemos.personalization.creator.prime-share-percent=${MNEMOS_PERSONALIZATION_CREATOR_PRIME_SHARE_PERCENT:70}
mnemos.personalization.creator.coin-share-percent=${MNEMOS_PERSONALIZATION_CREATOR_COIN_SHARE_PERCENT:50}
mnemos.personalization.creator.coin-per-prime=${MNEMOS_PERSONALIZATION_CREATOR_COIN_PER_PRIME:100}
mnemos.personalization.creator.revenue-retry-delay=${MNEMOS_PERSONALIZATION_CREATOR_REVENUE_RETRY_DELAY:30s}
mnemos.personalization.creator.revenue-retry-batch-size=${MNEMOS_PERSONALIZATION_CREATOR_RETRY_BATCH_SIZE:100}
mnemos.personalization.creator.retry-scan-delay-ms=${MNEMOS_PERSONALIZATION_CREATOR_RETRY_SCAN_DELAY_MS:10000}

mnemos.personalization.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
mnemos.personalization.storage.access-key=${MINIO_PERSONALIZATION_ACCESS_KEY:mnemos-personalization}
mnemos.personalization.storage.secret-key=${MINIO_PERSONALIZATION_SECRET_KEY}
mnemos.personalization.storage.bucket=${MINIO_PERSONALIZATION_BUCKET:mnemos-personalization}
