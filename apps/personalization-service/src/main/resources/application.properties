spring.application.name=personalization-service
server.port=${SERVER_PORT:8089}

spring.datasource.url=jdbc:postgresql://localhost:5433/mnemos?currentSchema=personalization
spring.datasource.username=${APP_POSTGRES_USER:mnemos}
spring.datasource.password=${APP_POSTGRES_PASSWORD:mnemos_local_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.schemas=personalization

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs

mnemos.outbox.enabled=true
mnemos.outbox.publisher.enabled=true
mnemos.inbox.enabled=true

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

mnemos.clients.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
mnemos.clients.account-service.api-key=${PERSONALIZATION_SERVICE_ACCOUNT_API_KEY:}

mnemos.personalization.creator.prime-share-percent=70
mnemos.personalization.creator.coin-revenue-prime-percent=20
