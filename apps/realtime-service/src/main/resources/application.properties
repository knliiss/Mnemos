spring.application.name=realtime-service

server.port=${SERVER_PORT:8088}

spring.datasource.url=jdbc:postgresql://localhost:5433/mnemos?currentSchema=realtime
spring.datasource.username=${APP_POSTGRES_USER}
spring.datasource.password=${APP_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=realtime

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

mnemos.kafka.manage-topics=${MNEMOS_KAFKA_MANAGE_TOPICS:true}

mnemos.inbox.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus

mnemos.security.public-paths[0]=/actuator/health
mnemos.security.public-paths[1]=/actuator/health/**
mnemos.security.public-paths[2]=/ws/v1/collector
mnemos.security.public-paths[3]=/api/v1/realtime/collector-activations/redeem
mnemos.security.public-paths[4]=/api/v1/realtime/collector-credentials/validate

mnemos.clients.account-service.url=${MNEMOS_ACCOUNT_SERVICE_URL:http://localhost:8081}
mnemos.clients.account-service.api-key=${REALTIME_SERVICE_ACCOUNT_API_KEY:}

mnemos.realtime.gateway-forwarding-token=${MNEMOS_REALTIME_FORWARDING_TOKEN}

mnemos.realtime.delivery.timeout=30m
mnemos.realtime.delivery.heartbeat-interval=15s
mnemos.realtime.delivery.replay-ttl=24h
mnemos.realtime.delivery.replay-limit=100
mnemos.realtime.delivery.deduplication-limit=512
mnemos.realtime.delivery.stream-poll-timeout=250ms
mnemos.realtime.delivery.stream-batch-size=100
mnemos.realtime.delivery.stream-max-length=100000
mnemos.realtime.delivery.max-connections-per-user=${MNEMOS_REALTIME_MAX_CONNECTIONS_PER_USER:3}
mnemos.realtime.delivery.max-connections-per-client-ip=${MNEMOS_REALTIME_MAX_CONNECTIONS_PER_CLIENT_IP:20}
mnemos.realtime.delivery.max-connections-total=${MNEMOS_REALTIME_MAX_CONNECTIONS_TOTAL:5000}
mnemos.realtime.delivery.connection-lease-ttl=${MNEMOS_REALTIME_CONNECTION_LEASE_TTL:45s}

mnemos.realtime.collector.max-message-size=64KB
mnemos.realtime.collector.messages-per-second=20
mnemos.realtime.collector.max-in-flight-messages=100
mnemos.realtime.collector.kafka-timeout=2s
mnemos.realtime.collector.heartbeat-interval=10s
mnemos.realtime.collector.heartbeat-timeout=30s
mnemos.realtime.collector.observation-timeout=10m
mnemos.realtime.collector.authorization-failure-grace=30s
mnemos.realtime.collector.activation-ttl=10m
