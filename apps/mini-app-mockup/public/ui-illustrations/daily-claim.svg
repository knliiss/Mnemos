<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 56" shape-rendering="crispEdges">
  <!-- reward burst -->
  <rect x="10" y="9" width="4" height="4" fill="#E9AD43"/>
  <rect x="58" y="8" width="5" height="5" fill="#D7A0DE"/>
  <rect x="62" y="22" width="3" height="3" fill="#FFFFFF" opacity=".86"/>
  <rect x="7" y="28" width="3" height="3" fill="#CFFF35" opacity=".78"/>

  <!-- floating coin -->
  <rect x="18" y="11" width="10" height="10" rx="5" fill="#E4A63A"/>
  <rect x="20" y="13" width="6" height="6" rx="3" fill="#FFD565"/>
  <rect x="22" y="14" width="2" height="4" fill="#7E5316"/>

  <!-- floating prime crystal -->
  <path d="M52 10h4v3h3v4h-3v3h-4v-3h-3v-4h3v-3Z" fill="#D5A0DE"/>
  <path d="M53 12h2v6h-2z" fill="#F4DCF8" opacity=".88"/>

  <!-- open lid -->
  <g transform="translate(0 -1)">
    <rect x="18" y="18" width="36" height="9" rx="3" fill="#18210D"/>
    <rect x="21" y="19" width="30" height="5" rx="2" fill="#263716"/>
    <rect x="34" y="18" width="4" height="9" fill="#E6B24B"/>
    <rect x="18" y="24" width="36" height="3" fill="#0E1408" opacity=".82"/>
  </g>

  <!-- oversized bow: makes the object immediately read as a present -->
  <path d="M35 17h-3l-7-5h-5v7h5l7-2h3Z" fill="#F0C45A"/>
  <path d="M37 17h3l7-5h5v7h-5l-7-2h-3Z" fill="#F0C45A"/>
  <rect x="33" y="13" width="6" height="7" rx="2" fill="#FFD86A"/>
  <rect x="34" y="14" width="4" height="5" rx="1" fill="#B77720" opacity=".5"/>

  <!-- gift box -->
  <rect x="15" y="29" width="42" height="20" rx="5" fill="#18210D"/>
  <rect x="18" y="32" width="36" height="14" rx="3" fill="#263716"/>
  <rect x="34" y="29" width="4" height="20" fill="#E6B24B"/>
  <rect x="15" y="29" width="42" height="4" fill="#30431A"/>
  <rect x="34" y="29" width="4" height="20" fill="#F1C65F"/>

  <!-- clear "claim/tap" cue -->
  <path d="M60 35h5v3h3v5h-3v3h-5v-3h-3v-5h3v-3Z" fill="#F5F7EA" opacity=".92"/>
  <rect x="61" y="37" width="3" height="7" fill="#18210D" opacity=".72"/>
  <rect x="58" y="39" width="9" height="3" fill="#18210D" opacity=".72"/>
</svg>