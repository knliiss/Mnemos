server.port=${SERVER_PORT:8081}

spring.datasource.url=${APP_DATASOURCE_URL}
spring.datasource.username=${APP_POSTGRES_USER}
spring.datasource.password=${APP_POSTGRES_PASSWORD}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN}/realms/mnemos
spring.security.oauth2.client.provider.keycloak-admin.token-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://keycloak:8080}/realms/mnemos/protocol/openid-connect/token

mnemos.keycloak-admin.server-url=${MNEMOS_AUTH_ORIGIN}
mnemos.keycloak-admin.client-id=${MNEMOS_ACCOUNT_SERVICE_CLIENT_ID}
mnemos.keycloak-admin.client-secret=${KEYCLOAK_ACCOUNT_SERVICE_CLIENT_SECRET}