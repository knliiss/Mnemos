spring.application.name=account-service

server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://localhost:5433/mnemos?currentSchema=account
spring.datasource.username=${APP_POSTGRES_USER}
spring.datasource.password=${APP_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.schemas=account

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

spring.security.oauth2.client.registration.keycloak-admin.provider=keycloak-admin
spring.security.oauth2.client.registration.keycloak-admin.client-id=${MNEMOS_ACCOUNT_SERVICE_CLIENT_ID:account-service-admin}
spring.security.oauth2.client.registration.keycloak-admin.client-secret=${KEYCLOAK_ACCOUNT_SERVICE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.keycloak-admin.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak-admin.token-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/token

mnemos.keycloak-admin.url=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}
mnemos.keycloak-admin.realm=mnemos

mnemos.account.player-directory-service.base-url=${PLAYER_DIRECTORY_SERVICE_URL:http://localhost:8092}
mnemos.account.player-directory-service.api-key=${ACCOUNT_SERVICE_PLAYER_DIRECTORY_API_KEY:}

mnemos.inbox.enabled=true
mnemos.outbox.enabled=true
mnemos.outbox.publisher.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

mnemos.security.internal.api-keys.wallet-service=${WALLET_SERVICE_ACCOUNT_API_KEY}
mnemos.security.internal.api-keys.event-service=${EVENT_SERVICE_ACCOUNT_API_KEY}
mnemos.security.internal.api-keys.reward-service=${REWARD_SERVICE_ACCOUNT_API_KEY}
mnemos.security.internal.api-keys.bet-service=${BET_SERVICE_ACCOUNT_API_KEY}
mnemos.security.internal.api-keys.personalization-service=${PERSONALIZATION_SERVICE_ACCOUNT_API_KEY}
mnemos.security.internal.api-keys.social-service=${SOCIAL_SERVICE_ACCOUNT_API_KEY}
mnemos.security.internal.api-keys.profile-service=${PROFILE_SERVICE_ACCOUNT_API_KEY}
mnemos.security.internal.api-keys.realtime-service=${REALTIME_SERVICE_ACCOUNT_API_KEY}
mnemos.security.internal.api-keys.player-directory-service=${PLAYER_DIRECTORY_SERVICE_ACCOUNT_API_KEY}
mnemos.security.internal.api-keys.telegram-bot-service=${TELEGRAM_BOT_SERVICE_ACCOUNT_API_KEY}
