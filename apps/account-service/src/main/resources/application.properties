spring.application.name=account-service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.security.oauth2.client.registration.keycloak-admin.provider=keycloak-admin
spring.security.oauth2.client.registration.keycloak-admin.client-id=${MNEMOS_ACCOUNT_SERVICE_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak-admin.client-secret=${KEYCLOAK_ACCOUNT_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak-admin.authorization-grant-type=client_credentials

spring.security.oauth2.client.provider.keycloak-admin.token-uri=${MNEMOS_AUTH_ORIGIN}/realms/mnemos/protocol/openid-connect/token

spring.cloud.openfeign.okhttp.enabled=true

mnemos.keycloak-admin.url=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}
mnemos.keycloak-admin.realm=mnemos

mnemos.cristalix-api.url=${CRISTALIX_API_URL:https://api.cristalix.gg}
mnemos.cristalix-api.project-token=${CRISTALIX_PROJECT_TOKEN}
mnemos.cristalix-api.project-key=${CRISTALIX_PROJECT_KEY}

mnemos.cristalix-api.connect-timeout=3s
mnemos.cristalix-api.read-timeout=5s

mnemos.cristalix-api.rate-limit.permits=5
mnemos.cristalix-api.rate-limit.refresh-period=1s
mnemos.cristalix-api.rate-limit.timeout=5s

logging.level.com.mnemos.account.integration.cristalix.client.CristalixClient=INFO
logging.level.feign.Logger=INFO

mnemos.outbox.enabled=true
mnemos.outbox.producer=account-service
mnemos.outbox.require-transaction=true

mnemos.outbox.cleanup.enabled=true
mnemos.outbox.cleanup.initial-delay=10m
mnemos.outbox.cleanup.fixed-delay=1h
mnemos.outbox.cleanup.published-retention=7d
mnemos.outbox.cleanup.dead-retention=30d
mnemos.outbox.cleanup.batch-size=1000
mnemos.outbox.cleanup.max-batches-per-run=10


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.client-id=account-service

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

mnemos.kafka.enabled=true
mnemos.kafka.manage-topics=false