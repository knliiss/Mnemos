spring.application.name=bot-management-service
server.port=${SERVER_PORT:8095}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mnemos?currentSchema=bot_management}
spring.datasource.username=${BOT_MANAGEMENT_POSTGRES_USER}
spring.datasource.password=${BOT_MANAGEMENT_POSTGRES_PASSWORD}
spring.flyway.enabled=true
spring.flyway.schemas=bot_management

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

mnemos.security.public-paths[0]=/actuator/health
mnemos.security.public-paths[1]=/actuator/health/**
mnemos.security.public-paths[2]=/internal/v1/bot-agents/**

mnemos.bot.realtime-url=${MNEMOS_BOT_REALTIME_URL:http://localhost:8088}
mnemos.bot.internal-token=${MNEMOS_BOT_INTERNAL_TOKEN}

management.endpoints.web.exposure.include=health,info,prometheus
