spring.application.name=telegram-bot-service
server.port=${SERVER_PORT:8094}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

mnemos.telegram-bot.telegram.enabled=${TELEGRAM_BOT_ENABLED:false}
mnemos.telegram-bot.telegram.token=${MNEMOS_TELEGRAM_BOT_TOKEN:}
mnemos.telegram-bot.telegram.mini-app-url=${MNEMOS_FRONTEND_ORIGIN:}

mnemos.security.internal.api-keys.notification-service=${NOTIFICATION_SERVICE_TELEGRAM_BOT_API_KEY:}
