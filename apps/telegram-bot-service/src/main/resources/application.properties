spring.application.name=telegram-bot-service
server.port=${SERVER_PORT:8094}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.repositories.enabled=false

mnemos.telegram-bot.telegram.enabled=${TELEGRAM_BOT_ENABLED:false}
mnemos.telegram-bot.telegram.token=${MNEMOS_TELEGRAM_BOT_TOKEN:}
mnemos.telegram-bot.telegram.mini-app-url=${MNEMOS_FRONTEND_ORIGIN:}
mnemos.telegram-bot.menu.session-ttl=${TELEGRAM_BOT_MENU_SESSION_TTL:30d}

mnemos.clients.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
mnemos.clients.account-service.api-key=${TELEGRAM_BOT_SERVICE_ACCOUNT_API_KEY:}
mnemos.clients.event-service.url=${EVENT_SERVICE_URL:http://localhost:8083}
mnemos.clients.event-service.api-key=${TELEGRAM_BOT_SERVICE_EVENT_API_KEY:}
mnemos.clients.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
mnemos.clients.notification-service.api-key=${TELEGRAM_BOT_SERVICE_NOTIFICATION_API_KEY:}
mnemos.clients.player-directory-service.url=${PLAYER_DIRECTORY_SERVICE_URL:http://localhost:8092}
mnemos.clients.player-directory-service.api-key=${TELEGRAM_BOT_SERVICE_PLAYER_DIRECTORY_API_KEY:}
mnemos.clients.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8093}
mnemos.clients.payment-service.api-key=${TELEGRAM_BOT_SERVICE_PAYMENT_API_KEY:}
mnemos.clients.reward-service.url=${REWARD_SERVICE_URL:http://localhost:8085}
mnemos.clients.reward-service.api-key=${TELEGRAM_BOT_SERVICE_REWARD_API_KEY:}

mnemos.security.internal.api-keys.notification-service=${NOTIFICATION_SERVICE_TELEGRAM_BOT_API_KEY:}
mnemos.security.internal.api-keys.payment-service=${PAYMENT_SERVICE_TELEGRAM_BOT_API_KEY:}
