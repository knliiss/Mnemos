<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 144" shape-rendering="crispEdges">
  <style>
    .mnemos-police-eyelids {
      opacity: 0;
      animation: mnemos-police-blink 14.8s steps(1, end) infinite;
    }

    @keyframes mnemos-police-blink {
      0%, 31%, 33%, 78%, 80%, 100% { opacity: 0; }
      32%, 79% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mnemos-police-eyelids { animation: none; opacity: 0; }
    }
  </style>

  <rect x="42" y="132" width="76" height="4" fill="#080A08" opacity=".5"/>
  <rect x="56" y="136" width="48" height="4" fill="#080A08" opacity=".24"/>

  <!-- tail -->
  <rect x="108" y="96" width="16" height="4" fill="#111511"/>
  <rect x="120" y="100" width="12" height="4" fill="#111511"/>
  <rect x="128" y="104" width="8" height="16" fill="#111511"/>
  <rect x="124" y="116" width="8" height="8" fill="#111511"/>
  <rect x="116" y="120" width="12" height="4" fill="#111511"/>
  <rect x="112" y="100" width="12" height="4" fill="#343934"/>
  <rect x="124" y="104" width="8" height="12" fill="#343934"/>
  <rect x="120" y="116" width="8" height="4" fill="#414741"/>

  <!-- uniform body -->
  <rect x="48" y="88" width="64" height="36" fill="#111511"/>
  <rect x="52" y="84" width="56" height="44" fill="#17263A"/>
  <rect x="56" y="88" width="48" height="32" fill="#203550"/>
  <rect x="52" y="92" width="8" height="24" fill="#15283E"/>
  <rect x="100" y="92" width="8" height="24" fill="#15283E"/>
  <rect x="76" y="88" width="8" height="32" fill="#D8D2C6"/>
  <rect x="80" y="88" width="4" height="32" fill="#ECE7DD"/>

  <!-- belt and paws -->
  <rect x="56" y="116" width="48" height="4" fill="#0D1115"/>
  <rect x="76" y="116" width="12" height="8" fill="#BA914D"/>
  <rect x="80" y="120" width="4" height="4" fill="#F0CF7E"/>
  <rect x="52" y="120" width="20" height="8" fill="#202420"/>
  <rect x="88" y="120" width="20" height="8" fill="#202420"/>
  <rect x="56" y="120" width="12" height="4" fill="#454B45"/>
  <rect x="92" y="120" width="12" height="4" fill="#454B45"/>

  <!-- shirt pockets -->
  <rect x="60" y="96" width="12" height="12" fill="#15283E"/>
  <rect x="88" y="96" width="12" height="12" fill="#15283E"/>
  <rect x="60" y="96" width="12" height="4" fill="#2A4668"/>
  <rect x="88" y="96" width="12" height="4" fill="#2A4668"/>

  <!-- police badge -->
  <rect x="92" y="88" width="8" height="4" fill="#D3A64F"/>
  <rect x="88" y="92" width="16" height="8" fill="#D3A64F"/>
  <rect x="92" y="100" width="8" height="4" fill="#D3A64F"/>
  <rect x="96" y="92" width="4" height="4" fill="#F2D985"/>

  <!-- ears -->
  <rect x="44" y="28" width="8" height="20" fill="#121512"/>
  <rect x="48" y="24" width="8" height="20" fill="#121512"/>
  <rect x="52" y="32" width="8" height="12" fill="#121512"/>
  <rect x="108" y="32" width="8" height="12" fill="#121512"/>
  <rect x="112" y="24" width="8" height="20" fill="#121512"/>
  <rect x="116" y="28" width="8" height="20" fill="#121512"/>
  <rect x="48" y="28" width="4" height="12" fill="#A97980"/>
  <rect x="116" y="28" width="4" height="12" fill="#A97980"/>

  <!-- head -->
  <rect x="48" y="40" width="64" height="4" fill="#121512"/>
  <rect x="44" y="44" width="72" height="4" fill="#121512"/>
  <rect x="40" y="48" width="80" height="32" fill="#121512"/>
  <rect x="44" y="80" width="72" height="8" fill="#121512"/>
  <rect x="44" y="48" width="72" height="28" fill="#363B36"/>
  <rect x="48" y="76" width="64" height="8" fill="#363B36"/>
  <rect x="44" y="60" width="4" height="12" fill="#2B302B"/>
  <rect x="112" y="60" width="4" height="12" fill="#2B302B"/>

  <!-- eyes -->
  <rect x="52" y="56" width="24" height="12" fill="#181B18"/>
  <rect x="84" y="56" width="24" height="12" fill="#181B18"/>
  <rect x="56" y="56" width="16" height="12" fill="#B7CA78"/>
  <rect x="88" y="56" width="16" height="12" fill="#B7CA78"/>
  <rect x="60" y="56" width="8" height="12" fill="#0B0D0B"/>
  <rect x="92" y="56" width="8" height="12" fill="#0B0D0B"/>
  <rect x="60" y="56" width="4" height="4" fill="#F6F7ED"/>
  <rect x="92" y="56" width="4" height="4" fill="#F6F7ED"/>

  <!-- muzzle -->
  <rect x="52" y="68" width="16" height="8" fill="#CFC8BB"/>
  <rect x="92" y="68" width="16" height="8" fill="#CFC8BB"/>
  <rect x="68" y="68" width="24" height="4" fill="#E8E2D7"/>
  <rect x="64" y="72" width="32" height="8" fill="#E8E2D7"/>
  <rect x="68" y="80" width="24" height="4" fill="#D8D1C5"/>
  <rect x="76" y="68" width="8" height="4" fill="#B98589"/>
  <rect x="80" y="72" width="4" height="4" fill="#8F666B"/>
  <rect x="76" y="80" width="12" height="4" fill="#595D58"/>

  <!-- whiskers -->
  <rect x="28" y="68" width="24" height="4" fill="#747A74" opacity=".6"/>
  <rect x="32" y="76" width="20" height="4" fill="#606660" opacity=".42"/>
  <rect x="108" y="68" width="24" height="4" fill="#747A74" opacity=".6"/>
  <rect x="108" y="76" width="20" height="4" fill="#606660" opacity=".42"/>

  <!-- police cap -->
  <rect x="52" y="20" width="56" height="4" fill="#0D141E"/>
  <rect x="48" y="24" width="64" height="8" fill="#17263A"/>
  <rect x="44" y="32" width="72" height="8" fill="#203550"/>
  <rect x="40" y="40" width="80" height="4" fill="#0D141E"/>
  <rect x="60" y="16" width="40" height="4" fill="#17263A"/>
  <rect x="64" y="20" width="32" height="4" fill="#2A4668"/>
  <rect x="76" y="24" width="8" height="4" fill="#D3A64F"/>
  <rect x="72" y="28" width="16" height="8" fill="#D3A64F"/>
  <rect x="76" y="32" width="8" height="4" fill="#F2D985"/>

  <g class="mnemos-police-eyelids">
    <rect x="52" y="52" width="24" height="16" fill="#363B36"/>
    <rect x="84" y="52" width="24" height="16" fill="#363B36"/>
    <rect x="56" y="61" width="16" height="3" fill="#181B18"/>
    <rect x="88" y="61" width="16" height="3" fill="#181B18"/>
  </g>
</svg>
