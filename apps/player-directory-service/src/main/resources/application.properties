spring.application.name=player-directory-service
server.port=${SERVER_PORT:8092}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mnemos?currentSchema=player_directory,public}
spring.datasource.username=${APP_POSTGRES_USER}
spring.datasource.password=${APP_POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=player_directory

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

mnemos.kafka.manage-topics=${MNEMOS_KAFKA_MANAGE_TOPICS:true}
mnemos.inbox.enabled=true
mnemos.outbox.enabled=true
mnemos.outbox.publisher.enabled=true
mnemos.outbox.publisher.fixed-delay=100ms

mnemos.security.internal.api-keys.account-service=${ACCOUNT_SERVICE_PLAYER_DIRECTORY_API_KEY}
mnemos.security.internal.api-keys.telegram-bot-service=${TELEGRAM_BOT_SERVICE_PLAYER_DIRECTORY_API_KEY}

mnemos.player-directory.account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
mnemos.player-directory.account-service.api-key=${PLAYER_DIRECTORY_SERVICE_ACCOUNT_API_KEY:}
mnemos.player-directory.account-bootstrap.batch-size=${PLAYER_DIRECTORY_ACCOUNT_BOOTSTRAP_BATCH_SIZE:200}
mnemos.player-directory.account-bootstrap.fixed-delay-ms=${PLAYER_DIRECTORY_ACCOUNT_BOOTSTRAP_DELAY_MS:2000}
mnemos.player-directory.account-bootstrap.initial-delay-ms=${PLAYER_DIRECTORY_ACCOUNT_BOOTSTRAP_INITIAL_DELAY_MS:5000}

mnemos.player-directory.cristalix-api.url=${CRISTALIX_API_URL:https://api.cristalix.gg}
mnemos.player-directory.cristalix-api.connect-timeout=${CRISTALIX_CONNECT_TIMEOUT:3s}
mnemos.player-directory.cristalix-api.read-timeout=${CRISTALIX_READ_TIMEOUT:5s}

mnemos.player-directory.cristalix-api.credentials.interactive.project-key=${CRISTALIX_INTERACTIVE_PROJECT_KEY:}
mnemos.player-directory.cristalix-api.credentials.interactive.project-token=${CRISTALIX_INTERACTIVE_PROJECT_TOKEN:}
mnemos.player-directory.cristalix-api.credentials.interactive.rate-limit.permits=${CRISTALIX_INTERACTIVE_RATE_LIMIT:280}
mnemos.player-directory.cristalix-api.credentials.interactive.rate-limit.refresh-period=1m
mnemos.player-directory.cristalix-api.credentials.interactive.rate-limit.timeout=2s

mnemos.player-directory.cristalix-api.credentials.monitoring.project-key=${CRISTALIX_MONITORING_PROJECT_KEY:}
mnemos.player-directory.cristalix-api.credentials.monitoring.project-token=${CRISTALIX_MONITORING_PROJECT_TOKEN:}
mnemos.player-directory.cristalix-api.credentials.monitoring.rate-limit.permits=${CRISTALIX_MONITORING_RATE_LIMIT:240}
mnemos.player-directory.cristalix-api.credentials.monitoring.rate-limit.refresh-period=1m
mnemos.player-directory.cristalix-api.credentials.monitoring.rate-limit.timeout=0s

mnemos.player-directory.cristalix-api.credentials.reserve.project-key=${CRISTALIX_RESERVE_PROJECT_KEY:}
mnemos.player-directory.cristalix-api.credentials.reserve.project-token=${CRISTALIX_RESERVE_PROJECT_TOKEN:}
mnemos.player-directory.cristalix-api.credentials.reserve.rate-limit.permits=${CRISTALIX_RESERVE_RATE_LIMIT:240}
mnemos.player-directory.cristalix-api.credentials.reserve.rate-limit.refresh-period=1m
mnemos.player-directory.cristalix-api.credentials.reserve.rate-limit.timeout=0s

mnemos.player-directory.presence.offline-confirmation-delay=${PLAYER_DIRECTORY_OFFLINE_CONFIRMATION_DELAY:10s}
mnemos.player-directory.presence.required-offline-observations=${PLAYER_DIRECTORY_REQUIRED_OFFLINE_OBSERVATIONS:2}

mnemos.player-directory.observability.refresh-interval=${PLAYER_DIRECTORY_OBSERVABILITY_REFRESH_INTERVAL:15s}
mnemos.player-directory.observability.stale-presence-after=${PLAYER_DIRECTORY_OBSERVABILITY_STALE_PRESENCE_AFTER:5m}

mnemos.player-directory.realms.freshness=${PLAYER_DIRECTORY_REALM_FRESHNESS:1m}
mnemos.player-directory.realms.cache-ttl=${PLAYER_DIRECTORY_REALM_CACHE_TTL:10s}

mnemos.player-directory.resolution.batch-size=${PLAYER_DIRECTORY_RESOLUTION_BATCH_SIZE:50}
mnemos.player-directory.resolution.lease-duration=${PLAYER_DIRECTORY_RESOLUTION_LEASE_DURATION:30s}
mnemos.player-directory.resolution.retry-backoff=${PLAYER_DIRECTORY_RESOLUTION_RETRY_BACKOFF:30s}
mnemos.player-directory.resolution.maximum-retry-backoff=${PLAYER_DIRECTORY_RESOLUTION_MAXIMUM_RETRY_BACKOFF:10m}
mnemos.player-directory.resolution.scheduler-delay-ms=${PLAYER_DIRECTORY_RESOLUTION_SCHEDULER_DELAY_MS:1000}

mnemos.player-directory.tracking.batch-size=${PLAYER_DIRECTORY_TRACKING_BATCH_SIZE:50}
mnemos.player-directory.tracking.lease-duration=${PLAYER_DIRECTORY_TRACKING_LEASE_DURATION:30s}
mnemos.player-directory.tracking.subscription-poll-interval=${PLAYER_DIRECTORY_SUBSCRIPTION_POLL_INTERVAL:20s}
mnemos.player-directory.tracking.sao-online-poll-interval=${PLAYER_DIRECTORY_SAO_ONLINE_POLL_INTERVAL:20s}
mnemos.player-directory.tracking.high-activity-poll-interval=${PLAYER_DIRECTORY_HIGH_ACTIVITY_POLL_INTERVAL:1m}
mnemos.player-directory.tracking.low-activity-poll-interval=${PLAYER_DIRECTORY_LOW_ACTIVITY_POLL_INTERVAL:2m}
mnemos.player-directory.tracking.linked-account-poll-interval=${PLAYER_DIRECTORY_LINKED_ACCOUNT_POLL_INTERVAL:6h}
mnemos.player-directory.tracking.unverifiable-poll-interval=${PLAYER_DIRECTORY_UNVERIFIABLE_POLL_INTERVAL:2m}
mnemos.player-directory.tracking.low-activity-drop-threshold=${PLAYER_DIRECTORY_LOW_ACTIVITY_DROP_THRESHOLD:15}
mnemos.player-directory.tracking.low-activity-retention=${PLAYER_DIRECTORY_LOW_ACTIVITY_RETENTION:48h}
mnemos.player-directory.tracking.high-activity-retention=${PLAYER_DIRECTORY_HIGH_ACTIVITY_RETENTION:336h}
mnemos.player-directory.tracking.failure-backoff=${PLAYER_DIRECTORY_FAILURE_BACKOFF:30s}
mnemos.player-directory.tracking.maximum-failure-backoff=${PLAYER_DIRECTORY_MAXIMUM_FAILURE_BACKOFF:10m}
mnemos.player-directory.tracking.scheduler-delay-ms=${PLAYER_DIRECTORY_TRACKING_SCHEDULER_DELAY_MS:1000}
