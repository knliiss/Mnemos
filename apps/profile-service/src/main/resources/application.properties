spring.application.name=profile-service
server.port=${SERVER_PORT:8091}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mnemos?currentSchema=profile,public}
spring.datasource.username=${APP_POSTGRES_USER}
spring.datasource.password=${APP_POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=profile

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

mnemos.kafka.manage-topics=${MNEMOS_KAFKA_MANAGE_TOPICS:true}
mnemos.inbox.enabled=true

mnemos.profile.account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
mnemos.profile.account-service.api-key=${PROFILE_SERVICE_ACCOUNT_API_KEY:}
mnemos.profile.personalization-service.base-url=${PERSONALIZATION_SERVICE_URL:http://localhost:8089}
mnemos.profile.personalization-service.api-key=${PROFILE_SERVICE_PERSONALIZATION_API_KEY:}
mnemos.profile.appearance-reconciliation-max-age=${PROFILE_APPEARANCE_RECONCILIATION_MAX_AGE:30s}
mnemos.profile.bootstrap.batch-size=${PROFILE_BOOTSTRAP_BATCH_SIZE:200}
mnemos.profile.bootstrap.fixed-delay-ms=${PROFILE_BOOTSTRAP_DELAY_MS:2000}
mnemos.profile.social-reconciliation-delay-ms=${PROFILE_SOCIAL_RECONCILIATION_DELAY_MS:5000}
