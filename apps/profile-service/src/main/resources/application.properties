spring.application.name=profile-service
spring.datasource.url=${PROFILE_DB_URL:jdbc:postgresql://localhost:5432/mnemos_profile}
spring.datasource.username=${PROFILE_DB_USERNAME:postgres}
spring.datasource.password=${PROFILE_DB_PASSWORD:postgres}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.kafka.consumer.auto-offset-reset=earliest
