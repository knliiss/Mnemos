spring.application.name=payment-service
server.port=${SERVER_PORT:8093}

spring.datasource.url=jdbc:postgresql://localhost:5433/mnemos?currentSchema=payment
spring.datasource.username=${APP_POSTGRES_USER}
spring.datasource.password=${APP_POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.schemas=payment

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

mnemos.kafka.manage-topics=${MNEMOS_KAFKA_MANAGE_TOPICS:true}
mnemos.outbox.enabled=true
mnemos.outbox.publisher.enabled=true
mnemos.inbox.enabled=true

mnemos.clients.telegram-bot-service.url=${TELEGRAM_BOT_SERVICE_URL:http://localhost:8094}
mnemos.clients.telegram-bot-service.api-key=${PAYMENT_SERVICE_TELEGRAM_BOT_API_KEY:}

mnemos.security.internal.api-keys.telegram-bot-service=${TELEGRAM_BOT_SERVICE_PAYMENT_API_KEY:}

mnemos.payment.stars.packages=${MNEMOS_PAYMENT_STAR_PACKAGES:25:25,50:50,100:100,250:250,500:500,1000:1000}
mnemos.payment.stars.invoice-lifetime=${MNEMOS_PAYMENT_STAR_INVOICE_LIFETIME:15m}
mnemos.payment.stars.invoice-photo-url=${MNEMOS_PAYMENT_STAR_INVOICE_PHOTO_URL:https://app.knalis.rest/ui-illustrations/prime-cache.png}
