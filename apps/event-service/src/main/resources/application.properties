spring.application.name=event-service

server.port=${SERVER_PORT:8083}

spring.datasource.url=jdbc:postgresql://localhost:5433/mnemos?currentSchema=event,public
spring.datasource.username=${APP_POSTGRES_USER}
spring.datasource.password=${APP_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.schemas=event

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences[0]=mnemos-api

mnemos.outbox.enabled=true
mnemos.outbox.publisher.enabled=true
mnemos.inbox.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

mnemos.kafka.manage-topics=${MNEMOS_KAFKA_MANAGE_TOPICS:true}
mnemos.outbox.publisher.fixed-delay=100ms

mnemos.event.global.active-duration=${MNEMOS_GLOBAL_EVENT_ACTIVE_DURATION:15m}
mnemos.event.global.maximum-simultaneous-events=${MNEMOS_GLOBAL_EVENT_MAXIMUM_SIMULTANEOUS_EVENTS:3}
mnemos.event.identity-resolution.max-age=${MNEMOS_EVENT_IDENTITY_RESOLUTION_MAX_AGE:30m}

logging.level.com.mnemos.messaging.outbox=DEBUG
logging.level.com.mnemos.messaging.kafka=DEBUG

mnemos.security.internal.api-keys.bet-service=${BET_SERVICE_EVENT_API_KEY}
mnemos.security.internal.api-keys.social-service=${SOCIAL_SERVICE_EVENT_API_KEY}
