spring.application.name=account-service

server.port=${SERVER_PORT:8082}

spring.datasource.url=${APP_DATASOURCE_URL}
spring.datasource.username=${APP_POSTGRES_USER}
spring.datasource.password=${APP_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

mnemos.outbox.enabled=true
mnemos.outbox.producer=wallet-service
mnemos.outbox.require-transaction=true

mnemos.outbox.cleanup.enabled=true
mnemos.outbox.cleanup.initial-delay=10m
mnemos.outbox.cleanup.fixed-delay=1h
mnemos.outbox.cleanup.published-retention=7d
mnemos.outbox.cleanup.dead-retention=30d
mnemos.outbox.cleanup.batch-size=1000
mnemos.outbox.cleanup.max-batches-per-run=10


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.client-id=wallet-service

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

mnemos.kafka.enabled=true
mnemos.kafka.manage-topics=false