spring.application.name=moderation-service

server.port=${SERVER_PORT:8087}

spring.datasource.url=jdbc:postgresql://localhost:5433/mnemos?currentSchema=moderation
spring.datasource.username=${APP_POSTGRES_USER:mnemos}
spring.datasource.password=${APP_POSTGRES_PASSWORD:mnemos_local_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=moderation

spring.security.oauth2.resourceserver.jwt.issuer-uri=${MNEMOS_AUTH_ORIGIN:http://localhost:8080}/realms/mnemos
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/certs

spring.security.oauth2.client.registration.keycloak-moderation.provider=keycloak-moderation
spring.security.oauth2.client.registration.keycloak-moderation.client-id=${MNEMOS_MODERATION_SERVICE_CLIENT_ID:moderation-service-admin}
spring.security.oauth2.client.registration.keycloak-moderation.client-secret=${KEYCLOAK_MODERATION_SERVICE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.keycloak-moderation.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak-moderation.token-uri=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}/realms/mnemos/protocol/openid-connect/token

mnemos.keycloak-admin.url=${MNEMOS_KEYCLOAK_INTERNAL_URL:http://localhost:8080}
mnemos.keycloak-admin.realm=${MNEMOS_KEYCLOAK_ADMIN_REALM:mnemos}

mnemos.security.internal.api-keys.gateway-service=${GATEWAY_MODERATION_API_KEY}

mnemos.clients.wallet-service.url=${WALLET_SERVICE_URL:http://localhost:8082}
mnemos.clients.wallet-service.api-key=${MODERATION_SERVICE_WALLET_API_KEY:}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

mnemos.kafka.manage-topics=${MNEMOS_KAFKA_MANAGE_TOPICS:true}

mnemos.outbox.enabled=true
mnemos.outbox.publisher.enabled=true
mnemos.inbox.enabled=true
