x-production-datasource-defaults: &production-datasource-defaults
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "5000"
  SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: "3000"
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "60000"
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1800000"
  SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: "300000"

