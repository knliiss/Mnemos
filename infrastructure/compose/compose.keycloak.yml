services:
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME:-mnemos}-keycloak
    hostname: keycloak
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    command:
      - start

    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${MNEMOS_AUTH_ORIGIN}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      KC_LOG_LEVEL: ${KEYCLOAK_ROOT_LOG_LEVEL:-INFO}
      KC_LOG_LEVEL_COM_MNEMOS_KEYCLOAK_TELEGRAM: ${TELEGRAM_AUTH_LOG_LEVEL:-INFO}

      MNEMOS_TELEGRAM_BOT_TOKEN: ${MNEMOS_TELEGRAM_BOT_TOKEN}
      MNEMOS_TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${MNEMOS_TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-300}
      MNEMOS_SUPER_ADMIN_TELEGRAM_ID: ${MNEMOS_SUPER_ADMIN_TELEGRAM_ID:-}
      MNEMOS_ACCOUNT_SERVICE_CLIENT_ID: ${MNEMOS_ACCOUNT_SERVICE_CLIENT_ID}

    volumes:
      - type: bind
        source: ../../keycloak-extensions/telegram-authenticator/build/libs/mnemos-telegram-authenticator.jar
        target: /opt/keycloak/providers/mnemos-telegram-authenticator.jar
        read_only: true
        bind:
          create_host_path: false
      - ../keycloak/themes/mnemos:/opt/keycloak/themes/mnemos:ro

    ports:
      - "${MNEMOS_HOST_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_HOST_PORT:-8079}:8080"

    depends_on:
      keycloak-postgres:
        condition: service_healthy

    networks:
      - mnemos-network
