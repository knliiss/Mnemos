services:
  bot-management-service:
    container_name: mnemos-bot-management-service
    build:
      context: ../..
      dockerfile: apps/bot-management-service/Dockerfile
    image: mnemos/bot-management-service:${BOT_MANAGEMENT_SERVICE_VERSION:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8095
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/${APP_POSTGRES_DB}?currentSchema=bot_management
      BOT_MANAGEMENT_POSTGRES_USER: ${BOT_MANAGEMENT_POSTGRES_USER}
      BOT_MANAGEMENT_POSTGRES_PASSWORD: ${BOT_MANAGEMENT_POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DATASOURCE_MAX_POOL_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DATASOURCE_MIN_IDLE:-1}
      MNEMOS_AUTH_ORIGIN: ${MNEMOS_AUTH_ORIGIN}
      MNEMOS_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      MNEMOS_BOT_REALTIME_URL: http://realtime-service:8088
      MNEMOS_BOT_INTERNAL_TOKEN: ${MNEMOS_BOT_INTERNAL_TOKEN}
    depends_on:
      app-postgres-security-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    networks:
      - mnemos-network
