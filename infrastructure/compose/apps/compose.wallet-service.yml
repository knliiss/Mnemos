services:
  wallet-service:
    container_name: mnemos-wallet-service

    build:
      context: ../..
      dockerfile: apps/wallet-service/Dockerfile

    image: mnemos/wallet-service:${WALLET_SERVICE_VERSION:-local}

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker

      SERVER_PORT: 8082

      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/${APP_POSTGRES_DB}?currentSchema=wallet
      SPRING_DATASOURCE_USERNAME: ${WALLET_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${WALLET_POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DATASOURCE_MAX_POOL_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DATASOURCE_MIN_IDLE:-1}

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${MNEMOS_AUTH_ORIGIN}/realms/mnemos
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/mnemos/protocol/openid-connect/certs

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"wallet_service\" password=\"${KAFKA_WALLET_SERVICE_PASSWORD}\";"
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/mnemos/kafka/kafka.truststore.p12
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TLS_STORE_PASSWORD}
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
      MNEMOS_KAFKA_MANAGE_TOPICS: "false"
      MNEMOS_KAFKA_MESSAGEAUTH_ENABLED: "true"
      MNEMOS_KAFKA_MESSAGEAUTH_PRIVATEKEY: ${WALLET_SERVICE_KAFKA_SIGNING_PRIVATE_KEY}
      MNEMOS_KAFKA_MESSAGEAUTH_TRUSTEDPUBLICKEYS: ${MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS}

      ACCOUNT_SERVICE_URL: http://account-service:8081
      WALLET_SERVICE_ACCOUNT_API_KEY: ${WALLET_SERVICE_ACCOUNT_API_KEY}
      WALLET_SERVICE_TELEGRAM_BOT_API_KEY: ${WALLET_SERVICE_TELEGRAM_BOT_API_KEY}
      MODERATION_SERVICE_WALLET_API_KEY: ${MODERATION_SERVICE_WALLET_API_KEY}
      MNEMOS_WALLET_COIN_PER_PRIME: ${MNEMOS_WALLET_COIN_PER_PRIME:-100}
      MNEMOS_WALLET_COIN_PURCHASE_PRIME_AMOUNTS: ${MNEMOS_WALLET_COIN_PURCHASE_PRIME_AMOUNTS:-5,10,25,50,100,250}

    volumes:
      - "kafka-client-tls:/etc/mnemos/kafka:ro"

    depends_on:
      app-postgres-security-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    networks:
      - mnemos-network
