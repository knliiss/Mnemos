services:
  wallet-service:
    container_name: mnemos-wallet-service

    build:
      context: ../..
      dockerfile: apps/wallet-service/Dockerfile

    image: mnemos/wallet-service:${WALLET_SERVICE_VERSION:-local}

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker

      SERVER_PORT: 8082

      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/${APP_POSTGRES_DB}?currentSchema=wallet
      SPRING_DATASOURCE_USERNAME: ${APP_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_POSTGRES_PASSWORD}

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${MNEMOS_AUTH_ORIGIN}/realms/mnemos
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/mnemos/protocol/openid-connect/certs

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"wallet_service\" password=\"${KAFKA_WALLET_SERVICE_PASSWORD}\";"
      MNEMOS_KAFKA_MANAGE_TOPICS: "false"
      MNEMOS_KAFKA_MESSAGE_AUTH_ENABLED: "true"
      MNEMOS_KAFKA_MESSAGE_AUTH_PRIVATE_KEY: ${WALLET_SERVICE_KAFKA_SIGNING_PRIVATE_KEY}
      MNEMOS_KAFKA_MESSAGE_AUTH_TRUSTED_PUBLIC_KEYS: ${MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS}

      ACCOUNT_SERVICE_URL: http://account-service:8081
      WALLET_SERVICE_ACCOUNT_API_KEY: ${WALLET_SERVICE_ACCOUNT_API_KEY}

    depends_on:
      app-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    networks:
      - mnemos-network
