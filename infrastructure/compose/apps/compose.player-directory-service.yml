services:
  player-directory-service:
    container_name: mnemos-player-directory-service

    build:
      context: ../..
      dockerfile: apps/player-directory-service/Dockerfile

    image: mnemos/player-directory-service:${PLAYER_DIRECTORY_SERVICE_VERSION:-local}
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8092

      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/${APP_POSTGRES_DB}?currentSchema=player_directory,public
      APP_POSTGRES_USER: ${PLAYER_DIRECTORY_POSTGRES_USER}
      APP_POSTGRES_PASSWORD: ${PLAYER_DIRECTORY_POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DATASOURCE_MAX_POOL_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DATASOURCE_MIN_IDLE:-1}

      MNEMOS_AUTH_ORIGIN: ${MNEMOS_AUTH_ORIGIN}
      MNEMOS_KEYCLOAK_INTERNAL_URL: http://keycloak:8080

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"player_directory_service\" password=\"${KAFKA_PLAYER_DIRECTORY_SERVICE_PASSWORD}\";"
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/mnemos/kafka/kafka.truststore.p12
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TLS_STORE_PASSWORD}
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
      MNEMOS_KAFKA_MANAGE_TOPICS: "false"
      MNEMOS_KAFKA_MESSAGEAUTH_ENABLED: "true"
      MNEMOS_KAFKA_MESSAGEAUTH_PRIVATEKEY: ${PLAYER_DIRECTORY_SERVICE_KAFKA_SIGNING_PRIVATE_KEY}
      MNEMOS_KAFKA_MESSAGEAUTH_TRUSTEDPUBLICKEYS: ${MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS}

      ACCOUNT_SERVICE_URL: http://account-service:8081
      ACCOUNT_SERVICE_PLAYER_DIRECTORY_API_KEY: ${ACCOUNT_SERVICE_PLAYER_DIRECTORY_API_KEY}
      PLAYER_DIRECTORY_SERVICE_ACCOUNT_API_KEY: ${PLAYER_DIRECTORY_SERVICE_ACCOUNT_API_KEY}
      PLAYER_DIRECTORY_ACCOUNT_BOOTSTRAP_BATCH_SIZE: ${PLAYER_DIRECTORY_ACCOUNT_BOOTSTRAP_BATCH_SIZE:-200}
      PLAYER_DIRECTORY_ACCOUNT_BOOTSTRAP_DELAY_MS: ${PLAYER_DIRECTORY_ACCOUNT_BOOTSTRAP_DELAY_MS:-2000}
      PLAYER_DIRECTORY_ACCOUNT_BOOTSTRAP_INITIAL_DELAY_MS: ${PLAYER_DIRECTORY_ACCOUNT_BOOTSTRAP_INITIAL_DELAY_MS:-5000}

      CRISTALIX_API_URL: ${CRISTALIX_API_URL}
      CRISTALIX_INTERACTIVE_PROJECT_KEY: ${CRISTALIX_INTERACTIVE_PROJECT_KEY}
      CRISTALIX_INTERACTIVE_PROJECT_TOKEN: ${CRISTALIX_INTERACTIVE_PROJECT_TOKEN}
      CRISTALIX_MONITORING_PROJECT_KEY: ${CRISTALIX_MONITORING_PROJECT_KEY}
      CRISTALIX_MONITORING_PROJECT_TOKEN: ${CRISTALIX_MONITORING_PROJECT_TOKEN}
      CRISTALIX_RESERVE_PROJECT_KEY: ${CRISTALIX_RESERVE_PROJECT_KEY}
      CRISTALIX_RESERVE_PROJECT_TOKEN: ${CRISTALIX_RESERVE_PROJECT_TOKEN}
      CRISTALIX_INTERACTIVE_RATE_LIMIT: ${CRISTALIX_INTERACTIVE_RATE_LIMIT:-280}
      CRISTALIX_MONITORING_RATE_LIMIT: ${CRISTALIX_MONITORING_RATE_LIMIT:-240}
      CRISTALIX_RESERVE_RATE_LIMIT: ${CRISTALIX_RESERVE_RATE_LIMIT:-240}

      PLAYER_DIRECTORY_OFFLINE_CONFIRMATION_DELAY: ${PLAYER_DIRECTORY_OFFLINE_CONFIRMATION_DELAY:-10s}
      PLAYER_DIRECTORY_REQUIRED_OFFLINE_OBSERVATIONS: ${PLAYER_DIRECTORY_REQUIRED_OFFLINE_OBSERVATIONS:-2}
      PLAYER_DIRECTORY_OBSERVABILITY_REFRESH_INTERVAL: ${PLAYER_DIRECTORY_OBSERVABILITY_REFRESH_INTERVAL:-15s}
      PLAYER_DIRECTORY_OBSERVABILITY_STALE_PRESENCE_AFTER: ${PLAYER_DIRECTORY_OBSERVABILITY_STALE_PRESENCE_AFTER:-5m}

      PLAYER_DIRECTORY_REALM_FRESHNESS: ${PLAYER_DIRECTORY_REALM_FRESHNESS:-1m}
      PLAYER_DIRECTORY_REALM_CACHE_TTL: ${PLAYER_DIRECTORY_REALM_CACHE_TTL:-10s}

      PLAYER_DIRECTORY_RESOLUTION_BATCH_SIZE: ${PLAYER_DIRECTORY_RESOLUTION_BATCH_SIZE:-50}
      PLAYER_DIRECTORY_RESOLUTION_LEASE_DURATION: ${PLAYER_DIRECTORY_RESOLUTION_LEASE_DURATION:-30s}
      PLAYER_DIRECTORY_RESOLUTION_RETRY_BACKOFF: ${PLAYER_DIRECTORY_RESOLUTION_RETRY_BACKOFF:-30s}
      PLAYER_DIRECTORY_RESOLUTION_MAXIMUM_RETRY_BACKOFF: ${PLAYER_DIRECTORY_RESOLUTION_MAXIMUM_RETRY_BACKOFF:-10m}
      PLAYER_DIRECTORY_RESOLUTION_SCHEDULER_DELAY_MS: ${PLAYER_DIRECTORY_RESOLUTION_SCHEDULER_DELAY_MS:-1000}

      PLAYER_DIRECTORY_TRACKING_BATCH_SIZE: ${PLAYER_DIRECTORY_TRACKING_BATCH_SIZE:-50}
      PLAYER_DIRECTORY_TRACKING_LEASE_DURATION: ${PLAYER_DIRECTORY_TRACKING_LEASE_DURATION:-30s}
      PLAYER_DIRECTORY_SUBSCRIPTION_POLL_INTERVAL: ${PLAYER_DIRECTORY_SUBSCRIPTION_POLL_INTERVAL:-20s}
      PLAYER_DIRECTORY_SAO_ONLINE_POLL_INTERVAL: ${PLAYER_DIRECTORY_SAO_ONLINE_POLL_INTERVAL:-20s}
      PLAYER_DIRECTORY_HIGH_ACTIVITY_POLL_INTERVAL: ${PLAYER_DIRECTORY_HIGH_ACTIVITY_POLL_INTERVAL:-1m}
      PLAYER_DIRECTORY_LOW_ACTIVITY_POLL_INTERVAL: ${PLAYER_DIRECTORY_LOW_ACTIVITY_POLL_INTERVAL:-2m}
      PLAYER_DIRECTORY_UNVERIFIABLE_POLL_INTERVAL: ${PLAYER_DIRECTORY_UNVERIFIABLE_POLL_INTERVAL:-2m}
      PLAYER_DIRECTORY_LOW_ACTIVITY_DROP_THRESHOLD: ${PLAYER_DIRECTORY_LOW_ACTIVITY_DROP_THRESHOLD:-15}
      PLAYER_DIRECTORY_LOW_ACTIVITY_RETENTION: ${PLAYER_DIRECTORY_LOW_ACTIVITY_RETENTION:-48h}
      PLAYER_DIRECTORY_HIGH_ACTIVITY_RETENTION: ${PLAYER_DIRECTORY_HIGH_ACTIVITY_RETENTION:-336h}
      PLAYER_DIRECTORY_FAILURE_BACKOFF: ${PLAYER_DIRECTORY_FAILURE_BACKOFF:-30s}
      PLAYER_DIRECTORY_MAXIMUM_FAILURE_BACKOFF: ${PLAYER_DIRECTORY_MAXIMUM_FAILURE_BACKOFF:-10m}
      PLAYER_DIRECTORY_TRACKING_SCHEDULER_DELAY_MS: ${PLAYER_DIRECTORY_TRACKING_SCHEDULER_DELAY_MS:-1000}

    volumes:
      - "kafka-client-tls:/etc/mnemos/kafka:ro"

    depends_on:
      app-postgres-security-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    networks:
      - mnemos-network
