services:
  moderation-service:
    container_name: mnemos-moderation-service
    build:
      context: ../..
      dockerfile: apps/moderation-service/Dockerfile
    image: mnemos/moderation-service:${MODERATION_SERVICE_VERSION:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/${APP_POSTGRES_DB}?currentSchema=moderation
      SPRING_DATASOURCE_USERNAME: ${MODERATION_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${MODERATION_POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DATASOURCE_MAX_POOL_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DATASOURCE_MIN_IDLE:-1}
      MNEMOS_AUTH_ORIGIN: ${MNEMOS_AUTH_ORIGIN}
      MNEMOS_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"moderation_service\" password=\"${KAFKA_MODERATION_SERVICE_PASSWORD}\";"
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/mnemos/kafka/kafka.truststore.p12
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TLS_STORE_PASSWORD}
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
      MNEMOS_KAFKA_MANAGE_TOPICS: "false"
      MNEMOS_KAFKA_MESSAGEAUTH_ENABLED: "true"
      MNEMOS_KAFKA_MESSAGEAUTH_PRIVATEKEY: ${MODERATION_SERVICE_KAFKA_SIGNING_PRIVATE_KEY}
      MNEMOS_KAFKA_MESSAGEAUTH_TRUSTEDPUBLICKEYS: ${MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS}
      MNEMOS_MODERATION_SERVICE_CLIENT_ID: ${MNEMOS_MODERATION_SERVICE_CLIENT_ID}
      KEYCLOAK_MODERATION_SERVICE_CLIENT_SECRET: ${KEYCLOAK_MODERATION_SERVICE_CLIENT_SECRET}
      GATEWAY_MODERATION_API_KEY: ${GATEWAY_MODERATION_API_KEY}
      WALLET_SERVICE_URL: http://wallet-service:8082
      MODERATION_SERVICE_WALLET_API_KEY: ${MODERATION_SERVICE_WALLET_API_KEY}
    volumes:
      - "kafka-client-tls:/etc/mnemos/kafka:ro"
    depends_on:
      app-postgres-security-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - mnemos-network
