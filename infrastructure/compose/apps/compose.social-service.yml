services:
  social-service:
    container_name: mnemos-social-service
    build:
      context: ../..
      dockerfile: apps/social-service/Dockerfile
    image: mnemos/social-service:${SOCIAL_SERVICE_VERSION:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/${APP_POSTGRES_DB}?currentSchema=social
      APP_POSTGRES_USER: ${APP_POSTGRES_USER}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      MNEMOS_AUTH_ORIGIN: ${MNEMOS_AUTH_ORIGIN}
      MNEMOS_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"social_service\" password=\"${KAFKA_SOCIAL_SERVICE_PASSWORD}\";"
      MNEMOS_KAFKA_MANAGE_TOPICS: "false"
      MNEMOS_KAFKA_MESSAGEAUTH_ENABLED: "true"
      MNEMOS_KAFKA_MESSAGEAUTH_PRIVATEKEY: ${SOCIAL_SERVICE_KAFKA_SIGNING_PRIVATE_KEY}
      MNEMOS_KAFKA_MESSAGEAUTH_TRUSTEDPUBLICKEYS: ${MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS}
      ACCOUNT_SERVICE_URL: http://account-service:8081
      EVENT_SERVICE_URL: http://event-service:8083
      PERSONALIZATION_SERVICE_URL: http://personalization-service:8089
      SOCIAL_SERVICE_ACCOUNT_API_KEY: ${SOCIAL_SERVICE_ACCOUNT_API_KEY}
      SOCIAL_SERVICE_EVENT_API_KEY: ${SOCIAL_SERVICE_EVENT_API_KEY}
      SOCIAL_SERVICE_PERSONALIZATION_API_KEY: ${SOCIAL_SERVICE_PERSONALIZATION_API_KEY}
      SPOTLIGHT_PRICE_PRIME: ${SPOTLIGHT_PRICE_PRIME:-25}
    depends_on:
      app-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      account-service:
        condition: service_started
      event-service:
        condition: service_started
      personalization-service:
        condition: service_started
    networks:
      - mnemos-network
