services:
  realtime-service:
    container_name: mnemos-realtime-service
    build:
      context: ../..
      dockerfile: apps/realtime-service/Dockerfile
    image: mnemos/realtime-service:${REALTIME_SERVICE_VERSION:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/${APP_POSTGRES_DB}?currentSchema=realtime
      SPRING_DATASOURCE_USERNAME: ${APP_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_POSTGRES_PASSWORD}
      MNEMOS_AUTH_ORIGIN: ${MNEMOS_AUTH_ORIGIN}
      MNEMOS_FRONTEND_ORIGIN: ${MNEMOS_FRONTEND_ORIGIN}
      MNEMOS_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      MNEMOS_REALTIME_FORWARDING_TOKEN: ${MNEMOS_REALTIME_FORWARDING_TOKEN}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"realtime_service\" password=\"${KAFKA_REALTIME_SERVICE_PASSWORD}\";"
      MNEMOS_KAFKA_MANAGE_TOPICS: "false"
      MNEMOS_KAFKA_MESSAGEAUTH_ENABLED: "true"
      MNEMOS_KAFKA_MESSAGEAUTH_PRIVATEKEY: ${REALTIME_SERVICE_KAFKA_SIGNING_PRIVATE_KEY}
      MNEMOS_KAFKA_MESSAGEAUTH_TRUSTEDPUBLICKEYS: ${MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      app-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - mnemos-network
