services:
  event-service:
    container_name: mnemos-event-service

    build:
      context: ../..
      dockerfile: apps/event-service/Dockerfile

    image: mnemos/event-service:${EVENT_SERVICE_VERSION:-local}

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker

      SERVER_PORT: 8083

      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/${APP_POSTGRES_DB}?currentSchema=event,public
      SPRING_DATASOURCE_USERNAME: ${APP_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DATASOURCE_MAX_POOL_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DATASOURCE_MIN_IDLE:-1}

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${MNEMOS_AUTH_ORIGIN}/realms/mnemos
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/mnemos/protocol/openid-connect/certs

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"event_service\" password=\"${KAFKA_EVENT_SERVICE_PASSWORD}\";"
      MNEMOS_KAFKA_MANAGE_TOPICS: "false"
      MNEMOS_KAFKA_MESSAGEAUTH_ENABLED: "true"
      MNEMOS_KAFKA_MESSAGEAUTH_PRIVATEKEY: ${EVENT_SERVICE_KAFKA_SIGNING_PRIVATE_KEY}
      MNEMOS_KAFKA_MESSAGEAUTH_TRUSTEDPUBLICKEYS: ${MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS}

      BET_SERVICE_EVENT_API_KEY: ${BET_SERVICE_EVENT_API_KEY}
      SOCIAL_SERVICE_EVENT_API_KEY: ${SOCIAL_SERVICE_EVENT_API_KEY}

    depends_on:
      app-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    networks:
      - mnemos-network
