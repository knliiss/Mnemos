services:
  account-service:
    container_name: mnemos-account-service

    build:
      context: ../..
      dockerfile: apps/account-service/Dockerfile

    image: mnemos/account-service:${ACCOUNT_SERVICE_VERSION:-local}
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081

      SPRING_DATASOURCE_URL: jdbc:postgresql://app-postgres:5432/${APP_POSTGRES_DB}?currentSchema=account
      SPRING_DATASOURCE_USERNAME: ${ACCOUNT_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DATASOURCE_MAX_POOL_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DATASOURCE_MIN_IDLE:-1}

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${MNEMOS_AUTH_ORIGIN}/realms/mnemos
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/mnemos/protocol/openid-connect/certs

      MNEMOS_KEYCLOAK_ADMIN_SERVER_URL: ${MNEMOS_AUTH_ORIGIN}
      MNEMOS_KEYCLOAK_ADMIN_REALM: mnemos
      MNEMOS_KEYCLOAK_ADMIN_CLIENT_ID: ${MNEMOS_ACCOUNT_SERVICE_CLIENT_ID}
      MNEMOS_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ACCOUNT_SERVICE_CLIENT_SECRET}

      MNEMOS_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      MNEMOS_ACCOUNT_SERVICE_CLIENT_ID: ${MNEMOS_ACCOUNT_SERVICE_CLIENT_ID}
      KEYCLOAK_ACCOUNT_SERVICE_CLIENT_SECRET: ${KEYCLOAK_ACCOUNT_SERVICE_CLIENT_SECRET}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"account_service\" password=\"${KAFKA_ACCOUNT_SERVICE_PASSWORD}\";"
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/mnemos/kafka/kafka.truststore.p12
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TLS_STORE_PASSWORD}
      SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
      MNEMOS_KAFKA_MANAGE_TOPICS: "false"
      MNEMOS_KAFKA_MESSAGEAUTH_ENABLED: "true"
      MNEMOS_KAFKA_MESSAGEAUTH_PRIVATEKEY: ${ACCOUNT_SERVICE_KAFKA_SIGNING_PRIVATE_KEY}
      MNEMOS_KAFKA_MESSAGEAUTH_TRUSTEDPUBLICKEYS: ${MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS}

      PLAYER_DIRECTORY_SERVICE_URL: http://player-directory-service:8092
      ACCOUNT_SERVICE_PLAYER_DIRECTORY_API_KEY: ${ACCOUNT_SERVICE_PLAYER_DIRECTORY_API_KEY}
      PLAYER_DIRECTORY_SERVICE_ACCOUNT_API_KEY: ${PLAYER_DIRECTORY_SERVICE_ACCOUNT_API_KEY}

      WALLET_SERVICE_ACCOUNT_API_KEY: ${WALLET_SERVICE_ACCOUNT_API_KEY}
      EVENT_SERVICE_ACCOUNT_API_KEY: ${EVENT_SERVICE_ACCOUNT_API_KEY}
      REWARD_SERVICE_ACCOUNT_API_KEY: ${REWARD_SERVICE_ACCOUNT_API_KEY}
      BET_SERVICE_ACCOUNT_API_KEY: ${BET_SERVICE_ACCOUNT_API_KEY}
      PERSONALIZATION_SERVICE_ACCOUNT_API_KEY: ${PERSONALIZATION_SERVICE_ACCOUNT_API_KEY}
      SOCIAL_SERVICE_ACCOUNT_API_KEY: ${SOCIAL_SERVICE_ACCOUNT_API_KEY}
      PROFILE_SERVICE_ACCOUNT_API_KEY: ${PROFILE_SERVICE_ACCOUNT_API_KEY}
      REALTIME_SERVICE_ACCOUNT_API_KEY: ${REALTIME_SERVICE_ACCOUNT_API_KEY}
      ACCOUNT_SERVICE_TELEGRAM_BOT_API_KEY: ${ACCOUNT_SERVICE_TELEGRAM_BOT_API_KEY}

    volumes:
      - "kafka-client-tls:/etc/mnemos/kafka:ro"

    depends_on:
      app-postgres-security-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      player-directory-service:
        condition: service_started

    networks:
      - mnemos-network
