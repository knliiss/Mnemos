services:
  gateway-service:
    container_name: mnemos-gateway
    build:
      context: ../..
      dockerfile: apps/gateway-service/Dockerfile
    image: mnemos/gateway:${GATEWAY_SERVICE_VERSION:-local}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      MNEMOS_AUTH_ORIGIN: ${MNEMOS_AUTH_ORIGIN}
      MNEMOS_FRONTEND_ORIGIN: ${MNEMOS_FRONTEND_ORIGIN}
      MNEMOS_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      ACCOUNT_SERVICE_URL: http://account-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8082
      EVENT_SERVICE_URL: http://event-service:8083
      EVENT_SERVICE_HOST: event-service
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      REWARD_SERVICE_URL: http://reward-service:8085
      BET_SERVICE_URL: http://bet-service:8086
      MODERATION_SERVICE_URL: http://moderation-service:8087
      REALTIME_SERVICE_URL: http://realtime-service:8088
      REALTIME_SERVICE_HOST: realtime-service
      PERSONALIZATION_SERVICE_URL: http://personalization-service:8089
      GATEWAY_MODERATION_API_KEY: ${GATEWAY_MODERATION_API_KEY}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"mnemos_apps\" password=\"${KAFKA_APP_PASSWORD}\";"
      MNEMOS_KAFKA_MANAGE_TOPICS: ${MNEMOS_KAFKA_MANAGE_TOPICS:-true}
      MNEMOS_KAFKA_MESSAGE_AUTH_ENABLED: "true"
      MNEMOS_KAFKA_MESSAGE_AUTH_PRIVATE_KEY: ${GATEWAY_SERVICE_KAFKA_SIGNING_PRIVATE_KEY}
      MNEMOS_KAFKA_MESSAGE_AUTH_TRUSTED_PUBLIC_KEYS: ${MNEMOS_KAFKA_TRUSTED_PUBLIC_KEYS}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      account-service:
        condition: service_started
      wallet-service:
        condition: service_started
      event-service:
        condition: service_started
      notification-service:
        condition: service_started
      reward-service:
        condition: service_started
      bet-service:
        condition: service_started
      moderation-service:
        condition: service_started
      realtime-service:
        condition: service_started
      personalization-service:
        condition: service_started
    networks:
      - mnemos-network
