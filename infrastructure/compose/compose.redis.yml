services:
  redis:
    image: "redis:${REDIS_VERSION}"
    container_name: "${COMPOSE_PROJECT_NAME}-redis"
    hostname: "redis"
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - "${REDIS_MAXMEMORY}"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - "${REDIS_PASSWORD}"

    ports:
      - "${MNEMOS_HOST_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT}:6379"

    volumes:
      - "redis-data:/data"

    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - mnemos-network
