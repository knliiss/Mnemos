services:
  kafka:
    image: "apache/kafka:${KAFKA_VERSION}"
    container_name: "${COMPOSE_PROJECT_NAME}-kafka"
    hostname: "kafka"
    restart: unless-stopped

    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT}:9092"

    environment:
      - "CLUSTER_ID=${KAFKA_CLUSTER_ID}"
      - "KAFKA_NODE_ID=1"
      - "KAFKA_PROCESS_ROLES=broker,controller"
      - "KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:${KAFKA_CONTROLLER_PORT}"
      - "KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER"
      - "KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL"
      - "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT"
      - "KAFKA_LISTENERS=INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT},EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT}"
      - "KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:${KAFKA_INTERNAL_PORT},EXTERNAL://localhost:${KAFKA_HOST_PORT}"
      - "KAFKA_SASL_ENABLED_MECHANISMS=PLAIN"
      - "KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN"
      - >-
        KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker"
        password="${KAFKA_BROKER_PASSWORD}"
        user_broker="${KAFKA_BROKER_PASSWORD}"
        user_kafka_admin="${KAFKA_ADMIN_PASSWORD}"
        user_account_service="${KAFKA_ACCOUNT_SERVICE_PASSWORD}"
        user_wallet_service="${KAFKA_WALLET_SERVICE_PASSWORD}"
        user_event_service="${KAFKA_EVENT_SERVICE_PASSWORD}"
        user_notification_service="${KAFKA_NOTIFICATION_SERVICE_PASSWORD}"
        user_reward_service="${KAFKA_REWARD_SERVICE_PASSWORD}"
        user_bet_service="${KAFKA_BET_SERVICE_PASSWORD}"
        user_moderation_service="${KAFKA_MODERATION_SERVICE_PASSWORD}"
        user_gateway_service="${KAFKA_GATEWAY_SERVICE_PASSWORD}"
        user_realtime_service="${KAFKA_REALTIME_SERVICE_PASSWORD}"
        user_personalization_service="${KAFKA_PERSONALIZATION_SERVICE_PASSWORD}"
        user_social_service="${KAFKA_SOCIAL_SERVICE_PASSWORD}"
        user_profile_service="${KAFKA_PROFILE_SERVICE_PASSWORD}";
      - >-
        KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker"
        password="${KAFKA_BROKER_PASSWORD}"
        user_kafka_admin="${KAFKA_ADMIN_PASSWORD}";
      - "KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      - "KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false"
      - "KAFKA_SUPER_USERS=User:broker;User:kafka_admin;User:ANONYMOUS"
      - "KAFKA_EARLY_START_LISTENERS=CONTROLLER"
      - "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1"
      - "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1"
      - "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1"
      - "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0"
      - "KAFKA_NUM_PARTITIONS=3"
      - "KAFKA_AUTO_CREATE_TOPICS_ENABLE=false"
      - "KAFKA_LOG_DIRS=/var/lib/kafka/data"

    volumes:
      - "kafka-data:/var/lib/kafka/data"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf '%s\n' 'security.protocol=SASL_PLAINTEXT' 'sasl.mechanism=PLAIN' 'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka_admin" password="${KAFKA_ADMIN_PASSWORD}";' > /tmp/kafka-health.properties &&
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:${KAFKA_INTERNAL_PORT} --command-config /tmp/kafka-health.properties --list >/dev/null 2>&1
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

    networks:
      - mnemos-network

  kafka-init:
    build:
      context: ../kafka
      dockerfile: Dockerfile.init
      args:
        KAFKA_VERSION: ${KAFKA_VERSION}

    image: "${COMPOSE_PROJECT_NAME}-kafka-init:${KAFKA_VERSION}"
    container_name: "${COMPOSE_PROJECT_NAME}-kafka-init"
    restart: "no"

    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:${KAFKA_INTERNAL_PORT}
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - mnemos-network
