services:
  kafka:
    image: "apache/kafka:${KAFKA_VERSION}"
    container_name: "${COMPOSE_PROJECT_NAME}-kafka"
    hostname: "kafka"
    restart: unless-stopped

    ports:
      - "${KAFKA_HOST_PORT}:9092"

    environment:
      - "CLUSTER_ID=${KAFKA_CLUSTER_ID}"
      - "KAFKA_NODE_ID=1"
      - "KAFKA_PROCESS_ROLES=broker,controller"
      - "KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:${KAFKA_CONTROLLER_PORT}"
      - "KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER"
      - "KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL"
      - "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      - "KAFKA_LISTENERS=INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT},EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT}"
      - "KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:${KAFKA_INTERNAL_PORT},EXTERNAL://localhost:${KAFKA_HOST_PORT}"
      - "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1"
      - "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1"
      - "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1"
      - "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0"
      - "KAFKA_NUM_PARTITIONS=3"
      - "KAFKA_AUTO_CREATE_TOPICS_ENABLE=false"
      - "KAFKA_LOG_DIRS=/var/lib/kafka/data"

    volumes:
      - "kafka-data:/var/lib/kafka/data"

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 25s

    networks:
      - mnemos-network