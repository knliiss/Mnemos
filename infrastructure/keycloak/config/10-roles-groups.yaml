realm: mnemos

roles:
  realm:
    - name: USER
      description: Regular Mnemos user
    - name: MODERATOR
      description: Mnemos moderation access
    - name: ADMIN
      description: Mnemos administration access

groups:
  - name: users
    realmRoles:
      - USER
  - name: moderators
    realmRoles:
      - MODERATOR
  - name: admins
    realmRoles:
      - ADMIN

defaultGroups:
  - /users
