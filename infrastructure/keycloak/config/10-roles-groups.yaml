realm: mnemos
roles:
  realm:
  - name: USER
    description: Regular Mnemos user
  - name: PERSONALIZATION_CREATOR
    description: Can create personalization marketplace items
  - name: PERSONALIZATION_MODERATOR
    description: Can review and manage personalization marketplace items
  - name: MODERATOR
    description: Mnemos moderation access
  - name: ADMIN
    description: Mnemos administration access
  - name: SUPER_ADMIN
    description: Mnemos highest administration access
groups:
- name: users
  realmRoles:
  - USER
  - offline_access
- name: personalization-creators
  realmRoles:
  - PERSONALIZATION_CREATOR
- name: personalization-moderators
  realmRoles:
  - PERSONALIZATION_MODERATOR
- name: moderators
  realmRoles:
  - MODERATOR
- name: admins
  realmRoles:
  - ADMIN
- name: super-admins
  realmRoles:
  - SUPER_ADMIN
defaultGroups:
- /users
