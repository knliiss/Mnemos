realm: mnemos

clients:
  - clientId: mnemos-mini-app
    name: Mnemos Telegram Mini App
    description: Public OIDC client for the Mnemos Telegram Mini App
    enabled: true
    protocol: openid-connect
    publicClient: true
    bearerOnly: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    authorizationServicesEnabled: false
    fullScopeAllowed: true
    consentRequired: false
    redirectUris:
      - "$(env:MNEMOS_FRONTEND_ORIGIN)/*"
    webOrigins:
      - "$(env:MNEMOS_FRONTEND_ORIGIN)"
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "$(env:MNEMOS_FRONTEND_ORIGIN)/*"
    authenticationFlowBindingOverrides:
      browser: Telegram Mini App
    defaultClientScopes:
      - web-origins
      - acr
      - roles
      - profile
      - basic
    optionalClientScopes:
      - offline_access
      - microprofile-jwt
    protocolMappers:
      - name: telegram-id
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: telegram_user_id
          claim.name: telegram_id
          jsonType.label: long
          access.token.claim: "true"
          id.token.claim: "true"
          userinfo.token.claim: "true"
          multivalued: "false"

      - name: mnemos-user-id
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: mnemos_user_id
          claim.name: mnemos_user_id
          jsonType.label: String
          access.token.claim: "true"
          id.token.claim: "true"
          userinfo.token.claim: "true"
          multivalued: "false"

      - name: mnemos-api-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.custom.audience: mnemos-api
          access.token.claim: "true"
          id.token.claim: "false"

  - clientId: "$(env:MNEMOS_ACCOUNT_SERVICE_CLIENT_ID)"
    name: Account Service Admin
    description: Service account used by account-service to manage users
    enabled: true
    protocol: openid-connect
    publicClient: false
    bearerOnly: false
    clientAuthenticatorType: client-secret
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    authorizationServicesEnabled: false
    fullScopeAllowed: false
    consentRequired: false
    secret: "$(env:KEYCLOAK_ACCOUNT_SERVICE_CLIENT_SECRET)"
    redirectUris: []
    webOrigins: []
    defaultClientScopes:
      - roles
      - account-service-admin-roles
    optionalClientScopes: []

  - clientId: "$(env:MNEMOS_MODERATION_SERVICE_CLIENT_ID)"
    name: Moderation Service Admin
    description: Service account used by moderation-service to inspect realm roles
    enabled: true
    protocol: openid-connect
    publicClient: false
    bearerOnly: false
    clientAuthenticatorType: client-secret
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    authorizationServicesEnabled: false
    fullScopeAllowed: false
    consentRequired: false
    secret: "$(env:KEYCLOAK_MODERATION_SERVICE_CLIENT_SECRET)"
    redirectUris: []
    webOrigins: []
    defaultClientScopes:
      - roles
    optionalClientScopes: []
